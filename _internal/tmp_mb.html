        <script type="text/javascript">
            var msource;
            try {
                var u = new URL(location.href);
                var sp = u.searchParams;
                msource = sp.get('msource') || sp.get('from') || sp.get('source_from') || sp.get('from_module');
            } catch (e) {
                console.warn('get page source from query failed', e);
            }
            window.activity = { id: 6934, spmId: '457.19' };
            window.reportMsgObj = {};
            window.appBuvid = '';
            window.reportConfig = {
                sample: 1,
                extMsgs: {
                    appBuvid: function () {
                        return window.appBuvid;
                    },
                },
                scrollTracker: true,
                msgObjects: 'reportMsgObj',
                pvMsg: { msource: msource },
                errorTracker: true,
            };
            // 模块的点击上报
            document.addEventListener('click', function (e) {
                if (!e.path && !e.composedPath) return;
                var patharr = e.path ? e.path : e.composedPath();
                if (patharr.length > 0) {
                    for (var i = 0; i < patharr.length; i++) {
                        var node = patharr[i];
                        if (node && node.className && node.dataset.module) {
                            var k = 'BiliActModuleClick?' + node.id + '?' + node.dataset.module;
                            if (node.dataset.version) {
                                k = k + '?' + node.dataset.version;
                            }
                            var value = 1;
                            try {
                                window.reportMsgObj &&
                                    window.reportObserver &&
                                    ((window.reportMsgObj[k] = value),
                                    window.reportObserver.forceCommit && window.reportObserver.forceCommit());
                            } catch (error) {
                                console.error('[logger]', error);
                            }
                        }
                    }
                }
            });
        </script>

    <body>
        <div id="w-player"></div>
        <div id="poster-area"></div> 
        

        <script type="text/javascript">
            function typeTransform(val, type) {
                if (typeof val === 'undefined') {
                    return null;
                } else if (type === VIDEO_CONFIG_TYPE_MAP.number) {
                    var numberVal = parseFloat(val);
                    return numberVal !== NaN ? numberVal : null;
                } else if (type === VIDEO_CONFIG_TYPE_MAP.boolean) {
                    return val === 'true';
                } else if (type === VIDEO_CONFIG_TYPE_MAP.object) {
                    try {
                        return JSON.parse(decodeURIComponent(val));
                    } catch (e) {
                        return null;
                    }
                } else {
                    return decodeURIComponent(val);
                }
            }

            var urlParam = {};
            try {
                var u = new URL(location.href);
                for (var pair of u.searchParams.entries()) {
                    urlParam[pair[0]] = pair[1];
                }
            } catch (err) {
                var query = location.search.substr(1);
                query = query.split('&');
                for (let i = 0; i < query.length; i++) {
                    let q = query[i].split('=');
                    if (q.length === 2) {
                        urlParam[q[0]] = q[1];
                    }
                }
            }

            var urlConfig = { playerConfig: {}, pageConfig: {} };

            function convertConfig() {
                for (var key in urlParam) {
                    if (window.PAGE_CONFIG[key]) {
                        var paramVal = typeTransform(urlParam[key], window.PAGE_CONFIG[key]);
                        if (paramVal !== null) {
                            urlConfig.pageConfig[key] = paramVal;
                        }
                    } else if (window.PLAYER_CONFIG[key]) {
                        var paramVal = typeTransform(urlParam[key], window.PLAYER_CONFIG[key]);
                        if (paramVal !== null) {
                            urlConfig.playerConfig[key] = paramVal;
                        }
                    }
                }
            }
            convertConfig();
            var allow = true;
            if (window.top != window.self && REFERRER_LIST) {
                try {
                    var h = window.document.referrer.match(/^http(s)?:\/\/(.*?)\//);
                    if (
                        h &&
                        h[2] &&
                        !new RegExp(REFERRER_LIST.join('|').replace(/\./g, '\\.').replace(/\*/g, '\.\*')).test(h[2])
                    ) {
                        allow = false;
                    } else if (
                        !window.document.referrer &&
                        window.navigator.userAgent.indexOf('MicroMessenger') === -1 &&
                        window.navigator.userAgent.indexOf('IqiyiApp') === -1
                    ) {
                        allow = false;
                    }
                } catch (e) {}
            }

            try {
                if (urlConfig.playerConfig.highQn) {
                    var i = window.document.referrer.match(/^http(s)?:\/\/(.*?)\//);
                    if (i && i[2] && new RegExp('player\.bilibili\.com').test(i[2])) {
                        urlConfig.playerConfig.highQn = false;
                    }
                }

                if (urlConfig.pageConfig.crossDomain) {
                    window.location.host.indexOf('.bilibili.com') !== -1
                        ? (document.domain = 'bilibili.com')
                        : window.location.host.indexOf('.bilibili.co') !== -1 && (document.domain = 'bilibili.co');
                }
            } catch (e) {}

            if (urlConfig.playerConfig.useHls) {
                if (window.navigator.userAgent.indexOf('Android') !== -1) {
                    urlConfig.playerConfig.useHls = false;
                }
            }

            if (allow) {
                // 创建播放器的封装函数
                function createPlayer(config) {
                    // 合并配置
                    const playerConfig = Object.assign(
                        { wrap: document.querySelector('#w-player') },
                        config
                    );

                    // 创建播放器实例
                    const player = new WPlayer(playerConfig);
                    window.player = player;

                    // 处理 iframe 相关逻辑
                    if (window.parent && window.parent !== window) {
                        window.parent.player = player;
                        const Html5IframeInitializedInjected = window.parent.Html5IframeInitialized || function () {};
                        window.parent.Html5IframeInitialized = function () {
                            let hasPlay = false;
                            top.document.querySelectorAll('iframe').forEach(function (e) {
                                try {
                                    if (e.contentWindow.player) {
                                        if (hasPlay) {
                                            e.contentWindow.player.pause();
                                        } else if (!e.contentWindow.player.isPaused()) {
                                            hasPlay = true;
                                        }

                                        if (!e.contentWindow.initializedInjected) {
                                            e.contentWindow.initializedInjected = true;
                                            e.contentWindow.player.on(WPlayer.events.VIDEO_PLAY, function () {
                                                top.document.querySelectorAll('iframe').forEach(function (g) {
                                                    try {
                                                        if (
                                                            g !== e.contentWindow.frameElement &&
                                                            g.contentWindow.player
                                                        ) {
                                                            if (!g.contentWindow.player.isPaused()) {
                                                                g.contentWindow.player.pause();
                                                            }
                                                        }
                                                    } catch (e) {}
                                                });
                                            });
                                        }
                                    }
                                } catch (e) {
                                    console.log(e);
                                }
                            });
                            return Html5IframeInitializedInjected();
                        };

                        if (!window.parent.Html5IframeAllInitialized) {
                            function createHtml5IframeAllInitialized() {
                                const pathname = new URL(window.frameElement.src).pathname;
                                let html5IframeInitializedNum = Array.prototype.filter.call(
                                    top.document.querySelectorAll('iframe'),
                                    (i) => i.src.includes(pathname),
                                ).length;
                                let curInitializedNum = 0;
                                return function () {
                                    curInitializedNum++;
                                    if (curInitializedNum >= html5IframeInitializedNum) {
                                        window.parent.Html5IframeInitialized();
                                        html5IframeInitializedNum = null;
                                        curInitializedNum = null;
                                    }
                                };
                            }
                            window.parent.Html5IframeAllInitialized = createHtml5IframeAllInitialized();
                        }
                        window.parent.Html5IframeAllInitialized();
                    }

                    return player;
                }
                const SP = urlConfig.playerConfig;
                const posterArea = document.getElementById('poster-area');
                // 使用封装后的函数创建播放器
                if (SP.onlyPoster && !SP.autoplay && playerViewSdk && playerViewSdk.render){
                    try {
                        const hidePoster = (autoplay) => {
                            setTimeout(() => {
                                  playerViewSdk.clear();
                                  posterArea.style.display = 'none';
                              }, 250);
                            createPlayer({
                                ...SP,
                                autoplay,
                                hide: true
                            });
                           
                        }
                        const onPosterClick = () => {
                            hidePoster(true);
                        }
                        const onPosterError = (e) => {
                            console.log('e', e)
                            hidePoster(SP.autoplay);
                        }
                        const getGroupKind = function () {
                            if (SP.episodeId) return playerViewSdk.GROUP_KIND.Pgc;
                            return playerViewSdk.GROUP_KIND.Ugc;
                        };
                        posterArea.style.display = 'block';
                        const posterParams = {
                            requestParams: {
                                params: {
                                    aid: SP.aid,
                                    cid: SP.cid,
                                    bvid: SP.bvid,
                                    seasonId: SP.seasonId,
                                    episodeId: SP.episodeId,
                                    isGaiaAvoided: true,
                                },
                                kind: getGroupKind()
                            },
                            showTopInfo: false,
                            showArchiveInfo: !SP.hideCoverInfo,
                            platform: playerViewSdk.PLATFORM.PC,
                            container: posterArea,
                            onClick: onPosterClick,
                            onError: onPosterError
                        };
                        playerViewSdk.render(posterParams);
                   }catch(e){
                        createPlayer(SP);
                   }
                   
                } else {
                    createPlayer(SP);
                }
                
            }
        </script>
