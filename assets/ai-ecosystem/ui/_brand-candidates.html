<body>
<h2>品牌标候选 · 逐级缩放检验</h2>
<div class="row" id="row"></div>

<script>
/* 候选：圆角渐变方块 + 白色图形 */
function tile(inner, strokeW) {
  var id = 'g' + Math.random().toString(36).slice(2, 7);
  return '<svg class="' + '' + '" viewBox="0 0 32 32">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="#4f8cff"/><stop offset=".5" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b5cf6"/>' +
    '</linearGradient></defs>' +
    '<rect width="32" height="32" rx="9.5" fill="url(#' + id + ')"/>' + inner + '</svg>';
}

var CANDS = [
  {
    n: 'A · 马头实心（面右）',
    svg: function () {
      return tile('<path fill="#fff" d="M6.6 27.6c.4-5.2 1.4-9.4 3-12.6 1-2 1.8-5.4 2-8.8l1.4-4 2.6 5.4c2.2.8 4.4 2 6.8 3.4 2 .8 4 1.2 6 2 .8.4 1 1.4.4 2.2-.6 1-1.6 1.4-2.8 1.4h-2c-2 .4-4 1.4-6 2.8-1 1-1.6 2.6-1.8 4.8l-.4 3.4z"/>');
    }
  },
  {
    n: 'B · 马头描边（面右）',
    svg: function () {
      return tile('<g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M8 28c.4-5 1.4-9.2 3-12.4 1-2 1.8-5.4 2-8.8l1.6-4.4 2.8 5.8c2.2.8 4.2 2 6.4 3.4 2 .8 3.8 1.2 5.6 1.8"/>' +
        '<path d="M20 16.6c2.4-.6 4.6-.2 6.6 1 .7.4.8 1.3.3 1.9-.7.9-1.7 1.2-2.8 1.1-1.9-.1-3.6.5-5.1 1.6-1 .8-1.6 2.3-1.8 4.4L17 28"/></g>');
    }
  },
  {
    n: 'C · 象棋骑士',
    svg: function () {
      return tile('<path fill="#fff" d="M11.4 8.6 9.6 4.6l4.4 1.2c1.6-.9 3.4-1.2 5.4-.8 3.6.7 6 3.5 6 7.2 0 2.2-1 4-2.8 5.2l.4 4.2c1.6.6 2.6 1.6 2.6 2.8H6.2c0-1.2 1-2.2 2.6-2.8L11.4 8.6z"/>');
    }
  },
  {
    n: 'D · 马头+鬃毛（面右，含蓄）',
    svg: function () {
      return tile('<path fill="#fff" d="M7 28.4c.2-4.8 1-8.8 2.6-12 .9-1.8 1.5-4.8 1.8-7.8l1.6-5 3 6c1.9.7 3.7 1.8 5.6 3.1 1.7.7 3.3 1 4.8 1.5 1 .3 1.3 1.5.6 2.3-.7.9-1.8 1.2-3 1.1h-.6c-1.7.4-3.3 1.3-4.8 2.5-.9.9-1.4 2.4-1.6 4.3l-.3 4z"/>');
    }
  },
  {
    n: 'E · 极简速度形（抽象）',
    svg: function () {
      return tile('<g fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round">' +
        '<path d="M9.5 24.5c0-6.4 1.6-11.6 4.8-15.6"/>' +
        '<path d="M14.6 8.2 20 6.1 18.6 12"/>' +
        '<path d="M12.5 17.4h11"/><path d="M14.8 22h9"/></g>');
    }
  },
  {
    n: 'F · 现有方案（对照）',
    svg: function () {
      var id = 'gf' + Math.random().toString(36).slice(2, 7);
      return '<svg viewBox="0 0 32 32"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#4f8cff"/><stop offset=".5" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b5cf6"/>' +
        '</linearGradient></defs><rect width="32" height="32" rx="9.5" fill="url(#' + id + ')"/>' +
        '<g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.6,1.4) scale(0.9)">' +
        window.BJI ? window.BJI.svg('brand_mark').replace(/<svg[^>]*>|<\/svg>/g, '') : '' +
        '</g></svg>';
    }
  }
];

var root = document.getElementById('row');
CANDS.forEach(function (c, i) {
  var div = document.createElement('div');
  div.className = 'cand';
  var svg = c.svg();
  // 同一 svg 复制到 4 个尺寸
  function at(cls) {
    return svg.replace('<svg ', '<svg class="' + cls + '" ');
  }
  div.innerHTML = '<div class="sizes">' + at('lg') + '</div>' +
    '<div class="sizes">' + at('md') + at('sm') + at('xs') + '</div>' +
    '<p>' + c.n + '</p>';
  root.appendChild(div);
});
</script>
