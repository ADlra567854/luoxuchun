<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="白驹 ccowork">
  <title>白驹 ccowork</title>
  <defs>
    <linearGradient id="bjMark" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset=".5" stop-color="#38B6FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="11" fill="url(#bjMark)"/>
  <!-- 「白」字几何化：一撇 + 日。笔画统一 3.3，撇末端与「日」顶横相接，
       16px 下仍是可读的「白」，而不是一团白块。 -->
  <g stroke="#FFFFFF" stroke-width="3.3" stroke-linecap="round" fill="none">
    <path d="M21.6 7.6 18.3 15.9"/>
    <rect x="13" y="15.2" width="14" height="16.4" rx="1.6"/>
    <path d="M13 23.4h14"/>
  </g>
</svg>
