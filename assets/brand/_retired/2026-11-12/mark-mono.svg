<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="白驹 ccowork">
  <title>白驹 ccowork（单色版）</title>
  <!-- 单色版：不带底色，笔画取 currentColor。
       深色底上设 color:#fff，浅色底上设 color:inherit，一份资产两处可用，
       不用维护两套互不同步的反色文件。 -->
  <g stroke="currentColor" stroke-width="3.3" stroke-linecap="round" fill="none">
    <path d="M21.6 7.6 18.3 15.9"/>
    <rect x="13" y="15.2" width="14" height="16.4" rx="1.6"/>
    <path d="M13 23.4h14"/>
  </g>
</svg>
