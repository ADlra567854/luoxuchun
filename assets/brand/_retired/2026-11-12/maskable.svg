<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="白驹 ccowork">
  <title>白驹 ccowork（maskable）</title>
  <defs>
    <linearGradient id="bjMask" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset=".5" stop-color="#38B6FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- maskable：主体必须落在中心 80% 安全区内，四边留白交给系统裁切 -->
  <rect width="512" height="512" fill="url(#bjMask)"/>
  <g transform="translate(96 96) scale(8)" stroke="#FFFFFF" stroke-width="3.3" stroke-linecap="round" fill="none">
    <path d="M21.6 7.6 18.3 15.9"/>
    <rect x="13" y="15.2" width="14" height="16.4" rx="1.6"/>
    <path d="M13 23.4h14"/>
  </g>
</svg>
