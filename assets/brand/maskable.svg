<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="品牌图形标（maskable）">
  <title>品牌图形标 · 隙 · maskable</title>
  <defs>
    <linearGradient id="apMask" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset=".5" stop-color="#38B6FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- maskable：主体必须落在中心 80% 安全区内，四边留白交给系统裁切。
       用「隙」小尺寸简化版（加粗笔画、去圆点），裁切后仍读得出形状。 -->
  <rect width="512" height="512" fill="url(#apMask)"/>
  <g transform="translate(115 115) scale(7.05)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M29.8 18.5 A 9.5 9.5 0 1 1 21.5 10.2" stroke-width="5.2"/>
    <path d="M31.4 8.6 L 22.4 17.6" stroke-width="4.8"/>
  </g>
</svg>
