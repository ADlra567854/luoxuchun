<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="品牌图形标（触屏图标）">
  <title>品牌图形标 · 隙 · 触屏图标</title>
  <defs>
    <linearGradient id="apTouch" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset=".5" stop-color="#38B6FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- iOS 会自己切圆角，所以必须满版、不透明，否则加主屏后四角发黑。
       图形沿用「隙」完整版（180px 足够承载中心圆点）。 -->
  <rect width="180" height="180" fill="url(#apTouch)"/>
  <g transform="translate(11.25 11.25) scale(3.9375)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M30.34 18.18 A 10.5 10.5 0 1 1 21.82 9.66" stroke-width="3.2"/>
    <path d="M31.8 8.2 L 22 18" stroke-width="3"/>
  </g>
  <circle cx="90" cy="90" r="10.24" fill="#FFFFFF"/>
</svg>
