<style>
  [data-theme="deep"]{
    --bg:#06080f; --bg2:#0b1020; --card:rgba(16,23,40,.72); --line:rgba(56,225,255,.20);
    --text:#e8eefc; --muted:#8fa0c4; --blue:#4f8cff; --cyan:#38e1ff; --purple:#8b5cf6; --gold:#f5c26b;
    --grad:linear-gradient(120deg,#38e1ff,#5b8cff 45%,#8b5cf6);
  }
  [data-theme="cloud"]{
    --bg:#F4F7FC; --bg2:#ffffff; --card:rgba(255,255,255,.82); --line:rgba(79,140,255,.22);
    --text:#1E293B; --muted:#475569; --blue:#4f8cff; --cyan:#0ea5e9; --purple:#8b5cf6; --gold:#d97706;
    --grad:linear-gradient(120deg,#4f8cff,#38b6ff 50%,#8b5cf6);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;transition:background .4s}
  .poster{position:relative;width:1080px;height:1350px;max-width:96vw;max-height:96vh;aspect-ratio:1080/1350;
    border-radius:26px;overflow:hidden;background:var(--bg);
    box-shadow:0 30px 80px rgba(0,0,0,.45);border:1px solid var(--line);transition:.4s}
  /* 极光光斑 */
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;pointer-events:none}
  .o1{width:520px;height:520px;background:var(--cyan);top:-160px;left:-140px}
  .o2{width:480px;height:480px;background:var(--purple);bottom:-150px;right:-120px}
  .o3{width:360px;height:360px;background:var(--blue);top:40%;left:55%}
  [data-theme="cloud"] .orb{mix-blend-mode:normal;opacity:.32}
  .inner{position:relative;z-index:2;height:100%;padding:78px 78px 60px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:16px}
  .logo{width:62px;height:62px;border-radius:18px;background:var(--grad);display:grid;place-items:center;
    font-size:34px;box-shadow:0 10px 30px rgba(56,225,255,.35)}
  .brand b{font-size:30px;font-weight:900;letter-spacing:.5px}
  .brand span{display:block;font-size:14px;color:var(--muted);letter-spacing:3px;margin-top:2px}
  .badge{align-self:flex-start;margin-top:54px;display:inline-flex;align-items:center;gap:10px;
    font-size:15px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 20px;
    background:var(--card);backdrop-filter:blur(8px)}
  h1{margin-top:26px;font-size:118px;line-height:1.04;font-weight:900;letter-spacing:1px}
  h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:24px;font-size:27px;color:var(--muted);max-width:820px;line-height:1.5}
  .stats{margin-top:auto;display:flex;gap:18px;flex-wrap:wrap}
  .stat{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:22px 24px;backdrop-filter:blur(8px)}
  .stat b{display:block;font-size:46px;font-weight:900;background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .stat span{font-size:15px;color:var(--muted);margin-top:8px;display:block}
  .thumbs{margin-top:30px;display:grid;grid-template-columns:repeat(15,1fr);gap:10px}
  .thumbs img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;border:1px solid var(--line);
    background:#0b1224}
  .foot{margin-top:34px;display:flex;align-items:center;justify-content:space-between;
    font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:22px}
  .foot b{color:var(--text)}
  .toggle{position:absolute;top:30px;right:30px;z-index:5;display:flex;gap:8px}
  .toggle button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;
    padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .toggle button.cur{background:var(--grad);color:#04101f;border-color:transparent}
  .tip{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);opacity:.6;z-index:5}
  @media print{.toggle,.tip{display:none}.poster{box-shadow:none;max-height:none}}
</style>
