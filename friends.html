<style>
:root{
  --bg:#F4F7FC;--card:#FFFFFF;--text:#1E293B;--muted:#475569;
  --line:rgba(148,163,184,.28);--soft:rgba(79,140,255,.09);
  --grad:linear-gradient(120deg,#4f8cff,#38b6ff 50%,#8b5cf6);
  --shadow:0 10px 30px rgba(30,58,110,.09);
}
html[data-theme="deep"],body[data-theme="deep"]{
  --bg:#030014;--card:#101728;--text:#E9F0FB;--muted:#8FA3BD;
  --line:rgba(143,163,189,.22);--soft:rgba(91,140,255,.13);
  --grad:linear-gradient(120deg,#38e1ff,#5b8cff 45%,#8b5cf6);

}
html[data-gate="locked"] body.bj-gated-page > *:not(.bj-gate-overlay){display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--card) 82%,transparent);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800}
.mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:16px}
.pill{display:inline-flex;gap:7px;align-items:center;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:#2B62C9;background:rgba(79,140,255,.11);border:1px solid rgba(79,140,255,.28)}

.hero{padding:38px 0 22px}
.hero h1{font-size:clamp(26px,4.6vw,40px);line-height:1.3;margin:14px 0 10px;font-weight:900}

.hero p{color:var(--muted);max-width:760px;margin:0}
.rule{height:3px;width:120px;border-radius:99px;background:var(--grad);margin-top:20px}
h2.sec{font-size:20px;font-weight:900;margin:30px 0 6px;display:flex;align-items:center;gap:10px}
h2.sec span{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.card .no{font:700 12px/1 ui-monospace,monospace;color:#2B62C9;letter-spacing:1px}
html[data-theme="deep"] .card .no,body[data-theme="deep"] .card .no{color:#7CC8FF}
.card h3{margin:0;font-size:16px;font-weight:800;line-height:1.4}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.65;word-break:break-word}
.card .kv{display:flex;gap:7px;flex-wrap:wrap;font-size:11.5px}
.card .kv i{font-style:normal;padding:3px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.card .kv i.hi{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.38)}
.card .kv i.ok{background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.34)}
.card .concl{border-left:3px solid #4F8CFF;background:var(--soft);border-radius:0 10px 10px 0;padding:9px 12px;font-size:12.5px;line-height:1.65}
.card .foot{margin-top:auto;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.card code{font-size:11.5px;word-break:break-all}
.lnk{display:inline-flex;padding:5px 12px;border-radius:999px;background:var(--grad);color:#fff;text-decoration:none;font-size:12px;font-weight:800}
.pending{display:inline-flex;padding:5px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:700}
.dom{font:700 13px/1.4 ui-monospace,monospace;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lineB{border-left:3px solid #8B5CF6}
.lineA{border-left:3px solid #38B6FF}
footer{margin-top:40px;padding:24px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.cite{display:inline-flex;padding:5px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:700}

<script>
(function(){
  /* 整段渲染抽成函数：首帧处于访问确认阶段时分组为空，
     确认后 baiju-gate.js 只撤遮罩、不会重画，必须监听状态事件重渲染。 */
  function render(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function allowed(g){return !!(window.BaijuGate&&window.BaijuGate.allows&&window.BaijuGate.allows(g))}
  var d={};
  try{d=JSON.parse(document.getElementById('bj-friends-data').textContent||'{}')}catch(e){}
  var dg=d.publicDigest,de=document.getElementById('digest');
  if(de)de.textContent=dg?('核验至 '+dg.date+' · 开放资料 '+dg.stats.public+' 条（已核验 '+dg.stats.verified+'）· 自有提示词 '+dg.prompts.count+' 条 / '+dg.prompts.groups+' 组 · 待上线条目 '+dg.stats.restricted+' 条 · 每日重生成'):'核验至 —';
  var boards=d.sections||[],doms=d.domains||[],libs=(d.library||[]).filter(function(g){return allowed(g.scope)});
  document.getElementById('secCount').textContent=boards.length+' 个板块';
  document.getElementById('domCount').textContent=doms.length+' 项';
  document.getElementById('cite').textContent='核验至 '+(d.date||'—')+' · 出处 '+boards.length+' 个板块';
  document.getElementById('boards').innerHTML=boards.map(function(x){
    return '<article class="card">'+
      '<div class="no">'+esc(x.no)+' / '+esc(x.id)+'</div>'+
      '<h3>'+esc(x.title)+'</h3><p>'+esc(x.desc||'')+'</p>'+
      '<div class="kv"><i>条目 '+x.items+'</i><i class="ok">已核实 '+x.verified+'</i><i class="'+(x.pending?'hi':'')+'">待核实 '+x.pending+'</i><i class="hi">风险 '+esc(x.risk||'—')+'</i></div>'+
      '<div class="concl"><b>结论：</b>'+esc(x.conclusion)+'</div>'+
      '<div class="foot">'+esc(x.publishState)+' · 核验 '+esc(x.verifiedAt)+' · 失效标记 '+(x.expired?'已失效':'无')+'</div>'+
    '</article>'
  }).join('')||'<div class="card">暂无数据</div>';

  var n=libs.reduce(function(a,g){return a+(g.items||[]).length},0);
  document.getElementById('libCount').textContent=libs.length+' 组 / '+n+' 条';
  document.getElementById('library').innerHTML=libs.map(function(g){
    var cards=(g.items||[]).map(function(x){
      var ok=x.status==='verified'&&!!x.canonical;
      return '<article class="card">'+
        '<div class="no">'+esc(x.id)+' / '+esc(x.kind)+'</div>'+
        '<h3>'+esc(x.title)+'</h3>'+
        '<div class="kv"><i>'+esc(x.brand)+'</i><i>'+esc(x.license)+'</i><i class="'+(ok?'ok':'hi')+'">'+(ok?'已核验':'待核实')+'</i></div>'+
        '<p><b>出处：</b>'+esc(x.publisher)+'</p>'+
        '<p><b>源头：</b>'+(ok?'<code>'+esc(x.canonical)+'</code>':'未核实，留空')+'</p>'+
        '<div class="concl"><b>结论：</b>'+esc(x.conclusion)+'</div>'+
        '<div class="foot">采集 '+esc(x.collectedAt)+' · 核验 '+esc(x.verifiedAt||'—')+' · 失效标记 '+(x.expired?'已失效':'无')+'</div>'+
        (ok?'<a class="lnk" href="'+esc(x.canonical)+'" target="_blank" rel="noopener noreferrer nofollow">前往官方源 ↗</a>':'<span class="pending">待核实 · 暂不提供链接</span>')+
      '</article>'
    }).join('')||'<div class="card">暂无条目</div>';
    return '<h2 class="sec" style="font-size:17px;margin-top:22px">'+esc(g.title)+' <span>'+(g.items||[]).length+' 条</span></h2>'+
      '<section class="grid">'+cards+'</section>'
  }).join('')||'<div class="card">暂无数据</div>';

  if(allowed('planning')){
    document.getElementById('domains').innerHTML=doms.map(function(x){
      return '<article class="card '+(x.line==='A'?'lineA':'lineB')+'">'+
        '<div class="dom">'+esc(x.sub)+'</div>'+
        '<h3>'+esc(x.purpose)+'</h3>'+
        '<div class="kv"><i>'+esc(x.line)+' 线</i><i>'+esc(x.status)+'</i><i>公开入口 '+(x.publicEntry?'有':'0')+'</i></div>'+
      '</article>'
    }).join('')||'<div class="card">暂无数据</div>'
  }else{
    document.getElementById('domains').innerHTML='<div class="card">暂无数据</div>'
  }
  }
  render()
  document.addEventListener('baiju:gate-open', render)
  document.addEventListener('baiju:gate-close', render)
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render)
})();
</script>
  <script src="/baiju-assistant.js" defer></script>
</body>
</html>
