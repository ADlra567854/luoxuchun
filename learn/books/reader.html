<style>
:root{
  --bg:#07090f; --bg2:#0c1120; --card:#111a2e; --line:#20304f;
  --gold:#f5c26b; --blue:#4f8cff; --cyan:#38e1ff; --purple:#8b5cf6;
  --text:#edf2fc; --muted:#93a3c7; --dim:#64748b;
  --grad:linear-gradient(120deg,#f5c26b,#ff8c5a 40%,#8b5cf6);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.85;height:100vh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a3a5e;border-radius:6px}
nav{display:flex;align-items:center;gap:14px;padding:11px 22px;background:rgba(7,9,15,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-shrink:0;z-index:100}
.logo{font-size:17px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.back{color:var(--cyan);text-decoration:none;font-size:13px}
.back:hover{color:var(--gold)}
.ch-title{flex:1;text-align:center;font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-arrow{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
.nav-arrow:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.nav-arrow:disabled{opacity:.35;cursor:not-allowed}
.reader{flex:1;display:flex;min-height:0}
.toc{width:270px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--line);padding:14px 10px;background:rgba(10,14,26,.55)}
.toc .toc-head{font-size:11px;letter-spacing:2px;color:var(--dim);padding:4px 10px 10px;font-weight:700}
.toc a{display:block;padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;line-height:1.5;transition:.18s;border-left:2px solid transparent}
.toc a:hover{color:var(--cyan);background:rgba(56,225,255,.06)}
.toc a.on{color:var(--gold);background:rgba(245,194,107,.08);border-left-color:var(--gold);font-weight:600}
.toc .ch-num{font-family:Consolas,monospace;font-size:10px;color:var(--dim);margin-right:6px}
.frame-area{flex:1;display:flex;flex-direction:column;min-width:0}
.frame-area iframe{flex:1;width:100%;border:none;background:var(--bg)}
@media(max-width:860px){.toc{display:none}.reader{padding-top:0}}
</style>

<script>
(function(){
  'use strict';
  var CHAPTERS = [
    ['00','AI 个人 IP 超级内容矩阵总蓝图','00-AI个人IP超级内容矩阵总蓝图.html'],
    ['01','DeepSeek-V4-Pro 小白入门','01-DeepSeek-V4-Pro-小白入门.html'],
    ['02','AI 工具全景图 国内国外','02-AI工具全景图-国内国外.html'],
    ['03','AI 变现路线图 小白版','03-AI变现路线图-小白版.html'],
    ['04','AI 编程工具','04-AI编程工具-IDE编译审阅浏览.html'],
    ['05','书稿总目录','05-书稿总目录-AI工具简史与实战全书.html'],
    ['06','第10章 DeepSeek 发展史','06-书稿-第10章-DeepSeek发展史.html'],
    ['07','第1章 AI 七十年','07-书稿-第1章-AI七十年.html'],
    ['08','第3章 ChatGPT 点燃全民 AI 时代','08-书稿-第3章-ChatGPT点燃全民AI时代.html'],
    ['09','第4章 图像生成简史','09-书稿-第4章-图像生成简史.html'],
    ['10','第5章 视频生成简史','10-书稿-第5章-视频生成简史.html'],
    ['11','提示词完全指南 2026','11-提示词完全指南-2026最新版.html'],
    ['12','AI 影响面','12-AI影响面-从短视频到天气再到每一个人.html'],
    ['13','开源 AI 工具','13-开源AI工具-开箱即用指南.html'],
    ['14','AI 小说与短剧的影响','14-AI小说与短剧的影响.html'],
    ['15','中国 AI 政策与国外重视','15-中国AI政策与国外重视.html'],
    ['16','GitHub 最新开源项目','16-GitHub最新开源项目盘点与一键上手.html'],
    ['17','开源项目逐个上手手册','17-开源项目逐个上手手册.html'],
    ['18','AI 研究方向详解','18-AI研究方向详解-知识网.html'],
    ['19','行行出状元','19-行行出状元-各行各业如何看AI如何学AI.html'],
    ['20','AI 学习总纲','20-AI学习总纲-从零到会用.html'],
    ['21','第2章 深度学习革命','21-书稿-第2章-深度学习革命.html'],
    ['22','第6章 AI 编程革命','22-书稿-第6章-AI编程革命.html'],
    ['23','第7章 AI 办公自动化','23-书稿-第7章-AI办公自动化.html'],
    ['24','第8章 AI 教育变革','24-书稿-第8章-AI教育变革.html'],
    ['25','第9章 AI 医疗应用','25-书稿-第9章-AI医疗应用.html'],
    ['26','第11章 AI 伦理与安全','26-书稿-第11章-AI伦理与安全.html'],
    ['27','第12章 AI 与就业','27-书稿-第12章-AI与就业.html'],
    ['28','第13章 AI 创业指南','28-书稿-第13章-AI创业指南.html'],
    ['29','第14章 AI 与未来社会','29-书稿-第14章-AI与未来社会.html'],
    ['30','第15章 AI 与国家安全','30-书稿-第15章-AI与国家安全.html'],
    ['31','第16章 AI 与文化创意','31-书稿-第16章-AI与文化创意.html']
  ];
  var tocEl = document.getElementById('toc');
  var frame = document.getElementById('frame');
  var chTitle = document.getElementById('chTitle');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  /* 本页模板没有渲染 #prevBtn / #nextBtn，下面 load() 与事件绑定会直接抛
     TypeError 并中断脚本。兜底建两个隐藏按钮：目录点击与左右方向键翻页照常可用。 */
  if(!prevBtn){ prevBtn=document.createElement('button'); prevBtn.type='button'; prevBtn.hidden=true; document.body.appendChild(prevBtn); }
  if(!nextBtn){ nextBtn=document.createElement('button'); nextBtn.type='button'; nextBtn.hidden=true; document.body.appendChild(nextBtn); }
  if(!chTitle){ chTitle=document.createElement('span'); chTitle.hidden=true; document.body.appendChild(chTitle); }
  var idx = 0;
  try{
    var p = new URLSearchParams(location.search).get('ch');
    if(p !== null){ idx = Math.max(0, Math.min(CHAPTERS.length - 1, Number(p) || 0)); }
  }catch(e){}
  tocEl.innerHTML = '<div class="toc-head"> 目录 · 32 章</div>' + CHAPTERS.map(function(c, i){
    return '<a href="#" data-i="'+i+'"><span class="ch-num">'+c[0]+'</span>'+c[1]+'</a>';
  }).join('');
  function load(i){
    idx = Math.max(0, Math.min(CHAPTERS.length - 1, i));
    var c = CHAPTERS[idx];
    frame.src='/learn/books/pages/' + c[2];
    chTitle.textContent = c[1];
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === CHAPTERS.length - 1;
    tocEl.querySelectorAll('a').forEach(function(a){
      a.classList.toggle('on', Number(a.dataset.i) === idx);
    });
    var active = tocEl.querySelector('a.on');
    if(active && active.scrollIntoView) active.scrollIntoView({ block:'nearest' });
  }
  tocEl.addEventListener('click', function(e){
    var a = e.target.closest('a'); if(!a) return;
    e.preventDefault();
    load(Number(a.dataset.i));
  });
  prevBtn.addEventListener('click', function(){ load(idx - 1); });
  nextBtn.addEventListener('click', function(){ load(idx + 1); });
  addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') load(idx - 1);
    if(e.key === 'ArrowRight') load(idx + 1);
  });
  load(idx);
})();
</script>
