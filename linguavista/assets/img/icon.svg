<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d0d2b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38e1ff"/>
      <stop offset="50%" style="stop-color:#5b8cff"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#101728"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)"/>

  <!-- 外光环 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.5"/>

  <!-- 地球主体 -->
  <circle cx="256" cy="256" r="140" fill="url(#innerGrad)" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- 经纬线（水平） -->
  <ellipse cx="256" cy="256" rx="140" ry="40" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="256" cy="256" rx="140" ry="80" fill="none" stroke="url(#ringGrad)" stroke-width="1.2" opacity="0.3"/>
  <ellipse cx="256" cy="256" rx="140" ry="120" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.25"/>

  <!-- 经线（垂直） -->
  <path d="M256 116 Q256 256 256 396" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.4"/>
  <path d="M176 150 Q256 256 176 362" fill="none" stroke="url(#ringGrad)" stroke-width="1.2" opacity="0.3"/>
  <path d="M336 150 Q256 256 336 362" fill="none" stroke="url(#ringGrad)" stroke-width="1.2" opacity="0.3"/>

  <!-- 大陆形状（简化抽象） -->
  <path d="M180 200 Q200 180 240 185 Q280 190 300 210 Q320 230 310 260 Q300 290 270 300 Q240 310 210 295 Q180 280 175 250 Q170 220 180 200Z" 
        fill="url(#ringGrad)" opacity="0.15"/>
  <path d="M220 280 Q250 270 280 285 Q310 300 320 330 Q300 350 270 355 Q240 360 220 340 Q200 320 220 280Z" 
        fill="url(#ringGrad)" opacity="0.12"/>

  <!-- 语言气泡（代表对话学习） -->
  <g transform="translate(340, 160)">
    <circle cx="0" cy="0" r="28" fill="url(#ringGrad)" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" font-size="24" fill="white" font-weight="bold">💬</text>
  </g>

  <!-- 星星点缀 -->
  <circle cx="130" cy="130" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="380" cy="380" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="120" cy="370" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="400" cy="120" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="256" cy="100" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="256" cy="412" r="1.5" fill="#fff" opacity="0.3"/>
</svg>
