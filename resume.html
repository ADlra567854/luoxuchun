.logo{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:2px;color:#fff}

@media(max-width:900px){nav{padding:12px 20px}.nav-links{display:none}}
.wrap{position:relative;z-index:5;max-width:1060px;margin:0 auto;padding:104px 24px 70px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,4.6vw,44px);letter-spacing:3px}

/* 模板：经典 */
.preview.tpl-classic{background:#fdfdf6;border:1px solid #d8cdb0;color:#2c2c2c;box-shadow:0 14px 40px rgba(120,100,60,.14)}
.preview.tpl-classic .rv{color:#2c2c2c}
.preview.tpl-classic .rv .rv-head{text-align:center;border-bottom:2px solid #8a6d3b;padding-bottom:14px}
.preview.tpl-classic .rv .rv-name{font-family:"Source Han Serif SC","SimSun",serif;background:none;color:#8a6d3b;-webkit-background-clip:unset;background-clip:unset}
.preview.tpl-classic .rv .rv-target{color:#8a6d3b;font-weight:600}
.preview.tpl-classic .rv .rv-contact{color:#6b5d3f}
.preview.tpl-classic .rv .rv-sec{color:#8a6d3b;border-bottom:1px solid #cbb98a;font-family:"Source Han Serif SC","SimSun",serif}
.rv{color:var(--text)}
.rv .rv-head{border-bottom:2px solid var(--grad);padding-bottom:14px;margin-bottom:16px}
.rv .rv-name{font-family:var(--serif);font-size:30px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rv .rv-target{font-size:15px;color:var(--ice);margin-top:4px}
.rv .rv-contact{font-size:13px;color:var(--muted);margin-top:6px}

@media print{

  #printArea,#printArea *{visibility:visible}

  .rv h4{color:#b8860b}
  .rv .rv-skills span{border-color:#ccc;color:#333}
  .rv p,.rv{color:#111}
}

<script>
(function(){
  'use strict';
  var rvEmpty = document.getElementById('rvEmpty');
  var rvBox = document.getElementById('rvBox');
  // ---------- 模板切换（简约 / 科技 / 经典） ----------
  var printArea = document.getElementById('printArea');
  document.querySelectorAll('.tpl-btn').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.tpl-btn').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      printArea.classList.remove('tpl-tech', 'tpl-classic');
      if(b.dataset.tpl) printArea.classList.add('tpl-' + b.dataset.tpl);
      try{ localStorage.setItem('ccowork.resume-tpl', b.dataset.tpl || '') }catch(e){}
    });
  });
  try{
    var savedTpl = localStorage.getItem('ccowork.resume-tpl') || '';
    if(savedTpl){
      printArea.classList.add('tpl-' + savedTpl);
      document.querySelectorAll('.tpl-btn').forEach(function(x){ x.classList.toggle('on', x.dataset.tpl === savedTpl); });
    }
  }catch(e){}
  function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function build(){
    var d = {
      name: document.getElementById('f_name').value.trim() || '（姓名）',
      target: document.getElementById('f_target').value.trim() || '求职意向',
      phone: document.getElementById('f_phone').value.trim(),
      email: document.getElementById('f_email').value.trim(),
      edu: document.getElementById('f_edu').value.trim(),
      skills: document.getElementById('f_skills').value.trim(),
      proj: document.getElementById('f_proj').value.trim(),
      about: document.getElementById('f_about').value.trim()
    };
    var contact = [d.phone, d.email].filter(Boolean).join(' · ');
    var skillsHtml = d.skills ? '<h4>技能</h4><div class="rv-skills">' + d.skills.split(/[,，]/).map(function(s){ return '<span>'+esc(s.trim())+'</span>'; }).join('') + '</div>' : '';
    var projHtml = d.proj ? '<h4>项目 / 经历</h4>' + d.proj.split(/\n+/).map(function(l){ return '<p>• ' + esc(l.trim()) + '</p>'; }).join('') : '';
    var aboutHtml = d.about ? '<h4>自我介绍</h4><p>' + esc(d.about).replace(/\n/g,'<br>') + '</p>' : '';
    rvBox.innerHTML = '<div class="rv"><div class="rv-head"><div class="rv-name">'+esc(d.name)+'</div>'
      + '<div class="rv-target">'+esc(d.target)+'</div>'
      + (contact ? '<div class="rv-contact">'+esc(contact)+'</div>' : '') + '</div>'
      + (d.edu ? '<h4>教育背景</h4><p>'+esc(d.edu)+'</p>' : '')
      + skillsHtml + projHtml + aboutHtml + '</div>';
    rvEmpty.style.display = 'none';
    return d;
  }
  document.getElementById('genBtn').addEventListener('click', build);
  document.getElementById('printBtn').addEventListener('click', function(){ build(); window.print(); });
  document.getElementById('aiBtn').addEventListener('click', function(){
    var d = build();
    var txt = '姓名：'+d.name+'\n意向：'+d.target+'\n教育：'+d.edu+'\n技能：'+d.skills+'\n项目：'+d.proj+'\n自我：'+d.about;
    location.href = './agent.html?ask=' + encodeURIComponent('请帮我优化这份简历：指出薄弱点并给出改写建议（分点输出）。\n\n' + txt);
  });
  // 粒子
  var cv=document.getElementById('stars'),ctx=cv.getContext('2d'),W,H,pts=[];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;} rs(); addEventListener('resize',rs);
  var C=['94,234,212','56,225,255','91,140,255','240,185,92'];
  var n=Math.min(90,Math.floor(W*H/19000));
  for(var i=0;i<n;i++) pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.4,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,c:C[Math.random()*4|0]});
  (function dr(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){var p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fillStyle='rgba('+p.c+',.5)';ctx.fill();
      for(var j=i+1;j<pts.length;j++){var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d2=dx*dx+dy*dy;
        if(d2<11000){ctx.strokeStyle='rgba('+p.c+','+(0.11*(1-d2/11000))+')';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}
    }
    requestAnimationFrame(dr);
  })();
})();
</script>
