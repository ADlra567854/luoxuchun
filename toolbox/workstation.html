<style>
:root{--bg:#07090f;--card:#111a2e;--line:#20304f;--gold:#f5c26b;--cyan:#38e1ff;--green:#4ade80;
  --text:#edf2fc;--muted:#93a3c7;--grad:linear-gradient(120deg,#f5c26b,#38e1ff)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a3a5e;border-radius:6px}
/* 顶栏 */
#topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(7,9,15,.95);flex-wrap:wrap}
.logo{font-size:16px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#gh-search{flex:1;min-width:200px;display:flex;gap:8px}
#gh-q{flex:1;background:#0a0f1e;border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--text);font-size:14px}
#gh-q:focus{outline:none;border-color:var(--cyan)}
.btn{background:#0e1626;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{color:var(--cyan);border-color:var(--cyan)}
.btn.main{background:var(--grad);color:#0a0f1e;font-weight:800;border:none}
.btn.run{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.4);color:var(--green);font-weight:700}
#topbar a{color:var(--muted);text-decoration:none;font-size:13px}
#topbar a:hover{color:var(--gold)}
/* 三栏 */
#main{flex:1;display:flex;overflow:hidden}
/* 左：GitHub 仓库 */
#left{width:250px;min-width:250px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#0a0f1a}
#left h4{font-size:12px;color:var(--gold);letter-spacing:2px;padding:12px 14px 6px}
#repos{overflow-y:auto;max-height:38%;border-bottom:1px solid var(--line);padding:0 8px 10px}
.repo-item{padding:9px 10px;border-radius:10px;cursor:pointer;margin:4px 0;border:1px solid transparent}
.repo-item:hover{background:var(--card);border-color:var(--line)}
.repo-item .rn{font-size:13px;color:var(--cyan);font-weight:600;word-break:break-all}
.repo-item .rd{font-size:12px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.repo-item .rs{font-size:11px;color:var(--gold);margin-top:3px}
#files{flex:1;overflow-y:auto;padding:4px 8px 12px}
.file-item{padding:6px 10px;border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer;font-family:Consolas,monospace;word-break:break-all}
.file-item:hover{background:var(--card);color:var(--green)}
.file-item.dir{color:#7f96c9}
#repo-actions{padding:8px 12px;border-top:1px solid var(--line)}
#repo-actions a{display:block;font-size:12px;color:var(--cyan);padding:4px 0;text-decoration:none}
/* 中：编辑器 + 输出 */
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#editor-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#cur-file{font-family:Consolas,monospace;font-size:13px;color:var(--gold);flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lang-sel{background:#0a0f1e;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;font-size:13px}
#editor-wrap{flex:1;min-height:0}
.CodeMirror{height:100%;font-size:14px}
#out{height:200px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:#05070c}
#out-head{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
#out-body{flex:1;overflow-y:auto;padding:10px 14px;font-family:Consolas,monospace;font-size:13px;color:#b9c8ea;white-space:pre-wrap}
#out-frame{flex:1;border:none;background:#fff;display:none}
/* 右：AI 对话 */
#right{width:320px;min-width:320px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#0a0f1a}
#right h4{font-size:12px;color:var(--gold);letter-spacing:2px;padding:12px 14px 6px}
#aimode{margin:0 14px;background:#0a0f1e;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;font-size:12px;width:calc(100% - 28px)}
#aikey{margin:6px 14px;background:#0a0f1e;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font-size:12px;width:calc(100% - 28px)}
#msgs{flex:1;overflow-y:auto;padding:10px 12px}
.msg{margin:10px 0;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.75;max-width:96%;white-space:pre-wrap;word-wrap:break-word}
.msg.user{margin-left:auto;background:rgba(56,225,255,.1);border:1px solid rgba(56,225,255,.3)}
.msg.bot{background:rgba(245,194,107,.06);border:1px solid rgba(245,194,107,.28)}
.msg.sys{background:none;border:1px dashed var(--line);color:var(--muted);font-size:12px;max-width:100%}
.msg.bot code{background:#0a0f1e;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px;color:var(--cyan)}
.msg.bot pre{background:#0a0f1e;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;position:relative;margin:8px 0}
.msg.bot pre code{background:none;border:none;padding:0;display:block}
.toeditor{display:inline-block;margin-top:4px;background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.4);color:var(--green);border-radius:10px;padding:3px 10px;font-size:11px;cursor:pointer}
#ai-bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
#ai-q{flex:1;background:#0a0f1e;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;resize:none;font-family:inherit}
#ai-q:focus{outline:none;border-color:var(--cyan)}
#ai-send{padding:0 16px;border:none;border-radius:10px;background:var(--grad);color:#0a0f1e;font-weight:800;cursor:pointer}
@media(max-width:1100px){#right{display:none}}
.m-toggle{display:none}
/* 移动端单栏：GitHub / AI 面板变覆盖式抽屉，编辑器始终占主屏 */
@media(max-width:760px){
  #left{display:none}
  #main{flex-direction:column;overflow-x:hidden;position:relative}
  #center{width:100%;max-width:100%;min-width:0}
  #editor-wrap{min-height:280px;max-width:100%;overflow:hidden}
  #editor-bar{flex-wrap:wrap}
  #gh-search{min-width:0}
  .CodeMirror{max-width:100%}
  .CodeMirror-scroll,.CodeMirror-sizer,.CodeMirror-gutters{max-width:100%!important;min-width:0!important}
  #out{height:150px}
  #topbar{padding:8px 10px;flex-wrap:wrap}
  #topbar .logo{display:none}
  #topbar > a{display:none}              /* 移动端隐藏导航链接，仅保留核心操作 */
  #gh-search{min-width:0;flex:1 1 100%;order:10}  /* 搜索栏独占一行，避免顶栏溢出 */
  .m-toggle{display:inline-block;background:var(--card);border:1px solid var(--line);color:var(--cyan);
    border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
  .m-toggle.on{background:var(--grad);color:#0a0f1e;border-color:transparent}
  /* 抽屉层（覆盖编辑器，不挤压） */
  #left,#right{display:none;position:fixed;top:0;bottom:0;width:min(320px,86vw);z-index:120;
    background:#0a0f1a;box-shadow:0 0 40px rgba(0,0,0,.5);padding-top:8px}
  #left{left:0;border-right:1px solid var(--line);border-left:none}
  #right{right:0;border-left:1px solid var(--line);border-right:none}
  #left.m-open,#right.m-open{display:flex}
  .m-mask{position:fixed;inset:0;background:rgba(2,5,12,.55);z-index:119;display:none}
  .m-mask.show{display:block}
}
</style>

<script>
const $=id=>document.getElementById(id);
/* ================= IDE ================= */
const editor=CodeMirror($('editor-wrap'),{
  value:'# 欢迎来到白驹工作站\n# 左侧搜 GitHub 开源项目（免登录），右侧 AI 对话生成代码\n# 写好代码后点顶部「运行」\n\nprint("Hello, 白驹!")\nfor i in range(3):\n    print("第", i+1, "步：会写代码了")\n',
  mode:'python',theme:'dracula',lineNumbers:true,indentUnit:4
});
const LANGS={python:'python',javascript:'javascript',html:'xml',markdown:'markdown'};
$('lang-sel').onchange=e=>{editor.setOption('mode',LANGS[e.target.value]);
  const ext={python:'py',javascript:'js',html:'html',markdown:'md'}[e.target.value];
  $('cur-file').textContent='untitled.'+ext;};
function detectLang(path){
  const ext=(path.split('.').pop()||'').toLowerCase();
  const m={py:'python',js:'javascript',html:'html',htm:'html',md:'markdown'};
  if(m[ext]){$('lang-sel').value=m[ext];editor.setOption('mode',LANGS[m[ext]]);}
}
$('new-btn').onclick=()=>{editor.setValue('');$('cur-file').textContent='untitled.'+$('lang-sel').selectedOptions[0].textContent.split('.')[0];};
$('dl-btn').onclick=()=>{
  const blob=new Blob([editor.getValue()],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=($('cur-file').textContent.split(' ——')[0]||'code.txt');a.click();URL.revokeObjectURL(a.href);};
/* ================= 运行（编译） ================= */
let pyodide=null,pyLoading=false;
function out(t,color){const d=$('out-body');d.innerHTML+='<span style="color:'+(color||'#b9c8ea')+'">'+String(t).replace(/</g,'&lt;')+'\n</span>';d.scrollTop=1e9;}
async function runPython(code){
  $('out-body').style.display='block';$('out-frame').style.display='none';
  if(!pyodide){
    if(pyLoading){out('Pyodide 正在加载中，稍候再点运行…','#f5c26b');return;}
    pyLoading=true;out('首次运行 Python：正在加载 Pyodide（浏览器内 Python 运行时，约 10MB）…','#f5c26b');
    try{
      await new Promise((res,rej)=>{const s=document.createElement('script');
        s.src='https://registry.npmmirror.com/pyodide/0.26.4/full/pyodide.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
      pyodide=await loadPyodide({indexURL:'https://registry.npmmirror.com/pyodide/0.26.4/full/'});
      out('Python 环境就绪 ','#4ade80');
    }catch(e){out('Pyodide 加载失败：'+e.message,'#ff6b6b');pyLoading=false;return;}
    pyLoading=false;
  }
  pyodide.setStdout({batched:t=>out(t)});
  pyodide.setStderr({batched:t=>out(t,'#ff6b6b')});
  try{await pyodide.runPythonAsync(code);}catch(e){out(e.message,'#ff6b6b');}
}
function runJS(code){
  $('out-body').style.display='block';$('out-frame').style.display='none';
  const f=$('out-frame');
  f.srcdoc='<script>const send=(t,d)=>parent.postMessage({__ide:1,type:t,data:d},"*");'
    +'console.log=(...a)=>send("log",a.join(" "));console.error=(...a)=>send("err",a.join(" "));'
    +'onerror=(m)=>send("err",m);try{'+code.replace(/<\/script>/g,'<\\/script>')
    +'}catch(e){send("err",e.message)}<\/script>';
}
addEventListener('message',e=>{
  if(!e.data||e.data.__ide!==1)return;
  out(e.data.data,e.data.type==='err'?'#ff6b6b':'#b9c8ea');
});
function runHTML(code){
  $('out-body').style.display='none';$('out-frame').style.display='block';
  $('out-frame').srcdoc=code;
}
$('run-btn').onclick=()=>{
  const lang=$('lang-sel').value,code=editor.getValue();
  out(' 运行 ('+lang+') …','#38e1ff');
  if(lang==='python')runPython(code);
  else if(lang==='javascript')runJS(code);
  else if(lang==='html')runHTML(code);
  else{$('out-body').style.display='block';$('out-frame').style.display='none';
    out('Markdown 预览：\n');const d=$('out-body');d.innerHTML='<div style="font-family:inherit">'+marked.parse(code)+'</div>';}
};
$('clear-out').onclick=()=>{$('out-body').innerHTML='';$('out-frame').srcdoc='';};
/* ================= GitHub 免登录 ================= */
async function gh(url){
  const r=await fetch(url,{headers:{'Accept':'application/vnd.github+json'}});
  if(!r.ok)throw new Error('GitHub API '+r.status+(r.status===403?'（免登录限流 60 次/小时，稍后再试）':''));
  return r.json();
}
$('gh-btn').onclick=async()=>{
  const q=$('gh-q').value.trim();if(!q)return;
  $('repos').innerHTML='<div style="padding:10px;font-size:12px;color:var(--muted)">搜索中…</div>';
  try{
    const j=await gh('https://api.github.com/search/repositories?q='+encodeURIComponent(q)+'&sort=stars&per_page=8');
    $('repos').innerHTML='';
    j.items.forEach(r=>{
      const d=document.createElement('div');d.className='repo-item';
      d.innerHTML='<div class="rn">'+r.full_name+'</div><div class="rd">'+(r.description||'')+'</div>'
        +'<div class="rs"> '+Math.round(r.stargazers_count/1000)+'k · '+(r.language||'')+'</div>';
      d.onclick=()=>openRepo(r);$('repos').appendChild(d);});
    if(!j.items.length)$('repos').innerHTML='<div style="padding:10px;font-size:12px;color:var(--muted)">没有找到相关仓库</div>';
  }catch(e){$('repos').innerHTML='<div style="padding:10px;font-size:12px;color:#ff6b6b">'+e.message+'</div>';}
};
let curRepo=null;
async function openRepo(r){
  curRepo=r;
  $('files').innerHTML='<div style="padding:10px;font-size:12px;color:var(--muted)">读取文件树…</div>';
  $('repo-actions').innerHTML=
    '<a href="'+r.html_url+'" target="_blank"> GitHub 页面</a>'
    +'<a href="https://codeload.github.com/'+r.full_name+'/zip/refs/heads/'+r.default_branch+'"> 一键下载整个项目 ZIP</a>';
  try{
    const t=await gh('https://api.github.com/repos/'+r.full_name+'/git/trees/'+r.default_branch+'?recursive=1');
    const files=t.tree.filter(x=>x.type==='blob'&&/\.(py|js|ts|html|md|json|txt|yml|yaml|toml|sh|css)$/i.test(x.path)).slice(0,80);
    $('files').innerHTML='';
    files.forEach(f=>{
      const d=document.createElement('div');d.className='file-item';d.textContent=f.path;
      d.onclick=()=>openFile(r,f.path);$('files').appendChild(d);});
    if(!files.length)$('files').innerHTML='<div style="padding:10px;font-size:12px;color:var(--muted)">未列出文本文件，直接下载 ZIP 查看。</div>';
  }catch(e){$('files').innerHTML='<div style="padding:10px;font-size:12px;color:#ff6b6b">'+e.message+'</div>';}
}
async function openFile(r,path){
  $('cur-file').textContent=r.full_name+'/'+path;
  detectLang(path);
  try{
    const res=await fetch('https://raw.githubusercontent.com/'+r.full_name+'/'+r.default_branch+'/'+path);
    if(!res.ok)throw new Error('读取失败 '+res.status);
    editor.setValue(await res.text());
    out(' 已载入 '+path,'#4ade80');
  }catch(e){out(e.message,'#ff6b6b');}
}
/* ================= AI 全景对话 ================= */
const FILES=[['AI实战全书','book/AI实战全书.html'],['开源项目全景','../blog/AI实战全书.html'],['工科实战','../blog/AI时代工科学习-编程计算机数控仿真实战.html'],['开发者基地','./devbase.html']];
let CORPUS=[];
(async()=>{for(const [n,u] of FILES){try{const r=await fetch(encodeURI(u));if(r.ok){let t=await r.text();
  if(u.endsWith('.html'))t=t.replace(/<style[\s\S]*?<\/style>/g,'').replace(/<script[\s\S]*?<\/script>/g,'').replace(/<[^>]+>/g,' ');
  CORPUS.push({name:n,text:t});}}catch(e){}}
  sys(' 工作站就绪。语料 '+CORPUS.length+' 部；GitHub 免登录通道已开；IDE 已装入示例 Python，点「 运行」试试。');})();
function sys(t){add(t,'sys')}
function add(t,cls){const d=document.createElement('div');d.className='msg '+cls;
  d.innerHTML=(cls==='bot')?marked.parse(t):t.replace(/</g,'&lt;');
  $('msgs').appendChild(d);$('msgs').scrollTop=1e9;
  if(cls==='bot')d.querySelectorAll('pre code').forEach(c=>{
    const b=document.createElement('button');b.className='toeditor';b.textContent=' 写入编辑器';
    b.onclick=()=>{editor.setValue(c.innerText);out(' AI 代码已写入编辑器','#4ade80');};
    c.parentElement.after(b);});
  return d;}
function retrieve(q){
  const keys=[...new Set(q.match(/[\u4e00-\u9fa5]{2,}|[a-zA-Z0-9]{2,}/g)||[])];
  return CORPUS.map(c=>{
    const s=c.text.split(/\n{2,}/).map(p=>{let n=0;keys.forEach(k=>{n+=(p.split(k).length-1)*(k.length>3?3:1)});return{p,s:n};})
      .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,4);
    return s.length?{name:c.name,hits:s.map(x=>x.p)}:null;
  }).filter(Boolean);
}
/* ================= 内置大模型（WebLLM · 浏览器本地真运行） ================= */
let engine=null,engineLoading=false;
async function ensureEngine(onProgress){
  if(engine)return engine;
  if(!navigator.gpu)throw new Error('当前浏览器不支持 WebGPU，请用最新版 Chrome/Edge 打开（或切换 Ollama / DeepSeek 模式）');
  if(engineLoading)throw new Error('模型正在加载中，请稍候…');
  engineLoading=true;
  const webllm=await import('https://esm.run/@mlc-ai/web-llm');
  engine=await webllm.CreateMLCEngine('Qwen2.5-1.5B-Instruct-q4f16_1-MLC',{
    initProgressCallback:p=>onProgress&&onProgress(p.text||'加载中…')
  });
  engineLoading=false;
  $('engine-status').innerHTML=' 内置模型已就绪：Qwen2.5-1.5B 正在你的浏览器里本地运行（离线可用）';
  return engine;
}
async function aiSend(){
  const q=$('ai-q').value.trim();if(!q)return;
  add(q,'user');$('ai-q').value='';
  const ctx=retrieve(q).map(c=>'【'+c.name+'】\n'+c.hits.join('\n')).join('\n\n').slice(0,6000);
  const mode=$('aimode').value;
  const typing=add('思考中…','bot');
  const curCode=editor.getValue().slice(0,3000);
  const sysP='你是白驹工作站（一个网页 IDE）里的 AI 助手。用户当前编辑器语言：'+$('lang-sel').value+'，编辑器内容：\n'+curCode+'\n\n门户书稿语料：\n'+ctx+'\n\n要求：编程问题直接给可运行代码（用代码块包裹）；其他问题据语料精炼回答。';
  try{
    let ans;
    if(mode==='webllm'){
      if(!engine){
        typing.innerHTML=' 首次启动：正在把大模型下载进你的浏览器…<br><span style="font-size:12px;color:var(--muted)" id="dlprog">准备中…</span>';
        await ensureEngine(t=>{const el=$('dlprog');if(el)el.textContent=t;});
        typing.innerHTML=' 模型加载完成，开始思考…';
      }
      const reply=await engine.chat.completions.create({messages:[{role:'system',content:sysP},{role:'user',content:q}]});
      ans=reply.choices[0].message.content;
    }
    else if(mode==='deepseek'){
      const key=($('aikey').value.trim())||CC.get('deepseek');
      if(!key)throw new Error('请填 DeepSeek API Key（本地运行 node server.mjs 可免填，用服务端 Key）');
      if($('aikey').value.trim())CC.set('deepseek',key);
      ans=await askLLM('https://api.deepseek.com/v1/chat/completions','deepseek-chat',sysP,q,key);
    }else if(mode==='ollama'){
      ans=await askLLM('http://localhost:11434/v1/chat/completions','qwen3:8b',sysP,q);
    }else{
      const ctxArr=retrieve(q);
      ans=ctxArr.length?'**检索到相关内容：**\n\n'+ctxArr.slice(0,2).map(c=>'### 《'+c.name+'》\n> '+c.hits[0].slice(0,240).replace(/\n/g,' ')+'…').join('\n\n')
        +'\n\n---\n切到 Ollama / DeepSeek 大脑后，我可以直接生成可运行代码并写入编辑器。'
        :'免配置模式下我只做书稿检索，未命中「'+q+'」。切换到 Ollama 或 DeepSeek 大脑，即可生成代码。';
    }
    typing.remove();add(ans,'bot');
  }catch(e){typing.remove();add('**'+e.message+'**（已降级为检索模式）','bot');
    const ctxArr=retrieve(q);if(ctxArr.length)add('《'+ctxArr[0].name+'》：'+ctxArr[0].hits[0].slice(0,200)+'…','bot');}
  $('msgs').scrollTop=1e9;
}
async function askLLM(url,model,sysP,q,key){
  const headers={'Content-Type':'application/json'};
  if(key)headers['Authorization']='Bearer '+key;
  const r=await fetch(url,{method:'POST',headers,
    body:JSON.stringify({model,messages:[{role:'system',content:sysP},{role:'user',content:q}]})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return (await r.json()).choices[0].message.content;
}
$('ai-send').onclick=aiSend;
$('ai-q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSend();}});
$('gh-q').addEventListener('keydown',e=>{if(e.key==='Enter')$('gh-btn').click();});
