window.BJ_CORPUS={"book\\AI实战全书.md":"# AI 实战全书\n\n## ——从第一次对话，到用 AI 赚钱的完整指南\n\n> **版本**：2026 年 8 月版。全书只讲当前最新的模型与工具，过时内容一律不写。\n> **读者**：零基础起步的所有人；以及要教别人用 AI 的人。\n> **用法**：每章 = 看得懂的原理 + 抄得走的操作 + 拿得走的模板。每章末尾有\"动手任务\"，照做就会。\n\n---\n\n# 第一篇 对话 AI：你和智能时代，只差一个对话框\n\n## 第 1 章 十分钟认识所有主流 AI\n\n### 1.1 一张表看懂 2026 格局\n\n| AI | 出品方 | 最强项 | 收费 |\n|---|---|---|---|\n| **DeepSeek** | 深度求索（中国） | 深度思考（R 系列推理）、性价比、开源生态 | 网页/App 全免费；API 极低价 |\n| **ChatGPT（GPT-5.6）** | OpenAI（美国） | 全能均衡；免费用户已获无限对话 + Think 推理 | 免费版够用 |\n| **豆包** | 字节跳动（中国） | 中文日常体验、语音通话、多模态 | 免费 |\n| **Kimi** | 月之暗面（中国） | 长文档：扔给它整本书、百页合同 | 免费 |\n| **通义千问** | 阿里（中国） | 办公全家桶：文档、表格、会议 | 免费 |\n| **Claude** | Anthropic（美国） | 写作与编程，\"行文最像人\" | 免费版 + 订阅 |\n| **Gemini** | Google（美国） | 多模态、超长上下文、谷歌全家桶联动 | 免费版 + 订阅 |\n\n**新手三选一**：日常主力用 **DeepSeek**（免费 + 深度思考）；读长文档用 **Kimi**；手机随手聊用 **豆包**。一个月后自然会有自己的偏好。\n\n### 1.2 第一次对话的正确姿势\n\n大多数人第一次用 AI：输入\"帮我写个工作总结\"，得到一段平庸的废话，然后宣布\"AI 不过如此\"。错不在 AI，在提问：\n\n-  小白问法：\"帮我写个工作总结\"\n-  入门问法：\"我是电商客服主管，本周处理了 320 个售后工单，主打物流延迟问题。写一份 300 字周报，语气简洁，突出'物流延迟率下降 15%'这个数据\"\n-  高手问法：入门问法 + \"写完后站在我老板的角度挑 3 个毛病，并直接改好\"\n\n同一个 AI，三种问法，三个世界。本书教的不是\"选哪个 AI\"，而是\"怎么驱动它\"。\n\n### 1.3 必须打开的两个开关\n\n1. **深度思考**（R 系列推理）：数学、逻辑、策划、分析类问题必开。看 AI\"先想后答\"，推理过程本身就是思维课。\n2. **联网搜索**：凡和\"最近\"有关的问题必开——新闻、价格、政策。不开，AI 只知道旧闻。\n\n**动手任务**：用\"高手问法\"让 AI 写一份你真实的周报，体验三档差距。\n\n---\n\n## 第 2 章 对话 AI 的十八般用法\n\n### 2.1 学习加速器\n- **三层讲解**：\"把【量子纠缠】分别讲给 10 岁孩子、高中生、大学生听\"——一次要三层，哪里卡住读哪里。\n- **出题老师**：\"根据这篇课文出 5 道选择题 + 2 道简答题，附答案与解析。\"\n- **长文陪读**：长文档发 Kimi  \"300 字总结核心观点，列出 3 个我还没问但应该问的问题\"。\n\n### 2.2 工作放大器\n- **邮件改写**：\"把这封邮件改得既坚定又不得罪人：【原文】\"\n- **Excel 救星**：\"A 列姓名、B 列销售额，写公式找出前 10% 并标红\"——AI 直接给公式和设置步骤。\n- **会议纪要**：录音转文字后发给 AI：\"提炼决议事项、待办（含负责人）、三个争议点\"。\n\n### 2.3 生活万金油\n- 旅行：\"10 月 1 日广州出发成都 4 天，带老人，预算 4000，要松弛不赶路，出逐日行程表\"\n- 健康：\"这份体检报告哪些指标异常？大白话解释，该挂什么科\"（不替代医生）\n- 法律常识：\"房东提前收房，押金怎么办？依据民法典哪条？\"（重大决策请咨询律师）\n\n**动手任务**：把下周真实要做的一件事（出行/汇报/采购）交给 AI 完整规划一次。\n\n---\n\n# 第二篇 AI 工具全书：写、画、剪、办公、编程\n\n## 第 3 章 AI 写作：从公文到小说\n\n**黄金流程（全书通用）**：三级大纲  分节扩写  人工注入真实经历  \"杠精编辑\"终审。\n\n### 3.1 四种文体打法\n- **公文/汇报**：给背景 + 给数据 + 给格式。\"你是资深笔杆子，根据素材写【文种】，要求……\"\n- **公众号/小红书**：\"百万粉博主，主题【X】：5 个标题（≤20 字含数字或悬念）+ 正文 + 3 个话题标签\"\n- **短视频脚本**：\"60 秒分镜表：镜号/景别/画面/旁白/时长，画面描述可直接用作 AI 视频提示词\"\n- **小说**：人物卡先行  章纲  逐章生成  每章开头附\"前情摘要\"防设定漂移。\n\n### 3.2 祛 AI 味三刀\n1. **换案例**：\"某博主提升了效率\"换成你的真实数字与细节\n2. **删套话**：\"值得注意的是\"\"综上所述\"\"随着……的发展\"见一个删一个\n3. **加毛边**：允许口语、短句、自嘲。完美无瑕是 AI 最大的指纹\n\n## 第 4 章 AI 绘画与视频\n\n### 4.1 出图（即梦 / Midjourney / 通义万相）\n公式：**主体 + 环境 + 光线 + 风格 + 画幅**\n示例：\"深夜便利店，穿雨衣的女孩在窗前喝热饮，暖黄灯光与雨夜蓝光对比，电影感，16:9\"\n\n### 4.2 出视频（可灵 / 即梦 / 混元视频）\n铁律：**先出图，再图生视频**。纯文生视频是开盲盒，图生视频是照图施工。流程：文生图定关键帧  图生视频加运动  剪映串联成片。\n\n### 4.3 剪辑（剪映专业版）\n智能字幕、智能剪口播、智能踩点、AI 配音、电影感预设——口播视频从粗剪到成片约 10 分钟。\n\n## 第 5 章 AI 办公与编程\n- **办公**：通义千问读文档、WPS AI 写公文做 PPT、飞书妙记出纪要、DeepSeek 写 Excel 公式与数据分析\n- **编程（Vibe Coding）**：对 CodeBuddy / Cursor 说人话即可生成软件。心法三步：说清楚要什么  让 AI 解释方案  验收时让它自测。本门户全部页面就是这样做出来的。\n\n**动手任务**：用出图公式生成一张图，再图生视频让它动起来，体会\"盲盒\"与\"施工\"的区别。\n\n---\n\n# 第三篇 提示词工程：值钱的不是 AI，是驱动 AI 的人\n\n## 第 6 章 万能公式与十大模板\n\n**万能公式 = 角色 + 任务 + 上下文 + 约束 + 输出格式 + 示例**\n\n十大即抄即用模板：\n\n1. **选题军师**：\"你是百万粉博主，围绕【领域】给 5 个选题：标题≤20 字含数字或悬念，标注目标情绪，附 15 字开场钩子，输出表格\"\n2. **杠精编辑**：\"你是毒舌主编：1) 找 5 个最大问题并引用原文 2) 指出 3 处'像 AI 写的'句子 3) 给修改示范，保留我的风格\"\n3. **深度分析师**（开深度思考）：\"分析【现象】：先列三种对立解释，评估各自证据强度，给出你的判断及置信度\"\n4. **苏格拉底老师**：\"不要直接给答案。通过连续提问，引导我自己想出【问题】的答案\"\n5. **分镜编导**：\"为主题【X】写 60 秒分镜：8-12 镜，每镜 3-8 秒，画面描述可直接作为 AI 视频提示词，输出表格\"\n6. **面试官**：\"你是【岗位】面试官，连续问我 5 个由易到难的问题，我每次答完你给评分和改进版\"\n7. **翻译润色**：\"译为地道英文，分'直译/意译/商务正式'三版，标注关键选词理由\"\n8. **数据解读**：\"解读这份数据：3 个最重要发现、1 个反常识发现、2 个值得追问的问题\"\n9. **谈判教练**：\"我要和【对方】谈【事项】，我的底线是【X】。预演：对方最可能的 3 个压价话术及我的回应\"\n10. **复盘师**：\"我做砸了【事情】，经过是……帮我复盘：归因分'运气/能力/流程'三类，给 3 条下次可执行的改进\"\n\n## 第 7 章 高手心法\n- **迭代 > 一次完美**：第一轮要框架，第二轮填血肉，第三轮换风格，第四轮让它自我批判\n- **给反例**：\"不要写成这样：【烂例子】\"胜过十条形容词\n- **让它反问**：\"开始前先向我提 5 个能帮你做得更好的问题\"\n- **人设封装**：固定人设写进自定义指令（各平台均支持），一次设定永久生效\n\n---\n\n# 第四篇 AI 赚钱：真实路径与清醒账本\n\n## 第 8 章 八条已被验证的路径\n\n| 路径 | 投入 | 变现方式 | 适合谁 |\n|---|---|---|---|\n| AI 内容账号 | 时间为主 | 流量分成、商单 | 有表达欲的人 |\n| AI 代写/代做 | 技能 + 时间 | 接单平台、私域 | 文笔/审美在线者 |\n| AI 视频短片 | 工具订阅 | 商单、账号变现 | 愿意学剪辑的人 |\n| 知识付费 | 经验沉淀 | 专栏、训练营 | 某领域老手 |\n| AI 提效咨询 | 行业认知 | 企业服务 | 有行业资源者 |\n| 数字产品 | 一次制作 | 模板/提示词包/小工具 | 产品思维者 |\n| 一人公司 | 全栈打法 | 产品营收 | 能扛决策密度的人 |\n| AI 技能溢价 | 学习成本 | 升职加薪 | 职场人（最稳） |\n\n**清醒账本**：AI 把\"会做\"的成本打到近零，于是\"知道做什么、卖给谁\"成了全部价值。宣称\"躺赚\"的都是卖铲子的；真实赚到钱的人都在某个细分领域有真理解。\n\n## 第 9 章 一人公司操作手册（精华版）\n\n全链路工具栈：技术（AI 编程 + 纪律技能包）、大脑（DeepSeek）、运营（n8n 自动化）、设计（AI 绘画/视频）、客服（Dify/FastGPT 知识库）、安全（garak/Strix 上线体检）。月成本可压到 ¥100~500。\n\n三条军规：① 选你真正懂的细分领域；② 先做能收钱的最小产品，再做完美的产品；③ AI 是员工，不是搜索引擎——要给它定 KPI、验收、复盘。\n\n---\n\n# 第五篇 打造你的专属 AI 助手\n\n## 第 10 章 三种方式，由易到难\n\n### 10.1 自定义指令（5 分钟，零门槛）\n各平台都有\"自定义指令/个人设定\"入口。填入：\"我的职业、我的目标、回答风格要求\"——从此 AI 每次开口都懂你。\n\n### 10.2 知识库助手（一下午，零代码）\n用 Dify / FastGPT：上传你的文档  自动切片向量化  获得\"只根据你的资料回答\"的助手。发布为链接，就是你的 24 小时客服/助教/资料员。\n\n### 10.3 本地私有助手（技术向，数据不出机）\nOllama 跑开源模型 + Modelfile 封装人设：\n\n```\nFROM qwen3:8b\nSYSTEM \"你是「墨白」，毒舌但靠谱的写作助教：\n1. 只答写作问题 2. 先指出最大问题再给示范 3. 禁止空话\"\nPARAMETER temperature 0.8\n```\n\n`ollama create mobai -f Modelfile` 一条命令打包完成。财务、病历、日记这类隐私数据，用它处理最安心。\n\n**动手任务**：任选一种方式，本周内做出一个\"真的会用第二次\"的助手。\n\n---\n\n# 第六篇 学习路线图\n\n## 第 11 章 四周路线图（零基础  能教别人）\n\n| 周 | 目标 | 每天 30 分钟做什么 | 验收标准 |\n|---|---|---|---|\n| 第 1 周 | 对话自由 | 第 1-2 章 + 高手问法练真实任务 | 能用 AI 完成一件真实工作 |\n| 第 2 周 | 工具上手 | 第 3-5 章：写一篇、画一张、剪一段 | 产出一图 + 一 15 秒视频 |\n| 第 3 周 | 提示词进阶 | 第 6-7 章：十个模板各用一遍 | 收藏 3 个你自己的模板 |\n| 第 4 周 | 做出助手 | 第 10 章三选一 + 第 11 章输出 | 教会一位朋友，并做出你的助手 |\n\n**能教别人，才是真学会。** 第四周的隐藏任务：把你最常用的一个模板教给身边一个人——你会发现讲一遍，理解深一倍。\n\n## 第 12 章 持续跟进：如何永不过时\n\n- **每周 10 分钟**：扫一眼 GitHub Trending 与主流模型更新日志\n- **每月 1 小时**：试一个新工具，淘汰一个旧习惯\n- **本门户持续更新**：编年史追踪历史与格局，开发者基地追踪开源实战，本书稿沉淀方法——三位一体，常读常新\n\n---\n\n# 附录 · 速查卡\n\n**万能公式**：角色 + 任务 + 上下文 + 约束 + 格式 + 示例\n**黄金流程**：大纲  扩写  注入真实  杠精终审\n**祛 AI 味**：换案例、删套话、加毛边\n**出视频**：先出图，再图生视频\n**赚钱观**：AI 消灭执行成本，放大决策价值；细分领域的真理解是唯一护城河\n\n---\n\n# 第七篇 八大行业实战手册\n\n> 通用方法人人会背，行业打法才是真功夫。本篇按行业给出\"工作流 + 提示词 + 避坑\"，每一节都可独立当成一门小课。\n\n## 第 13 章 电商与实体生意\n\n**AI 能接管的动作**：选品分析、标题优化、详情页文案、客服话术、评价回复、投放素材。\n\n**实战工作流（以淘宝店为例）**：\n1. **选品**：把类目榜单数据发给 AI  \"分析这 20 个竞品：价格带分布、差评关键词 Top5、未被满足的需求\"\n2. **标题**：\"你是淘系运营老手，产品卖点是【X】，参考这 10 个竞品标题，产出 10 个标题，每个包含 1 个场景词 + 1 个痛点词 + 1 个数字\"\n3. **详情页**：\"按'痛点场景  解决方案  证据  打消顾虑  促单'结构写详情页文案\"\n4. **客服**：把常见 50 问整理成知识库喂给 Dify，获得 24 小时自动客服\n5. **评价回复**：\"用店主口吻回复这条差评：诚恳道歉 + 具体补救 + 不超过 80 字\"\n\n**避坑**：AI 写的卖点必须过一遍广告法违禁词（\"最\"\"第一\"\"治疗\"类词让 AI 自查：\"检查这段文案是否含广告法违禁词\"）。\n\n## 第 14 章 自媒体与短视频\n\n**账号冷启动七步**：\n1. 定位：让 AI 做\"赛道体检\"——\"分析【赛道】头部 20 个账号的共同点和内容缺口\"\n2. 选题：用\"选题军师\"模板批量产出，每周囤 30 条\n3. 脚本：60 秒分镜表模板，画面描述直接喂视频生成\n4. 标题封面：一稿 20 个标题做内部票选；封面用 AI 出图\n5. 一稿多发：同一条内容让 AI 改写抖音/B站/小红书/公众号四个版本\n6. 评论区运营：\"给这条视频写 5 条神评论风格的预埋评论\"（用于引导讨论，请遵守平台规则）\n7. 复盘：每周把后台数据发给 AI  \"哪条跑赢大盘？归因到选题/封面/开头三秒，哪个环节？\"\n\n**避坑**：平台 AI 检测日趋严格，纯 AI 生成的低质内容会被限流。\"AI 出稿 + 人改 30%\"是最低安全线。\n\n## 第 15 章 教师与知识博主\n\n- **备课**：\"按布鲁姆教学目标分类，为【课文】设计 45 分钟教案：导入/讲解/互动/作业四段\"\n- **分层作业**：\"同一知识点出基础/提高/挑战三档练习\"\n- **知识付费**：经验  让 AI 协助整理成大纲  逐节录制  AI 出讲义与习题  上架专栏\n- **避坑**：给学生的 AI 使用立规矩——\"可以用 AI 查资料，不能用 AI 交作业\"，并让 AI 帮你设计\"防 AI 代写\"的开口题\n\n## 第 16 章 程序员与技术岗\n\n- **日常**：CodeBuddy/Cursor 生成业务代码；DeepSeek 做 Code Review（\"以资深架构师视角审查这段代码：安全、性能、可读性各给一条最重要意见\"）\n- **调试**：贴报错 + 贴上下文 + \"先解释原因，再给修复，再说怎么避免\"\n- **学习新技术**：\"用我熟悉的 Python 类比，给我讲明白 Rust 的所有权机制\"\n- **避坑**：AI 生成的代码必须过测试；涉及鉴权、支付的代码逐行人工审\n\n## 第 17 章 财务、法务、行政\n\n- **财务**：Excel 公式生成、报表解读（\"指出这份财报三个异常项\"）、报销制度问答助手\n- **法务**：合同审查初筛（\"找出这份合同中对乙方不利的 5 个条款\"）——**终稿必须律师过目**\n- **行政**：制度起草、会议纪要、活动策划案、邮件模板库\n- **避坑**：涉及金额与法律责任的输出，AI 只做初筛，人做终审——这条写进团队规范\n\n## 第 18 章 医疗、健康与心理\n\n- **可用**：报告指标白话解读、就医前问题清单整理、健康科普内容创作、用药提醒脚本\n- **红线**：诊断与用药决策必须医生做；心理倾诉可以聊，但危机干预必须转专业热线\n- **行业机会**：医疗自媒体是 2026 年稀缺赛道——\"AI 起草 + 医生背书\"的内容模式已被验证\n\n## 第 19 章 制造业与工科\n\n- **数控/工艺**：让 AI 解释 G 代码、生成工艺卡片初稿、做质检报告模板\n- **仿真与实训**：用 AI 生成仿真脚本、实训指导书、故障排查决策树\n- **详细实战见本门户《AI 时代工科学习实战》专卷**（编程/数控/仿真全部带可运行代码）\n\n## 第 20 章 公务员与事业单位\n\n- **公文**：通知/请示/纪要/讲话稿——给要素（事由、对象、时限、口径），AI 出规范初稿\n- **调研报告**：访谈记录发给 AI  提炼问题清单  对策建议框架\n- **避坑**：涉密与内部数据**绝不进公网 AI**，用本地部署模型（Ollama）处理\n\n---\n\n# 第八篇 提示词百宝库\n\n> 100 条高频提示词，按场景分类，复制替换【】即可使用。精选前 40 条列于书稿，完整版见门户提示词模块（持续更新）。\n\n## 学习成长（1-10）\n1. 把【概念】用三个年龄段能懂的话各讲一遍\n2. 为【主题】设计 7 天自学计划：每天 30 分钟，含检验方式\n3. 扮演苏格拉底，用连续提问引导我弄懂【问题】\n4. 把这篇文章压缩成 5 句话，再展开成 500 字，对比两种读法\n5. 出 10 道题检验我是否掌握【知识点】，逐题给解析\n6. 我是【专业】学生，用我专业的例子解释【跨学科概念】\n7. 这本书【书名】的核心理论是什么？它在 2026 年还成立吗？批判性评价\n8. 把【英语段落】逐句精讲：生词、语法点、地道表达\n9. 模拟【考试】面试官，五轮追问，每轮给评分\n10. 我学了【技能】但总忘，给我一套基于间隔重复的回忆卡片\n\n## 职场办公（11-20）\n11. 把这段流水账改成结构清晰的周报：进展/数据/风险/计划\n12. 这封邮件语气太硬，改到\"坚定但不得罪人\"，给两个版本\n13. 设计一份 30 分钟的会议议程，确保能出决议\n14. 把这份会议纪要提炼成：决议、待办（到人到期）、遗留问题\n15. 写一份项目复盘：亮点/不足/根因/可复制的经验\n16. 帮我准备晋升答辩：5 分钟陈述稿 + 10 个可能被追问的问题\n17. 这个方案的预算部分帮我做三种口径：保守/常规/激进\n18. 把领导这段口播式语音整理成正式通知\n19. 设计新人入职第一周的带教计划\n20. 用 STAR 法则帮我改写这段简历经历\n\n## 内容创作（21-30）\n21. 给【主题】出 10 个标题：数字型/悬念型/反常识型各若干\n22. 把这个选题写成 60 秒口播脚本，前 3 秒必须有钩子\n23. 把这篇长文改写成小红书风格：短句、表情分隔、种草口吻\n24. 检查这篇文章的 AI 味：找出所有套话并给替换方案\n25. 为这篇科普文设计 3 个类比，让外行秒懂\n26. 把这期播客逐字稿提炼成shownotes：时间轴+金句+资源链接\n27. 写一个系列专栏的 12 期规划：主题递进、每期钩子\n28. 这段视频文案配什么 BGM 情绪？给三个方向及理由\n29. 把这条爆款拆解成可复用的结构模板\n30. 给这个故事设计三个不同结局：温暖/讽刺/开放\n\n## 商业赚钱（31-40）\n31. 分析这个生意模式：谁付费、为何付费、最大的成本坑在哪\n32. 为【产品】写一版 elevator pitch：30 秒，让外行想投钱\n33. 设计这个服务的三档定价，并给每档一个\"值回票价\"的理由\n34. 我的目标客户是【人群】，他们在哪聚集？用什么内容能触达？\n35. 模拟我的挑剔客户，对这个报价单提出 5 个砍价点，并给我回应话术\n36. 这个副业的冷启动第一步是什么？给我一个 48 小时内能完成的动作\n37. 把我的【技能】包装成三个可售卖的服务产品\n38. 分析我的竞品账号：它最赚钱的内容类型是什么？缺口在哪？\n39. 设计一个老客户转介绍机制，成本控制在营收 5% 以内\n40. 给我一份\"本月现金流风险\"自查清单\n\n（41-100 条覆盖：生活助手、亲子教育、健康运动、编程开发、创意设计、AI 协作进阶——完整版见门户\"提示词工程\"与\"开发者基地\"章节，持续增补。）\n\n---\n\n# 第九篇 二十个完整案例库\n\n> 每个案例都给出：背景  完整提示词  产出摘要  可复制要点。以下精选六个完整展开，其余以索引列出。\n\n## 案例 1：全职妈妈的绘本副业\n**背景**：零基础，想给孩子做专属绘本。\n**提示词链**：① \"写一本 12 页儿童绘本脚本，主题【分享】，主角是只小刺猬，每页一句话+画面描述\"  ② 画面描述逐页喂即梦出图  ③ \"把故事录成 3 分钟睡前音频文案，标注语气变化\"。\n**产出**：一本实体打印绘本 + 一条音频。后来她把这个流程做成\"定制绘本\"小生意，客单价 199 元。\n**要点**：个人痛点 = 最好的选品。\n\n## 案例 2：县城手机店老板的抖音号\n**背景**：实体店客流下滑。\n**提示词**：\"我是县城手机店老板，给我 30 个'帮老乡避坑'选题，要土味、直接、有用。\"\n**产出**：三个月 47 条视频，\"到店说抖音来的\"顾客占新增三成。\n**要点**：本地信任 > 全网爆款。\n\n## 案例 3：大四学生的求职突围\n**提示词链**：① \"用 STAR 法则改写我的三段经历\"  ② \"模拟【目标公司】面试官，五轮压力面\"  ③ \"根据我的回答给出评分和满分示范\"。\n**产出**：两周 14 场模拟面，拿到 3 个 offer。\n**要点**：AI 最被低估的用途是\"陪练\"——无限耐心、即时反馈。\n\n## 案例 4：英语老师的微课矩阵\n**提示词**：\"把'现在完成时'做成 8 期短视频系列：每期一个学生最常犯的错误，前 3 秒展示错误句子。\"\n**产出**：一学期更新 96 期，家长群自然裂变，周末班满员。\n**要点**：把\"答疑记录\"变成\"内容资产\"。\n\n## 案例 5：程序员的技术博客复活\n**提示词链**：\"把我这个项目的排障过程改写成技术博客：问题现象错误假设定位过程修复教训\"  \"再产出 5 个标题和一条推特体摘要\"。\n**产出**：周更半年，一篇被大厂技术号转载，带来面试邀约。\n**要点**：你踩过的坑，就是别人搜的关键词。\n\n## 案例 6：社区团购团长的小程序\n**背景**：想让接龙下单自动化。\n**做法**：对 CodeBuddy 描述需求\"做一个接龙小程序：商品列表、接龙按钮、截止统计\"，三轮迭代上线。\n**产出**：替代手工统计，每晚省 1.5 小时。\n**要点**：Vibe Coding 的最佳起点是\"给自己造工具\"。\n\n**案例 7-20 索引**：跨境电商详情页流水线 / 律所合同初筛助手 / 餐饮店点评回复系统 / 房产中介房源文案库 / 健身教练计划生成器 / 婚庆公司提案自动化 / 考研政治带背账号 / 宠物医院科普矩阵 / 二手车检测报告解读 / 外贸开发信工厂 / 园区招商材料生成 / 乡村民宿内容套装 / 播客剪辑流水线 / 大学生竞赛辅导助手——完整展开见门户\"实战案例\"模块持续更新。\n\n---\n\n# 第十篇 疑难解答（FAQ 50 问精选）\n\n**Q1：AI 会不会取代我的工作？**\n取代你的不是 AI，是\"会用 AI 的同行\"。最先消失的不是岗位，而是岗位里\"重复、模板化\"的那部分动作。对策：把省下的时间投到 AI 做不好的事——信任、审美、决策、担责。\n\n**Q2：免费版和付费版差多少？**\n2026 年的现状：日常问答、写作、学习，免费版（DeepSeek 全免费、GPT-5.6 免费档、豆包/Kimi/通义）已完全够用。付费版的价值在：更高限额、更长上下文、最新模型优先体验、API 额度。先用透免费版再决定。\n\n**Q3：AI 说的能信吗？**\n分场景：创意、结构、语言类——放心用；事实、数据、法律、医疗类——必须核查。养成习惯：让 AI\"给出信息来源\"，再抽查两个。\n\n**Q4：我的数据会被拿去训练吗？**\n看平台隐私政策：主流平台企业版/API 默认不用于训练；敏感数据用本地模型（Ollama）处理是终极方案。\n\n**Q5：学英语/编程还有意义吗？**\n有。AI 放大的是\"有基础的人\"。懂英语的人用 AI 翻译质量翻倍；懂编程的人用 Vibe Coding 效率十倍。AI 时代的铁律：**内行用 AI 是杠杆，外行用 AI 是盲盒**。\n\n**Q6：孩子该怎么接触 AI？**\n三原则：小学练提问（把 AI 当百科全书）、中学练核查（把 AI 当会犯错的家教）、大学练创造（把 AI 当创业合伙人）。禁止事项：作业代写。\n\n**Q7：提示词需要背吗？**\n不需要背，需要\"改\"。收藏本书的模板库，用的时候复制  替换【】 根据输出再追问一轮。三个月后你就有自己的模板库了。\n\n**Q8：多个 AI 结果打架怎么办？**\n这恰恰是高阶用法：把 A 的回答发给 B 批判，再把 B 的批判发给 A 回应——你当裁判。三方会审的结果，比任何单一答案可靠。\n\n**Q9：本地部署值得折腾吗？**\n三句话判断：常处理隐私数据  值得；想零成本重度使用  值得；只是日常问答  官方免费版够了。\n\n**Q10：现在开始晚吗？**\n2022 年有人问，2024 年有人问，2026 年还有人问。种一棵树最好的时间是十年前，其次是今天。而且本轮技术革命的\"应用红利期\"才刚刚开始——第 11 章的四周路线图，今晚就能开始第一周。\n\n（FAQ 11-50 涵盖：账号注册、API 申请、提示词调试、内容合规、变现税务、团队协作——完整版见门户持续更新。）\n\n---\n\n# 终章 写给每一位读者\n\n这本书没有一个字想让你\"记住\"，只想让你\"用起来\"。\n\nAI 这堂课没有期末考试，只有开卷实践。你合上书稿的这一刻，最好的下一步是：打开任何一个 AI，把本书第 6 章的某个模板，用在你明天真实要做的一件事上。\n\n做完那件事，你就已经毕业了——并且具备了教别人的资格。\n\n（全书持续修订 · 最新版永远在门户\"AI 实战全书\"章节）\n","book\\五卷全书\\AI工具大全-百科全书.md":"# AI 工具大全 · 百科全书\n\n> 这是一份持续更新的 AI 工具百科，按类别收录市面上几乎所有的主流 AI 工具。目标是「一册在手，AI 全有」。每个工具标注【用途】【免费/付费】【适合人群】。日更扩充中。\n\n---\n\n## 一、AI 对话与底座大模型\n\n| 工具 | 出品方 | 特点 | 费用 |\n|------|--------|------|------|\n| **DeepSeek V4** | 深度求索 | 开源、性价比之王、百万上下文、四种模式 | 网页免费 |\n| **ChatGPT / GPT-5.5** | OpenAI | 生态最全、插件丰富 | 免费+订阅 |\n| **Claude** | Anthropic | 写作细腻、代码强、长文档理解 | 免费+订阅 |\n| **Gemini** | 谷歌 | 多模态、与谷歌全家桶打通 | 免费+订阅 |\n| **通义千问 Qwen** | 阿里 | 中文强、开源系列丰富 | 免费 |\n| **Kimi** | 月之暗面 | 超长上下文、文档处理 | 免费 |\n| **豆包** | 字节 | 中文友好、免费额度大 | 免费 |\n| **文心一言** | 百度 | 中文生态、知识库 | 免费 |\n\n**选型建议**：中文日常用 DeepSeek/豆包/Kimi；写代码用 DeepSeek V4-Pro / Claude；多模态用 Gemini；追求生态用 ChatGPT。\n\n---\n\n## 二、AI 写作\n\n| 工具 | 用途 | 特点 |\n|------|------|------|\n| DeepSeek / Kimi / 豆包 | 通用写作、爆款文、小说 | 提示词工程决定上限 |\n| 秘塔写作猫 | 中文润色、纠错 | 中文语法强 |\n| Notion AI | 笔记+写作一体 | 工作流集成 |\n| WPS AI | 文档、公文 | 办公场景 |\n\n---\n\n## 三、AI 绘画 / 生图\n\n| 工具 | 特点 | 费用 |\n|------|------|------|\n| **即梦**（字节） | 中文友好、免费额度多、质量高 | 免费额度 |\n| **Midjourney** | 艺术质感天花板 | 订阅 |\n| **Stable Diffusion / Flux** | 开源、可本地、可控性最强 | 免费（开源） |\n| **DALL·E** | 与 ChatGPT 集成 | 订阅 |\n| **可灵 / 即梦 AI** | 图生视频强 | 免费额度 |\n\n**生图提示词公式**：主体 + 细节 + 环境 + 风格 + 光影 + 画质 + 比例。\n\n---\n\n## 四、AI 视频\n\n| 工具 | 强项 | 费用 |\n|------|------|------|\n| **可灵 Kling** | 文/图生视频，动作连贯，国产顶流 | 免费额度 |\n| **即梦 AI** | 视频+图片一体，中文友好 | 免费额度 |\n| **Sora**（OpenAI） | 长镜头、物理模拟 | 订阅 |\n| **Runway / Pika** | 专业特效、风格化 | 免费+订阅 |\n| **Vidu / 海螺 AI** | 国产视频生成 | 免费额度 |\n| **剪映** | 剪辑、配音、字幕、模板 | 免费 |\n\n---\n\n## 五、AI 音频（配音 / 音乐）\n\n| 工具 | 用途 | 特点 |\n|------|------|------|\n| 剪映配音 | 视频旁白 | 免费、音色多、直接进剪辑流 |\n| 魔音工坊 / 讯飞配音 | 专业配音 | 商用、音色真实 |\n| **ElevenLabs** | 声音克隆 | 天花板级、多语言 |\n| **Suno / 天工 SkyMusic** | AI 音乐生成 | 输入歌词和风格，直接出歌 |\n| 讯飞听见 | 录音转文字 | 会议纪要神器 |\n\n---\n\n## 六、AI 编程\n\n| 工具 | 定位 | 费用 |\n|------|------|------|\n| **Cursor / Windsurf** | AI 原生编辑器 | 免费+订阅 |\n| **GitHub Copilot** | 补全流 | 订阅 |\n| **Claude Code** | 终端 Agent 编程 | 按量 |\n| **Trae**（字节） | 国产 AI IDE | 免费 |\n| DeepSeek V4（API） | 底层模型，可接各种工具 | 按量 |\n\n**省钱技巧**：把 Claude Code / Cursor 的模型指向 DeepSeek（`ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic`），用 Pro 档跑推理、Flash 档跑子任务，成本大降。\n\n---\n\n## 七、AI 办公与效率\n\n| 场景 | 工具 |\n|------|------|\n| 写文档 | DeepSeek / WPS AI |\n| 做 PPT | Gamma / WPS AI / 讯飞智文 |\n| 表格处理 | DeepSeek（写公式/脚本）+ Excel |\n| 会议纪要 | 讯飞听见 / 飞书智能伙伴 / 通义听悟 |\n| 翻译 | DeepSeek / 沉浸式翻译 |\n| 知识管理 | Notion AI / ima / 飞书知识库 |\n| 思维导图 | XMind + AI / 亿图脑图 |\n\n---\n\n## 八、AI Agent 与自动化\n\n| 工具 | 特点 | 适合 |\n|------|------|------|\n| **Coze 扣子**（字节） | 拖拽式搭 Bot，中文友好 | 新手 |\n| **Dify** | 开源、可自托管、工作流编排 | 开发者/企业 |\n| **n8n** | 自动化工作流，连接各种应用 | 打通工具链 |\n| **MCP 协议** | 给 AI 接「外挂工具」的通用标准 | 进阶 |\n| Manus / AutoGLM | 通用 Agent，自主执行 | 尝鲜/进阶 |\n\n---\n\n## 九、AI 搜索与研究\n\n| 工具 | 特点 |\n|------|------|\n| DeepSeek 联网搜索 | 实时信息 + 可核验引用 |\n| Perplexity | AI 搜索引擎标杆 |\n| 秘塔 AI 搜索 | 中文搜索、无广告 |\n| 知乎直答 | 中文知识问答 |\n| ima / 得到 | 知识库检索 |\n\n---\n\n## 十、AI 3D / 设计 / 其他\n\n| 类别 | 工具 |\n|------|------|\n| AI 3D 生成 | Tripo / Meshy / 即梦 3D |\n| AI 设计 | Canva AI / MasterGo / 稿定设计 |\n| AI 数字人 | 剪映数字人 / 腾讯智影 / HeyGen |\n| AI 换装/抠图 | 稿定 / 美图设计室 |\n| AI 直播 | 数字人直播工具 |\n| AI 翻译硬件 | 讯飞翻译机 / 时空壶 |\n\n---\n\n## 附录：一个「最小可用组合」建议\n\n**零成本起步**：DeepSeek（底座）+ 即梦（生图）+ 可灵（视频）+ 剪映（剪辑配音）+ Coze（自动化）。\n\n**进阶付费**：Midjourney（生图质感）+ ElevenLabs（声音克隆）+ Cursor（编程）+ DeepSeek API（按量）。\n\n---\n\n> 本百科每日更新。有新工具、新类别，会持续收录。若你想深入了解某一类工具的用法，见《01-博文》里的对应实战篇。\n","book\\五卷全书\\AI绘画实战-从文字到画面.md":"# AI 实战 · AI 绘画：从文字到画面（完整教程）\n\n> 想画什么就有什么，前提是你要「会说」。这篇教你掌握 AI 生图的核心方法，稳定产出高质量图片。\n\n---\n\n## 一、先理解：AI 绘画的两种玩法\n\n1. **文生图**：输入文字，AI 凭空生成图片。适合「我有一个想法，但没有画面」。\n2. **图生图**：给一张参考图，AI 在此基础上改。适合「我大概知道要什么样子，要精确控制」。\n\n**新手建议：多用图生图起步。** 先找一张接近你想要的图，比纯文字描述靠谱十倍。\n\n---\n\n## 二、选工具\n\n| 工具 | 特点 | 适合 |\n|------|------|------|\n| **即梦**（字节） | 中文友好、免费额度多 | 新手首选 |\n| **Midjourney** | 艺术质感天花板 | 追求画面表现力 |\n| **Stable Diffusion / Flux** | 开源、可控性最强 | 进阶玩家 |\n\n先用即梦把「文生图」玩熟，再考虑进阶。\n\n---\n\n## 三、核心：生图提示词公式\n\n生图提示词有个万能公式：\n\n```\n主体 + 细节描述 + 环境/背景 + 风格 + 光影 + 画质 + 比例\n```\n\n逐项拆解：\n\n| 要素 | 说明 | 示例 |\n|------|------|------|\n| **主体** | 画面里最主要的东西 | 一只橘猫 |\n| **细节** | 主体的特征 | 圆脸、绿眼睛、戴着小红帽 |\n| **环境** | 在哪、什么背景 | 坐在阳光下的窗台 |\n| **风格** | 画风 | 宫崎骏动画风格 / 水彩 / 赛博朋克 |\n| **光影** | 光线氛围 | 柔和侧光 / 黄昏暖光 |\n| **画质** | 清晰度要求 | 高清细节、4K |\n| **比例** | 画幅 | 16:9 / 9:16 / 1:1 |\n\n**完整示例**：\n```\n一只圆脸的橘猫，戴着小红帽，坐在阳光下的窗台上，窗外有绿植，\n宫崎骏动画风格，柔和侧光，高清细节，16:9\n```\n\n对比一下：「画一只猫」——这就是「抽卡」和「稳定产出」的区别。\n\n---\n\n## 四、风格词库（直接抄）\n\n这些风格词，能让你的图质感瞬间提升：\n\n- **写实类**：电影感写实、超写实、胶片质感、人像摄影\n- **艺术类**：宫崎骏动画、赛博朋克、国风水墨、浮世绘、油画、水彩、波普\n- **氛围类**：极简、暗黑、梦幻、蒸汽朋克、废土\n- **画质类**：高清细节、8K、大师级构图、景深\n\n---\n\n## 五、让 AI 画得更好的 5 个技巧\n\n1. **负面词也要说。** 比如「不要模糊、不要畸形的手、不要多余文字」，能排除很多翻车。\n2. **风格词要具体。** 「水彩」比「好看」有用一百倍。\n3. **一个画面一个重点。** 元素太多，AI 容易乱。新手先练「一个主体 + 一个背景」。\n4. **用图生图迭代。** 生成一张满意的，再让它「换背景」「改色调」，一步步逼近你想要的。\n5. **不满意就改词，别硬刷。** 提示词质量决定你抽的是「普通池」还是「限定池」。\n\n---\n\n## 六、常见翻车与解法\n\n| 问题 | 原因 | 解法 |\n|------|------|------|\n| 手画畸形 | AI 对手部理解差 | 负面词「畸形的手」，或干脆不画手 |\n| 文字乱码 | AI 不擅长画面文字 | 负面词「不要文字」，或后期加字 |\n| 风格不统一 | 没固定风格词 | 所有图统一加同一个风格词 |\n| 画面杂乱 | 元素太多 | 删减元素，聚焦一个主体 |\n\n---\n\n## 七、进阶方向\n\n- **图生视频**：把生图结果喂给可灵/即梦，让画面动起来（见《AI 视频制作实战》）。\n- **角色一致性**：用同一张参考图 + 固定描述，让同一个「角色」出现在不同场景。\n- **风格迁移**：用图生图，把你的照片变成动漫/油画/赛博朋克风格。\n\n---\n\n> 下一篇实战预告：提示词模板库（附录）——一次性给你 20+ 个开箱即用的提示词模板。\n","book\\五卷全书\\AI视频制作实战-一个人做出一条视频.md":"# AI 实战 · 一个人做出一条视频（完整教程）\n\n> 这篇是第三卷的实战篇：手把手带你，用 AI 工具从零做出一条完整的短视频。全程零成本，一个人完成。\n\n---\n\n## 一、先搞清楚 AI 视频的工作流\n\nAI 做视频，不是「打一句话，直接出成片」，而是**一条流水线**：\n\n```\n脚本  分镜图  生成视频片段  配音  配乐  剪辑  成片\n```\n\n每一步都有专门的 AI 工具。掌握了这条线，你就能稳定产出，而不是碰运气。\n\n---\n\n## 二、第一步：写脚本（DeepSeek）\n\n脚本是视频的地基。用 DeepSeek 的 **Expert 模式**，给它一份清晰的要求：\n\n```\n你是短视频导演。帮我写一条 60 秒的短视频分镜脚本，主题「{你的主题}」。\n要求：\n1. 开头 3 秒必须抓住注意力\n2. 共 8-10 个镜头\n3. 每个镜头写清楚【画面】【运镜】【旁白】【时长】\n4. 节奏快、有情绪\n```\n\n它会给你一份可以直接用的分镜脚本。**重点检查开头 3 秒**——短视频的生死，往往就决定在这 3 秒。\n\n---\n\n## 三、第二步：做分镜图（即梦 / Midjourney）\n\n把脚本里每个镜头的【画面】描述，逐条喂给 AI 绘画工具。\n\n**关键技巧**：\n- 统一加「风格词」，保证所有分镜画风一致（比如「宫崎骏动画风格」「赛博朋克」「电影感写实」）。\n- 统一比例，短视频用 **16:9** 或 **9:16**（竖屏）。\n- 用「图生图」微调：先生成一张满意的，再以它为参考生成后续镜头，风格更统一。\n\n示例生图提示词：\n```\n一个年轻人深夜坐在书桌前，只有一盏台灯亮着，逆光剪影，\n电影感写实风格，柔和光线，高清细节，16:9\n```\n\n---\n\n## 四、第三步：生成视频片段（可灵 / 即梦 AI）\n\n把分镜图逐张喂给视频生成工具，用「**图生视频**」。\n\n**运镜词要写进去**，AI 视频很吃运镜描述：\n\n| 想达到的效果 | 运镜词 |\n|--------------|--------|\n| 缓缓靠近 | 「镜头缓慢推近」 |\n| 全景展示 | 「环绕旋转」 |\n| 跟着走 | 「跟拍，镜头跟随」 |\n| 大场面 | 「镜头拉升，俯瞰」 |\n\n**每个片段只生成 5-10 秒**，不要指望一个提示词出整条片子。攒够片段再拼。\n\n---\n\n## 五、第四步：配音（剪映配音 / ElevenLabs）\n\n把脚本里的【旁白】文案，喂给配音工具生成人声。\n\n- **免费方案**：剪映自带的配音，音色多、直接进剪辑流。\n- **进阶方案**：ElevenLabs 克隆你自己的声音，做出「个人专属」的 IP 声音。\n\n---\n\n## 六、第五步：配乐（Suno / 素材库）\n\n- **AI 生成**：用 Suno 输入风格和歌词，生成专属 BGM。\n- **免版权素材**：剪映自带音乐库，选「卡点」「史诗」「轻快」等。\n\n---\n\n## 七、第六步：剪辑（剪映）\n\n把片段、配音、BGM 丢进剪映：\n\n1. 按脚本顺序排片段\n2. 配音对齐画面\n3. 加字幕（剪映可自动识别生成）\n4. 卡点、转场、调色\n5. 导出\n\n---\n\n## 八、一条「AI 视频」的完整提示词链（照着抄）\n\n```\n【脚本】DeepSeek：你是短视频导演，写一条 60 秒分镜脚本，主题 X……\n【分镜】即梦：{画面描述}，{风格}，16:9\n【视频】可灵：图生视频，{分镜图}，镜头缓慢推近\n【配音】剪映：{旁白文案}，选磁男声\n【音乐】Suno：史诗感，卡点，无歌词\n【剪辑】剪映：拼接 + 自动字幕 + 卡点\n```\n\n---\n\n## 九、常见坑\n\n1. **别追求一次到位。** 片段慢慢攒，先跑通流程，再追求质量。\n2. **风格要统一。** 分镜图风格词不一致，成片会很违和。\n3. **时长克制。** 新手先做 30-60 秒，短而完整，比长而粗糙好。\n4. **版权意识。** AI 生成的画面商用前，看平台条款。\n\n---\n\n> 下一篇实战预告：AI 绘画实战——从文字到画面，如何稳定产出高质量图片。\n","book\\五卷全书\\README-全书总目录.md":"# 《AI 时代》全书总目录\n\n> **书名（暂定）**：《AI 时代：一部发展史、工具书与个人逆袭指南》\n> **定位**：一本「能容纳好几个东西」的超级书 —— 它同时是历史书、工具书、实战手册，也是个人 IP 打造指南。\n> **阅读对象**：所有想在这个 AI 时代「看懂、会用、并用它成就自己」的普通人。\n\n---\n\n## 一句话读懂这本书\n\n这本书回答三个问题：\n\n1. **AI 从哪里来？**（第一卷：发展史与历程）\n2. **AI 工具有哪些、怎么用？**（第二卷：工具大全 + 第三卷：实战）\n3. **我该怎么用 AI 成就自己？**（第四卷：中国科技启示 + 第五卷：个人 IP）\n\n---\n\n## 全书结构（五卷 + 附录）\n\n### 卷首 · 总序\n> [《总序：写给每一个想在这个时代留下名字的人》](总序.md)  已完成\n\n### 第一卷 · AI 发展史（历史 · 历程 · 发展史）\n> 从石器到 AI，人类科技的完整脉络\n- 第一章 从古至今的科技史主线 —— 见 `../05-AI发展历程/从古至今科技史与AI发展历程.md` \n- 第二章 人工智能：从梦想到现实（1950-2022）—— 同上 \n- 第三章 近两年：AI 的疯狂加速度（2023-2026 大事记）—— 同上 \n\n### 第二卷 · AI 工具大全\n> 市面上几乎所有 AI 工具，一册在手\n- 全卷内容 —— 见 `../07-AI工具大全/AI工具大全-百科全书.md` （持续扩充）\n\n### 第三卷 · AI 实战\n> 提示词工程 + 写作/绘画/视频/音频/编程/办公/Agent\n- 全卷内容 —— 见 `../01-博文/如何利用DeepSeek与全套AI工具-超级实战指南.md` （持续扩充）\n\n### 第四卷 · 中国科技历程\n> 中国科技故事，理解 AI 诞生的土壤\n- 总目录 —— 见 `../06-中国科技故事/README-目录.md` \n- 第一篇 DeepSeek 的逆袭 —— \n- 其余篇目连载中（两弹一星 / 高铁 / 北斗 / 航天 / 华为 / 大疆 …）\n\n### 第五卷 · 个人 IP 与 AI\n> 如何用 AI 打造你的个人主流 IP\n- [《如何用 AI 打造你的个人主流 IP》](第五卷-如何用AI打造个人主流IP.md)  已完成\n\n### 附录\n- 提示词模板库\n- 工具速查表\n- 学习路线图\n\n---\n\n## 这本书如何「容纳好几个东西」\n\n它把五类内容融成一本书：\n\n| 内容类型 | 对应卷 | 形态 |\n|----------|--------|------|\n| 历史 / 历程 / 发展史 | 第一卷 + 第四卷 | 时间轴叙事 |\n| AI 工具 | 第二卷 | 百科全书 |\n| 实战方法 | 第三卷 | 手册教程 |\n| 中国科技故事 | 第四卷 | 人物志 |\n| 个人 IP 打造 | 第五卷 | 行动指南 |\n\n**这就是「一本书 = 一个个人 IP 的完整知识底座」。**\n\n---\n\n> 本书日更连载。每天新增内容会自动并入对应卷；最终出版时可导出为完整电子书/纸质书。\n","book\\五卷全书\\从古至今科技史与AI发展历程.md":"# 从古至今：科技史与 AI 发展历程（超级时间轴）\n\n> 人类文明的每一次跃迁，本质都是「工具」的跃迁。从打磨第一块石器，到训练出会思考的模型，我们走过了几万年。这篇长文把这条线串起来——你会看到，AI 不是凭空出现的怪物，而是这条科技长河最新、也最汹涌的一段浪。\n\n---\n\n## 第一部分 从古至今的科技史主线\n\n### 一、文明的工具时代（史前—18 世纪）\n\n- **旧石器时代**：人类学会打磨石器、使用火。火的掌控让人类第一次「改变」了能量形态。\n- **农业革命（约 1 万年前）**：驯化作物与牲畜，人类从游猎转向定居，人口开始指数增长——这是「生产力」第一次质变。\n- **文字与算筹**：文字让知识得以跨代积累。中国古代的**算筹、算盘**，是人类最早的计算工具之一，体现了「用工具辅助计算」的原始冲动。\n- **四大发明（中国）**：造纸术、印刷术、火药、指南针。其中**印刷术**直接引爆了知识的传播革命——知识的复制成本第一次被大幅降低，这是「信息革命」的史前预演。\n- **阿拉伯数字与十进制**：让计算变得系统、可传承。\n- **机械计算的开端（17 世纪）**：帕斯卡造出加法机（1642），莱布尼茨改进为四则运算机（1673）——「让机器替人算数」这个念头，几百年前就种下了。\n\n### 二、工业革命：蒸汽与电（18—19 世纪）\n\n- **第一次工业革命（18 世纪末）**：瓦特改良蒸汽机。人类第一次大规模「解放」了肌肉力量。\n- **第二次工业革命（19 世纪）**：电力、内燃机、电报、电话。**电**不仅点亮了世界，也为后来的计算机铺好了物理基础。\n- **巴贝奇的差分机（19 世纪）**：查尔斯·巴贝奇设计、阿达·洛芙莱斯为其编写算法——阿达被公认为「世界上第一位程序员」。她预见到机器不仅能算数，还能处理符号，这个洞见超前了一个半世纪。\n\n### 三、信息时代：计算机与互联网（20 世纪）\n\n- **图灵机（1936）**：艾伦·图灵提出「通用计算」的抽象模型，为一切计算机奠定理论基础。\n- **图灵测试（1950）**：图灵在《计算机器与智能》中问：「机器能思考吗？」——这被视为人工智能的起点之问。\n- **ENIAC（1946）**：第一台通用电子计算机诞生。\n- **晶体管（1947） 集成电路（1958） 摩尔定律（1965）**：计算能力开始以指数速度增长。\n- **个人电脑（1970-80 年代）**：苹果、IBM PC 把计算机带进千家万户。\n- **互联网（1969 ARPANET  1990s 万维网）**：蒂姆·伯纳斯-李发明万维网，信息第一次以「全球即时互联」的方式流动。**互联网是 AI 的食物——没有海量数据，就没有后来的大模型。**\n\n---\n\n## 第二部分 人工智能：从梦想到现实（1950—2022）\n\n### 一、诞生与寒冬（1950—1990s）\n\n- **1956 达特茅斯会议**：约翰·麦卡锡等人正式提出「人工智能」一词，AI 作为一门学科诞生。\n- **符号主义与专家系统（1970-80s）**：试图用「规则」模拟专家决策，短暂繁荣后因难以扩展而衰落。\n- **两次 AI 寒冬（1970s、1980s-90s）**：经费枯竭、期望落空，AI 研究两度陷入低谷。**教训：AI 的发展从来不是直线，而是「希望—泡沫—寒冬—复兴」的循环。**\n- **1997 深蓝击败卡斯帕罗夫**：IBM 的深蓝在国际象棋上战胜世界冠军，AI 第一次在大众层面引发震动。\n\n### 二、深度学习的爆发（2006—2020）\n\n- **2006**：杰弗里·辛顿提出深度信念网络，「深度学习」重回舞台。\n- **2012 AlexNet**：深度学习在 ImageNet 图像识别大赛上碾压传统方法，计算机视觉迎来转折点。**这一年被公认为「深度学习元年」。**\n- **2016 AlphaGo 击败李世石**：DeepMind 的 AlphaGo 在围棋——这个曾被认为机器无法征服的领域——战胜人类顶尖棋手。AI 的「直觉」能力震惊世界。\n- **2017 Transformer 问世**：谷歌团队发表《Attention Is All You Need》，提出 Transformer 架构。**这是今天一切大语言模型的「共同祖先」。** 注意力机制让模型能够「抓住重点」，处理长序列信息。\n\n### 三、大模型时代（2018—2022）\n\n- **2018 GPT-1**：OpenAI 提出「预训练 + 微调」范式。\n- **2019 GPT-2**：模型规模跃升，展现出惊人的文本生成能力。\n- **2020 GPT-3（1750 亿参数）**：小样本学习能力震惊业界，证明「规模」本身就是一种能力——**Scaling Law（规模定律）开始显现。**\n- **2022.11 ChatGPT 发布**：两个月破亿用户，成为史上增长最快的消费级应用。**「AI」从一个学术名词，一夜之间变成了全世界每个人手机里都能用的工具。**\n\n---\n\n## 第三部分 近两年：AI 的疯狂加速度（2023—2026）\n\n> 这是人类科技史上密度最高的两年。我把大事记按时间排列，你能感受到那种「每个月都有颠覆」的节奏。\n\n### 2023 年：大模型竞赛元年\n\n| 时间 | 事件 |\n|------|------|\n| 3 月 | OpenAI 发布 GPT-4，多模态能力开始显现 |\n| 3 月 | 百度发布「文心一言」，国产大模型正式起跑 |\n| 4 月 | 阿里「通义千问」、商汤「日日新」等国产模型密集发布 |\n| 7 月 | Meta 开源 Llama 2，掀起「开源模型」浪潮 |\n| 8 月 | 月之暗面 Kimi 上线，主打超长上下文 |\n| 全年 | 「百模大战」：国内涌现数百个大模型，行业进入洗牌期 |\n\n### 2024 年：多模态与「性价比」革命\n\n| 时间 | 事件 |\n|------|------|\n| 2 月 | OpenAI 发布 Sora，文生视频震惊全球 |\n| 2 月 | 谷歌发布 Gemini 1.5，百万级上下文 |\n| 5 月 | 字节「豆包」、快手「可灵」相继发力，国产视频生成崛起 |\n| 6 月 | 国产视频模型（可灵、即梦、Vidu）密集迭代，中国在视频生成赛道进入第一梯队 |\n| 下半年 | Agent（智能体）概念爆发，从「聊天」走向「自主干活」 |\n| 12 月 | DeepSeek V3 发布，以极低训练成本对标顶级闭源模型，震动全球 AI 圈 |\n\n### 2025 年：中国力量与「开源 + 低价」的冲击波\n\n| 时间 | 事件 |\n|------|------|\n| 年初 | DeepSeek R1 发布，推理能力对标 OpenAI o1，且开源、免费，登上中美 App Store 双榜第一 |\n| 全年 | 「DeepSeek 效应」：全球大模型价格战打响，AI 使用成本断崖式下降 |\n| 全年 | Agent 走向落地：Manus、Coze 等让「AI 替你干活」从概念变成产品 |\n| 全年 | 视频生成、声音克隆、数字人走向成熟，普通人一个人能「开一家内容公司」 |\n\n### 2026 年：AI 成为基础设施\n\n| 时间 | 事件 |\n|------|------|\n| 4 月 24 日 | **DeepSeek V4 发布**：V4-Pro（强推理）+ V4-Flash（快速低价），百万 token 上下文，网页全免费 |\n| 8 月 12 日 | DeepSeek V4-Pro 0813 正式 GA，Agent 能力进一步加强 |\n| 全年 | AI 全面嵌入办公、编程、创作、教育；「会用 AI」成为和「会用电脑」一样的基础技能 |\n\n---\n\n## 第四部分 中国科技：一条并行的主线\n\n> AI 的历史，离不开中国科技的底色。以下是中国在科技史上几个关键的高光时刻——它们是理解「DeepSeek 为什么能诞生在中国」的背景。\n\n- **两弹一星（1960-70s）**：在极其艰苦的条件下，中国造出了原子弹、氢弹、人造卫星，奠定了「举国体制攻关核心技术」的传统。\n- **高速铁路（2008 起）**：中国高铁从追赶到领跑，运营里程世界第一，成为「中国制造」的名片。\n- **北斗导航（2020 全球组网）**：中国自己的全球卫星导航系统，摆脱对 GPS 的依赖。\n- **5G 通信**：华为等企业在 5G 标准与设备上占据全球领先地位。\n- **量子科技**：「墨子号」量子科学实验卫星（2016）、「九章」量子计算原型机（2020），中国在量子通信与量子计算上走在前列。\n- **载人航天与空间站（2021 天和核心舱）**：中国空间站全面建成，嫦娥探月、天问探火持续推进。\n- **超级计算机**：「神威·太湖之光」「天河」系列多次登顶全球超算榜首。\n- **DeepSeek（2023 至今）**：一家中国 AI 公司，用「开源 + 极致性价比」改写全球大模型格局——这是中国科技故事里最新、也最亮的一章（详见《中国科技故事》系列）。\n\n---\n\n## 结语：我们在哪里\n\n回望这条线：**石器  火  文字  印刷术  蒸汽机  电  计算机  互联网  深度学习  大模型。**\n\n每一次，人类都在做同一件事：**把重复的、费力的、低效的环节，交给工具，让自己去做更有创造性的部分。** AI 是这条逻辑的最新一步——而且可能是步子最大的一步。\n\n你正站在这个拐点上。接下来要做的，不是恐慌，也不是旁观，而是**成为第一批真正会用这些工具的人**。\n","book\\五卷全书\\总序.md":"# 总序：写给每一个想在这个时代留下名字的人\n\n> 这本书，是一份「个人 IP 的出生证明」。\n\n---\n\n## 一、为什么是现在\n\n过去一百年，普通人想要「被看见」，只有几条窄路：考进名校、挤进大厂、上电视、出书。每一条，都需要资源、人脉、运气，或者半辈子的积累。\n\n但现在，一切都变了。\n\n一个普通人，只要会用 AI，就能：\n\n- **一个人写出过去需要一个编辑部的内容；**\n- **一个人做出过去需要一个摄制组的视频；**\n- **一个人运营过去需要一个团队的自媒体；**\n- **一个人写出一本过去需要半生积淀的书。**\n\nAI 把「内容生产」这个曾经最重的门槛，一脚踢开了。而内容，正是「个人 IP」的根基。\n\n**所以这不是一本讲技术的书。这是一本讲「机会」的书。**\n\n## 二、什么是个人 IP\n\n个人 IP，不是「网红」，不是「流量」，而是——**当你不在场的时候，别人如何介绍你。**\n\n它是一个人稳定的、可被记住的、有辨识度的「标签 + 价值 + 信任」的组合。它可以是一个领域的专家身份，可以是一种独特的表达风格，也可以是一套持续输出的内容体系。\n\n在 AI 时代，个人 IP 的公式变成了：\n\n```\n个人 IP = 定位 × 内容 × 持续输出\n```\n\n而 AI，同时降低了这三样东西的成本。\n\n## 三、这本书怎么帮你\n\n我把「打造个人 IP」这件事，拆成了这本书的五卷：\n\n1. **第一卷 · AI 发展史** —— 让你先「看懂」这个时代。不懂历史的人，抓不住趋势。\n2. **第二卷 · AI 工具大全** —— 让你「有武器」。工欲善其事，必先利其器。\n3. **第三卷 · AI 实战** —— 让你「会打仗」。提示词、写作、视频、编程……把武器用起来。\n4. **第四卷 · 中国科技历程** —— 让你「有底气」。从两弹一星到 DeepSeek，中国人能做到的，你也可以。\n5. **第五卷 · 个人 IP 与 AI** —— 让你「成事」。把前面所有东西，变成你自己的 IP。\n\n## 四、写给谁\n\n- 想转型、想搞副业的职场人\n- 想做自媒体、但不知从何下手的普通人\n- 想用 AI 放大自己能力的学生、自由职业者\n- 以及每一个，不想被时代落下的人\n\n## 五、一个承诺\n\n这本书，我会**日更**写下去。它不会是一本「写完就结束」的书，而是一个「持续生长」的知识体——就像你的个人 IP 一样，每天都在变强。\n\n**从今天起，你不再只是「读者」。你是这本书，以及你自己 IP 的，共同作者。**\n\n—— 于 2026 年 8 月 15 日\n","book\\五卷全书\\第五卷-如何用AI打造个人主流IP.md":"# 第五卷 · 如何用 AI 打造你的个人主流 IP\n\n> 前面四卷，你「看懂」了 AI，「拿到」了工具，「学会」了实战，「找到」了底气。这一卷，我们把所有东西合成一件事：**打造你自己的个人 IP。**\n\n---\n\n## 第一章 个人 IP 的底层逻辑\n\n### 1.1 个人 IP 是什么，不是什么\n\n- **不是**网红、不是粉丝数、不是蹭热点。\n- **是**「信任 + 辨识度 + 持续价值」的复合体。\n\n一句话判断你有没有 IP：**当别人遇到某个问题，会不会第一个想到你？** 如果会，你就有 IP。\n\n### 1.2 个人 IP 的四个要素\n\n| 要素 | 说明 | AI 能帮什么 |\n|------|------|-------------|\n| **定位** | 你是谁、为谁解决什么问题 | 用 AI 做定位分析、找差异化 |\n| **内容** | 你持续输出的东西 | 用 AI 批量生产高质量内容 |\n| **渠道** | 你被看见的地方 | 用 AI 做多平台分发 |\n| **信任** | 别人为什么信你 | 用 AI 保持输出稳定性、专业度 |\n\n### 1.3 公式\n\n```\n个人 IP = 定位 × 内容 × 持续输出\n```\n\n三个要素相乘，任何一个为零，结果都是零。而 AI 的厉害之处在于——它能让「持续输出」从「拼意志力」变成「拼流程」。\n\n---\n\n## 第二章 定位：找到你的赛道\n\n定位是 IP 的地基。用 DeepSeek 帮你做定位，三步走：\n\n**第一步：盘点你的资源。** 把提示词喂给它：\n\n```\n我今年{年龄}，职业是{职业}，擅长{技能}，兴趣爱好是{兴趣}，\n业余时间{时间}，我可以用 AI 做{你能做的东西}。\n请帮我列出 10 个适合做个人 IP 的方向，并标注每个的受众、变现路径、竞争难度。\n```\n\n**第二步：找差异化。** 让 AI 帮你做「交叉定位」：\n\n```\n在「{领域A}」和「{领域B}」之间，有没有一个别人还没做好的交叉地带？\n请给我 5 个具体的细分定位建议。\n```\n\n交叉定位最容易出彩——比如「AI + 副业」「AI + 育儿」「AI + 法律」，越窄越容易记住。\n\n**第三步：验证。** 让 AI 帮你查这个赛道的现状：\n\n```\n关于「{你的定位}」，目前市面上有哪些头部账号？他们的内容有什么共性？还有哪些用户需求没有被满足？\n```\n\n---\n\n## 第三章 内容：用 AI 搭一条流水线\n\n个人 IP 的本质是「内容工厂」。用 AI 把内容生产做成流水线：\n\n### 3.1 选题（每天 10 分钟）\n\n```\n你是资深自媒体操盘手。请围绕「{我的定位}」，给我本周 7 天的选题，\n每天 3 个，标注：目标受众、痛点、爆点、可用的标题。\n```\n\n### 3.2 生产（每篇 30 分钟）\n\n- **图文**：DeepSeek 写初稿  你改  即梦/稿定配图。\n- **短视频**：DeepSeek 写脚本  即梦出分镜  可灵生成画面  剪映剪辑配音。\n- **长文/书**：DeepSeek 搭大纲  分章扩写  你注入个人观点（这一步决定差异化）。\n\n### 3.3 分发（每天 15 分钟）\n\n```\n请把下面这篇内容，改写成适合{小红书/抖音/公众号/知乎/B站}的版本，\n保留核心观点，调整语气和格式，并给出各平台的标题和标签建议。\n内容：{粘贴}\n```\n\n**一鱼多吃**：一篇长文，拆成 5 个平台的不同形态，这是个人 IP 的规模化秘诀。\n\n---\n\n## 第四章 一个人，就是一支队伍\n\n用 AI 组合，你可以「一个人开一家内容公司」：\n\n| 岗位 | 过去需要 | 现在用 AI |\n|------|----------|-----------|\n| 编剧 | 写手 | DeepSeek |\n| 美术 | 设计师 | 即梦 / Midjourney |\n| 摄影/剪辑 | 摄制组 | 可灵 / 剪映 |\n| 配音 | 声优 | 剪映配音 / ElevenLabs |\n| 运营 | 团队 | Coze 自动化分发 |\n| 数据分析 | 分析师 | DeepSeek 分析 |\n\n**核心心法**：你不是在「用 AI 代替别人」，你是在「用 AI 放大你自己」。最终你的个人观点、你的真实经历、你的判断力，才是 IP 的护城河——AI 负责体量，你负责灵魂。\n\n---\n\n## 第五章 变现路径\n\n个人 IP 的变现，从轻到重：\n\n1. **流量变现**：平台广告分成、打赏（门槛最低）\n2. **知识变现**：付费文章、课程、社群、咨询（用 AI 帮你做课程大纲）\n3. **产品变现**：电子书、模板、工具（这本书就是你的第一个产品）\n4. **品牌变现**：广告合作、带货、联名（需要 IP 有影响力后）\n\n**起步建议**：先做「知识变现」——因为你的「知识」+「AI 能力」就是现成的产品，边际成本几乎为零。\n\n---\n\n## 第六章 一张「个人 IP 起号」作战图\n\n用 AI 从 0 到 1 起一个 IP，7 天计划：\n\n- **Day 1-2**：定位（用第二章的方法，让 DeepSeek 帮你敲定赛道）\n- **Day 3**：搭账号（名字、简介、头像、简介——全部让 AI 给方案你选）\n- **Day 4-7**：日更内容（用第三章的流水线，每天 1-2 条）\n\n**记住三件事**：\n1. **先完成，再完美。** 前 30 条内容，目标不是爆，是「练流程」。\n2. **别断更。** 个人 IP 最怕的不是写得差，是「消失」。\n3. **真实 > 完美。** AI 能帮你写，但你的真实经历和观点，才是别人「只关注你」的原因。\n\n---\n\n## 结语：这本书，就是你的第一个 IP 产品\n\n你正在读的这本书，本身就是「用 AI 打造个人 IP」的第一个完整案例——它从定位（帮助普通人看懂 AI）出发，用 AI 生产内容（日更），并会落地成网站、视频、电子书等多形态产品。\n\n**而你现在要做的，就是照着这卷的方法，开始你的第一天。**\n\n> 下一篇预告（日更）：第一卷继续补全「近两年 AI 大事记」的细节，或者第四卷中国科技故事《两弹一星》。我们明天见。\n","book\\五卷全书\\附录-学习路线图.md":"# 附录 · AI 学习路线图\n\n> 从零基础到AI高手，按阶段学习，不走弯路。\n\n---\n\n## 阶段一：AI认知与基础（1-2周）\n\n### 目标\n建立对AI的整体认知，学会使用主流AI工具。\n\n### 学习内容\n1. **AI是什么**：大模型基本原理（不需要数学），了解GPT、Claude、DeepSeek的区别\n2. **提示词入门**：学会写有效的提示词，掌握角色设定、任务描述、输出格式三要素\n3. **主流工具上手**：注册并使用DeepSeek、ChatGPT、Kimi中至少两个\n\n### 实践任务\n- [ ] 用AI写一篇1000字的文章\n- [ ] 用AI生成一张图片\n- [ ] 用AI总结一篇长文档\n- [ ] 对比同一个问题在不同AI中的回答\n\n### 推荐资源\n- 《AI实战全书》第1-3章\n- DeepSeek官方文档\n\n---\n\n## 阶段二：提示词工程（2-4周）\n\n### 目标\n掌握系统化的提示词设计方法，让AI输出质量提升10倍。\n\n### 学习内容\n1. **提示词框架**：CRISPE、BROKE、ICIO等框架\n2. **角色扮演法**：给AI设定专业角色\n3. **思维链（CoT）**：让AI展示推理过程\n4. **少样本学习**：通过示例引导AI\n5. **输出控制**：格式、长度、风格的精确控制\n\n### 实践任务\n- [ ] 设计一个「小红书文案生成器」提示词\n- [ ] 用思维链解决一个复杂数学问题\n- [ ] 创建一个个人专属的「写作助手」提示词库\n- [ ] 用AI完成一次完整的项目方案撰写\n\n### 推荐资源\n- 《AI实战全书》提示词篇\n- OpenAI Prompt Engineering Guide\n\n---\n\n## 阶段三：AI+专业技能（1-3个月）\n\n### 目标\n将AI与自身专业结合，形成「AI+X」的复合竞争力。\n\n### 按职业方向选择\n\n#### 方向A：内容创作者\n- AI写作（公众号、小红书、知乎）\n- AI绘画（配图、封面、插画）\n- AI视频（脚本、分镜、剪辑）\n- AI音频（配音、BGM）\n\n#### 方向B：程序员/开发者\n- AI代码补全（Copilot/Cursor）\n- AI代码审查\n- AI文档生成\n- AI测试用例生成\n\n#### 方向C：运营/营销\n- AI用户画像分析\n- AI营销文案批量生成\n- AI数据分析报告\n- AI客服话术优化\n\n#### 方向D：教育/培训\n- AI课程设计\n- AI个性化学习方案\n- AI批改与反馈\n- AI知识库搭建\n\n#### 方向E：创业者/自由职业\n- AI商业计划书\n- AI市场调研\n- AI竞品分析\n- AI财务预测\n\n### 实践任务\n- [ ] 用AI完成一个完整的工作项目\n- [ ] 建立个人AI工具库（收藏10+个常用工具）\n- [ ] 输出一份「AI+我的专业」使用心得\n\n---\n\n## 阶段四：AI进阶应用（3-6个月）\n\n### 目标\n掌握AI的高级用法，成为团队中的AI专家。\n\n### 学习内容\n1. **AI Agent**：让AI自主完成任务\n2. **RAG（检索增强生成）**：搭建个人知识库\n3. **工作流自动化**：Zapier/Make + AI\n4. **本地部署**：Ollama运行本地大模型\n5. **AI API开发**：调用AI接口构建应用\n\n### 实践任务\n- [ ] 搭建一个个人知识库问答系统\n- [ ] 创建一个自动化工作流（如：自动回复邮件）\n- [ ] 在本地运行一个开源大模型\n- [ ] 开发一个简单的AI应用（网页/小程序）\n\n### 推荐资源\n- 《AI实战全书》进阶篇\n- LangChain官方教程\n- Ollama官方文档\n\n---\n\n## 阶段五：AI变现与影响力（持续）\n\n### 目标\n用AI技能创造价值，建立个人品牌。\n\n### 变现路径\n1. **内容创作**：AI辅助写作/绘画/视频，平台分成\n2. **知识付费**：AI课程、AI咨询、AI培训\n3. **工具开发**：AI小程序、AI插件、AI SaaS\n4. **企业服务**：AI流程优化、AI客服搭建\n5. **自媒体**：AI教程、AI评测、AI资讯\n\n### 实践任务\n- [ ] 确定一个变现方向并制定计划\n- [ ] 发布10篇AI相关内容（文章/视频）\n- [ ] 获得第一笔AI相关收入\n- [ ] 建立个人IP（公众号/小红书/B站）\n\n---\n\n## 常见问题FAQ\n\n### Q1：没有编程基础能学AI吗？\n完全可以。阶段一到阶段三都不需要编程。阶段四的API开发需要基础编程，但可以先用低代码工具过渡。\n\n### Q2：需要学英语吗？\n基础使用不需要，国内工具足够。但想深入研究，建议能读英文文档。\n\n### Q3：AI会取代我的工作吗？\nAI不会取代你，但会用AI的人会取代不会用AI的人。关键是把AI变成你的工具，而不是你的对手。\n\n### Q4：每天需要花多少时间？\n- 阶段一：每天30分钟\n- 阶段二：每天1小时\n- 阶段三起：根据目标灵活安排\n\n### Q5：有哪些免费资源？\n- DeepSeek：免费对话\n- 即梦/可灵：免费额度\n- Stable Diffusion：完全开源免费\n- 本书所有教程：免费阅读\n\n---\n\n## 学习社群\n\n- **AI实战全书读者群**：交流使用心得\n- **DeepSeek官方社区**：最新资讯\n- **GitHub开源项目**：Star、Fork、贡献\n\n---\n\n> 记住：**学习AI不是学一门技术，而是学会一种新的工作方式。** 开始比完美更重要，现在就用起来。\n","book\\五卷全书\\附录-工具速查表.md":"# 附录 · AI 工具速查表\n\n> 一页纸速查：按场景找工具，按工具找入口。\n\n---\n\n## 一、对话与写作\n\n| 工具 | 场景 | 特点 | 入口 |\n|------|------|------|------|\n| DeepSeek | 通用对话/写作/代码 | 免费、开源、推理强 | chat.deepseek.com |\n| ChatGPT | 全能助手 | 多模态、生态丰富 | chat.openai.com |\n| Claude | 长文档/分析 | 200K上下文、逻辑严密 | claude.ai |\n| Kimi | 超长文档 | 200万字上下文 | kimi.moonshot.cn |\n| 文心一言 | 中文创作 | 百度生态、中文理解 | yiyan.baidu.com |\n| 通义千问 | 企业应用 | 阿里云集成、开源 | tongyi.aliyun.com |\n| 豆包 | 日常助手 | 字节出品、体验流畅 | doubao.com |\n| Notion AI | 笔记写作 | 与Notion无缝集成 | n I | notion.so |\n| 飞书智能伙伴 | 协同办公 | 字节出品 | feishu.cn |\n| 钉钉AI | 企业办公 | 阿里生态 | dingtalk.com |\n| Gamma | PPT生成 | 文字生成演示文稿 | gamma.app |\n| Tome | 演示文稿 | 叙事性强 | tome.app |\n| Otter.ai | 会议记录 | 实时转录 | otter.ai |\n\n## 七、搜索与研究\n\n| 工具 | 场景 | 特点 | 入口 |\n|------|------|------|------|\n| Perplexity | AI搜索 | 答案+引用 | perplexity.ai |\n| 秘塔搜索 | 中文搜索 | 无广告、AI总结 | metaso.cn |\n| Consensus | 论文搜索 | 2亿篇论文 | consensus.app |\n| Elicit | 文献综述 | AI读论文 | elicit.com |\n| Connected Papers | 论文图谱 | 可视化文献关系 | connectedpapers.com |\n\n## 八、Agent与自动化\n\n| 工具 | 场景 | 特点 | 入口 |\n|------|------|------|------|\n| Coze | 字节Agent | 零代码搭建 | coze.cn |\n| Dify | 开源Agent | 自部署、可定制 | dify.ai |\n| FastGPT | 知识库 | 中文RAG优化 | fastgpt.in |\n| AutoGPT | 自主Agent | 实验性强 | github.com/Significant-Gravitas/AutoGPT |\n| LangChain | 开发框架 | 最流行 | langchain.com |\n| 腾讯元器 | 腾讯Agent | 微信生态 | yuanqi.tencent.com |\n| Zapier | 自动化 | 5000+应用连接 | zapier.com |\n| Make | 复杂自动化 | 可视化编排 | make.com |\n\n## 九、本地部署\n\n| 工具 | 场景 | 特点 | 入口 |\n|------|------|------|------|\n| Ollama | 本地大模型 | 一行命令运行 | ollama.ai |\n| LM Studio | 图形界面 | 小白友好 | lmstudio.ai |\n| Stable Diffusion WebUI | 本地绘画 | 最流行的SD界面 | github.com/AUTOMATIC1111 |\n| ComfyUI | 节点式绘画 | 灵活、可复现 | github.com/comfyanonymous/ComfyUI |\n| LocalAI | OpenAI兼容 | 本地API | localai.io |\n| GPT4All | 离线聊天 | 完全离线 | gpt4all.io |\n\n## 十、学习与教育\n\n| 工具 | 场景 | 特点 | 入口 |\n|------|------|------|------|\n| Khanmigo | 可汗学院 | 免费AI家教 | khanacademy.org |\n| Duolingo Max | 语言学习 | GPT-4驱动 | duolingo.com |\n| Quizlet | 记忆卡片 | AI生成题目 | quizlet.com |\n| Socratic | 作业辅导 | Google出品 | socratic.org |\n| 讯飞星火 | 中文教育 | 口语评测 | xinghuo.xfyun.cn |\n\n---\n\n> 提示：以上工具信息截至2026年8月，AI工具迭代极快，建议定期查看最新版本。\n","book\\五卷全书\\附录-提示词模板库.md":"# 附录 · 提示词模板库（开箱即用）\n\n> 20+ 个可直接复制的提示词模板，覆盖写作、学习、工作、创作、编程等场景。把 `{}` 里的内容换成你自己的，就能用。\n\n---\n\n## 一、写作类\n\n### 1. 爆款文章\n```\n你是资深新媒体编辑。请写一篇关于「{主题}」的文章。\n目标读者：{读者画像}\n风格：{口语化/专业/幽默}\n要求：{字数}字以内，结构清晰，有{小标题/金句/数据}，开头 3 句抓人，结尾有行动号召。\n```\n\n### 2. 改写/润色\n```\n请帮我改写下面这段文字，要求：\n1. 保留原意和关键信息\n2. 语言更{流畅/精炼/有感染力}\n3. 去掉重复和冗余，去掉 AI 腔和套话\n原文：{粘贴}\n```\n\n### 3. 写标题（一次 20 个）\n```\n请为下面这篇文章起 20 个标题，风格多样（悬念式/数字式/反常识式/痛点式），\n标注每个标题适合的平台。\n文章主题：{主题}\n```\n\n### 4. 小说/故事\n```\n请帮我写一个{类型}故事的开头，主题是{主题}。\n主角：{人设}，背景：{背景}。\n要求：{字数}字，有冲突和悬念，结尾留钩子。\n```\n\n---\n\n## 二、学习类\n\n### 5. 费曼学习法\n```\n用最简单的话向我解释「{概念}」，假设我完全没有基础。\n先给一句话总结，再给一个生活化比喻，最后给我一个能自测的小问题。\n```\n\n### 6. 对比学习\n```\n请对比「{概念A}」和「{概念B}」，用表格列出它们的区别、\n各自的优缺点、适用场景，最后总结「什么时候选 A，什么时候选 B」。\n```\n\n### 7. 总结提炼\n```\n请把下面这份内容，压缩成 500 字摘要，保留核心观点、数据和结论。\n内容：{粘贴}\n```\n\n---\n\n## 三、工作类\n\n### 8. 会议纪要\n```\n请把下面这段会议记录整理成纪要，包含：① 结论 ② 待办事项（标注负责人）③ 遗留问题。\n记录：{粘贴}\n```\n\n### 9. 邮件\n```\n帮我写一封{正式/委婉/强硬}的邮件，收件人是{对象}。\n背景：{背景}，我的诉求：{诉求}。\n要求：简洁、得体、语气恰当。\n```\n\n### 10. 周报/汇报\n```\n请帮我把这周的工作写成周报，突出成果和数据。\n工作内容：{粘贴}，格式：{成果/进展/问题/下周计划}。\n```\n\n### 11. 方案/策划\n```\n请帮我写一份{活动/项目}的策划方案，包含：背景、目标、策略、执行步骤、预算预估、风险。\n主题：{主题}\n```\n\n---\n\n## 四、创作类\n\n### 12. 短视频脚本\n```\n你是短视频导演。帮我写一条{时长}的短视频分镜脚本，主题「{主题}」。\n要求：开头 3 秒抓人，每个镜头写【画面】【运镜】【旁白】【时长】，节奏快。\n```\n\n### 13. 直播脚本/口播稿\n```\n请帮我写一份{时长}分钟的口播稿，主题「{主题}」。\n要求：口语化、有节奏、开头抛痛点、中间给干货、结尾引导互动。\n```\n\n### 14. 生图提示词\n```\n主体 + 细节 + 环境 + 风格 + 光影 + 画质 + 比例\n示例：一只橘猫，圆脸绿眼睛，坐在阳光窗台，宫崎骏动画风格，柔和侧光，高清，16:9\n```\n\n---\n\n## 五、编程类\n\n### 15. 写代码\n```\n用{语言}实现{功能}。\n要求：代码可运行、有注释、考虑边界情况。\n环境：{框架/版本}\n```\n\n### 16. 解释代码\n```\n请解释下面这段代码做了什么，逐段说明，并指出可能的 bug 或改进点。\n代码：{粘贴}\n```\n\n### 17. 报错排查\n```\n我运行这段代码报了下面的错误，请帮我定位原因并给出修复方案。\n代码：{粘贴}\n报错：{粘贴完整报错}\n```\n\n---\n\n## 六、分析与决策类\n\n### 18. 利弊分析\n```\n请帮我分析{决策/方案}的利弊，列出每个选项的：优势、风险、成本、适合条件，\n最后给出你的推荐和理由。\n```\n\n### 19. 数据分析\n```\n请分析下面这组数据，找出：① 三个最重要的发现 ② 一个异常点 ③ 一个可行动的建议。\n数据：{粘贴}\n```\n\n### 20. 头脑风暴\n```\n请围绕「{主题}」给我 20 个创意点子，标注每个的可执行性、受众、差异化。\n```\n\n---\n\n## 七、个人 IP 类\n\n### 21. 定位分析\n```\n我今年{年龄}，职业{职业}，擅长{技能}，兴趣{兴趣}，业余时间{时间}。\n请帮我列出 10 个适合做个人 IP 的方向，标注受众、变现路径、竞争难度。\n```\n\n### 22. 一鱼多吃（多平台分发）\n```\n请把下面这篇内容，改写成适合{小红书/抖音/公众号/知乎/B站}的版本，\n保留核心观点，调整语气和格式，并给出标题和标签建议。\n内容：{粘贴}\n```\n\n---\n\n## 使用心法\n\n- **套模板是第一步，改模板才是关键。** 模板给你起点，你的具体信息（角色、背景、约束、示例）才是让它「好用」的灵魂。\n- **给示例最管用。** 遇到拿不准的，直接贴一个你认可的例子让它模仿。\n- **分步来。** 复杂任务拆成「先大纲  再逐段  再润色」，别指望一次到位。\n\n> 本模板库持续扩充中。发现好用的模板，随时收录进来。\n","book\\五卷全书\\中国科技故事\\01-DeepSeek的逆袭.md":"# 中国科技故事 · 01 · DeepSeek 的逆袭\n\n> 一个名不见经传的中国公司，如何在短短几年里，用「开源 + 极致性价比」的组合拳，震动了整个全球 AI 行业。这不是童话，这是一个关于「当长期主义遇上技术信仰」的故事。\n\n---\n\n## 一、一家「不着急」的公司\n\n2023 年，杭州，一家公司悄悄成立。它没有融资宣讲会，没有铺天盖地的营销，创始团队来自一家量化对冲基金——幻方量化。\n\n创始人梁文锋，一个低调到几乎不公开露面的技术派。他和团队有个朴素的信念：**模型本身才是最重要的，别的都是次要的。**\n\n当全行业都在卷「讲故事、拼融资、抢用户」的时候，这家公司选择了一条最「笨」的路：**闷头做模型，把性能做到极致，把价格打到最低，然后开源给全世界。**\n\n这家公司，叫 **DeepSeek（深度求索）**。\n\n---\n\n## 二、第一声惊雷：V3\n\n2024 年底，DeepSeek 发布了 V3 模型。真正让全球震动的，不是它「能聊天」，而是一组数字：\n\n- **训练成本**：据披露，V3 的训练成本远低于同性能级别的西方模型——有人估算只有几百万美元级别，而同类模型动辄上亿美元。\n- **性能**：在多项基准测试上，V3 对标甚至超越了当时的一些顶级闭源模型。\n\n一个「反常识」的事实摆在了所有人面前：**原来顶级 AI，不一定需要烧掉天文数字的钱。** 华尔街分析师开始重新审视 AI 的「成本叙事」，美股 AI 板块甚至为此震荡。\n\nDeepSeek 用一个模型，打碎了「只有巨头才能玩大模型」的幻觉。\n\n---\n\n## 三、王炸：R1 与「中国时刻」\n\n2025 年初，DeepSeek R1 发布。这是一款主打「推理」的模型，在数学、代码、逻辑推理上对标 OpenAI 的 o1，但——\n\n**它开源，而且免费。**\n\n效果立竿见影：DeepSeek 的 App 同时登上了**中国和美国 App Store 免费榜第一**。这是第一次，一款中国 AI 应用在美国——这个全球竞争最激烈的地方——登顶。\n\n那一刻，很多人开始用「中国 AI 的斯普特尼克时刻」来形容它。因为这说明了一件事：**在 AI 这个被认为「美国领先」的领域，中国力量第一次以最硬核的方式站到了舞台中央。**\n\n更深远的影响是「DeepSeek 效应」：\n- 全球大模型价格战打响，AI 使用成本断崖式下降；\n- 「开源」重新成为行业主流叙事，闭源巨头的护城河被质疑；\n- 无数开发者第一次意识到：**可以用很便宜的成本，跑一个世界级的模型。**\n\n---\n\n## 四、为什么是 DeepSeek？\n\n回头看，DeepSeek 能成，靠的不是运气，而是几个「反行业」的选择：\n\n1. **技术信仰高于商业叙事。** 别人在融资，他们在训模型；别人在营销，他们在优化架构。\n2. **极致工程效率。** 用更聪明的算法（如 MoE 混合专家架构、创新的注意力机制）替代「堆算力」，把每一分钱都花在刀刃上。\n3. **开源与开放的底气。** 敢开源，是因为相信「技术本身会带来护城河」，而不是靠封闭垄断。\n4. **中国工程师红利。** 一批顶尖的中国年轻工程师，用实力证明：在 AI 这场竞赛里，中国不只有应用，还有最底层的基础研究能力。\n\n---\n\n## 五、它改变了什么\n\n对普通人的意义，可能比任何榜单都重要：\n\n- **AI 从「奢侈品」变成了「水电煤」。** 网页版免费、API 便宜，一个学生、一个个体户，都能用上世界级的 AI。\n- **「开源 + 低价」成为共识。** 今天你能用到的很多便宜好用的 AI 工具，背后都有 DeepSeek 冲击波的影子。\n- **中国科技叙事有了新章节。** 从两弹一星到高铁，从北斗到 DeepSeek——「集中力量办大事」之外，中国人也在证明自己能在「自由竞争的前沿科技」里登顶。\n\n---\n\n## 六、故事还在继续\n\n2026 年，DeepSeek V4 发布，V4-Pro 的推理能力对标全球最顶尖的模型，V4-Flash 把性价比又推上一个台阶。它依然开源，依然便宜，依然「不着急」。\n\n这个故事最动人的地方在于：**它不是一个已经写好的结局，而是一个仍在进行的进行时。** 而每一个正在用 DeepSeek 的人，都是这个故事的一部分。\n\n---\n\n> **下期预告**：两弹一星——从「一穷二白」到「镇国重器」，中国人如何在最艰难的时候造出了最硬核的东西。\n","book\\五卷全书\\中国科技故事\\02-两弹一星.md":"# 中国科技故事 · 02 · 两弹一星：从「一穷二白」到「镇国重器」\n\n> 这是中国科技史上最艰难、也最悲壮的一章。它讲的是：一群人在什么都没有的时候，硬是把最硬核的东西造了出来。\n\n---\n\n## 一、为什么这件事必须做\n\n1950 年代的新中国，一穷二白，工业底子几乎为零。而当时的国际环境，用一句话就能概括：**没有大国重器，就没有资格谈安全。**\n\n核威胁的阴影笼罩在头顶。别人有原子弹，你没有，就意味着在谈判桌上你永远矮一头。于是，1955 年，中央做出了一个艰难而坚定的决定：**我们要搞原子弹。**\n\n这就是后来被称为「两弹一星」的伟大工程——原子弹、氢弹、人造卫星。\n\n## 二、一个人和一群人的回国\n\n故事的起点，是一个人的归来。\n\n**钱学森**，当时已经是世界顶尖的火箭专家，在美国享有极高的学术地位。但他坚持要回国。为此，他经历了长达五年的软禁、监视和刁难，直到 1955 年才终于踏上归途。\n\n他说过一句后来广为流传的话：**「我的事业在中国，我的成就在中国，我的归宿在中国。」**\n\n钱学森回来了。紧接着，**邓稼先、于敏、王淦昌、郭永怀**……一批又一批顶尖科学家，放弃了国外优渥的条件，隐姓埋名，走进了大漠戈壁。\n\n他们中的很多人，从此十几年没有在公开场合露过面，连家人都不知道他们在做什么。\n\n## 三、在算盘上算出的原子弹\n\n造原子弹，第一道坎是「计算」。那个年代，中国没有高性能计算机，大量的数据计算，靠的是**手摇计算机、计算尺，甚至是算盘**。\n\n科学家们就趴在桌子前，用算盘一颗珠子一颗珠子地拨，硬是把海量的数据算了出来。\n\n有个细节至今让人动容：为了验证一个关键数据，邓稼先带领团队算了九遍，和国外的数据始终对不上。最后发现，是国外的数据错了。\n\n**中国人的「土办法」，用最笨的功夫，做出了最尖端的东西。**\n\n## 四、三个里程碑\n\n- **1964 年 10 月 16 日**：中国第一颗原子弹爆炸成功。罗布泊上空腾起的蘑菇云，宣告中国打破了核垄断。\n- **1967 年 6 月 17 日**：中国第一颗氢弹爆炸成功。从原子弹到氢弹，中国只用了不到三年，是所有国家中最快的。\n- **1970 年 4 月 24 日**：中国第一颗人造卫星「东方红一号」发射成功，《东方红》的旋律从太空传回地面。\n\n「两弹一星」全部完成。\n\n## 五、它改变了什么\n\n对普通人来说，「两弹一星」可能很遥远。但它带来的东西，每个人都受益至今：\n\n1. **安全。** 大国重器撑起了国家的安全底线，才有了后面几十年的和平发展。\n2. **信心。** 它证明了一件事：中国人，在最难的时候，也能靠自己的双手干成最难的事。这种「不信邪」的精神，刻进了民族的骨子里。\n3. **底子。** 两弹一星锤炼出的科研体系、工业能力、人才队伍，成了后来航天、高铁、量子、AI 等一系列成就的土壤。\n\n## 六、一句话总结\n\n**两弹一星，是中国科技史上的一座丰碑。它告诉我们：真正的核心技术，买不来、要不来，只能靠自己拼出来。**\n\n而这种精神，正是今天 DeepSeek、华为们敢于在最前沿领域正面竞争的底气来源。\n\n---\n\n> **下期预告**：中国高铁——从「引进」到「领跑」，中国如何把一张白纸，画成世界第一的高铁网络。\n","book\\五卷全书\\中国科技故事\\03-中国高铁.md":"# 中国科技故事 · 03 · 中国高铁：从「引进」到「领跑」\n\n> 二十年前，中国还没有高铁。二十年后，中国拥有世界上最长、最快的高铁网络。这是一个关于「怎么从零开始，用一代人的时间跑成第一」的故事。\n\n---\n\n## 一、一张白纸\n\n2004 年之前，中国铁路的时速普遍在 120 公里左右，别说高铁，连「提速」都是奢望。每逢春运，绿皮火车里挤满了人，一票难求。\n\n而那时候，日本有新干线，法国有 TGV，德国有 ICE——「高铁」是发达国家的象征。\n\n中国决定造高铁。但摆在面前的现实是：**我们没有技术。**\n\n## 二、引进、消化、吸收、再创新\n\n中国的选择，是一条后来被反复讨论的路：**引进技术，然后消化吸收，最后自己创新。**\n\n2004 年，中国向全球招标，引进高铁技术。这不是简单的「买」，而是一个精妙的策略：\n\n- 用巨大的市场规模作为筹码，要求外方必须**转让技术**；\n- 然后组织国内的工程师，**一点一点吃透**这些技术；\n- 最后，在别人的基础上，**造出自己的东西**。\n\n这条路走得很辛苦，但走得很有章法。短短几年，中国工程师不仅学会了，还开始改进了。\n\n## 三、从「和谐号」到「复兴号」\n\n- **2008 年**：京津城际铁路开通，时速 350 公里，中国高铁正式「跑起来」。\n- **2017 年**：具有完全自主知识产权的「**复兴号**」上线。这一次，从动车组到控制系统，核心技术都是中国自己的。\n\n**「复兴号」的诞生，标志着一个质变**：中国高铁从「引进者」变成了「领跑者」。\n\n## 四、世界第一的底气\n\n今天，中国高铁的几个数字，足以说明一切：\n\n- **运营里程**：超过 4 万公里，世界第一，占全球高铁总里程的三分之二以上；\n- **最高时速**：350 公里，世界最快；\n- **「八纵八横」**：一张覆盖全国的高铁网，把城市与城市之间的距离，缩短到「小时级」。\n\n早上在北京吃早点，中午到上海开会，晚上回北京——这在过去不可想象，如今是日常。\n\n## 五、它改变了普通人的生活\n\n高铁的意义，远不止「快」：\n\n1. **时空被压缩了。** 大城市不再遥远，小城市有了机会，「打工人」可以在更大的半径里选择生活。\n2. **经济被盘活了。** 高铁网带来的「同城效应」，让人才、资源、产业加速流动。\n3. **一张「中国名片」。** 高铁成了中国制造、中国速度、中国标准的象征，走出了国门。\n\n## 六、一句话总结\n\n**中国高铁的逆袭，靠的不是运气，而是一条清晰的路：先虚心学，再拼命追，最后跑在最前面。**\n\n这条路，和后来中国在光伏、新能源车、AI 大模型上的打法，一脉相承。\n\n---\n\n> **下期预告**：北斗导航——我们为什么要造自己的「北斗」，以及它在关键时刻如何救过你的命。\n","book\\五卷全书\\中国科技故事\\04-北斗导航.md":"# 中国科技故事 · 04 · 北斗导航：我们为什么要造自己的「北斗」\n\n> 你可能每天都在用导航，但你可能不知道：手机里的定位，背后有一个关于「受制于人」和「自力更生」的故事。\n\n---\n\n## 一、一颗「别人的卫星」的教训\n\n1990 年代，全球卫星导航几乎是 GPS 的天下。导航、授时、定位，都要靠它。\n\n中国也曾想「用别人的」。但两件事，让中国人彻底清醒：\n\n1. **1993 年「银河号」事件**：一艘中国货轮在海上被无理拦截，理由是怀疑运载违禁品。更憋屈的是，美方直接**关闭了该海域的 GPS 服务**，让银河号在海上失去了方向，漂流了 33 天。\n\n2. **授时的软肋**：卫星导航不只是「定位」，它还是「授时」系统——电力、通信、金融、交通，全都依赖精确的时间同步。一旦别人的卫星「掐断」信号，后果不堪设想。\n\n**结论只有一个：核心技术，必须握在自己手里。**\n\n## 二、中国决定自己造\n\n1994 年，中国启动北斗工程。这是一条「三步走」的漫长道路：\n\n- **北斗一号**（2000 年）：区域有源定位，先解决「有没有」的问题。\n- **北斗二号**（2012 年）：覆盖亚太，解决「能不能用」的问题。\n- **北斗三号**（2020 年）：**全球组网完成**，解决「好不好」的问题。\n\n从立项到全球组网，整整 26 年。中间经历了无数次技术封锁、频率之争、发射失利，但方向从没变过。\n\n## 三、北斗的独门绝技\n\n北斗不只是「中国版的 GPS」，它有几个别人没有的杀手锏：\n\n1. **短报文通信**：就算你到了没有手机信号的地方，北斗也能让你「发短信」。这个功能，在汶川地震、远洋搜救、野外探险中救过无数条命。\n2. **高精度**：北斗的定位精度可以达到厘米级，农业、测绘、自动驾驶都用得上。\n3. **独立自主**：这是最根本的一条——自己的卫星，自己的信号，谁也关不掉。\n\n## 四、它如何改变普通人的生活\n\n你可能没意识到，北斗早已无处不在：\n\n- **手机导航**：现在绝大多数新手机，都同时接收 GPS 和北斗信号，定位更快更准。\n- **外卖、打车、快递**：你点外卖能准时送到，背后是北斗的精准定位。\n- **防灾减灾**：地震、洪水预警，北斗短报文能第一时间把消息传出去。\n- **农业、渔业**：无人拖拉机、渔船定位，北斗让「面朝黄土背朝天」变成了「无人化作业」。\n\n## 五、一句话总结\n\n**北斗的故事，是关于「自主」的故事。它告诉我们：真正靠得住的东西，必须是自己造的。**\n\n从北斗，到后来的 5G、量子通信、DeepSeek，中国在越来越多「卡脖子」的领域，选择了同一条路——**自己造。**\n\n---\n\n> **下期预告**：中国航天——从东方红一号到空间站，中国人的星辰大海。\n","book\\五卷全书\\中国科技故事\\05-中国航天.md":"# 中国科技故事 · 05 · 中国航天：从东方红一号到空间站\n\n> 1970年，一曲《东方红》从太空传回地球。半个多世纪后，中国人把自己的空间站挂在了天上。这是一部关于「仰望星空，脚踏实地」的史诗。\n\n---\n\n## 一、从零到一的东方红\n\n1957年，苏联把第一颗人造卫星送上天，世界震惊。毛主席说：「我们也要搞人造卫星。」\n\n但那时的中国，连一枚像样的火箭都没有。科研人员住的是干打垒，吃的是窝窝头，计算靠手摇计算机。\n\n**1970年4月24日，酒泉卫星发射中心，长征一号火箭点火升空。**「东方红一号」卫星成功入轨，乐曲《东方红》从太空传遍全国。\n\n中国成为继苏、美、法、日之后，第五个独立发射卫星的国家。那晚，无数人走出家门仰望星空——天上第一次有了一颗中国的星星。\n\n---\n\n## 二、载人飞天：千年梦圆\n\n中国人飞天的梦想，从敦煌壁画上的飞天就开始了。但真正实现，要等到2003年。\n\n**2003年10月15日，杨利伟乘坐神舟五号进入太空。**绕地球14圈，21小时23分。当他从返回舱走出来，微笑着挥手时，全中国沸腾了。\n\n此后：神舟七号翟志刚完成中国首次太空行走；天宫一号目标飞行器升空；神舟九号实现首次载人交会对接。\n\n每一步都走得稳，每一步都走得扎实。这就是中国航天的风格：**不抢风头，但绝不停步。**\n\n---\n\n## 三、天宫：中国人的太空之家\n\n2021年4月，天和核心舱发射成功；2022年，问天、梦天实验舱先后对接，中国空间站「T」字构型建成。\n\n**从此，地球轨道上有了中国人的「太空之家」。**航天员可以长期驻留，做实验、搞研究，甚至在太空开直播上课。\n\n国际空间站即将退役，未来几年，中国空间站可能是人类在太空中唯一的家。\n\n从「东方红一号」到天宫空间站，中国航天用半个多世纪，把「不可能」变成了「我们的日常」。\n\n---\n\n## 四、为什么是航天\n\n航天是最难的工程之一：涉及上万个零部件、几十万个数据点，任何一个小失误都可能导致失败。\n\n中国航天的成功密码：**系统工程思维**（把复杂问题拆解成可执行的模块）、**举国体制优势**（全国一盘棋）、**人才梯队建设**（平均年龄30多岁的团队）。\n\n对普通人的意义：导航、通信、气象预报……航天技术早已渗入日常生活。更重要的是，它给了中国人一种底气——**我们也能做最难的事。**\n\n---\n\n## 五、下一站：星辰大海\n\n中国航天的日程表已经排到了未来：载人登月计划2030年前实现；深空探测瞄准火星采样返回、木星系探测；可重复使用运载火箭正在研发。\n\n这条路没有终点。正如航天员王亚平说的：**「太空不会因为你是女性就温柔以待，但也不会因为你是中国人就拒绝你。」**\n\n中国航天，永远在下一枚火箭的倒计时里。\n","book\\五卷全书\\中国科技故事\\06-嫦娥探月.md":"# 中国科技故事 · 06 · 嫦娥探月与天问探火：中国人的星辰大海\n\n> 从「嫦娥奔月」的神话，到嫦娥五号带回月壤；从「天问」的诗篇，到天问一号着陆火星。中国人用最浪漫的名字，做最硬核的事。\n\n---\n\n## 一、奔月：神话照进现实\n\n2004年，中国正式开展月球探测工程，命名为「嫦娥工程」。这个名字取自中国古代神话——嫦娥奔月。\n\n**2007年，嫦娥一号成功绕月**，传回中国第一幅全月影像图。**2013年，嫦娥三号带着「玉兔号」月球车成功软着陆**，中国成为第三个实现月面软着陆的国家。\n\n最震撼的是**2019年嫦娥四号**：人类历史上第一次在月球背面软着陆。月球背面永远背对地球，通信要靠中继卫星「鹊桥」。这一步，连美国人都没做到过。\n\n---\n\n## 二、取土：1731克的重量\n\n**2020年12月，嫦娥五号成功采集1731克月球样品并返回地球。**这是人类时隔44年再次带回月壤。\n\n这1731克，让中国成为世界上第三个从月球采样返回的国家。更关键的是——嫦娥五号的采样点在月球风暴洋北部，是此前美苏都没有去过的地方。\n\n中国科学家从这些月壤中发现了新的矿物，命名为「嫦娥石」。这是人类在月球上发现的第六种新矿物。\n\n**我们不只是「去过」，我们还带回了新的科学发现。**\n\n---\n\n## 三、天问：一步跨过几十年\n\n2020年7月，天问一号发射。中国的第一次火星探测，就要一次完成「绕、落、巡」三大任务——这在人类航天史上从未有过。\n\n2021年5月，祝融号火星车成功着陆乌托邦平原。**中国成为第二个在火星表面运行火星车的国家，而且是一次到位。**\n\n火星探测的窗口期每26个月才有一次，着陆的「恐怖七分钟」（进入大气层到着陆）全靠自主控制。中国航天人做到了。\n\n---\n\n## 四、浪漫与硬核\n\n中国航天有一个迷人的传统：用最浪漫的名字命名最硬核的工程。\n\n嫦娥、玉兔、鹊桥、天宫、天问、祝融、羲和、夸父……这些名字来自《山海经》《楚辞》，来自中国人几千年的浪漫想象。\n\n但当这些名字出现在太空里时，它们代表的是**最尖端的科技、最严谨的工程、最勇敢的决心。**\n\n这就是中国式的浪漫：**把神话变成现实，把诗意变成工程。**\n","book\\五卷全书\\中国科技故事\\07-超级计算机.md":"# 中国科技故事 · 07 · 超级计算机：神威·太湖之光背后的故事\n\n> 它是世界上最快的「大脑」，每秒能计算十亿亿次。但比速度更重要的，是它从头到尾都是「中国芯」。\n\n---\n\n## 一、为什么要造超算\n\n超级计算机是「国之重器」：天气预报、核武器模拟、新药研发、航空航天设计……几乎所有尖端科技都需要超算。\n\n长期以来，超算被美日垄断。TOP500榜单（全球超算排名）上，美国长期霸榜。中国想买最先进的芯片？对不起，禁运。\n\n**2015年，美国对中国四家超算中心实施芯片禁运。**这反而成了转折点——既然买不到，那就自己造。\n\n---\n\n## 二、神威·太湖之光\n\n2016年6月，「神威·太湖之光」登顶全球超算TOP500榜首。\n\n它的峰值性能达到每秒12.5亿亿次（125 PFlops），是当时第二名中国「天河二号」的近两倍、第三名美国「泰坦」的五倍。\n\n**但最重要的不是速度，而是：它使用的是完全自主研发的「申威26010」处理器。**40960块国产芯片，没有一块进口CPU。\n\n美国禁运的「卡脖子」，最终卡出了一个完全自主的中国超算。\n\n---\n\n## 三、超算有什么用\n\n很多人觉得超算离生活很远，其实不然：\n\n- **天气预报**：超算让台风路径预测更精准，可以挽救无数生命\n- **新药研发**：模拟分子间相互作用，大幅缩短新药开发周期\n- **大飞机设计**：C919的气动外形优化，离不开超算的风洞模拟\n- **AI训练**：大模型训练需要的算力，超算架构是重要基础\n- **核聚变研究**：「人造太阳」的等离子体模拟，需要超算支撑\n\n超算是「科技界的重工业」，它不直接生产消费品，但它是生产一切高科技的「母机」。\n\n---\n\n## 四、从跟跑到领跑\n\n中国超算的发展史，就是一部「从跟跑到领跑」的教科书：\n\n1983年「银河-I」问世，中国成为第三个能独立研制巨型机的国家；2010年「天河一号」首次登顶；2013-2015年「天河二号」六连冠；2016-2017年「神威·太湖之光」四连冠。\n\n今天的中国超算，不仅在速度上领先，更重要的是走出了一条**完全自主可控**的技术路线。\n\n在全球科技竞争最激烈的时代，这种自主性，就是最大的底气。\n","book\\五卷全书\\中国科技故事\\08-量子科技.md":"# 中国科技故事 · 08 · 量子科技：墨子号与九章\n\n> 在量子世界，中国人正在定义未来。墨子号卫星在太空分发「不可破解」的密钥，九章量子计算机用几分钟完成了经典超算需要几亿年的计算。\n\n---\n\n## 一、量子是什么\n\n量子力学是20世纪最反直觉的科学：一个粒子可以同时处于两种状态（叠加态），两个粒子可以跨越距离瞬间关联（量子纠缠）。\n\n爱因斯坦称之为「鬼魅般的超距作用」，玻尔说「如果你没有被量子力学震惊，那你还没理解它」。\n\n但正是这些「反常识」的特性，孕育着颠覆性的技术：量子通信可以做到原理上不可窃听；量子计算可以指数级加速某些计算。\n\n**21世纪的量子竞赛，就像20世纪的太空竞赛。谁赢了，谁就掌握了未来。**\n\n---\n\n## 二、墨子号：天上的量子实验室\n\n2016年8月，世界首颗量子科学实验卫星「墨子号」发射升空。以中国古代科学家墨子命名——他在两千多年前就发现了「小孔成像」，被认为是光学的鼻祖。\n\n墨子号完成了三大科学目标：\n- **星地量子密钥分发**：在卫星和地面站之间传送「不可破解」的密钥\n- **千公里级量子纠缠分发**：创造了1200公里的世界纪录\n- **量子隐形传态**：把量子态从地面「传送」到太空\n\n2017年，中国实现了北京到维也纳的量子加密视频通话，距离7600公里。这是人类历史上第一次洲际量子保密通信。\n\n---\n\n## 三、九章：量子计算优越性\n\n2020年12月，中国科学技术大学潘建伟团队发布「九章」光量子计算机。\n\n它求解「高斯玻色取样」问题只需要200秒，而当时最快的经典超算「富岳」需要6亿年。这被称为「量子计算优越性」（Quantum Supremacy）。\n\n一年后，「九章二号」和「祖冲之二号」相继发布，中国在光量子和超导量子两条技术路线上都实现了量子优越性，成为世界上唯一在两条路线上都做到的国家。\n\n**这意味着，在量子计算这个最前沿的赛道上，中国和美国并驾齐驱。**\n\n---\n\n## 四、量子与普通人\n\n量子技术离普通人有多远？其实比你想象的近：\n\n- **金融安全**：量子加密已在银行系统中试用，保护你的转账安全\n- **药物研发**：量子计算可以模拟分子结构，加速新药开发\n- **人工智能**：量子机器学习可能带来AI的下一次飞跃\n- **精密测量**：量子传感器可以更精确地探测引力、磁场、地下资源\n\n量子科技不是遥远的科幻，它是正在发生的未来。而在这场未来竞赛中，中国站在第一梯队。\n","book\\五卷全书\\中国科技故事\\09-华为.md":"# 中国科技故事 · 09 · 华为：一家公司的长征\n\n> 从深圳一间小办公室，到全球通信设备之王；从被制裁到绝地反击。华为的故事，是中国科技企业最壮烈的长征。\n\n---\n\n## 一、两万块钱起家\n\n1987年，43岁的任正非在深圳用两万块钱注册了华为。最初只是代理香港的电话交换机，赚差价。\n\n但任正非很快发现：**代理别人的产品，永远没有出路。**1990年，华为开始自主研发。当时公司只有几十个人，研发条件极其简陋——工程师们睡在公司，醒了就写代码。\n\n1993年，华为自主研发的C&C08数字程控交换机成功，价格比进口设备低一半以上。华为从此有了活下去的资本。\n\n---\n\n## 二、走向全球\n\n2000年代，华为开始「出海」。最初只能从俄罗斯、非洲、拉美等边缘市场做起——西方巨头的地盘进不去。\n\n华为的打法很「笨」：**别人不愿意去的地方，我们去；别人不愿意接的活，我们接。**在非洲的沙漠里、在西伯利亚的寒风中，华为工程师架设基站。\n\n到2012年，华为超越爱立信，成为全球最大的电信设备制造商。2019年，华为手机出货量超越苹果，成为全球第二。\n\n一家中国公司，用30年时间，从深圳的小办公室走到了世界之巅。\n\n---\n\n## 三、制裁与反击\n\n2019年5月，美国将华为列入「实体清单」。芯片断供、GMS服务禁用、EDA软件限制……一轮又一轮制裁，力度前所未有。\n\n但华为没有倒下。\n\n**鸿蒙操作系统**（HarmonyOS）从备胎转正，装机量突破7亿；**麒麟芯片**在断供三年后，以Mate 60系列王者归来；**5G专利**数量全球第一；**华为云、智能汽车、数字能源**等新业务全面开花。\n\n任正非说：「没有伤痕累累，哪来皮糙肉厚。」\n\n这不是一家公司的胜利，这是一个国家科技自立自强的缩影。\n\n---\n\n## 四、华为精神\n\n华为为什么能打？核心是三件事：\n\n**1. 压强原则**：集中所有资源攻一个城墙口，直到打开缺口。华为每年研发投入超千亿，占营收20%以上。\n\n**2. 奋斗者文化**：「以奋斗者为本」不是口号，是真金白银的股权激励。华为19万员工中，超过一半是研发人员。\n\n**3. 长期主义**：不上市、不炒房、不追风口。任天正说：「华为就是一只乌龟，二十多年只爬了一件事——通信。」\n\n在浮躁的时代，这种「笨」，恰恰是最聪明的选择。\n","book\\五卷全书\\中国科技故事\\10-5G通信.md":"# 中国科技故事 · 10 · 5G：中国如何站上通信之巅\n\n> 从1G空白、2G跟随、3G突破、4G并跑到5G领跑，中国通信产业用40年走完了别人百年的路。5G不只是快，它是万物互联的底座。\n\n---\n\n## 一、通信的40年逆袭\n\n1987年，中国引入第一代移动通信（1G），「大哥大」两万块一部，只有少数人用得起。核心技术全是国外的。\n\n2G时代，GSM和CDMA两个标准都是欧美主导，中国只能「交学费」。\n\n**3G时代，转折点来了。**中国提出了自主标准TD-SCDMA，虽然起步艰难，但这是中国人第一次在通信标准上有了话语权。\n\n4G时代，中国主导的TD-LTE成为全球两大4G标准之一，中国从「跟随」变成了「并跑」。\n\n**5G时代，中国终于站到了最前面。**\n\n---\n\n## 二、5G到底有多强\n\n5G不只是「手机上网更快」，它是三个维度的跃迁：\n\n- **速度**：峰值速率是4G的10-20倍，下载一部高清电影只需几秒\n- **延迟**：低至1毫秒，可以支撑自动驾驶、远程手术等场景\n- **连接密度**：每平方公里可连接100万台设备，是万物互联的基础\n\n中国在5G标准必要专利（SEP）中的占比超过30%，位居全球第一。华为、中兴、大唐等中国企业是5G标准的核心贡献者。\n\n---\n\n## 三、5G改变了什么\n\n截至2025年，中国建成全球最大的5G网络，5G基站超过300万个，覆盖全国所有地级市。\n\n5G不只是手机信号，它正在改变各行各业：\n\n- **智能制造**：5G+工业互联网让工厂实现柔性生产，一条产线可以生产不同型号的产品\n- **远程医疗**：5G远程超声、远程手术让优质医疗资源下沉到偏远地区\n- **智慧城市**：5G+AI城市管理，红绿灯可以根据车流自动调节\n- **矿山港口**：5G远程操控挖掘机、装卸集装箱，工人再也不用在危险环境中作业\n\n5G是「数字时代的高速公路」，没有它，很多未来技术只能是PPT。\n\n---\n\n## 四、从5G到6G\n\n通信技术的竞争没有终点。5G刚刚普及，6G的研发已经开始。\n\n6G的目标更加宏大：太赫兹频段、卫星互联网融合、通感一体化（基站同时是雷达和传感器）。中国已经把6G纳入国家战略，预计2030年商用。\n\n从1G到6G，中国通信产业的逆袭告诉我们一件事：**核心技术是要不来、买不来、讨不来的。只有自己造，才能真正站起来。**\n","book\\五卷全书\\中国科技故事\\11-移动支付.md":"# 中国科技故事 · 11 · 移动支付与数字生活：一部手机走天下\n\n> 中国人跳过了信用卡时代，直接进入了移动支付时代。一部手机，可以买菜、坐车、看病、缴费、理财……这不是科幻，这是中国的日常。\n\n---\n\n## 一、跳过一个时代\n\n2011年，中国信用卡人均持有量只有0.2张，美国是人均3张。按传统路径，中国要普及信用卡还需要十几年。\n\n但历史没有按剧本走。2013年，支付宝推出余额宝；2014年，微信红包横空出世；2015年，二维码支付席卷大街小巷。\n\n**中国跳过了信用卡时代，直接从现金跨到了移动支付。**这在世界经济史上是绝无仅有的。\n\n到2025年，中国移动支付普及率超过86%，是全球平均水平的三倍。从五星级酒店到路边摊，从北上广深到偏远山村，二维码无处不在。\n\n---\n\n## 二、不只是付钱\n\n移动支付的意义，远远超出「付钱」本身。它是数字生活的入口：\n\n- **扫码点餐**：餐馆不用排队点餐，翻台率提升30%\n- **乘车码**：一部手机坐公交地铁，再也不用找零钱\n- **电子医保**：看病不用带卡，手机刷码就能结算\n- **政务办事**：水电缴费、社保查询、公积金提取，手机上一键搞定\n- **小微贷款**：基于支付数据，路边摊主也能获得银行贷款\n\n移动支付把一个社会的「摩擦力」降到了最低。当付钱不再是障碍，整个经济的效率就被释放了。\n\n---\n\n## 三、数字人民币\n\n2019年，中国开始试点数字人民币（e-CNY），成为全球主要经济体中第一个推出央行数字货币的国家。\n\n数字人民币和支付宝/微信支付的区别：支付宝是「钱包」，数字人民币是「钱」。它具有法偿性（商家不能拒收）、双离线支付（没网也能用）、可控匿名（保护隐私但可监管）等特点。\n\n截至2025年，数字人民币试点已覆盖全国大部分地区，累计交易额突破数万亿元。\n\n**从贝壳到铜钱，从纸币到二维码，从二维码到数字人民币——中国正在定义下一代货币的形态。**\n\n---\n\n## 四、背后的技术底座\n\n移动支付的爆发，背后是一整套技术基础设施的支撑：\n\n- **4G/5G网络**：没有高速网络，就没有随时随地支付\n- **云计算**：双十一每秒几十万笔交易，靠的是阿里云的弹性算力\n- **大数据风控**：识别欺诈交易，毫秒级完成\n- **人工智能**：人脸识别支付、智能客服，AI无处不在\n\n移动支付看起来简单——扫个码就行了。但它背后是中国整个数字基础设施的集中体现。\n\n这也是为什么其他国家很难复制中国的移动支付奇迹：**不是缺一个App，而是缺一整套底座。**\n","book\\五卷全书\\中国科技故事\\12-大疆.md":"# 中国科技故事 · 12 · 大疆：从车库到全球无人机之王\n\n> 一个80后香港科技大学的学生，从深圳一间民房起步，把无人机做到了全球70%的市场份额。大疆的故事，是中国硬科技创业的教科书。\n\n---\n\n## 一、民房里的飞行器\n\n2006年，汪滔从香港科技大学毕业，带着两个同学回到深圳，在一间民房里创立了大疆（DJI）。启动资金是他读书时做毕业设计的奖学金。\n\n最初做的是直升机飞控系统——让遥控直升机稳定悬停的技术。当时这个领域几乎是空白，没有参考、没有供应商，一切从零开始。\n\n汪滔是个极致的产品主义者。他不喜欢社交、不接受采访，把全部时间花在产品上。他说：**「我只想做一件事——做出世界上最好的产品。」**\n\n---\n\n## 二、精灵时代：让无人机飞入寻常百姓家\n\n2013年，大疆推出「精灵Phantom」系列——全球第一款「到手即飞」的消费级无人机。\n\n在此之前，无人机是专业玩家的玩具，组装复杂、价格昂贵、操作门槛极高。精灵系列把这一切改变了：开箱即用，一键起飞，价格只要几千块。\n\n效果立竿见影。精灵系列横扫全球市场，大疆的营收从2013年的8亿暴涨到2015年的60亿。\n\n**大疆用一款产品，创造了一个全新的行业——消费级无人机。**\n\n---\n\n## 三、技术护城河\n\n大疆的统治力来自哪里？不是营销，不是渠道，而是**深不见底的技术护城河**：\n\n- **飞控系统**：大疆的核心竞争力，自主研发的飞行控制算法让无人机稳如磐石\n- **云台技术**：三轴机械增稳云台，让航拍画面如丝般顺滑\n- **图传技术**：自研的OcuSync图传，可以实时传输高清画面数公里\n- **避障系统**：计算机视觉+红外传感器，让无人机自动绕开障碍\n\n全球无人机专利排名中，大疆遥遥领先。在消费级无人机市场，大疆的份额长期保持在70%以上。\n\n即便面对美国制裁和竞争对手的围追堵截，大疆的位置至今无人撼动。**因为在绝对的技术优势面前，一切手段都是苍白的。**\n\n---\n\n## 四、从无人机到机器人\n\n大疆的野心早已不止于无人机：\n\n- **农业植保**：T系列农业无人机帮助农民精准喷洒农药，效率是人工的几十倍\n- **行业应用**：电力巡检、消防救援、测绘勘探，无人机正在替代危险的人工作业\n- **运动相机**：Osmo系列直接对标GoPro\n- **激光雷达**：览沃科技（Livox）的激光雷达已经进入自动驾驶领域\n- **教育机器人**：机甲大师RoboMaster系列，培养下一代工程师\n\n汪滔说：「大疆不是一家无人机公司，而是一家机器人公司。」\n\n从天上到地面，从消费级到工业级，大疆正在把「中国智造」的旗帜插到更多领域。\n","book\\五卷全书\\中国科技故事\\13-比亚迪.md":"# 中国科技故事 · 13 · 比亚迪与新能源车：换道超车\n\n> 当传统燃油车被欧美日垄断时，中国选择了一条新路——新能源。比亚迪从做电池起家，最终成为全球新能源车销量冠军。这是一次教科书级的「换道超车」。\n\n---\n\n## 一、从电池到汽车\n\n1995年，王传福辞去北京有色金属研究院的工作，在深圳创立比亚迪，做镍镉电池。三年后，比亚迪成为全球第二大充电电池制造商，仅次于日本三洋。\n\n2003年，王传福做了一个所有人都觉得疯狂的决定：**收购秦川汽车，进军汽车行业。**\n\n所有人都反对——一个做电池的，凭什么造车？王传福的逻辑很简单：**汽车未来是电动的，电动的核心是电池，而我刚好会做电池。**\n\n事实证明，他赌对了。\n\n---\n\n## 二、押注新能源\n\n2008年，比亚迪推出全球第一款量产插电式混合动力车F3DM。同一年，巴菲特以每股8港元买入比亚迪10%的股份。\n\n但真正的转折点在2021年。比亚迪发布DM-i超级混动技术和刀片电池，两款技术直接引爆市场：\n\n- **刀片电池**：通过结构设计创新，把磷酸铁锂电池的安全性做到极致（针刺不起火），同时降低成本\n- **DM-i混动**：亏电油耗低至3.8L/100km，彻底解决了消费者的「里程焦虑」\n\n**2022年，比亚迪宣布停产燃油车，全面转向新能源。**这是全球第一个做出这个决定的传统车企。\n\n---\n\n## 三、全球第一\n\n2023年，比亚迪全年新能源车销量突破300万辆，超越特斯拉，成为全球新能源车销量冠军。\n\n同时，比亚迪开始大规模出海：元PLUS（海外称ATTO 3）在欧洲、东南亚、中东热销；在泰国建厂、在巴西建厂、在匈牙利建厂。\n\n2025年，比亚迪的「仰望」品牌推出百万级豪车，搭载「易四方」四电机技术，可以原地掉头、应急浮水。中国品牌第一次站上了汽车技术的金字塔尖。\n\n**从「市场换技术」到「技术换市场」，中国汽车工业用了40年，终于完成了角色互换。**\n\n---\n\n## 四、换道超车的启示\n\n比亚迪的故事，是中国制造业升级的缩影，也是「换道超车」战略的经典案例：\n\n**1. 不在别人的主场打硬仗。** 燃油车赛道，欧美日有百年积累，你追不上。但电动车是新赛道，大家起点差不多。\n\n**2. 垂直整合的护城河。** 比亚迪自己造电池、造芯片（IGBT/SiC）、造电机、甚至造锂矿开采设备。这种全产业链掌控力，让它在供应链危机中岿然不动。\n\n**3. 技术为王。** 王传福是工程师出身，比亚迪的研发投入常年超过净利润。技术才是最大的护城河。\n\n**换道超车不是走捷径，而是找到一条更适合自己的赛道，然后用尽全力跑。**\n","book\\五卷全书\\中国科技故事\\14-国产大模型群像.md":"# 中国科技故事 · 14 · 国产大模型群像：文心、通义、豆包、Kimi的突围\n\n> 2023年ChatGPT横空出世，全世界都在问：中国的大模型在哪里？三年后，答案来了——不止一个，而是一群。\n\n---\n\n## 一、百模大战\n\n2023年，ChatGPT引爆全球。中国科技圈的反应速度超出所有人预期：百度3月发布文心一言，阿里4月发布通义千问，腾讯9月发布混元，字节跳动随后推出豆包。\n\n到2023年底，中国备案的大模型超过100个，被称为「百模大战」。有人说是泡沫，有人说是恐慌性跟进。但事后看来，**正是这种「饱和式投入」，让中国在大模型竞赛中没有掉队。**\n\n---\n\n## 二、各有绝活\n\n经过三年的激烈竞争，到2026年，国产大模型形成了清晰的差异化格局：\n\n- **DeepSeek（深度求索）**：以开源+极致性价比著称，R1推理模型对标OpenAI o1，是中国大模型的「性价比之王」\n- **文心一言（百度）**：依托百度搜索的海量中文数据，在中文理解和知识问答上表现出色\n- **通义千问（阿里）**：Qwen系列开源模型在全球开发者社区广受欢迎，下载量过亿\n- **豆包（字节跳动）**：C端用户量最大的国产AI助手，多模态能力领先\n- **Kimi（月之暗面）**：超长上下文（200万字）独树一帜，长文档理解能力全球领先\n- **智谱GLM**：清华系出身，学术底蕴深厚，B端市场布局扎实\n\n**一个生态的繁荣，不是一棵大树遮天蔽日，而是百花齐放。**\n\n---\n\n## 三、开源与闭源\n\n国产大模型最重要的贡献之一，是推动了全球开源生态的繁荣。\n\n阿里Qwen系列、DeepSeek系列等开源模型，让全球开发者第一次可以低成本地用上世界级模型。在HuggingFace开源社区，中国大模型的下载量和影响力持续攀升。\n\n开源不等于不赚钱。DeepSeek证明了：**开源可以是一种战略——用开放换生态，用生态换未来。**\n\n这打破了「闭源才是护城河」的迷思，也为全球AI的民主化做出了中国贡献。\n\n---\n\n## 四、差距与追赶\n\n客观地说，国产大模型与全球顶尖水平（GPT-4o、Claude等）仍有差距，尤其在多模态能力、Agent能力和基础研究的原创性上。\n\n但差距在快速缩小。2024年差距约一年，2025年缩至半年，2026年部分领域已实现并跑甚至领跑。\n\n更重要的是，中国大模型走出了一条独特的路：**不追求「全能冠军」，而是在各自擅长的领域做到极致。**开源的做开源，C端的做C端，垂直的做垂直。\n\n这场竞赛远未结束。但至少，中国不再只是观众。\n","book\\五卷全书\\中国科技故事\\15-光刻机与芯片.md":"# 中国科技故事 · 15 · 光刻机与芯片：卡脖子与突围战\n\n> 芯片是现代工业的粮食，光刻机是造芯片的「笔」。当这支「笔」被人卡住时，中国半导体产业开始了一场悲壮的突围战。\n\n---\n\n## 一、为什么芯片这么难\n\n一颗指甲盖大小的芯片上，集成了上百亿个晶体管。制造它需要5000多道工序、几百种设备、上千种材料。其中最关键的设备，就是光刻机。\n\n光刻机的精度有多恐怖？**相当于两架飞机并排飞行，一架飞机上的刀在另一架的米粒上刻字。**目前最先进的EUV光刻机只有荷兰ASML能造，单台售价超过10亿人民币，而且对中国禁运。\n\n芯片制造被形容为人类工业文明的「皇冠明珠」，因为它需要物理、化学、光学、材料、精密机械等几十个学科的顶级水平同时在线。\n\n---\n\n## 二、卡脖子清单\n\n2018年中兴事件、2019年华为被制裁，把「芯片自主」这个课题推到了每个中国人面前。\n\n卡脖子的不只是光刻机，而是一整条产业链：\n- **EDA软件**（芯片设计工具）：美国三巨头垄断\n- **先进制程**（7nm以下）：台积电、三星垄断\n- **EUV光刻机**：ASML独家供应\n- **高端芯片**（GPU/AI芯片）：英伟达、AMD垄断\n- **半导体材料**：日本企业在光刻胶、硅片等领域占比极高\n\n这不是一个「点」的问题，而是一张「网」的困境。\n\n---\n\n## 三、突围战\n\n面对封锁，中国半导体产业选择了最难但也最正确的路——**全产业链自主创新**：\n\n- **中芯国际**：14nm量产，N+1/N+2工艺（等效7nm）实现突破\n- **长江存储**：Xtacking架构的3D NAND闪存，跻身全球第一梯队\n- **华为海思**：麒麟9000S芯片在制裁下回归，证明了中国芯片设计的韧性\n- **上海微电子**：国产28nm光刻机交付，向更先进制程进军\n- **RISC-V**：中国积极参与开源指令集架构，寻找「换道」机会\n\n每一步都极其艰难，但每一步都在向前。芯片产业的规律是：**一旦突破，就无法回头。**\n\n---\n\n## 四、长期主义\n\n芯片不是一个可以「弯道超车」的行业。它需要的是「直道硬跑」——持续投入、耐心等待、忍受寂寞。\n\n好消息是，中国有全球最大的芯片市场（占全球1/3以上）、最多的理工科毕业生、最强的工程化能力。这些优势正在转化为实实在在的进步。\n\n华为Mate 60系列的发布，让全世界看到：制裁可以延缓中国芯片的进步，但无法阻止它。\n\n**芯片突围战，本质上是一场国运之战。而国运，从来不是靠运气，而是靠一代人的死磕。**\n","book\\五卷全书\\中国科技故事\\16-钱学森.md":"# 中国科技故事 · 16 · 钱学森：五年归国路，十年两弹成\n\n> 美国海军次长说：「一个钱学森抵得上五个师。」他用五年时间回国，用十年时间让中国有了原子弹和导弹。一个人的选择，改变了一个国家的命运。\n\n---\n\n## 一、天才少年\n\n1911年，钱学森出生于上海。1934年从交通大学毕业后，考取庚子赔款公费留学生，赴美国麻省理工学院学习航空工程。\n\n在加州理工学院，他师从「超音速飞行之父」冯·卡门，28岁就成为世界顶尖的空气动力学家。他与导师共同建立的「卡门-钱近似」公式，至今仍是航空航天领域的经典理论。\n\n**1949年，新中国成立。钱学森说：「我的事业在中国，我要回去。」**\n\n---\n\n## 二、五年归国路\n\n回国之路，走了整整五年。\n\n1950年，钱学森准备回国时，被美国当局无端扣留。行李被翻、被关进拘留所、被软禁在家。美国海军次长金贝尔说：「钱学森无论走到哪里，都抵得上五个师的兵力。我宁可把他枪毙，也不能让他回到中国。」\n\n在软禁的五年里，钱学森完成了《工程控制论》——这门学科后来成为自动化领域的基石。他把怒火化作了学术的锋芒。\n\n1955年，在周恩来总理的亲自交涉下，钱学森终于踏上了归国的轮船。他说：**「我将竭尽努力，和中国人民一道建设自己的国家，使我的同胞能过上有尊严和幸福的生活。」**\n\n---\n\n## 三、十年两弹成\n\n回国后，钱学森受命组建中国第一个火箭、导弹研究机构——国防部第五研究院。\n\n条件艰苦到难以想象：没有实验室，就在帐篷里做实验；没有计算机，就用手摇计算机；没有风洞，就用自行车打气筒模拟气流。\n\n**1960年，中国第一枚近程导弹「东风一号」发射成功。**\n**1964年，中国第一颗原子弹爆炸成功。**\n**1966年，导弹核武器试验成功——「两弹结合」，中国有了真正的核威慑力。**\n**1970年，「东方红一号」卫星升空，钱学森是主要技术负责人。**\n\n「五年归国路，十年两弹成」——这十个字，浓缩了一个人和一个国家最壮烈的十年。\n\n---\n\n## 四、一个人的遗产\n\n钱学森的贡献远不止「两弹一星」：\n\n- **系统工程**：他创立的系统科学理论，被广泛应用于航天、经济、社会管理等领域\n- **人才培养**：他亲手培养的科技人才，撑起了中国航天事业的几代人\n- **晚年思考**：他提出「大成智慧学」「开放复杂巨系统」等理论，直到96岁仍在思考国家的未来\n\n2009年10月31日，钱学森逝世，享年98岁。\n\n他留下的最后一句话是关于教育的：**「为什么我们的学校总是培养不出杰出人才？」**这个「钱学森之问」，至今仍在叩问每一个教育工作者的心。\n","book\\五卷全书\\中国科技故事\\17-袁隆平.md":"# 中国科技故事 · 17 · 袁隆平：一粒种子改变世界\n\n> 他不是在实验室里做研究的科学家，他是挽着裤腿站在稻田里的农民。他用一粒种子，让中国人端牢了饭碗，也让世界少了几亿饥民。\n\n---\n\n## 一、禾下乘凉梦\n\n1930年，袁隆平出生于北京。1953年从西南农学院毕业后，被分配到湖南安江农校当老师。\n\n1960年代，中国遭遇严重饥荒。袁隆平亲眼看到有人饿死在路边。他在心里发了一个誓：**「我一定要让大家吃饱饭。」**\n\n他有两个梦想：一个是「禾下乘凉梦」——水稻长得像高粱一样高，穗子像扫把一样长，颗粒像花生一样大，他和助手们坐在稻穗下乘凉；另一个是「杂交水稻覆盖全球梦」——让全世界的人都不再挨饿。\n\n这两个梦，他追了一辈子。\n\n---\n\n## 二、万分之一的机会\n\n杂交水稻的原理，是把两个不同品种的水稻杂交，利用「杂种优势」获得更高产量。说起来简单，做起来难如登天。\n\n1961年，袁隆平在稻田里发现了一株「鹤立鸡群」的天然杂交稻。由此推断：如果找到天然雄性不育株（雌蕊正常、雄蕊退化），就可以实现大规模杂交。\n\n**接下来的六年，他在十几万株水稻中，一株一株地找。**夏天在40度的稻田里弯着腰，用放大镜看每一朵花的花药。\n\n1964年，终于找到了第一株天然雄性不育株。到1970年，他的助手李必湖在海南找到了「野败」（野生雄性不育株），杂交水稻研究终于突破。\n\n**1973年，世界上第一株杂交水稻「南优2号」培育成功。亩产比普通水稻增产20%以上。**\n\n---\n\n## 三、一粒种子的力量\n\n杂交水稻的意义，怎么形容都不为过：\n\n- **中国**：杂交水稻累计推广超过90亿亩，增产稻谷9000多亿公斤，每年增产的粮食可以多养活7000万人\n- **全球**：杂交水稻已推广到印度、越南、菲律宾、美国、巴西等数十个国家，全球种植面积超过1.5亿公顷\n- **超级稻**：袁隆平团队不断刷新产量纪录——从亩产700公斤到800、900、1000、1100公斤，一次次突破「不可能」\n\n联合国粮农组织把推广杂交水稻列为解决发展中国家粮食短缺问题的首选战略。\n\n**一粒种子，真的可以改变世界。**\n\n---\n\n## 四、泥腿子科学家\n\n袁隆平不是那种西装革履的「学院派」科学家。他常年穿35块钱的衬衫，开十几万的车，住普通的房子。他最开心的时刻，是站在稻田里看稻穗。\n\n90岁高龄，他还在田间地头工作。2021年5月22日，袁隆平在长沙逝世，享年91岁。消息传来，举国哀悼。长沙市民自发涌上街头，追着灵车喊「袁爷爷，一路走好」。\n\n他的一生证明了一个朴素的道理：**真正的伟大，不在于你站得多高，而在于你弯腰的姿态。**\n\n在长沙的实验田里，新一季的水稻正在抽穗。风吹稻浪，仿佛在诉说一个永远不会结束的故事。\n","book\\五卷全书\\中国科技故事\\18-科技创业者群像.md":"# 中国科技故事 · 18 · 任正非、王传福、梁文锋：科技创业者群像\n\n> 他们年龄不同、行业不同、风格不同，但他们有一个共同的名字——中国科技创业者。他们用不同的方式，回答了同一个问题：中国企业能不能做出世界级的技术？\n\n---\n\n## 一、任正非：乌龟哲学\n\n任正非，1944年出生，43岁创立华为。\n\n他的管理哲学可以用一个词概括——**「乌龟」**。他说：「华为就是一只大乌龟，二十多年来只知爬呀爬，全然没看见路两旁的鲜花。」\n\n这种「慢」，恰恰是最快的：华为不上市、不炒房、不追风口，把每年营收的20%以上投入研发。2023年研发投入超过1600亿人民币，全球排名前五。\n\n任正非的另一个关键词是**「开放」**。华为有19万员工，其中外籍员工超过3万。他说：「一杯咖啡吸收宇宙能量。」——用最开放的心态，做最硬核的技术。\n\n在至暗时刻，任正非的从容令人惊叹：「美国的制裁，对华为来说是一次最好的考试。」\n\n**真正的强者，不是不会受伤，而是受伤之后依然能站起来。**\n\n---\n\n## 二、王传福：工程师的执念\n\n王传福，1966年出生于安徽无为县的农村家庭。父母早逝，靠哥嫂供他读完大学。\n\n1995年，他辞去「铁饭碗」，借250万元创办比亚迪做电池。2003年收购秦川汽车时，所有人反对，他说了一句话：**「我下半辈子就干汽车了。」**\n\n王传福是技术出身，对工程师文化有执念。比亚迪有一个著名的「技术鱼池」理论：各种技术像鱼一样养在池子里，市场需要什么就捞什么。\n\n刀片电池、DM-i超级混动、e平台3.0、易四方……一条条「大鱼」被捞出来，每一条都改变行业。\n\n**他的信念很简单：中国人不比外国人笨，外国人能做的，中国人也能做，而且能做得更好。**\n\n---\n\n## 三、梁文锋：低调的颠覆者\n\n梁文锋，1985年出生于广东湛江。从浙江大学毕业后，他创立了量化对冲基金幻方量化，用AI做投资，管理规模一度超过千亿。\n\n2023年，他做出了一个让所有人意外的决定：创立DeepSeek，All in通用人工智能。\n\n和任正非的「乌龟哲学」不同，梁文锋的风格是**「闪电战」**：DeepSeek从成立到震动全球，只用了不到两年。\n\n但他和任正非、王传福有一个共同点：**极度重视技术本身。**DeepSeek几乎没有营销团队，梁文锋说：「模型本身就是最好的广告。」\n\n在全球AI竞争最激烈的时代，梁文锋证明了：**中国不仅能做出好的AI应用，还能做出世界顶级的AI模型。**\n\n---\n\n## 四、三种力量\n\n任正非、王传福、梁文锋，代表了中国科技创业者的三种力量：\n\n| 创业者 | 公司 | 领域 | 核心力量 |\n|--------|------|------|----------|\n| 任正非 | 华为 | 通信/ICT | 长期主义+组织力 |\n| 王传福 | 比亚迪 | 新能源 | 技术执念+垂直整合 |\n| 梁文锋 | DeepSeek | 人工智能 | 技术信仰+极致效率 |\n\n三代人、三个行业、三种打法，但底层逻辑是一样的：**尊重技术、尊重人才、尊重时间。**\n\n中国科技的未来，就掌握在这些「不认命」的人手中。\n","book\\五卷全书\\中国科技故事\\README-目录.md":"# 中国科技故事 · 系列总目录\n\n> 这是一个持续更新的专题系列：讲述那些改变世界、也改变了中国的科技故事。每一篇独立成文，串起来就是一部「中国科技简史」。\n\n## 全部收录（18篇）\n\n| 编号 | 篇名 | 主题 | 状态 |\n|------|------|------|------|\n| 01 | [DeepSeek 的逆袭](01-DeepSeek的逆袭.md) | 一家中国公司如何用开源+性价比改写全球 AI 格局 |  已完成 |\n| 02 | [两弹一星](02-两弹一星.md) | 从「一穷二白」到「镇国重器」 |  已完成 |\n| 03 | [中国高铁](03-中国高铁.md) | 从「引进」到「领跑」 |  已完成 |\n| 04 | [北斗导航](04-北斗导航.md) | 我们为什么要造自己的「北斗」 |  已完成 |\n| 05 | [中国航天](05-中国航天.md) | 从东方红一号到空间站 |  已完成 |\n| 06 | [嫦娥探月与天问探火](06-嫦娥探月.md) | 中国人的星辰大海 |  已完成 |\n| 07 | [超级计算机](07-超级计算机.md) | 神威·太湖之光背后的故事 |  已完成 |\n| 08 | [量子科技](08-量子科技.md) | 墨子号与九章 |  已完成 |\n| 09 | [华为](09-华为.md) | 一家公司的长征 |  已完成 |\n| 10 | [5G通信](10-5G通信.md) | 中国如何站上通信之巅 |  已完成 |\n| 11 | [移动支付与数字生活](11-移动支付.md) | 一部手机走天下 |  已完成 |\n| 12 | [大疆](12-大疆.md) | 从车库到全球无人机之王 |  已完成 |\n| 13 | [比亚迪与新能源车](13-比亚迪.md) | 换道超车 |  已完成 |\n| 14 | [国产大模型群像](14-国产大模型群像.md) | 文心、通义、豆包、Kimi的突围 |  已完成 |\n| 15 | [光刻机与芯片](15-光刻机与芯片.md) | 卡脖子与突围战 |  已完成 |\n| 16 | [钱学森](16-钱学森.md) | 五年归国路，十年两弹成 |  已完成 |\n| 17 | [袁隆平](17-袁隆平.md) | 一粒种子改变世界 |  已完成 |\n| 18 | [科技创业者群像](18-科技创业者群像.md) | 任正非、王传福、梁文锋 |  已完成 |\n\n---\n\n> 每篇故事都会回答三个问题：**它为什么重要？中国为什么能做到？它如何改变了普通人的生活？**\n","blog\\AI写作完全指南.md":"# AI写作完全指南：从入门到精通\n\n> 写作是AI最成熟的应用之一。但大多数人只用到了AI写作10%的能力。这篇指南将带你从「会用」到「精通」。\n\n---\n\n## 一、AI写作的本质\n\nAI写作不是「让AI替你写」，而是「让AI帮你写得更好、更快」。\n\n核心公式：**AI初稿 + 人工优化 = 高质量内容**\n\n- AI负责：资料收集、结构搭建、初稿生成、语言润色\n- 人负责：观点提炼、案例选择、情感注入、最终把关\n\n---\n\n## 二、五大写作场景实战\n\n### 1. 公众号/头条号文章\n\n**提示词模板**：\n```\n你是一位资深公众号作者，擅长[领域]。请围绕「[主题]」写一篇2000字文章。\n要求：\n1. 标题要吸引人，包含数字或悬念\n2. 开头用一个故事或热点事件切入\n3. 正文分3-4个小标题，每部分有具体案例\n4. 语言风格[亲切/专业/幽默]\n5. 结尾引导读者互动（提问/点赞/关注）\n```\n\n**关键技巧**：\n- 给AI提供3-5篇你的历史文章，让它学习你的风格\n- 要求AI生成3个标题供你选择\n- 用「更口语化」「更专业」「更有情感」等指令迭代优化\n\n### 2. 小红书文案\n\n**特点**：短、平、快，重情绪，重互动。\n\n**提示词模板**：\n```\n你是一位小红书爆款文案专家。请为以下产品/主题写一篇小红书文案：\n1. 标题：20字以内，包含emoji和数字\n2. 正文：3-4段，每段2-3行，多用emoji\n3. 语气：像朋友聊天，亲切自然\n4. 结尾：5个相关话题标签\n5. 加入「姐妹们」「真的绝了」「我不允许你不知道」等小红书常用语\n```\n\n### 3. 短视频脚本\n\n**结构**：钩子（前3秒） 正文（分3段） 结尾（行动号召）\n\n**提示词模板**：\n```\n你是一位短视频编导。请为「[主题]」写一个60秒脚本：\n1. 前3秒钩子：提出一个颠覆认知的观点或悬念\n2. 中间3段：每段一个要点，配画面描述和台词\n3. 结尾：总结+行动号召（关注/点赞/评论）\n4. 整体节奏紧凑，适合抖音/快手/B站风格\n```\n\n### 4. 商业文案\n\n**类型**：产品描述、广告文案、品牌故事、邮件营销\n\n**核心原则**：AIDA模型（Attention注意Interest兴趣Desire欲望Action行动）\n\n### 5. 学术写作\n\n**可用场景**：文献综述、论文摘要、研究背景、致谢\n\n**不可用于**：核心论点、原创分析、数据造假\n\n**提示词模板**：\n```\n请帮我总结以下文献的核心观点，要求：\n1. 研究问题和背景\n2. 核心方法（用通俗语言）\n3. 主要发现和结论\n4. 创新点和局限\n5. 对我的研究的启示\n```\n\n---\n\n## 三、进阶技巧\n\n### 1. 角色扮演法\n\n给AI设定具体角色，输出质量大幅提升：\n\n-  普通：「写一篇关于人工智能的文章」\n-  高级：「你是一位有10年经验的科技记者，请写一篇关于AI最新进展的深度报道」\n\n### 2. 多轮迭代法\n\n不要期望一次得到完美结果。多轮对话逐步优化：\n\n1. 第一轮：生成初稿\n2. 第二轮：「更口语化一些」「增加一个案例」「缩短到1000字」\n3. 第三轮：「标题不够吸引人，给5个备选」「结尾不够有力」\n\n### 3. 反向提示法\n\n告诉AI「不要做什么」和「要做什么」同样重要：\n\n- 「不要使用专业术语，要让小学生也能看懂」\n- 「不要罗列优点，要用故事展示效果」\n- 「不要平铺直叙，要有起伏和悬念」\n\n### 4. 风格迁移法\n\n让AI学习特定风格：\n\n```\n请阅读以下3段文字，总结其写作风格特点，然后用同样的风格写一段关于[主题]的文字。\n[粘贴3段参考文字]\n```\n\n---\n\n## 四、常见问题\n\n**Q：AI写作会被平台检测出来吗？**\nA：各平台都在开发AI检测工具，但核心不是「是否用AI」，而是「内容是否有价值」。加入个人观点和真实案例，通过原创检测没问题。\n\n**Q：AI写作算抄袭吗？**\nA：AI生成内容是原创的，不算抄袭。但如果你直接复制粘贴不加修改，可能与其他用户的生成内容雷同。建议加入个人元素。\n\n**Q：如何保持自己的写作风格？**\nA：AI做初稿，你做「主编」——调整结构、替换案例、加入个人语气。长期使用，形成「AI+你」的独特风格。\n\n---\n\n## 五、实战练习\n\n本周挑战：用AI完成以下任务\n- [ ] 写一篇公众号文章（从选题到发布全流程）\n- [ ] 生成5个小红书标题，选最好的一个写全文\n- [ ] 写一个60秒短视频脚本\n- [ ] 用AI优化你之前写过的一篇文章\n\n---\n\n> **记住**：AI是杠杆，放大你的能力；但支点永远是你自己的思考和判断。\n","blog\\AI创业实战指南.md":"# AI创业实战指南\n\n> AI降低了创业门槛，但也提高了竞争烈度。一个人+AI就能启动一家公司，但如何活下来、活得好？这份指南给你答案。\n\n---\n\n## 一、AI创业的机会图谱\n\n### 1. 应用层（机会最多）\n\n- **垂直行业AI**：法律AI、医疗AI、教育AI、金融AI\n- **工具型AI**：写作工具、设计工具、编程工具、办公工具\n- **内容型AI**：AI生成内容平台、AI编辑工具\n\n### 2. 中间层（技术门槛高）\n\n- **模型微调**：针对特定场景优化开源模型\n- **Agent平台**：搭建AI工作流自动化平台\n- **数据服务**：数据标注、数据清洗、数据合成\n\n### 3. 基础设施层（巨头游戏）\n\n- 芯片、云计算、大模型训练——不建议个人创业者进入\n\n---\n\n## 二、从0到1：MVP实战\n\n### 第一步：找痛点\n\n**方法**：\n1. 观察自己工作中的重复性劳动\n2. 调研目标用户群体的抱怨\n3. 分析现有产品的差评\n\n**验证标准**：\n- 痛点是否真实存在？\n- 用户是否愿意付费解决？\n- 市场规模是否足够大？\n\n### 第二步：快速验证\n\n**原则**：用最小成本验证核心假设\n\n**方法**：\n- 不做产品，先做Landing Page收集意向用户\n- 用AI手动服务第一批用户（Concierge MVP）\n- 预售/众筹验证付费意愿\n\n### 第三步：产品化\n\n**技术选型建议**：\n- **初期**：调用现成API（DeepSeek/OpenAI），快速上线\n- **中期**：根据数据反馈，优化提示词和流程\n- **后期**：考虑微调模型或自研，建立壁垒\n\n---\n\n## 三、商业模式设计\n\n### 常见模式\n\n| 模式 | 特点 | 适合场景 | 案例 |\n|------|------|----------|------|\n| SaaS订阅 |  recurring revenue | 工具型产品 | Notion AI |\n| 按量付费 | 用多少付多少 | API服务 | OpenAI API |\n| Freemium | 免费+付费增值 | C端产品 | Canva |\n| 定制开发 | 项目制收费 | B端服务 | 咨询公司 |\n| 平台抽成 | 交易佣金 |  marketplace | 淘宝 |\n\n### 定价策略\n\n1. **成本加成**：成本×2-3倍\n2. **价值定价**：用户愿意付多少？节省时间的价值是多少？\n3. **竞品参考**：与竞品持平或略低，突出差异化\n\n---\n\n## 四、冷启动与增长\n\n### 1. 内容营销\n\n- 公众号/小红书/知乎分享AI干货\n- 案例展示：用你的产品解决真实问题\n- SEO优化：抢占关键词搜索流量\n\n### 2. 社群运营\n\n- 建立用户微信群/Discord\n- 定期举办线上分享\n- 收集反馈，快速迭代\n\n### 3. 渠道合作\n\n- 与互补产品互相导流\n- 入驻平台（Chrome商店、微信小程序）\n- KOL合作推广\n\n---\n\n## 五、避坑指南\n\n### 1. 技术陷阱\n\n-  盲目追求最新技术\n-  解决真实问题比技术先进更重要\n\n### 2. 产品陷阱\n\n-  功能大而全\n-  单点突破，做到极致\n\n### 3. 法律陷阱\n\n-  忽视数据隐私和内容合规\n-  前置合规审查，避免后期风险\n\n### 4. 资金陷阱\n\n-  过早烧钱扩张\n-  先验证单元经济模型，再规模化\n\n---\n\n## 六、实战案例\n\n**案例1：AI简历优化工具**\n- 痛点：求职者不会写简历\n- MVP：Landing Page收集1000个邮箱\n- 产品：AI分析简历，给出优化建议\n- 模式：9.9元/次，复购率30%\n- 结果：月收入10万+\n\n**案例2：AI法律文书助手**\n- 痛点：小微企业请不起律师\n- 产品：AI生成合同、审查合同\n- 模式：199元/月订阅\n- 结果：服务5000+企业，年收入千万级\n\n**案例3：AI电商详情页生成**\n- 痛点：中小卖家不会做详情页\n- 产品：输入产品信息，AI生成详情页文案+配图\n- 模式：按次收费+包月订阅\n- 结果：淘宝服务市场TOP10\n\n---\n\n## 七、 checklist\n\n- [ ] 找到一个真实痛点\n- [ ] 验证至少10个用户愿意付费\n- [ ] 上线MVP，获得第一批用户\n- [ ] 实现第一笔收入\n- [ ] 月增长率>20%\n- [ ] 考虑融资或扩大规模\n\n---\n\n> **核心理念**：AI创业的核心不是技术，而是「用AI解决真实问题，创造真实价值」。技术是手段，商业才是本质。\n","blog\\AI医疗应用指南.md":"# AI医疗应用指南\n\n> AI不会取代医生，但会用AI的医生会取代不会用的。这份指南覆盖AI在医疗领域的核心应用和实操方法。\n\n---\n\n## 一、医学影像诊断\n\n### 应用场景\n\n- **CT/MRI分析**：肺结节、脑出血、骨折检测\n- **X光片**：肺炎、肺结核筛查\n- **眼底照相**：糖尿病视网膜病变、青光眼\n- **病理切片**：癌细胞识别、分级\n\n### 主流产品\n\n| 产品 | 公司 | 获批情况 | 特点 |\n|------|------|----------|------|\n| 肺结节AI | 推想科技 | NMPA三类证 | 敏感性>95% |\n| 糖网AI | 鹰瞳科技 | NMPA三类证 | 准确率与专家相当 |\n| 骨折AI | 汇医慧影 | NMPA三类证 | 急诊快速筛查 |\n\n### 医生如何使用\n\n1. 影像上传至AI系统\n2. AI自动标注可疑区域\n3. 医生审核AI结果，做出最终诊断\n4. AI生成结构化报告\n\n**价值**：敏感性提升（减少漏诊）、效率提升（读片时间缩短50%）\n\n---\n\n## 二、临床决策支持\n\n### 1. 辅助诊断\n\n**AI应用**：\n- 输入症状和检查结果，AI列出可能诊断（按概率排序）\n- AI提示需要补充的检查\n- AI推荐治疗方案（基于最新指南）\n\n### 2. 用药审查\n\n**AI应用**：\n- 自动检查药物相互作用\n- 提示剂量是否合适\n- 识别过敏风险\n\n### 3. 病历质控\n\n**AI应用**：\n- 自动检查病历完整性\n- 提示诊断与用药是否匹配\n- 生成病历质量评分\n\n---\n\n## 三、医学科研\n\n### 1. 文献综述\n\n**AI应用**：\n- 输入研究主题，AI检索并总结最新文献\n- AI提取文献中的关键数据（样本量、方法、结果）\n- AI生成文献综述初稿\n\n**工具**：Elicit、Consensus、PubMed+AI插件\n\n### 2. 数据分析\n\n**AI应用**：\n- 临床数据统计分析（t检验、卡方检验、回归分析）\n- AI生成统计图表\n- AI解读统计结果\n\n### 3. 论文写作\n\n**AI应用**：\n- AI优化英文表达\n- AI生成摘要初稿\n- AI推荐投稿期刊\n\n---\n\n## 四、患者管理\n\n### 1. 智能随访\n\n**AI应用**：\n- AI自动发送随访提醒\n- AI收集患者症状反馈\n- AI识别异常情况并提醒医生\n\n### 2. 健康宣教\n\n**AI应用**：\n- AI生成个性化健康指导（饮食、运动、用药）\n- AI回答患者常见问题\n- AI生成出院指导\n\n---\n\n## 五、医院管理\n\n### 1. 智能导诊\n\n**AI应用**：\n- 患者描述症状，AI推荐科室\n- AI回答就诊流程问题\n- 减少人工导诊压力\n\n### 2. 运营分析\n\n**AI应用**：\n- AI分析门诊量、住院量趋势\n- AI预测高峰时段，优化排班\n- AI分析患者满意度，找出改进点\n\n---\n\n## 六、注意事项\n\n### 法律与伦理\n\n1. **AI不能替代医生诊断**：AI仅供辅助，最终诊断必须由医生做出\n2. **知情同意**：使用AI辅助诊疗应告知患者\n3. **数据隐私**：患者数据脱敏后才能用于AI训练\n4. **责任归属**：AI误诊的责任由医生和医院承担\n\n### 使用建议\n\n1. **保持批判性思维**：AI可能出错，要验证\n2. **持续学习**：AI更新快，要跟上最新进展\n3. **人机协作**：AI做初筛，人做决策\n4. **关注获批情况**：使用有NMPA/FDA批准的AI产品\n\n---\n\n## 七、未来趋势\n\n- **多模态融合**：影像+基因+临床数据综合判断\n- **个性化医疗**：基于基因组学的精准治疗\n- **手术机器人**：AI辅助的微创手术普及\n- **药物研发**：AI加速新药发现\n\n---\n\n> **核心理念**：AI是医生的「超级助手」，让医生从重复劳动中解放出来，专注于需要人文关辉和复杂决策的核心工作。\n","blog\\AI变现实操手册.md":"# AI变现实操手册\n\n> 学了AI，怎么赚钱？这篇手册给你10条经过验证的变现路径，每条都有具体操作步骤。\n\n---\n\n## 一、内容创作变现\n\n### 1. 公众号流量主\n\n**门槛**：500粉丝开通流量主\n\n**操作步骤**：\n1. 选定一个垂直领域（职场/育儿/美食/科技）\n2. 用AI辅助日更（AI初稿+人工优化）\n3. 优化标题和封面，提高打开率\n4. 粉丝到500后开通流量主，广告自动插入\n\n**收入参考**：万次阅读约30-100元，头部账号月入数万\n\n### 2. 小红书品牌合作\n\n**门槛**：1000粉丝开通蒲公英平台\n\n**操作步骤**：\n1. 定位美妆/穿搭/家居/数码等变现强的领域\n2. AI生成文案+AI生成配图，日更2-3条\n3. 粉丝到1000后接品牌合作\n4. 报价参考：粉丝数×0.1-0.3元/条\n\n### 3. 短视频中视频计划\n\n**平台**：抖音中视频计划、B站创作激励\n\n**操作步骤**：\n1. 用AI生成脚本（钩子+干货+结尾）\n2. AI配音+AI剪辑（剪映）\n3. 发布横版视频（1分钟以上）\n4. 播放量换收益，万次播放约10-50元\n\n---\n\n## 二、技能服务变现\n\n### 4. AI代写服务\n\n**平台**：淘宝、闲鱼、猪八戒、朋友圈\n\n**服务内容**：论文润色、简历优化、商业计划书、演讲稿\n\n**定价参考**：\n- 简历优化：50-200元/份\n- 演讲稿：100-500元/篇\n- 商业计划书：500-2000元/份\n\n### 5. AI绘画定制\n\n**服务内容**：头像定制、插画约稿、产品概念图\n\n**平台**：米画师、画加、淘宝\n\n**定价参考**：\n- 头像：20-100元/张\n- 插画：200-1000元/张\n- 商业概念图：500-3000元/张\n\n### 6. AI培训/咨询\n\n**服务内容**：企业内训、一对一咨询、线上课程\n\n**操作步骤**：\n1. 打造个人IP（公众号/小红书分享AI干货）\n2. 积累案例和口碑\n3. 推出付费服务\n\n**定价参考**：\n- 企业内训：5000-50000元/场\n- 一对一咨询：500-2000元/小时\n- 线上课程：99-999元/人\n\n---\n\n## 三、产品变现\n\n### 7. AI工具/插件开发\n\n**方向**：Chrome插件、微信小程序、Notion模板、提示词库\n\n**操作步骤**：\n1. 找到一个具体痛点（如：小红书文案生成器）\n2. 用AI开发MVP（最小可行产品）\n3. 上架到对应平台\n4. 通过广告/付费/订阅变现\n\n### 8. 知识付费\n\n**形式**：付费专栏、电子书、课程\n\n**平台**：小报童、知识星球、知乎盐选\n\n**操作步骤**：\n1. 选定一个AI细分领域（如：AI绘画提示词）\n2. 持续输出免费干货积累粉丝\n3. 推出付费深度内容\n\n---\n\n## 四、新兴机会\n\n### 9. AI数字人直播\n\n**模式**：用AI数字人24小时直播带货\n\n**工具**： HeyGen、硅基智能、闪剪\n\n**优势**：无需真人出镜，可批量复制\n\n### 10. AI Agent服务\n\n**方向**：为企业定制AI工作流\n\n**服务内容**：\n- 自动客服系统\n- 内容自动生成流水线\n- 数据分析报告自动化\n\n**定价**：按项目收费，5000-50000元/项目\n\n---\n\n## 五、避坑指南\n\n1. **不要追求「躺赚」**：AI是工具，不是印钞机。需要持续投入时间和精力。\n\n2. **不要违规**：避免洗稿、抄袭、虚假宣传。长期主义才是正道。\n\n3. **不要all in一个平台**：多平台分发，降低风险。\n\n4. **不要忽视交付质量**：口碑是最好的营销。AI生成内容一定要人工审核。\n\n---\n\n## 六、启动 checklist\n\n- [ ] 选定一个变现方向\n- [ ] 注册相关平台账号\n- [ ] 发布第一批内容（至少5条）\n- [ ] 获得第一笔收入（不管多少）\n- [ ] 复盘优化，持续迭代\n\n---\n\n> **核心**：AI变现的本质是「用AI提升效率，用效率创造价值」。技术只是手段，价值才是核心。\n","blog\\AI实战全书.md":"# AI 实战全书：一个人就是一支创作军团\n\n> 副标题：从零基础到用 AI 做出作品、做出收入、做出个人品牌的最实用指南\n> 适用人群：完全零基础、想用 AI 提效赚钱、想做个人 IP、想转型 AI 方向的普通人\n> 更新：2026 年 8 月 · 紧跟最新模型与工具\n\n---\n\n## 序言：为什么现在必须读这本书\n\n你不需要会编程，不需要数学好，不需要花一分钱，就能读完这本书、并立刻用起来。\n\n三年时间，AI 从\"实验室里的新奇玩意\"变成了\"每个人手机里都能免费用的基础设施\"。会用 AI 的人，正在用它写周报、做视频、剪片子、写小说、搭网站、做副业；不会用的人，还在问它\"你好\"。你们之间差的不是智商，而是一张地图。\n\n这本书就是那张地图。它把七十六年的 AI 历史压缩成一张认知图，把 200 多个工具压缩成一张选型表，把视频、写作、小说、网站四条创作链路拆成一步步可复制的流程，把六十个 AI 方向、三十二个职业视角摊开让你对号入座。\n\n读完这本书，你会得到三样东西：一套能立刻上手的技能，一张能随时查的工具地图，和一个能长期走下去的方向。\n\n---\n\n## 第一章 认知篇：一张地图看懂 AI\n\n### 1.1 AI 是什么，不是什么\n\nAI 不是魔法，不是要取代你的怪物，它是一个\"预测下一个字\"的超级引擎。它读过的文字、图片、代码，比任何一个人一辈子读的都多，所以它能写、能画、能答、能想。\n\n但请记住三件事：第一，它会一本正经地胡说八道（这叫幻觉），重要的事必须自己核实；第二，它是助手不是替身，写出来的东西你要过一遍；第三，它只会\"预测\"，不会\"负责\"——责任永远在人的肩膀上。\n\n### 1.2 七十六年，三起两落\n\n1950 年图灵问\"机器能思考吗\"；1956 年达特茅斯会议上\"人工智能\"一词诞生；之后经历两轮寒冬，直到 2012 年深度学习炸开，2016 年 AlphaGo 赢了李世石，2017 年 Transformer 诞生，2022 年 ChatGPT 五天破百万用户，2025 年 DeepSeek 用极低成本改写全球游戏规则。\n\n看懂这段历史只需要一句话：每一次狂喜都迎来寒冬，每一次寒冬都埋下下一次爆发的种子。今天你看到的繁荣，不是天上掉下来的，是前辈们七十六年死磕出来的。\n\n### 1.3 DeepSeek 时刻：效率革命的开始\n\n2025 年 1 月，中国公司 DeepSeek 用约 560 万美元成本训练出的开源模型 R1，比肩顶级闭源模型，英伟达单日市值蒸发约 5900 亿美元。它证明了一件事：AI 的成本可以被打下来，开源可以追上闭源，限制可以逼出创新。\n\n这对普通人的意义是：**AI 从此不是大公司的奢侈品，而是你手机里免费能用的基础设施。** 这是你最好的入场时机。\n\n---\n\n## 第二章 入门篇：先跑起来（今晚就能做）\n\n### 2.1 DeepSeek 三分钟上手\n\n打开 deepseek.com 或下载 App，注册登录。你会看到两个关键开关：**深度思考**（先想后答，处理复杂问题）和**联网搜索**（获取最新资料）。普通对话不用开，复杂推理开深度思考，查新资料开联网。\n\n### 2.2 提示词五法则\n\n大多数人用不好 AI，不是模型不行，是不会问。记住五条：明确需求（别只说\"帮我写点东西\"，要说清具体任务）；提供背景（你是谁、什么场景）；指定格式（多少字、什么语气）；控制长度（两百字就两百字）；及时纠正（第一次不对，直接让它改）。\n\n### 2.3 三个立刻能用的场景\n\n**写东西**：给领导写周报、给客户回消息、给孩子写发言稿。把背景和需求说清楚，几秒出稿。\n\n**当老师**：任何看不懂的概念，问一句\"用大白话给我解释一下，就当我是小学生\"。\n\n**当参谋**：买房、跳槽、选专业，把条件一条条列清楚，让它帮你分析利弊。\n\n今晚就做：选一个真实问题，用 DeepSeek 解决它。\n\n---\n\n## 第三章 工具篇：大脑一个，手脚按需配\n\n### 3.1 AI 工具全家桶地图\n\n记住一个原则：**大模型做大脑，垂直工具做手脚。**\n\n写作聊天用 DeepSeek、豆包、Kimi、通义千问、ChatGPT、Claude；画画用即梦、Midjourney、Flux；做视频用即梦、可灵、Sora、Runway；剪辑用剪映；配音用 ElevenLabs、剪映自带；配乐用 Suno；做 PPT 用 Gamma、WPS AI；查资料用秘塔、Perplexity；搭应用用 Dify、Coze；建站用 CodeBuddy、Cursor；本地跑模型用 Ollama。\n\n### 3.2 选型口诀\n\n代码用 DeepSeek，长文用 Kimi，办公用千问，生活用豆包，写作润色用 Claude，多模态用 Gemini。不纠结用哪家，按场景组合才是正确姿势。\n\n---\n\n## 第四章 实战篇：四个作品从零到一\n\n### 4.1 视频工作流（六小时成片）\n\n核心公式：**DeepSeek 编剧  AI 出图出视频  AI 配音配乐  剪映成片。**\n\n第一步，让 DeepSeek 写分镜脚本，输出带景别、画面描述、旁白、时长的表格；第二步，用即梦/可灵生成镜头，技巧是先生成关键帧图片再图生视频；第三步，AI 配音配乐；第四步，剪映智能字幕、卡点、调色、导出；第五步，让 AI 生成二十个标题做 A/B 选择。\n\n### 4.2 深度博文工作流（两小时万字）\n\nAI 搜索做资料综述  DeepSeek-R1 列三级大纲  分节扩写  注入你自己的经历和观点  让 R1 扮演\"杠精编辑\"挑刺  终稿润色。关键不是\"一键生成\"，是人机接力：人出灵魂，AI 出血肉。\n\n### 4.3 长篇小说工作流（三十天十万字）\n\n先建世界观设定文档和人物卡  让 R1 设计主线冲突与章纲  逐章生成，每章开头复述前情保持连贯  用角色扮演打磨台词  全书逻辑一致性审查。\n\n### 4.4 网站工作流（一小时上线）\n\n一句话告诉 AI 你要什么  生成网站  本地预览  一键部署。本站就是这么建的。\n\n---\n\n## 专题 · 赚钱篇：AI 副业、一人公司与个人 IP\n\n### 先看清牌桌：红利与洗牌同时发生\n\n2026 年的 AI 副业，是两条相反的路同时在走。一边是低门槛红利：AI 短剧、AI 代写、无人直播、AI 轻创业，让普通人不用学编程也能月入几千。另一边是残酷洗牌：AI 越降价，纯搬运式副业越难赚钱——当人人都会用 AI 时，\"AI 生成 + 倒卖\"的差价迅速归零。\n\n真正的判断是：AI 不会让所有人发财，但会让\"会用 AI 且有一技之长\"的人赚到第一波效率溢价。\n\n### 五条低门槛副业路线\n\n**AI 短剧**：用 DeepSeek 写剧本、即梦/可灵出画面、剪映成片，一条低成本短剧从入坑到变现的全流程。\n\n**AI 写作代写**：周报、文案、PPT、简历，服务不会写的人，赚的是\"时间差 + 技能差\"。\n\n**AI 视频/数字人**：口播视频批量生产，一条素材改五个平台。\n\n**无人直播**：AI 数字人 + 话术，24 小时直播带货。\n\n**AI 轻创业/工具**：用 Dify/Coze 搭一个小工具或服务，收订阅费。\n\n### 一人公司：AI 时代的最小商业闭环\n\n一个人 + 几个 AI 工具 = 一家公司。产品用 AI 帮你做，营销用 AI 帮你写文案，客服用 AI 帮你回，运营用 AI 帮你排期。关键是别贪多，先跑通一个最小闭环：一个产品、一个渠道、一个付费用户。\n\n### 个人 IP：最值钱的长期资产\n\n先立人设（一个替你踩过 AI 坑的搭子），再稳定输出（每周一条），最后变现（课程、社群、带货）。记住：前五条不求爆，求稳定输出和有记忆点的人设；第六条开始根据数据反馈调整。\n\n### 三条避坑\n\n第一，别当纯搬运工，AI 生成 + 倒卖的红利窗口极短；第二，别裸奔，重要内容人工核实、合规标注；第三，别贪多，先跑通一个闭环再复制。\n\n---\n\n## 专题 · 案例篇：六个真实可复制的案例\n\n方法讲再多，不如看已经跑通的结果。以下六个案例，每一个都对应前面某一章的完整链路，照着做就能复制。\n\n**案例 1 · AI 短片**：DeepSeek 编剧  即梦图生视频 12 个镜头  Suno 配乐  剪映成片。总耗时 6 小时，成本不足 50 元，播放量破百万。可复制要点：关键帧图片先行，图生视频比纯文生视频可控性高得多。\n\n**案例 2 · 万字深度文**：R1 三级大纲 + 分节扩写 + 杠精编辑法，2 小时产出行业分析长文，被多平台转载。可复制要点：先列大纲再分节扩写，别让 AI 一口气写全文。\n\n**案例 3 · 连载小说**：设定文档先行，每周 3 章 AI 共创，30 天 10 万字中篇，签约网文平台。可复制要点：世界观和人物卡是地基，地基稳了章节才不跑偏。\n\n**案例 4 · 个人网站**：一句话生成整站，1 小时上线——本项目就是证明。可复制要点：先用 AI 出结构，再逐块微调，别从零手写。\n\n**案例 5 · 矩阵账号**：一条素材用 AI 改写成 5 个平台版本，单人运营矩阵。可复制要点：核心内容只做一次，分发形态交给 AI。\n\n**案例 6 · 自动化流水线**：热点监控  自动选题  R1 初稿  人工终审，内容产能提升 10 倍。可复制要点：把重复环节交给机器，把判断环节留给人。\n\n**案例 7 · AI 数字人口播号**：数字人 + AI 口播稿，单人起号矩阵。可复制要点：口播稿让 DeepSeek 写，画面让数字人出，你只负责选题和剪辑。\n\n**案例 8 · 本地私有知识库**：Open WebUI + Ollama，把公司文档变成问答机器人，数据不出内网。可复制要点：上传 PDF 建库，问它\"我的资料里写了什么\"。\n\n**案例 9 · AI 翻译流水线**：DeepSeek/DeepL 翻译 + 人工审校 + 术语表，多语言内容出海。可复制要点：让 AI 先译、人再审，效率翻倍还保质量。\n\n**案例 10 · AI 电商 Listing**：选品  AI 生成标题五点描述  AI 出主图，跨境开店从 0 到上架。可复制要点：标题埋关键词、五点讲卖点、主图突出差异化。\n\n**案例 11 · AI 做课**：大纲  逐字稿  课件  AI 配音，一门课一天上线。可复制要点：先定学员痛点，再让 AI 倒推课程大纲。\n\n**案例 12 · AI 智能客服**：Dify + 知识库，把常见问题做成自动应答机器人。可复制要点：先喂 FAQ 和文档，再人工兜底复杂问题。\n\n---\n\n## 第五章 进阶篇：开发者基地\n\n### 5.1 本地部署：你自己的免费 AI\n\n装 Ollama，一条命令跑模型：`ollama run qwen3:8b`（8GB 内存）或 `ollama run deepseek-r1:14b`（16GB 内存）。再装 Open WebUI，你就拥有了一个完全离线、数据不出本机、免费不限量的私有 ChatGPT。\n\n### 5.2 从\"会用\"到\"会做\"\n\nDify 让你不写代码搭出 AI 应用；DeepSeek Harness 让模型变成会操作文件、终端、网页的数字员工；LangChain/LlamaIndex 让你用代码精细编排 Agent 和知识库。\n\n### 5.3 开源项目地图\n\n对话模型跑 Ollama；生产推理用 vLLM；生图用 ComfyUI；视频用 Open-Sora；语音用 Whisper/CosyVoice；向量库用 Qdrant/Chroma。开源公式：开源权重模型 + OpenAI 兼容接口 + 插件化 Agent + 本地部署 + 流水线编排。\n\n---\n\n## 第六章 方向篇：六十个方向、三十二个职业\n\n### 6.1 AI 方向全谱\n\n从大模型、多模态、具身智能、世界模型、AI Agent，到 AI 芯片、AI 安全、AI 对齐、联邦学习、合成数据，再到 AI 医疗金融法律教育、自动驾驶、量子 AI、脑机接口、AI for Science——六十个方向构成完整版图。你不必全学，只需找到与你相关的那一个。\n\n### 6.2 职业对号入座\n\n程序员用结对编程和 Agent，设计师用 AI 出图，教师用个性化辅导，医生用辅助诊断，律师用合同审查，金融做风控研报，销售做客户画像，制造业做质检预测维护……三十二个职业，每个都能找到 AI 的切入点。别问\"AI 能干什么\"，要问\"我的职业，AI 能帮我干什么\"。\n\n### 6.3 学习路线与找方向公式\n\n三层学习路线：会用（工具层） 会做（应用层） 会想（研发层）。90% 的人只需要走到前两层。\n\n找方向公式：**方向 = 兴趣 × 能力 × 趋势。** 趋势圈里写\"AI + 你的行业\"，而不是\"AI 本身\"——纯 AI 是少数人的赛道，AI + 医疗/法律/教育/制造才是大多数人的机会。\n\n未来专业分三类：受益（计算机、数据、AI）、转型（医学、法律、教育、设计，核心是专业深度 + AI 工具）、被替代（纯代码工具人、模板化设计、初级翻译，要么往上做判断，要么被 AI 接管）。\n\n普华永道 2026 就业晴雨表的结论：AI 加速技能转型，而非简单替代岗位。真正要练的是五种能力：会提问、会判断、会组合、有真实经验、敢负责。\n\n---\n\n## 第七章 未来篇：十二条正在发生的趋势\n\n别问\"AI 未来会怎样\"，看已经启动的趋势就够了。以下十二条，每一条在 2026 年都已经有了真实的原型、公司或产品，不是科幻，是正在发生。\n\n### 1. Agent 元年：从\"陪聊\"到\"干活\"\n\n模型从\"会回答\"进化到\"会做事\"。一个 Agent 可以独立完成调研、编程、订票、发文的完整链条。竞争的不再是模型本身，而是谁能调度最多工具、跑通最长的任务链。这是普通人最该关注的一条——因为它直接把 AI 从\"玩具\"变成\"员工\"。\n\n### 2. 具身智能：AI 长出身体\n\n数字 AI 负责想，物理 AI 负责动。人形机器人、自动驾驶、机械臂，正在把大模型的推理能力装进物理世界。具身智能是\"大脑长进身体里\"，它会让 AI 第一次真正改变物理世界。\n\n### 3. 世界模型：理解物理规律\n\n今天的语言模型学的是\"词与词的规律\"，世界模型要学的是\"物与物的规律\"——重力、碰撞、因果、时间。只有理解物理规律，AI 才能预测\"推一下杯子会往哪倒\"。这是具身智能和机器人共同的底层。\n\n### 4. 空间智能：让 AI 看懂三维世界\n\n从图片到 3D 场景的重建与理解，AI 开始拥有空间感。它关系到自动驾驶、AR/VR、机器人导航，也是\"物理 AI\"的眼睛。\n\n### 5. 多模态大一统：文本图像音视频一张网\n\n模型不再各管各的，而是把文字、图像、声音、视频放进同一个表示空间。这意味着 AI 能\"看图说话、听声辨物、跨模态联想\"，越来越像一个真正的人。\n\n### 6. 推理时计算：让模型多想一步\n\n参数竞赛退潮后，新的杠杆是\"推理时计算\"——不急着出答案，先让模型自己推演、验证、修正。DeepSeek-R1、o 系列证明：多想一步，准确率能大幅提升。\n\n### 7. 边缘 AI：把智能塞进手机和芯片\n\n模型越做越小，能力却不降。手机端离线跑模型、嵌入式设备本地推理成为可能。隐私、零延迟、离线可用，是边缘 AI 的三大刚需。\n\n### 8. 量子 AI：换一台不受经典物理束缚的引擎\n\n量子比特的叠加态带来维度级算力跃迁。量子机器学习、量子化学模拟，正在给 AI 打开一个经典计算永远解不动的新空间。\n\n### 9. AI for Science：第四科研范式\n\nAlphaFold 破解蛋白质结构、2024 年诺贝尔物理和化学奖双双颁给 AI。AI 正在成为继实验、理论、计算之后的第四种科研范式，加速药物、材料、气候的发现。\n\n### 10. 新质材料与新质生产力\n\nAI 反向设计材料，把发现周期从十年压到一年。固态电池、高温超导、催化剂、光伏——每个\"卡脖子\"环节背后都是材料问题，而材料问题正在变成算力问题。这就是\"新质生产力\"的本质：算力 × 数据 × 新材料。\n\n### 11. AI 安全与治理：从口号到法律\n\n从欧盟 AI 法案到各国备案制度，从内容标注规范到超级对齐研究，AI 治理正在变成法律、标准和职业。这是\"AI 能走多远\"的护栏。\n\n### 12. 可持续 AI：绿色算力\n\n万亿参数背后是吉瓦级电力。DeepSeek 式效率革命与绿色算力一起，让 AI 的成本曲线和能耗曲线同时往下走。可持续，是 AI 规模化绕不开的题。\n\n> 一句话收束：未来十年的主线不是\"AI 会不会取代人\"，而是\"谁先用 AI 改变了什么\"。十二条趋势，每一条都是一条可以入场的路。\n\n---\n\n## 结语：历史只记住用模型改变世界的人\n\n1956 年达特茅斯的先驱们无法想象 ChatGPT，正如今天的我们无法想象 2076 年。唯一确定的是：每一个时代最精彩的作品，都出自最先学会与新工具共舞的人。\n\n从今晚的第一条命令开始。别等想清楚，方向是在做的过程中清晰的，不是想出来的。\n\n---\n\n## 附录 A：提示词模板库\n\n**爆款选题**：角色是百万粉丝科技博主，任务是产十个选题，约束是标题不超过二十字、含数字或悬念，输出为表格。\n\n**分镜脚本**：角色是资深短视频编导，任务是为主题《XX》写六十秒分镜，约束是八到十二个镜头，画面描述可直接作为 AI 视频提示词，输出为表格。\n\n**长文润色**：角色是苛刻的资深主编，任务是批判并改写文章，步骤是先列五个问题再给策略再输出终稿，约束是删除空话套话、每段有信息增量。\n\n**小说章节**：角色是获奖类型小说作家，任务是依据世界观、人物卡、章纲撰写第 N 章，约束是三千字、场景先行、对话驱动、章末留钩子。\n\n---\n\n## 附录 B：工具速查表\n\n| 需求 | 首选 | 备选 |\n| --- | --- | --- |\n| 对话写作 | DeepSeek | 豆包、Kimi、千问 |\n| 深度推理 | DeepSeek-R1 | GPT-5.6 Think |\n| 长文阅读 | Kimi | Claude |\n| 生图 | 即梦 | Midjourney、Flux |\n| 视频生成 | 即梦、可灵 | Sora、Runway |\n| 剪辑 | 剪映 | CapCut |\n| 配音 | ElevenLabs | 剪映自带 |\n| 配乐 | Suno | Udio |\n| 做 PPT | Gamma | WPS AI |\n| 查资料 | 秘塔 | Perplexity |\n| 本地跑模型 | Ollama | LM Studio |\n| 搭应用 | Dify | Coze |\n| 建站 | CodeBuddy | Cursor |\n\n> 本书所有方法论，都已在本项目的网站、小说、博文、视频四大作品中落地验证。读完就去用，用了再来读第二遍。\n\n---\n\n## 附录 C：开箱即用开源项目清单\n\n以下项目全部开源、可本地运行、一条命令或一个安装包就能起。按\"今晚就能跑\"标准整理。\n\n| 项目 | 用途 | 开箱即用命令 |\n| --- | --- | --- |\n| Ollama | 本地跑大模型 | `ollama run qwen3:8b` |\n| Open WebUI | 本地 ChatGPT 界面 | `docker run -d -p 3000:8080 ghcr.io/open-webui/open-webui:main` |\n| LM Studio | 图形界面跑模型 | 官网下载安装即用 |\n| llama.cpp | 轻量推理引擎 | `git clone` + `make` |\n| vLLM | 生产级推理服务 | `pip install vllm` |\n| Dify | 可视化 AI 应用 | `git clone` + `docker compose up -d` |\n| LangChain | Agent 编排 | `pip install langchain` |\n| LlamaIndex | RAG 数据框架 | `pip install llama-index` |\n| Qdrant | 向量数据库 | `docker run -p 6333:6333 qdrant/qdrant` |\n| Chroma | 嵌入式向量库 | `pip install chromadb` |\n| ComfyUI | 可视化生图 | 官网下载安装即用 |\n| Diffusers | 代码级生图 | `pip install diffusers` |\n| Open-Sora | 文生视频 | `git clone` + `pip install -v .` |\n| Whisper | 语音转文字 | `pip install openai-whisper` |\n| CosyVoice | 语音合成/克隆 | `git clone` 官方仓库 |\n| GPT-SoVITS | 声音克隆 | `git clone` 官方仓库 |\n| DeepSeek Harness | Agent 框架 | `git clone` + `pip install -e .` |\n\n> 提醒：安装命令以各项目官方 README 为准；硬件要求已在第五章说明，8GB 内存跑小模型，16GB 跑中模型，24GB+ 显存跑大模型。\n","blog\\AI教育应用实战.md":"# AI教育应用实战\n\n> 从K12到成人教育，从教师到学生，AI正在重塑教育的每个环节。这篇实战指南教你如何把AI真正用起来。\n\n---\n\n## 一、教师篇：AI如何减负增效\n\n### 1. 备课助手\n\n**场景**：需要准备教案、课件、练习题\n\n**AI应用**：\n- 输入教材章节，AI生成教案框架\n- AI根据教学大纲生成练习题（基础/提高/挑战三级）\n- AI把知识点转化为思维导图\n\n**提示词示例**：\n```\n你是一位有20年经验的[学科]教师。请为[年级][章节]设计一份教案：\n1. 教学目标（知识/能力/情感）\n2. 教学重难点\n3. 教学过程（导入/新授/练习/总结）\n4. 板书设计\n5. 分层作业设计\n```\n\n### 2. 批改助手\n\n**场景**：作文批改、作业反馈\n\n**AI应用**：\n- AI初批：语法、结构、逻辑\n- 教师复核：思想性、创造性\n- AI生成个性化评语\n\n### 3. 学情分析\n\n**场景**：了解学生掌握情况\n\n**AI应用**：\n- 输入学生成绩数据，AI生成分析报告\n- AI识别薄弱知识点\n- AI推荐针对性练习\n\n---\n\n## 二、学生篇：AI如何助力学习\n\n### 1. 个性化学习路径\n\n**操作**：\n1. 告诉AI你的当前水平和目标\n2. AI生成学习计划（每日任务+资源推荐）\n3. AI根据你的答题情况动态调整难度\n\n### 2. 24小时答疑\n\n**场景**：课后遇到问题，不好意思问老师\n\n**AI应用**：\n- 拍照搜题（Photomath、作业帮）\n- AI讲解解题思路（不是直接给答案）\n- AI出类似题目巩固练习\n\n### 3. 语言学习\n\n**AI应用**：\n- AI对话练习（口语陪练）\n- AI批改作文\n- AI生成记忆卡片（Anki）\n\n---\n\n## 三、家长篇：AI如何辅导孩子\n\n### 1. 作业辅导\n\n**场景**：家长不会教，或没时间教\n\n**AI应用**：\n- AI讲解题目（用孩子能听懂的语言）\n- AI生成同类练习题\n- AI检查作业完成情况\n\n### 2. 兴趣培养\n\n**AI应用**：\n- AI根据孩子兴趣推荐书籍/视频\n- AI生成创意写作题目\n- AI陪玩教育游戏\n\n### 3. 学习规划\n\n**AI应用**：\n- AI制定寒暑假学习计划\n- AI推荐适合的学习资源\n- AI跟踪学习进度并提醒\n\n---\n\n## 四、成人教育篇\n\n### 1. 职业技能提升\n\n**AI应用**：\n- AI定制学习计划（如：30天学会Python）\n- AI模拟面试\n- AI生成简历和求职信\n\n### 2. 考试备考\n\n**AI应用**：\n- AI生成知识点总结\n- AI出模拟题并批改\n- AI分析错题，找出薄弱环节\n\n---\n\n## 五、实战案例\n\n**案例1：初中数学老师**\n- 用AI生成分层练习题，节省2小时/天\n- 用AI分析月考数据，精准定位薄弱班级\n- 用AI生成家长会PPT，效果获好评\n\n**案例2：高中生**\n- 用AI制定高考复习计划\n- 用AI批改英语作文，从15分提升到22分\n- 用AI讲解物理难题，成绩提升30%\n\n**案例3：职场人**\n- 用AI准备PMP考试，一次通过\n- 用AI练习英语口语，3个月从不敢说到流利\n\n---\n\n## 六、注意事项\n\n1. **AI是辅助，不是替代**：教师的情感关怀、人格影响，AI无法替代\n2. **防止依赖**：学生直接用AI抄作业，反而害了自己\n3. **保护隐私**：不要输入学生真实姓名等敏感信息\n4. **批判性思维**：AI可能出错，要培养学生验证信息的习惯\n\n---\n\n> **核心理念**：AI让教育更个性化、更高效，但教育的本质——点燃火焰、塑造人格——永远需要人的参与。\n","blog\\AI时代工科学习-编程计算机数控仿真实战.md":"# AI 时代工科学习全景 · 编程 / 计算机 / 数控 / 仿真（实战篇）\n\n> 这一篇不跟你讲虚的。你要的是「真的能写、真的能练、真的能下载」。所以下面每个主题，我都给**真实代码、真实工具、真实步骤**。AI 时代的工科学习，核心就一句话：**让 AI 当你的私人导师 + 模拟器，你负责动手练。**\n\n---\n\n## 一、AI 时代怎么学编程\n\n### 1.1 选语言：Python 一票通过\n\n工科 + AI 时代，学编程首选 **Python**。原因：语法最接近人话、库最全（科学计算、仿真、AI、爬虫全都有）、AI 对它的支持最好。\n\n### 1.2 把 DeepSeek 当私人导师（这是新学法）\n\n传统学法：买书  看视频  卡 bug  放弃。AI 时代学法：\n\n```\n你是一位耐心的编程老师。我是零基础。\n请用费曼学习法给我讲「{概念}」，先一句话总结，再给生活化比喻，\n最后给我 3 道由易到难的练习题。\n```\n\n遇到报错，**把完整报错贴回去**让它解释原因和改法——这是 AI 时代学编程最值钱的用法，没有之一。\n\n### 1.3 学习路线（从 0 到能干活）\n\n1. **语法基础**：变量、条件、循环、函数（1-2 周）\n2. **数据结构**：列表、字典、元组（1 周）\n3. **实战项目**：写个小工具（爬虫/自动化/计算器）\n4. **进阶**：面向对象、模块、调试\n\n### 1.4 真实代码：第一个能跑的程序\n\n```python\n# 一个能跑的科学计算器（学了函数和循环就能写）\ndef calc():\n    print(\"科学计算器 · 输入 quit 退出\")\n    while True:\n        expr = input(\"> \")\n        if expr.lower() == \"quit\":\n            break\n        try:\n            print(\"=\", eval(expr))   # 新手先用 eval，理解后再学安全写法\n
