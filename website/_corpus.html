\r\n内容创作案例（5个）\n\r\n\r\nC01\n小红书博主：AI辅助日更\n背景\n：美妆博主，粉丝5万，需要日更但时间不够。\n方案\n：用AI生成初稿，人工修改润色，AI生成配图。\n结果\n：从每周3更提升到日更，粉丝3个月增长2倍，广告收入翻倍。\n\r\nC02\n公众号作者：AI写深度长文\n背景\n：职场类公众号，需要每周2篇深度文章。\n方案\n：用AI做资料收集和初稿，人工加入个人见解和案例。\n结果\n：写作时间从8小时缩短到3小时，文章打开率提升40%。\n\r\nC03\n短视频创作者：AI生成脚本\n背景\n：知识类短视频，需要大量脚本。\n方案\n：AI生成脚本框架+人工优化+AI配音。\n结果\n：日更3条，3个月粉丝从0到10万。\n\r\nC04\n小说作者：AI辅助创作\n背景\n：网文作者，日更压力大。\n方案\n：AI生成情节构思和初稿，人工把控文风和节奏。\n结果\n：日更字数从4000提升到8000，作品进入平台畅销榜。\n\r\nC05\n插画师：AI辅助设计\n背景\n：商业插画师，客户改稿需求多。\n方案\n：AI快速生成多个风格草图，客户选定后精细绘制。\n结果\n：改稿次数减少60%，客户满意度提升。\n\r\n\r\n编程开发案例（5个）\n\r\n\r\nC06\n独立开发者：AI全栈开发\n背景\n：想做一个SaaS产品但不会前端。\n方案\n：用AI生成前端代码，自己专注后端逻辑。\n结果\n：3个月上线MVP，获得第一批100个付费用户。\n\r\nC07\n数据分析师：AI写SQL\n背景\n：每天需要写大量SQL查询。\n方案\n：用自然语言描述需求，AI生成SQL，人工验证。\n结果\n：效率提升3倍，出错率降低50%。\n\r\nC08\n测试工程师：AI生成测试用例\n背景\n：手动编写测试用例耗时耗力。\n方案\n：AI根据需求文档自动生成测试用例。\n结果\n：测试覆盖率从60%提升到90%，回归测试时间减半。\n\r\nC09\n运维工程师：AI写脚本\n背景\n：需要编写大量自动化运维脚本。\n方案\n：AI生成Shell/Python脚本，人工审核后部署。\n结果\n：运维效率提升5倍，故障响应时间从30分钟缩短到5分钟。\n\r\nC10\n产品经理：AI写PRD\n背景\n：产品需求文档写作耗时。\n方案\n：AI生成PRD框架和初稿，人工补充业务细节。\n结果\n：PRD写作时间从2天缩短到半天，开发理解度提升。\n\r\n\r\n商业变现案例（5个）\n\r\n\r\nC11\n电商卖家：AI优化listing\n背景\n：亚马逊卖家，产品描述转化率低。\n方案\n：AI生成多版本产品描述，A/B测试最优版本。\n结果\n：转化率提升25%，月销售额增长40%。\n\r\nC12\n自由职业者：AI接单\n背景\n：设计师，想扩大接单量。\n方案\n：用AI生成作品集展示文案，AI优化提案。\n结果\n：接单量翻倍，客单价提升30%。\n\r\nC13\n咨询顾问：AI辅助报告\n背景\n：管理咨询顾问，报告写作占大量时间。\n方案\n：AI生成报告框架和数据分析，人工加入洞察。\n结果\n：项目交付周期缩短30%，客户续约率提升。\n\r\nC14\n培训师：AI开发课程\n背景\n：企业培训师，需要快速开发新课程。\n方案\n：AI生成课程大纲、案例、练习题。\n结果\n：课程开发时间从2个月缩短到2周，课程评分4.8/5。\n\r\nC15\n自媒体人：AI矩阵运营\n背景\n：运营多个平台账号，内容产量不足。\n方案\n：AI一文多发（公众号+知乎+小红书+头条），AI生成不同风格版本。\n结果\n：内容产量提升5倍，全网粉丝增长10倍。\n\r\n\r\n学习教育案例（5个）\n\r\n\r\nC16\n大学生：AI辅助论文\n背景\n：毕业论文写作困难。\n方案\n：AI辅助文献综述、数据分析、格式排版。\n结果\n：论文提前1个月完成，获得优秀毕业论文。\n\r\nC17\n职场人：AI学英语\n背景\n：工作需要英语但基础差。\n方案\n：AI定制学习计划、AI对话练习、AI批改作文。\n结果\n：6个月从不敢开口到能进行工作汇报。\n\r\nC18\n程序员：AI学新技术\n背景\n：需要快速学习新技术栈。\n方案\n：AI讲解概念、AI生成示例代码、AI解答问题。\n结果\n：2周掌握新框架，顺利接手新项目。\n\r\nC19\n宝妈：AI副业变现\n背景\n：全职妈妈想利用碎片时间赚钱。\n方案\n：AI辅助写作投稿、AI生成短视频内容。\n结果\n：月收入从0到5000+，实现经济独立。\n\r\nC20\n退休人员：AI丰富生活\n背景\n：退休后想学习新技能。\n方案\n：AI教绘画、AI教摄影、AI陪伴聊天。\n结果\n：生活充实，还开了自己的公众号分享退休生活。\n\r\n\r\n核心启示\n：以上20个案例的共同点：1）AI做初稿/辅助，人做优化/决策；2）效率提升3-10倍；3）质量不降反升；4）人机协作是未来工作方式。\n\r\n\r\n\r\n白驹 ccowork · AI实战案例库 · 持续更新","站内·行业实战手册":"# 行业实战手册\n\nccowork · 行业实战手册 · 白驹 ccowork\n\r\n \r\n \n\r\n\r\n白驹 ccowork\n&larr; 返回总站\n\r\n\r\n \n10大行业实战\n\r\n \n行业实战\n手册\n\r\n \n10大行业的AI落地场景、推荐工具和实战技巧\n\r\n\r\n\r\n\r\n行业实战手册\n\r\n\r\n01\n电商行业\n核心场景\n：产品描述优化、客服自动回复、用户评价分析、竞品监控、营销文案生成。\n推荐工具\n：DeepSeek、ChatGPT、Midjourney、Canva AI。\n实战技巧\n：用AI生成10版产品描述进行A/B测试；用AI分析差评找出产品改进点；用AI生成节日营销文案。\n\r\n02\n教育行业\n核心场景\n：课程大纲设计、练习题生成、作文批改、个性化学习方案、教学PPT制作。\n推荐工具\n：Kimi（长文档）、DeepSeek、Gamma（PPT）、Quizlet。\n实战技巧\n：用AI把教材转化为思维导图；用AI生成不同难度的练习题；用AI分析学生作业找出共性问题。\n\r\n03\n医疗行业\n核心场景\n：病历摘要、医学文献翻译、患者教育材料、随访提醒、健康科普内容。\n推荐工具\n：DeepSeek、Claude（长文档）、Consensus（论文搜索）。\n注意\n：AI不能替代医生诊断，仅用于辅助和信息整理。\n\r\n04\n法律行业\n核心场景\n：合同审查、法律文书起草、案例检索、法规解读、尽职调查报告。\n推荐工具\n：DeepSeek、Claude、Elicit（文献检索）。\n注意\n：AI生成法律文书需律师审核，不构成法律意见。\n\r\n05\n金融行业\n核心场景\n：研报摘要、数据分析、风险评估报告、客户沟通话术、合规审查。\n推荐工具\n：DeepSeek、ChatGPT、Excel Copilot。\n实战技巧\n：用AI快速阅读100页研报提取要点；用AI生成客户沟通邮件模板。\n\r\n06\n制造业\n核心场景\n：设备维护手册、生产流程优化、质量检测报告、供应链分析、安全操作规程。\n推荐工具\n：DeepSeek、ChatGPT、Notion AI。\n实战技巧\n：用AI将英文设备手册翻译成中文并摘要；用AI分析生产数据找出瓶颈。\n\r\n07\n媒体行业\n核心场景\n：新闻稿写作、选题策划、标题优化、内容分发、舆情分析。\n推荐工具\n：DeepSeek、ChatGPT、Perplexity（搜索）。\n实战技巧\n：用AI生成10个标题进行测试；用AI监控行业热点。\n\r\n08\n房地产行业\n核心场景\n：房源描述、市场分析报告、客户跟进话术、合同起草、政策解读。\n推荐工具\n：DeepSeek、ChatGPT。\n实战技巧\n：用AI生成个性化房源推荐邮件；用AI分析区域房价趋势。\n\r\n09\n餐饮行业\n核心场景\n：菜单设计、营销文案、顾客评价回复、运营数据分析、新菜品研发灵感。\n推荐工具\n：DeepSeek、ChatGPT、Midjourney（菜品图）。\n实战技巧\n：用AI回复大众点评评价；用AI生成节日促销文案。\n\r\n10\n公务员/事业单位\n核心场景\n：公文写作、政策解读、工作总结、调研报告、会议纪要。\n推荐工具\n：DeepSeek、Kimi、WPS AI。\n实战技巧\n：用AI起草通知/报告初稿；用AI整理调研数据；用AI检查公文格式。\n\r\n\r\n通用原则\n：无论哪个行业，AI应用的核心逻辑都是：找到重复性高、规则明确、耗时长的环节，用AI提效，人专注于需要判断力、创造力、情感交流的核心环节。\n\r\n\r\n\r\n白驹 ccowork · 行业实战手册 · 持续更新","站内·FAQ五十问":"# FAQ五十问\n\nccowork · AI常见问题50问 · 白驹 ccowork\n\r\n \r\n \n\r\n\r\n白驹 ccowork\n&larr; 返回总站\n\r\n\r\n \nFAQ 50问\n\r\n \nAI常见问题\n50问\n\r\n \n从入门到进阶，解答你最关心的50个AI问题\n\r\n\r\n\r\n\r\n基础问题（10问）\n\r\n\r\nQ01\nAI会取代我的工作吗？\nAI不会取代你，但会用AI的人会取代不会用AI的人。关键是把AI变成工具而非对手。\n\r\nQ02\n没有编程基础能学AI吗？\n完全可以。使用AI工具（对话、绘画、写作）不需要编程。只有开发AI应用才需要编程。\n\r\nQ03\n哪个AI工具最好？\n没有「最好」，只有「最适合」。中文场景推荐DeepSeek/Kimi，英文推荐ChatGPT/Claude，绘画推荐Midjourney/SD。\n\r\nQ04\nAI生成的内容可以商用吗？\n视平台条款而定。Midjourney付费版可商用，Stable Diffusion开源可商用，ChatGPT生成内容版权归用户。建议查看具体平台条款。\n\r\nQ05\nAI会泄露我的隐私吗？\n主流平台都有隐私政策，但建议不要输入敏感个人信息（身份证号、密码、商业机密）。本地部署的模型（如Ollama）完全私密。\n\r\nQ06\nAI的回答总是不准确怎么办？\n1）优化提示词（更具体、给示例）；2）要求AI展示推理过程；3）多轮追问修正；4）关键信息人工核实。\n\r\nQ07\nAI生成的内容查重率高吗？\nAI生成内容原创性高，但建议加入个人见解和案例，避免纯AI生成导致的同质化。\n\r\nQ08\n如何写出好的提示词？\n核心三要素：角色设定（你是谁）+任务描述（要做什么）+输出要求（格式/长度/风格）。多迭代优化。\n\r\nQ09\nAI工具收费吗？\nDeepSeek/Kimi/文心一言有免费额度；ChatGPT Plus $20/月；Midjourney $10/月起；Stable Diffusion开源免费。\n\r\nQ10\n手机上能用AI吗？\n可以。DeepSeek/ChatGPT/Kimi都有App或网页版，手机浏览器直接使用。\n\r\n\r\n进阶问题（10问）\n\r\n\r\nQ11\n什么是RAG？\n检索增强生成（Retrieval-Augmented Generation），让AI结合你的私有数据回答问题。常用于企业知识库。\n\r\nQ12\n什么是AI Agent？\n能自主完成多步骤任务的AI系统。如：自动查资料写报告发邮件，全程无需人工干预。\n\r\nQ13\n本地部署和云端API哪个好？\n云端API：开箱即用、性能强、按量付费；本地部署：数据私密、无网络依赖、长期使用成本低。根据需求选择。\n\r\nQ14\n如何搭建个人知识库？\n1）收集资料（文档/网页/笔记）；2）用FastGPT/Dify搭建RAG系统；3）上传资料；4）开始问答。\n\r\nQ15\nAI绘画如何避免侵权？\n1）使用正版授权的模型；2）不直接模仿特定艺术家风格；3）商用前确认平台条款；4）必要时咨询法律人士。\n\r\nQ16\nAI能帮我写论文吗？\nAI可辅助文献综述、数据分析、语言润色，但核心观点和论证必须原创。直接提交AI生成论文属于学术不端。\n\r\nQ17\n如何选择大模型？\n中文选DeepSeek/Kimi，英文选GPT-4/Claude，长文档选Kimi/Claude，推理选DeepSeek R1，开源选Qwen/Llama。\n\r\nQ18\nAI训练需要多少数据？\n个人使用：不需要训练，直接用现成模型；微调：几百到几千条数据；从头训练：需要海量数据+算力，个人不建议。\n\r\nQ19\nAI的未来发展趋势？\n多模态（文本+图像+视频+音频）、Agent化（自主完成任务）、个性化（定制模型）、边缘化（终端设备运行）。\n\r\nQ20\n如何跟上AI发展？\n1）关注AI领域KOL；2）定期试用新工具；3）加入AI社群交流；4）阅读本书持续更新的内容。\n\r\n\r\n更多问题？\n FAQ持续更新中。如果你有其他问题，欢迎在公众号留言，我们会定期整理补充。\n\r\n\r\n\r\n白驹 ccowork · AI常见问题50问 · 持续更新","站内·AI安全指南":"# AI安全指南\n\nccowork · AI安全指南 · 白驹 ccowork\n\r\n \r\n \n\r\n\r\n白驹 ccowork\n&larr; 返回总站\n\r\n\r\n \n安全与防护\n\r\n \nAI安全\n指南\n\r\n \n8大AI安全风险与防护策略，保护你的数据和隐私\n\r\n\r\n\r\n\r\nAI安全风险与防护指南\n\r\n\r\n01\n数据隐私泄露\n风险\n：在云端AI输入敏感信息（密码、商业机密、个人隐私）可能被记录或泄露。\n防护\n：1）敏感信息脱敏后再输入；2）使用本地部署模型（Ollama）；3）阅读平台隐私政策；4）定期删除聊天记录。\n\r\n02\nAI生成虚假信息\n风险\n：AI可能生成看似真实但完全错误的信息（幻觉）。\n防护\n：1）关键信息人工核实；2）要求AI提供信息来源；3）交叉验证多个AI的回答；4）对专业领域保持怀疑。\n\r\n03\n深度伪造（Deepfake）\n风险\n：AI伪造的音频/视频可能被用于诈骗、诽谤。\n防护\n：1）对可疑音视频保持警惕；2）通过其他渠道验证；3）使用数字水印技术；4）不随意分享个人生物特征信息。\n\r\n04\n提示词注入攻击\n风险\n：恶意用户通过精心构造的输入，让AI执行非预期操作（如泄露系统提示词）。\n防护\n：1）不在提示词中包含敏感信息；2）对用户输入进行过滤；3）使用系统级提示词隔离用户输入。\n\r\n05\n模型投毒\n风险\n：攻击者在训练数据中注入恶意样本，影响模型行为。\n防护\n：1）使用可信来源的模型；2）对模型输出进行监控；3）定期更新模型版本。\n\r\n06\nAI依赖症\n风险\n：过度依赖AI导致自身能力退化。\n防护\n：1）保持独立思考习惯；2）AI做初稿，人做优化；3）定期进行无AI工作训练；4）培养AI无法替代的能力。\n\r\n07\n版权侵权\n风险\n：AI生成内容可能侵犯他人版权，或自己的内容被AI训练使用。\n防护\n：1）商用前确认平台版权条款；2）不直接复制AI生成内容；3）使用原创内容训练；4）关注AI版权法规动态。\n\r\n08\n算法偏见\n风险\n：AI可能基于有偏见的训练数据做出歧视性判断。\n防护\n：1）对AI决策保持批判性思维；2）重要决策人工复核；3）关注AI系统的公平性审计报告。\n\r\n\r\n核心原则\n：AI是强大的工具，但工具本身无善恶。关键在于使用者的判断力和责任感。在享受AI便利的同时，永远保持警惕和独立思考。\n\r\n\r\n\r\n白驹 ccowork · AI安全指南 · 持续更新","站内·本地部署手册":"# 本地部署手册\n\nccowork · 本地部署手册 · 白驹 ccowork\n\r\n \r\n \n\r\n\r\n白驹 ccowork\n&larr; 返回总站\n\r\n\r\n \n本地AI部署\n\r\n \n本地部署\n手册\n\r\n \nOllama、Stable Diffusion等本地AI工具的完整部署指南\n\r\n\r\n\r\n\r\n本地AI部署完全指南\n\r\n\r\n01\n为什么要本地部署？\n隐私安全\n：数据不出本地，完全私密。\n离线可用\n：无网络也能使用。\n零成本\n：一次部署，永久免费（除电费）。\n定制化\n：可微调、可扩展、完全掌控。\n\r\n02\nOllama：最简单的方式\n安装\n：curl -fsSL https://ollama.ai/install.sh | sh\n运行模型\n：ollama run qwen2.5:1.5b\n常用模型\n：qwen2.5（中文好）、llama3.1（英文好）、deepseek-r1（推理强）\nAPI调用\n：默认端口11434，兼容OpenAI格式。\n\r\n03\nLM Studio：图形界面\n特点\n：无需命令行，图形界面操作。\n功能\n：模型下载管理、聊天界面、API服务器、性能监控。\n适合\n：完全不懂命令行的小白用户。\n下载\n：lmstudio.ai\n\r\n04\nStable Diffusion WebUI\n功能\n：本地AI绘画，文生图、图生图、 inpainting、模型训练。\n安装\n：git clone https://github.com/AUTOMATIC1111/stable-diffusion-webui\n要求\n：NVIDIA显卡（6GB+显存推荐）\n模型站\n：civitai.com、liblib.art\n\r\n05\nComfyUI：节点式工作流\n特点\n：可视化节点编辑，灵活度高，可复现。\n优势\n：适合复杂工作流，可分享配置。\n社区\n：大量开源工作流可直接使用。\n适合\n：有一定基础的进阶用户。\n\r\n06\n硬件要求参考\n最低配置\n：8GB内存 + 核显  可运行1.5B模型\n推荐配置\n：16GB内存 + RTX 3060 12GB  流畅运行7B模型\n高端配置\n：32GB内存 + RTX 4090 24GB  可运行13B+模型\nMac用户\n：M1/M2/M3芯片，统一内存架构适合AI推理。\n\r\n07\n常见问题\nQ：本地模型效果比云端差？\nA：小模型（1.5B-7B）确实不如云端大模型，但隐私和成本优势明显。\nQ：需要什么显卡？\nA：NVIDIA显卡最佳，AMD次之，Intel核显也能跑小模型。\nQ：模型文件多大？\nA：1.5B约1GB，7B约4GB，13B约8GB，70B约40GB。\n\r\n08\n推荐学习路径\n第一步\n：安装Ollama，运行qwen2.5:1.5b体验\n第二步\n：尝试不同模型，找到适合自己的\n第三步\n：学习API调用，集成到自己的应用\n第四步\n：尝试Stable Diffusion本地绘画\n第五步\n：探索模型微调（可选进阶）\n\r\n\r\n核心建议\n：本地部署是AI进阶的必经之路。从Ollama开始，逐步探索，你会发现一个完全不受限的AI世界。\n\r\n\r\n\r\n白驹 ccowork · 本地部署手册 · 持续更新","站内·模型横评":"# 模型横评\n\nccowork · 2026 全球大模型对比 · 白驹 ccowork\n \n \n \n白驹 ccowork\n \n \n返回首页\n \n大模型对比\n \nAI 编年史\n \n格局总览\n \nDeepSeek 时刻\n \n横向对比\n \n选型建议\n \n \n教程视频\n \nAI赚钱\n \n作品大全\n \n \n2025 · GLOBAL LLM LANDSCAPE\n \n2026 全球大模型对比\n白驹 ccowork\n \n2025 是 AI 大模型格局被彻底重写的一年：OpenAI、Anthropic、Google 三强发布新一代前沿模型，\n 而以 DeepSeek 为首的中国力量凭借「开源 + 极致性价比」首次真正跻身全球第一梯队——\n 顶级智能不再昂贵，选择权回到每一个创作者手中。\n \n \n3\n海外前沿实验室\n \n7+\n国产第一梯队\n \n1/10\n国产价格量级\n \n2025\n格局重塑之年\n \n \n \nChapter 01\n \n格局总览：三强领跑，国产并进\n \n截至 2025 年底，全球大模型竞争进入「双极时代」：海外由 OpenAI、Anthropic、Google 三足鼎立，\n 国产则以 DeepSeek 为旗手、阿里、智谱、月之暗面、字节、百度群雄并起。最强通用能力仍属海外，但国产在\n \n中文、推理、性价比、开源生态\n 四个战场实现了实质性超车。\n \n \n 海外三强 · 最新一代\n \n \n \n01\n \n\n \nOpenAI · GPT-5 系列\n \n2025 年 8 月发布 GPT-5，随后 11 月迭代至 \nGPT-5.1 / GPT-5.2\n。通用能力与 Agent 智能体综合最强，\n 在 SuperCLUE 中文年度测评中夺冠。默认深度推理（thinking），可调节思考强度，代码与多模态（图像/语音）领先。\n \n闭源 · 综合最强 · Agent 旗舰\n \n \n \n02\n \n\n \nAnthropic · Claude 系列\n \n2025 年 11 月发布 \nClaude Opus 4.5\n 与 Sonnet 4.5。以\n长上下文（1M token）、代码工程、Agentic Coding\n 见长，\n 是开发者写代码、构建智能体的首选。写作风格细腻克制，长文档处理能力一骑绝尘。\n \n闭源 · 代码/长文 · 企业最爱\n \n \n \n03\n \n\n \nGoogle · Gemini 2.5 / 3\n \n2025 年 3 月发布 \nGemini 2.5 Pro\n，年底推出 \nGemini 3 Pro\n。拥有\n百万级上下文\n与最强的原生多模态能力（原生图像/视频/音频理解），\n 深度绑定 Google 生态，是「读图读视频 + 长报告」场景的利器。\n \n闭源 · 多模态最强 · 百万上下文\n \n \n \n 国产第一梯队 · 最新一代\n \n \n \n\n \nDeepSeek · V3.1 / R1\n开源\n \n2025 年 1 月 \nR1\n 引爆全球，8 月升级 \nV3.1 / V3.2\n。混合专家（MoE）架构，671B 总参数、37B 激活，\n 推理、代码、数学对标顶尖闭源，成本仅为其零头，是「极致性价比 + 完全开源」的代名词。\n \n开源 · 性价比之王 · 国产旗手\n \n \n \n\n \n阿里 · Qwen3\n开源\n \n2025 年 4 月发布 \nQwen3\n 全家族（含 235B-A22B MoE 旗舰），支持「思考/非思考」双模式切换，\n 开源权重 + 阿里云百炼生态，是国产开源生态最完整、最受开发者欢迎的底座之一。\n \n开源 · 生态最全 · 双模式\n \n \n \n\n \n智谱 · GLM-4.5 / GLM-5\n开源\n \n2025 年迭代至 \nGLM-4.6 / GLM-5\n，主打「Agentic」能力与自主智能体（AutoGLM），\n 在中文理解、工具调用、端侧智能（手机/眼镜）落地领先，是「模型即智能体」路线的重要玩家。\n \n开源 · 智能体 · 中文强\n \n \n \n\n \n月之暗面 · Kimi K2\n开源\n \n2025 年 7 月发布 \nKimi K2\n，以「长上下文 + 强 Agent」著称，1T 参数稀疏模型，\n 在代码与数学基准上对标全球最前列，同时 Kimi 对话产品以「超长文本阅读」占据用户心智。\n \n开源 · 长上下文 · 强 Agent\n \n \n \n\n \n字节 · 豆包 / 深度思考\n \n2025 年豆包大模型（Doubao）持续迭代，依托抖音/飞书生态用户量领先，\n豆包 App 长期霸榜\n，\n 主打对话体验、多模态与「深度思考」推理，是 C 端用户规模最大的国产模型之一。\n \n闭源 · C 端第一 · 多模态\n \n \n \n\n \n通义 / 文心\n \n阿里 \n通义千问\n（Qwen 开源线的商业化闭环）与百度 \n文心大模型\n（2025 年升级文心 5.0、开源文心 ERNIE）持续进化，\n 背靠搜索与云生态，在中文知识、企业落地、检索增强（RAG）场景积累深厚。\n \n中文知识 · 企业落地\n \n \n \n \nChapter 02\n \nDeepSeek 时刻：2025 的「斯普特尼克时刻」\n \n2025 年 1 月，一家中国小公司用一次开源，改写了全球 AI 的叙事逻辑——它证明：\n顶级智能，可以不靠天价算力堆出来。\n \n \n \n \n2025.01 · R1 引爆全球\n \n开源推理模型 DeepSeek-R1 发布\n \nR1 以「纯强化学习训练出思维链」的技术路径，在数学、代码、推理上对标 OpenAI o1，却把权重完全开源。\n 发布后 App 登顶美区 App Store 免费榜，被全球媒体称为中国 AI 的「斯普特尼克时刻」，一夜震动硅谷与华尔街。\n \n \n \n极低训练成本 · 约 560 万美元\n \n用「算法创新」替代「算力堆料」\n \nV3 以 MoE（混合专家）架构 + 671B 总参数、37B 激活参数，配合 Multi-Head Latent Attention、FP8 混合精度等工程创新，\n 以远低于同行的训练成本，达到逼近 GPT-4 级的能力——打破了「大模型必须烧几百亿美元」的固有认知。\n \n \n \n开源 + 白菜价 API\n \n把推理成本打下一个数量级\n \nR1/V3 的 API 价格仅为主流闭源模型的十分之一量级，且完全开放权重、可本地部署。全球开发者与创作者第一次\n 能以「几块钱」跑出「几十美元」的效果，AI 民主化从此真正落地。\n \n \n \n意义 · 国产首次跻身第一梯队\n \n从「追赶者」到「定义规则者」\n \nDeepSeek 的意义不止于一个模型：它证明开源路线能跑赢闭源叙事，倒逼 OpenAI、Google 等巨头降价、开源；\n 更重要的是——它让「国产大模型」第一次在全球能力榜上与顶尖实验室同台，并凭借「便宜一个数量级」占据生态位。\n \n \n \n \nChapter 03\n \n横向对比：一张表看清全局\n \n以「能力 × 价格 × 开放度」三个维度横向对比主流旗舰。价格单位为 \n美元 / 每百万 token 量级\n（2025 年底公开定价，输入/输出），\n 实际以官方最新价格为准；国产模型普遍便宜一个数量级。\n \n \n \n \n \n模型\n \n通用能力\n \n推理\n \n代码\n \n中文\n \n价格（$ / 1M token）\n \n开源/闭源\n \n多模态\n \n上下文\n \n \n \nGPT-5.1\n\n\n\n\n \n≈ $1.25 / $10\n闭源\n图像 / 语音\n400K\n \n \n \nClaude Opus 4.5\n\n\n\n\n \n≈ $5 / $25\n闭源\n图像\n1M\n \n \n \nGemini 3 Pro\n\n\n\n\n \n≈ $2 / $12\n闭源\n原生全模态\n1M+\n \n \n \nDeepSeek V3.1 / R1\n\n\n\n\n \n≈ $0.3 / $1.5\n开源\n文本为主\n128K\n \n \n \nQwen3（235B-A22B）\n\n\n\n\n \n≈ $0.3 / $0.9\n开源\n图像 / 视频\n128K\n \n \n \nGLM-5\n\n\n\n\n \n≈ $0.3 / $0.9\n开源\n图像 / 视频\n128K\n \n \n \nKimi K2\n\n\n\n\n \n≈ $0.4 / $1.2\n开源\n文本为主\n128K\n \n \n \n豆包（Doubao）\n\n\n\n\n \n≈ $0.1 / $0.3\n闭源\n图像 / 视频 / 语音\n256K\n \n \n \n \n \n \n\n \n2025 全球中文大模型榜单\n \n海外巨头（GPT-5 / Claude / Gemini）包揽综合前三，但\n国产在中文、推理、代码、性价比等细分领域超车\n；\n DeepSeek 稳居「开源模型」榜首，Qwen、GLM、Kimi 紧随其后。\n \n \n \n\n \nSuperCLUE 2025 年度测评\n \n国内权威中文基准：\nGPT-5.1 综合夺冠，DeepSeek 为开源模型第一\n，\n 在中文理解与推理上国产模型已与海外顶配「贴身肉搏」，性价比维度大幅领先。\n \n \n \n\n \nGaia2 Agent Leaderboard\n \n面向智能体的权威评测中，GPT-5 与 Claude 领跑，\nDeepSeek 等开源模型表现亮眼\n——\n 「全球前五已有两款中国造，且便宜一个数量级」成为 2025 年最常被引用的判断。\n \n \n \n \nChapter 04\n \n给创作者 / 个人 IP 的选型建议\n \n没有「最好」的模型，只有「最合适」的模型。选型公式：\n任务匹配 × 单次成本 × 隐私与可控性\n。\n \n \n \n \n\n \n长文写作 / 中文创作  DeepSeek / 豆包\n \n写公众号、小红书、知乎、小说、脚本，中文语感和成本是首要考量。DeepSeek V3.1 与 R1 的中文写作质量顶配、价格白菜，\n 豆包 C 端体验顺滑、多模态辅助出图，是个人 IP 量产内容的黄金组合。\n \n性价比首选\n \n \n \n\n \n写代码 / 构建工具  Claude / DeepSeek\n \n复杂工程、Agentic Coding、长代码库重构首选 Claude（Opus/Sonnet 4.5）；预算有限、需要海量生成时用 DeepSeek / Kimi K2 做主力，\n Claude 做关键模块精修，二者搭配能省 80% 成本。\n \n工程能力优先\n \n \n \n\n \n读图 / 读视频 / 多模态  Gemini / GPT-5\n \n要理解图片、视频、音频并产出结构化内容（如视频拆解、海报分析、长报告），Gemini 原生多模态 + 百万上下文最强；\n GPT-5 则胜在「多模态 + Agent 工具调用」的综合场景。\n \n多模态首选\n \n \n \n\n \n深度推理 / 选题策划  DeepSeek-R1\n \n需要「想清楚」的活——选题分析、剧情逻辑校验、商业策划、数学推导，R1 的思维链推理几乎免费，效果对齐 OpenAI 同档；\n 追求极限 Agent 能力再上 GPT-5。\n \n推理质价比\n \n \n \n 性价比怎么算\n \n \n \n\n \n算单篇成本，不算「月费幻觉」\n \n一篇 2000 字文章约消耗 6~8K token。用 GPT-5 约 ¥0.5，用 DeepSeek 约 ¥0.05——差距 10 倍。\n 高频产出时，选对模型一个月能省出几百上千元。\n \n \n \n\n \n「强模型定调 + 便宜模型量产」\n \n用贵模型打磨模板、定风格、审关键稿，用国产模型跑批量初稿与改写。80% 的活儿交给便宜模型，20% 的精品交给顶配。\n \n \n \n\n \n善用缓存与长上下文复用\n \n把「设定文档 / 风格参考 / 产品知识库」固定放在上下文里命中缓存，DeepSeek 缓存命中价格再降一个量级，\n 长文档场景直接选 128K+ 上下文模型，省去反复拼接的隐性成本。\n \n \n \n 自部署 vs 云 API\n \n \n \n\n \n开源 + 本地自部署\n \n适合\n：隐私敏感数据、稳定可控、长期高频、有硬件/技术能力的创作者与团队。\n \n路径\n：Ollama / vLLM 拉取 DeepSeek、Qwen3 蒸馏版（7B~70B）跑本地，或租 GPU 部署满血版；\n 数据不出本机，边际成本趋近于零，但需承担硬件与维护成本。\n \n隐私 + 长期成本\n \n \n \n\n \n云 API / 官方服务\n \n适合\n：快速上手、弹性用量、需要最新最强模型的创作者。\n \n路径\n：DeepSeek 官方 API（兼容 OpenAI 格式）、阿里云百炼（Qwen3）、硅基流动等平台统一接入多家开源模型；\n 零维护、按量付费，是「个人 IP 起步」的最优解。\n \n零维护 + 弹性\n \n \n \n \n 一句话选型清单\n \n \n写作量产\n  DeepSeek / 豆包 | \n写代码\n  Claude + DeepSeek | \n \n多模态\n  Gemini / GPT-5 | \n深度推理\n  DeepSeek-R1 | \n \n隐私自部署\n  Qwen3 / DeepSeek 蒸馏版 | \n极客省钱\n  开源 + 缓存命中\n \n \n \n白驹 ccowork\n \n<i class=\"cc-ic cc-back\" data-ic=\"arrow-left\"></i> 返回首页\n · 2026 全球大模型对比 · 由 AI 协同创作 · 2026\n \n数据与结论参考：\nSuperCLUE 2025 年度测评\n ·\n \n2025 全球中文大模型榜单\n ·\n \nGaia2 Leaderboard\n ·\n 各厂商官方定价。价格为量级参考，请以官方最新为准。","站内·AI前沿全景":"# AI前沿全景\n\nccowork · AI 前沿全景 · 前辈成果展示\n \n \n \nAI 前沿全景\n \n \n首页\n \n研究方向\n \n前辈成果\n \n大事记\n \n \n教程视频\n \nAI赚钱\n \n作品大全\n \n \nAI 前沿全景 · 前辈成果展示\n \n站在巨人的肩膀上\n看见 AI 的下一程\n \n这是一份写给后来者的「AI 前沿地图」。它带你扫一遍当下最热的研究方向，\n 认识那些亲手把 AI 推到今天的前辈，再对一对 2025–2026 年正在发生的里程碑。\n 读懂它，你就不再只是\"用 AI 的人\"，而是能看懂 AI 走向的人。\n \n \n开始探索\n \n致敬前辈\n \n看大事记\n \n \n \n13\n大前沿方向\n \n10\n位前辈人物\n \n10\n个里程碑\n \n75\n年 AI 历程\n \n \n \nResearch Landscape\n \nAI 研究所有方向\n \nAI 不是\"一个大模型\"，而是一片正在同时爆发的战场。下面 13 个方向，每个都值得你记住一句话，以及它在 2025 年最值得关注的代表进展。\n \n \n \n \n\n \n大语言模型与推理模型\n \n用海量文本预训练出的通用语言引擎，叠加「思维链」逐步推理能力，构成所有 AI 应用的大脑。写作、代码、对话、分析都从这里来。\n \n2025：DeepSeek-R1 / GPT-5 / Claude / Gemini 3 / Qwen3 / Kimi / GLM\n \n \n \n\n \n多模态\n \n让模型像人一样同时\"看懂\"文字、图像、音频与视频，在多种信息之间对齐、交叉理解与推理。\n \n2025：GPT-5 原生多模态 · Gemini 3 视觉推理\n \n \n \n\n \n图像生成\n \n文本转图像的扩散模型，从海报、封面到商业设计一应俱全，文字渲染与可控性逐年跃升。\n \n2025：即梦 / Midjourney / Flux / 混元图像迭代\n \n \n \n\n \n视频生成\n \n文生视频 / 图生视频，让静态画面动起来，并保持物理一致与连贯叙事，是当下最卷的赛道。\n \n2025：Sora 2 · 可灵 · 即梦 · Runway · Veo\n \n \n \n\n \n语音与音乐\n \n语音合成、声音克隆、实时语音对话与音乐生成，让 AI 拥有\"嗓音\"，成为多模态交互的标配。\n \n2025：ElevenLabs · Suno · 实时语音模型\n \n \n \n\n \n具身智能与机器人\n \n给 AI 一副\"身体\"，让它能感知环境、规划动作、在真实物理世界完成任务。\n \n2025：Figure Helix · 特斯拉 Optimus · 商汤开悟 3.0\n \n \n \n\n \n世界模型\n \n学习世界的运行规律，预测\"下一步会发生什么\"，被视为大语言模型之后的第二场革命。\n \n2025：Sora / Genie / 开悟世界模型 · 李飞飞提出分类法\n \n \n \n\n \n强化学习\n \n通过试错与奖励信号学习最优策略，是推理模型与机器人控制背后共同的\"教练\"。\n \n2025：大规模 RL（GRPO）催生 R1 级自我反思\n \n \n \n\n \nAI for Science\n \n用 AI 加速科学发现：破解蛋白质结构、预报天气、发现新材料，让科研周期从十年缩到数月。\n \n2025：AlphaFold3 · GenCast 天气 · 材料发现\n \n \n \n\n \nAI Agent 智能体\n \n能自主规划、调用工具、多步执行并自我纠错的 AI 系统，让模型从\"会聊天\"走向\"会办事\"。\n \n2025：被称「Agent 元年」· 智能体编程全面落地\n \n \n \n\n \n开源生态\n \n开放权重与开放工具链，让顶尖能力不再被少数公司垄断，AI 因此走向民主化。\n \n2025：中国开源霸榜 · 下载量超美国\n \n \n \n\n \n芯片与算力\n \nAI 的物理底座：没有 GPU 集群与数据中心，再聪明的算法也无处安放。\n \n2025：英伟达 Blackwell · 推理成本降至 1/35\n \n \n \n\n \nAI 安全与对齐\n \n让越来越强大的 AI 与人类价值观对齐，可控、可解释、可问责，是 AI 能走多远的前提。\n \n2025：红队测试 · 可解释性 · 全球 AI 治理立法\n \n \n \n \nHall of Pioneers\n \n前辈成果展示\n \n今天每一行模型代码，都站在前人的肩膀上。先看一条从图灵到 DeepSeek 的里程碑长河，再认识十位亲手改写历史的前辈。\n \n \nMilestones · 一条时间线\nAI 发展里程碑\n \n \n1950\n图灵提问「机器能思考吗」\n艾伦·图灵发表《计算机器与智能》，提出「图灵测试」，为\"机器智能\"立下第一根标尺。\n \n1956\n达特茅斯会议\n麦卡锡、明斯基等人在达特茅斯提出「人工智能」一词，AI 作为一门学科正式诞生。\n \n1960s–1980s\n专家系统\n把专家知识写成规则（MYCIN、XCON），AI 迎来第一次产业化浪潮，也经历\"AI 寒冬\"的沉淀。\n \n1986–2012\n深度学习奠基\n反向传播与卷积神经网络被提出，辛顿、LeCun、Bengio 三巨头在质疑中坚守，为复兴埋下火种。\n \n2012\nImageNet 时刻\nAlexNet 以深度学习大幅刷新图像识别纪录，点燃深度学习革命，GPU 算力成为主角。\n \n2017\nTransformer 诞生\nGoogle 提出「注意力即一切」，Transformer 架构成为几乎所有现代大模型的共同底座。\n \n2016\nAlphaGo 击败李世石\nDeepMind 的 AlphaGo 战胜人类围棋冠军，深度强化学习征服了\"直觉\"的最后堡垒。\n \n2020\nAlphaFold 破解蛋白质折叠\nAlphaFold2 高精度预测蛋白质结构，开创「AI for Science」新纪元，2024 年摘得诺贝尔化学奖。\n \n2022\nChatGPT 横空出世\nOpenAI 发布对话大模型，两个月破亿用户，把生成式 AI 从实验室带进千家万户。\n \n2025\n「DeepSeek 时刻」\nDeepSeek-R1 以开源 + 极致性价比震动全球，中国 AI 迎来自己的\"斯普特尼克时刻\"，开源格局被彻底改写。\n \n \nPeople · 人物成就卡\n十位前辈 · 一人一句核心贡献\n \n \n\n艾伦·图灵\nAlan Turing · 计算理论之父\n提出图灵机与图灵测试，用「机器能否思考」定义了人工智能这门学问的起点。\n \n\n马文·明斯基\nMarvin Minsky · AI 先驱\n1956 达特茅斯会议发起人之一，MIT 人工智能实验室创始人，把\"让机器思考\"变成一门工程。\n \n\n杰弗里·辛顿\nGeoffrey Hinton · 深度学习之父\n反向传播与神经网络奠基人，几十年如一日坚持，让深度学习成为主流，获 2024 诺贝尔物理学奖。\n \n\n杨立昆\nYann LeCun · CNN 之父\n发明卷积神经网络（CNN），让机器\"看懂\"图像，现任 Meta 首席 AI 科学家。\n \n\n约书亚·本吉奥\nYoshua Bengio · 深度学习三巨头\n在语言建模与生成模型上作出奠基贡献，如今是最坚定的 AI 安全倡导者之一。\n \n\n李飞飞\nFei-Fei Li · ImageNet 之母\n建立 ImageNet 数据集，直接引爆 2012 深度学习革命，如今倡导\"空间智能\"的新方向。\n \n\n黄仁勋\nJensen Huang · 英伟达创始人\n用 GPU 为深度学习提供算力引擎，一手打造支撑整个 AI 时代的计算帝国。\n \n\n德米斯·哈萨比斯\nDemis Hassabis · DeepMind 联合创始人\n主导 AlphaGo 与 AlphaFold，把 AI 从棋局推向科学发现，获 2024 诺贝尔化学奖。\n \n\n梁文锋\nLiang Wenfeng · DeepSeek 创始人\n用开源 + 极致性价比（约 560 万美元训练成本）改写全球 AI 格局，引发\"DeepSeek 时刻\"。\n \n\n萨姆·奥特曼\nSam Altman · OpenAI 首席执行官\nChatGPT 与 GPT 系列背后的掌舵人，把生成式 AI 从演示变成席卷全球的产品时代。\n \n \n \n2025 – 2026\n \n2025–2026 大事记\n \n这两年是 AI 史上节奏最快的一段。以下关键进展，是你跟同行聊 AI 时必须对得上号的\"时事账本\"。\n \n \n \n \n2025.01\n \n「DeepSeek 时刻」引爆全球\nDeepSeek-R1 开源并以极低成本逼近顶级闭源模型，美股震荡、下载霸榜，被称为中国 AI 的\"斯普特尼克时刻\"。\n \n \n \n2025\n \n中国开源模型霸榜，下载量超美国\nHugging Face 年度回顾显示，全球前十开源模型一度有 7 款来自中国，开源模型下载量超越美国——开源格局被彻底改写。\n \n \n \n2025\n \n大模型进入\"月抛\"时代\n一个月内 GPT-5、Claude 4.1、Gemini 3、Qwen3、Kimi K2、GLM-4.5 等多款旗舰密集发布，迭代速度空前。\n \n \n \n2025.08\n \nGPT-5 正式发布\nOpenAI 推出原生多模态、更强推理的 GPT-5，标志闭源阵营进入新一轮军备竞赛。\n \n \n \n2025\n \nAI 视频爆发：Sora / 可灵 / 即梦\n文生视频与图生视频进入商业化，Sora 2、可灵、即梦、Runway、Veo 竞争白热化，单镜头物理一致性大幅提升。\n \n \n \n2025\n \nAI 天气预报超越传统模式\nDeepMind 的 GenCast / WeatherNext 以机器学习实现 15 天高精度预报，AI for Science 走向实用。\n \n \n \n2025\n \n「Agent 元年」落地\n智能体编程（Cursor、CodeBuddy）、浏览器自动化与企业级 Agent 全面落地，AI 从\"会答\"走向\"会做\"。\n \n \n \n2025\n \nAI 摘下诺贝尔奖\n辛顿获物理学奖，哈萨比斯与江珀获化学奖——AI 获得科学界最高认可，标志着 AI for Science 的成人礼。\n \n \n \n2025–2026\n \n推理成本大幅下降\n英伟达 Blackwell（GB200/B300）交付，Agent 推理性能提升约 50 倍、单位 token 成本降至约 1/35，算力进入\"性价比\"时代。\n \n \n \n2026.01\n \n国产旗舰持续冲顶\n阿里巴巴、月之暗面升级模型，通义千问 3.7 旗舰强化智能体编程能力，中国开源生态继续领跑全球。\n \n \n \n白驹 ccowork\n \nAI 前沿全景 · 前辈成果展示 · 由 AI 协同创作 · 2026\n \n<i class=\"cc-ic cc-back\" data-ic=\"arrow-left\"></i> 返回首页","站内·里程碑成果":"# 里程碑成果\n\nccowork · AI 知识网络 · 前辈成果展示\n \n \n \nAI 知识网络 · 成果展示\n \n里程碑\n前辈人物\n研究方向\n最新动态\n回主站\n \n \nKNOWLEDGE NETWORK\n \n前辈们做出的 \nAI 成果\n \n面向想系统了解 AI 的人：里程碑成果、关键人物、全部研究方向，以及持续更新的最新进展。不是教你一个人，是给所有人看的知识网。\n \n \n \n01\n里程碑成果\n \n \n1950\n \n图灵测试\n艾伦·图灵提出「机器能否思考」，定下 AI 的原点。\n \n1956\n \n达特茅斯会议\n麦卡锡、明斯基等正式提出「人工智能」一词。\n \n1997\n \n深蓝战胜卡斯帕罗夫\nIBM 的深蓝在国际象棋上击败人类世界冠军。\n \n2012\n \nAlexNet\n辛顿团队用深度学习大胜 ImageNet，点燃深度学习复兴。\n \n2014\n \nGAN 生成对抗网络\nIan Goodfellow 提出，开启生成式 AI 的路线之一。\n \n2016\n \nAlphaGo 战胜李世石\nDeepMind 的 AlphaGo 攻下围棋，震动全球。\n \n2017\n \nTransformer\nGoogle 论文《Attention Is All You Need》，成为大模型地基。\n \n2020\n \nGPT-3 / AlphaFold\nOpenAI 展现规模威力；DeepMind 破解蛋白质折叠。\n \n2022\n \nChatGPT\nOpenAI 两个月破亿用户，把 AI 变成全民工具。\n \n2023\n \nGPT-4 / Llama\n多模态与开源大模型并行爆发。\n \n2024\n \nSora / 诺奖\n视频生成破圈；辛顿、霍普菲尔德获物理诺奖，AlphaFold 团队获化学诺奖。\n \n2025\n \nDeepSeek R1\n开源推理模型震动全球，证明「高效工程」可对抗堆算力。\n \n2026\n \nV4-Pro / GPT-5.6 / Kimi K3\n新一代旗舰模型与超大规模开源模型同场竞技。\n \n \n \n \n02\n前辈人物\n \n \n艾伦·图灵\n计算机科学之父，提出图灵测试。\n奠基人\n \n约翰·麦卡锡\n「人工智能」命名者，Lisp 发明者。\n奠基人\n \n杰弗里·辛顿\n深度学习之父，2024 物理诺奖。\n深度学习\n \n杨立昆 LeCun\n卷积神经网络，2018 图灵奖。\n计算机视觉\n \n约书亚·本吉奥\n深度学习三巨头之一。\n深度学习\n \n吴恩达\n把机器学习普及给千万人。\n教育普及\n \n李飞飞\nImageNet 数据集，推动 CV 复兴。\n计算机视觉\n \n伊利亚·苏茨克维\nAlexNet 到 GPT 的核心人物之一。\n大模型\n \n山姆·奥特曼\nOpenAI 掌舵人，推动 AGI 路线。\nOpenAI\n \n戴米斯·哈萨比斯\nAlphaGo、AlphaFold，DeepMind 创始人。\nDeepMind\n \n黄仁勋\nNVIDIA 创始人，AI 算力底座。\n算力\n \n何恺明\nResNet 残差网络，影响深远。\n计算机视觉\n \nIan Goodfellow\nGAN 之父，生成式 AI 先驱。\n生成模型\n \n梁文锋\nDeepSeek 创始人，开源 + 高效工程。\nDeepSeek\n \n \n \n \n03\n研究方向全景\n \n \n自然语言处理 NLP\n让机器理解与生成语言。\n \n计算机视觉 CV\n让机器看懂图像与视频。\n \n语音识别 / 合成\n听与说，从 Whisper 到 ChatTTS。\n \n强化学习 RL\n试错学习，AlphaGo 的核心。\n \n生成式模型\nGAN、扩散模型、自回归。\n \n多模态\n图文音视频统一理解。\n \n具身智能 / 机器人\n让 AI 有「身体」去行动。\n \nAI for Science\nAlphaFold 式科研加速。\n \n因果推断\n从相关性走向因果。\n \n图神经网络\n处理图结构数据。\n \n联邦学习\n数据不出本地的协作训练。\n \nAI 安全 / 对齐\n让模型安全、可控、对齐人类。\n \n边缘 AI\n模型跑在手机、端侧设备。\n \n自动驾驶\n感知 + 决策 + 控制。\n \n基础模型\n大模型的预训练与微调。\n \nAgent / 多智能体\n自主规划与工具调用。\n \n \n \n \n04\n最新动态（2026·持续更新）\n \n \n· DeepSeek 发布 V4-Pro 正式版（0813），100 万 Token 上下文、三种思考模式。\n \n· ChatGPT 推送 GPT-5.6 全家桶；Gemini 3.7 Flash 同日对垒。\n \n· 月之暗面发布 Kimi K3，2.8 万亿参数，全球最大开源模型之一。\n \n· 中国加快《人工智能法》立法进程；美国提议与欧盟建立 AI 伙伴关系。\n \n \nAI 知识网络 · 成果展示 · 面向所有人的知识网，持续更新","站内·学习路线图":"# 学习路线图\n\nccowork · AI 学习路线图 · 从零基础到系统进阶 · 白驹 ccowork\n \n \n \n白驹 ccowork\n \n \n学习路线图\n \n返回首页\n \n成果展示\n \nAI 编年史\n \nAI 前沿全景\n \nAI 对话\n \n作品库\n \n模型对比\n \n开发者基地\n \n开源项目\n \n全书书稿\n \n工科实训\n DeepSeek 指南\n 提示词工程\n 工具全景\n \n \n教程视频\n \nAI赚钱\n \n作品大全\n \n \nAI LEARNING ROADMAP · 循序渐进 · 6 阶段\n \n零基础，也能\n照着走完的 AI 之路\n \n把站点里散落的板块串成一条循序渐进的学习路径——\n 从「认识 AI」到「会用工具」、从「学会创作」到「懂点技术」、从「动手实践」到「系统进阶」。\n 每走完一个阶段，你都有一个看得见的里程碑。\n \n \n从阶段 0 开始\n \n查看 3 个月速成计划\n \n \n \n6\n大学习阶段\n \n19\n个核心页面\n \n12\n周速成计划\n \n6\n个毕业标志\n \n \n \nSuggested Path\n \n建议路径 · 时间轴概览\n \n一条主线，六个台阶：先看全景建立认知，再上手工具，接着产出作品，然后深入原理，最后动手实践并收束成体系。点击任意节点可跳到对应阶段。\n \n \n \nSTAGE 0 · 第 1-2 周\n认识 AI —— 建立全局认知\n看前沿全景、编年史与成果展示，知道 AI 从哪来、能干什么。\n \nSTAGE 1 · 第 3-4 周\n会用工具 —— 上手对话引擎\n掌握 DeepSeek 与提示词工程，学会与 AI 高效沟通。\n \nSTAGE 2 · 第 5-6 周\n学会创作 —— 把工具变成作品\n走通视频与写作流水线，照作品库样板做出自己的第一件作品。\n \nSTAGE 3 · 第 7-8 周\n懂点技术 —— 从会用到懂原理\n读懂模型差异与开源生态，能在本地跑起开源模型。\n \nSTAGE 4 · 第 9-10 周\n动手实践 —— 把 AI 用进工科\n进入实训实验室，跑通编程、数控与仿真脚本。\n \nSTAGE 5 · 第 11-12 周\n系统进阶 —— 收束成体系\n通读全书书稿与中国科技，建立自己的 AI 世界观与判断力。\n \n \n \nSix Stages\n \n六大阶段 · 每一步都看得到终点\n \n每个阶段一张卡片：先看哪几页、为什么看它、以及学完它的标志。按顺序走，零基础也能逐级通关。\n \n \n \n \n \n \n0\n \nSTAGE 0 · 建立全局认知\n认识 AI\n \n \n先不急着动手，先建立整体认知：AI 从哪来、现在是什么格局、能做出什么。有了全局观，后面学什么都接得上。\n \n \nAI 前沿全景\n看懂当下 AI 的版图与趋势，建立全局观。\n \nAI 编年史\n了解 70 年发展脉络，知道每个里程碑为什么重要。\n \n成果展示\n看到真实成品，建立「我也能做出来」的信心。\n \n \n \n学完的标志\n：能用三句话向别人讲清楚「AI 是什么、怎么发展来的、现在能做什么」。\n \n \n \n \n \n1\n \nSTAGE 1 · 上手核心工具\n会用工具\n \n \n零基础第一步：先上手最核心的对话引擎，学会与 AI 高效沟通。这是所有后续创作的地基。\n \n \nDeepSeek 指南\n认识主力引擎的用法、版本与成本，选对使用方式。\n \n提示词工程\n背熟万能公式「角色+任务+上下文+约束」，让输出质量翻倍。\n \n工具全景\n建立「什么任务该用什么工具」的选型地图。\n \nAI 对话\n亲手体验多轮对话与深度推理，把理论变成手感。\n \n \n \n学完的标志\n：能独立用 DeepSeek 完成一次带「角色 + 任务 + 约束」的提问，并得到满意的结果。\n \n \n \n \n \n2\n \nSTAGE 2 · 产出第一件作品\n学会创作\n \n \n把工具变成作品：从脚本到成片、从提纲到成文。关键是「人机接力」——你出灵魂，AI 出血肉。\n \n \n视频剪辑\n掌握「编剧出图出视频配音剪辑」的完整链路。\n \nAI 写作\n学会人机接力，从一篇博文一路写到长文甚至小说。\n \n作品库\n拆解四件完整作品，照着样板做出自己的第一件。\n \n \n \n学完的标志\n：独立产出一件完整小作品（一支短片 / 一篇长文 / 一部短篇），并发布出去。\n \n \n \n \n \n3\n \nSTAGE 3 · 理解底层原理\n懂点技术\n \n \n从「会用」进阶到「懂原理」：能自己判断选型、能自己部署，不再人云亦云。\n \n \n模型对比\n看懂主流模型差异，学会按任务正确选型。\n \n开源项目\n认识可本地运行的开源 AI 生态，摆脱闭源依赖。\n \n开发者基地\n逐行上手 Ollama、Dify 等工具，附六周入门路线。\n \n \n \n学完的标志\n：能在本地跑起一个开源模型，并说清楚它和闭源模型的区别。\n \n \n \n \n \n4\n \nSTAGE 4 · 真实动手实践\n动手实践\n \n \n把 AI 用进工科：编程、计算机、数控、仿真，代码复制就能跑、结果可验证。这是最「硬」的一段。\n \n \n工科实训\n进入实训实验室：五大类动手清单 + 可运行脚本 + 数控 G 代码。\n \n仿真一键运行\n网页内直接跑 PID、振动、电路、抛体、蒙特卡洛，滑杆调参实时出图。\n \n \n \n学完的标志\n：至少跑通 3 个仿真脚本，并用 pytest 验证结果正确。\n \n \n \n \n \n5\n \nSTAGE 5 · 收束成体系\n系统进阶\n \n \n最后一步：把零散的知识收束成完整体系，并读懂中国科技底色，形成自己的判断力。\n \n \n全书书稿\n二十余章完整体系，从入门到研究方向，是一部 AI 百科全书。\n \n中国科技\n读懂中国科技底色，理解 DeepSeek 为什么诞生在中国。\n \n \n \n学完的标志\n：能自成体系地讲清 AI 的过去、现在与未来，并规划好自己的下一步。\n \n \n \n \n3-Month Crash Plan\n \n3 个月速成计划 · 每周学什么\n \n每周投入 3~5 小时，12 周走完全程。节奏：前四周打认知与工具基础，中间四周产作品、啃技术，最后四周动手实践、收束成体系。\n \n \n \n \n周次\n阶段\n学习内容\n产出 / 达标标志\n \n第 1 周\n阶段0\nAI 前沿全景 + AI 编年史\n能讲清 AI 是什么、从哪来\n \n第 2 周\n阶段0\n成果展示 showcase\n列出 3 个想复刻的案例\n \n第 3 周\n阶段1\nDeepSeek 指南 + AI 对话\n独立完成高质量多轮对话\n \n第 4 周\n阶段1\n提示词工程 + 工具全景\n背熟万能公式，建立工具地图\n \n第 5 周\n阶段2\n视频剪辑 + AI 写作\n产出脚本或文章初稿\n \n第 6 周\n阶段2\n作品库 works\n完成并发布第一件作品\n \n第 7 周\n阶段3\n模型对比 models\n能按任务选出合适模型\n \n第 8 周\n阶段3\n开源项目 + 开发者基地\n本地跑通一个开源模型\n \n第 9 周\n阶段4\n工科实训 lab\n跑通编程与数控示例\n \n第 10 周\n阶段4\n仿真一键运行\n3 个仿真脚本 + pytest 通过\n \n第 11 周\n阶段5\n全书书稿 book\n通读全书，建立完整体系\n \n第 12 周\n阶段5\n中国科技 china-tech\n形成自己的 AI 判断力并输出总结\n \n \n \n白驹 ccowork\n \nAI 学习路线图 · 从零基础到系统进阶 · 由 AI 协同创作 · 2026\n \n<i class=\"cc-ic cc-back\" data-ic=\"arrow-left\"></i> 返回首页","站内·开源项目":"# 开源项目\n\nccowork · 开源 AI 项目 · 内嵌整合 | 白驹 ccowork\n \n \n \n白驹 ccowork\n \n \n 返回首页\n \n本地跑模型\n \n图像视频\n \n语音\n \nAgent 工作流\n \n对话壳\n \n训练微调\n \n开发者基地\n \n \n教程视频\n \nAI赚钱\n \n作品大全\n \n \nOPEN SOURCE AI · 开箱即用\n \n开源 AI 项目 · \n内嵌整合\n \n六大类、二十余个真实可用的开源项目，全部附上正确地址与「复制就能跑」的一键命令。\n 本地免费、数据不出机，多数连显卡都不用 —— 从推理、生成到 Agent 与微调，一条龙配齐。\n \n \n6\n大类\n \n20+\n开源项目\n \n100%\n免费可本地\n \n1 行\n命令即可跑\n \n \n图例：\n \n免费\n \n可本地运行\n \n显卡：可选\n \n显卡：需要\n \n \nCategory 01 · 本地跑大模型\n \n让大模型 \n住进你的电脑\n \n无需联网、无需 API Key，权重本地跑。轻量用 Ollama 起步，追求吞吐量上 vLLM / SGLang。\n \n \n \n \n \n\n \nOllama\n推理引擎\n一行命令下载并运行本地开源大模型（Llama / Qwen / DeepSeek 蒸馏版等），门槛最低。\n \n \nGitHub\nollama/ollama\n官网 ollama.com\n \n复制\ncurl -fsSL https://ollama.com/install.sh | sh\nollama run deepseek-r1:7b\n \n最简上手\n：装好后直接 \nollama run deepseek-r1:7b\n，终端即开即聊；Windows/macOS 用官网安装包。\n \n免费\n本地\n显卡：可选（CPU 可跑）\n \n \n \n \n\n \nllama.cpp\n轻量推理\n纯 C/C++ 大模型推理引擎，GGUF 量化后几乎任何设备（含 CPU、苹果芯片）都能跑。\n \n \nGitHub\nggml-org/llama.cpp\n \n复制\ngit clone https://github.com/ggml-org/llama.cpp\ncd llama.cpp && cmake -B build && cmake --build build --config Release\n \n最简上手\n：下载 GGUF 模型后运行 \n./llama-cli -m model.gguf -p \"你好\"\n。\n \n免费\n本地\n显卡：可选（CPU 即可）\n \n \n \n \n\n \nLM Studio\n图形界面\n桌面图形应用，点几下就能搜索、下载并运行本地模型，全程无需命令行。\n \n \nGitHub\nlmstudio-ai/lms\n官网 lmstudio.ai\n \n复制\nwinget install ElementLabs.LMStudio\n \n最简上手\n：官网下载安装包  搜索模型  下载  直接对话。\n \n免费（个人）\n本地\n显卡：可选（建议独显）\n \n \n \n \n\n \nvLLM\n生产推理\n面向生产的高吞吐 LLM 推理服务引擎，兼容 OpenAI API，适合把模型部署成服务。\n \n \nGitHub\nvllm-project/vllm\n \n复制\npip install vllm\nvllm serve Qwen/Qwen2.5-7B-Instruct\n \n最简上手\n：起服务后浏览器打开 \nhttp://localhost:8000\n，用 OpenAI 兼容接口调用。\n \n免费\n本地\n显卡：需要（NVIDIA）\n \n \n \n \n\n \nSGLang\n极速推理\n新一代 LLM / VLM 推理服务框架，吞吐高、支持结构化输出，常用于生产部署。\n \n \nGitHub\nsgl-project/sglang\n \n复制\npip install \"sglang[all]\"\npython -m sglang.launch_server --model Qwen/Qwen2.5-7B-Instruct\n \n最简上手\n：起服务后按 OpenAI 兼容格式请求 \nhttp://localhost:30000/v1\n。\n \n免费\n本地\n显卡：需要（NVIDIA）\n \n \n \n \nCategory 02 · 图像 / 视频生成\n \n文生图与视频 \n开源工作流\n \nStable Diffusion 生态三大入口：经典 WebUI、节点式 ComfyUI、专业工作室 InvokeAI，任选其一即可出图。\n \n \n \n \n \n\n \nSD WebUI\n经典文生图\nAUTOMATIC1111 出品的 Stable Diffusion Web 界面，生态最全、教程最多、插件最丰富。\n \n \nGitHub\nAUTOMATIC1111\n \n复制\ngit clone https://github.com/AUTOMATIC1111/stable-diffusion-webui\ncd stable-diffusion-webui && ./webui.sh\n \n最简上手\n：把模型放进 \nmodels\n 目录  启动  浏览器打开 \n127.0.0.1:7860\n。\n \n免费\n本地\n显卡：需要（NVIDIA 推荐）\n \n \n \n \n\n \nComfyUI\n节点工作流\n节点式图像 / 视频生成引擎，可控性最强，适合搭复杂管线（SD / Flux 等）。\n \n \nGitHub\ncomfyanonymous/ComfyUI\n \n复制\ngit clone https://github.com/comfyanonymous/ComfyUI\ncd ComfyUI && pip install -r requirements.txt && python main.py\n \n最简上手\n：打开 \n127.0.0.1:8188\n  拖入工作流 JSON  连好节点  点 Queue。\n \n免费\n本地\n显卡：需要（NVIDIA 推荐）\n \n \n \n \n\n \nInvokeAI\n创作工作室\n面向专业创作者的文生图工作室，自带画布、图库与统一画布，界面友好。\n \n \nGitHub\ninvoke-ai/InvokeAI\n \n复制\npip install invokeai\ninvokeai-web\n \n最简上手\n：首次运行选模型  浏览器打开 \n127.0.0.1:9090\n 开始作画。\n \n免费\n本地\n显卡：可选（MPS/CPU 可跑）\n \n \n \n \nCategory 03 · 语音\n \n识别与合成 \n本地语音引擎\n \nWhisper 负责「听懂」，Piper / Bark 负责「说话」，全部离线免费。\n \n \n \n \n \n\n \nWhisper\n语音识别\nOpenAI 开源语音识别模型，多语言转文字 + 翻译，本地离线可用，做字幕神器。\n \n \nGitHub\nopenai/whisper\n \n复制\npip install openai-whisper\nwhisper audio.mp3 --language Chinese\n \n最简上手\n：装好后 \nwhisper 文件.mp3\n 即可输出带时间轴的转写结果。\n \n免费\n本地\n显卡：可选（CPU 可跑）\n \n \n \n \n\n \nPiper\n轻量合成\n轻量级本地 TTS，速度快、能跑树莓派，适合离线朗读与嵌入式设备。\n \n \nGitHub\nrhasspy/piper\n \n复制\npip install piper-tts\necho \"你好\" | piper --model zh_CN-huayan-medium.onnx --output_file out.wav\n \n最简上手\n：下载中文 ONNX 语音模型  命令行合成 WAV。\n \n免费\n本地\n显卡：不需要（纯 CPU）\n \n \n \n \n\n \nBark\n情感合成\nSuno 开源多语言 TTS，能生成带语气、笑声甚至音乐感的自然语音。\n \n \nGitHub\nsuno-ai/bark\n \n复制\npip install suno-bark\n \n最简上手\n：几行 Python 调用 \ngenerate_audio\n 生成语音；CPU 很慢，建议用 GPU。\n \n免费\n本地\n显卡：强烈建议（CPU 极慢）\n \n \n \n \nCategory 04 · Agent / 工作流\n \n让多个 AI \n协作干活\n \n代码框架（LangChain / AutoGen / CrewAI）+ 可视化平台（Dify / n8n），全部无需显卡，走 API 即可。\n \n \n \n \n \n\n \nLangChain\n应用框架\n最流行的 LLM 应用开发框架，把模型、工具、记忆、检索串成链与 Agent。\n \n \nGitHub\nlangchain-ai/langchain\n \n复制\npip install langchain langchain-openai\n \n最简上手\n：组合 \nPrompt + LLM + Tool\n 构建链，接任意模型 API。\n \n免费\n本地（代码库）\n显卡：不需要\n \n \n \n \n\n \nAutoGen\n多智能体\n微软开源的多智能体对话框架，多个 Agent 自动分工协作完成任务。\n \n \nGitHub\nmicrosoft/autogen\n \n复制\npip install autogen-agentchat\n \n最简上手\n：定义 \nAssistantAgent\n 与 \nUserProxyAgent\n，让它们自动对话。\n \n免费\n本地（代码库）\n显卡：不需要\n \n \n \n \n\n \nCrewAI\n角色团队\n以「角色 + 团队」组织多个 AI Agent，像管理一支员工团队一样编排任务。\n \n \nGitHub\ncrewAIInc/crewAI\n \n复制\npip install crewai crewai-tools\ncrewai create crew my_crew\n \n最简上手\n：定义 \nAgent + Task + Crew\n 后调用 \nkickoff()\n。\n \n免费\n本地（代码库）\n显卡：不需要\n \n \n \n \n\n \nDify\n可视化平台\n开源 LLM 应用平台，可视化搭建 Agent / 工作流 / RAG 知识库，自带管理界面。\n \n \nGitHub\nlanggenius/dify\n \n复制\ngit clone https://github.com/langgenius/dify\ncd dify/docker && docker compose up -d\n \n最简上手\n：启动后打开 \nhttp://localhost\n，配置模型 API 即可建应用。\n \n免费\n可自托管\n显卡：不需要\n \n \n \n \n\n \nn8n\n工作流自动化\n开源工作流自动化平台，可视化串联 AI 与上千个应用，搭自动化流水线。\n \n \nGitHub\nn8n-io/n8n\n \n复制\ndocker run -it --rm -p 5678:5678 -v n8n_data:/home/node/.n8n n8nio/n8n\n \n最简上手\n：打开 \nhttp://localhost:5678\n，拖节点连流程，接 AI 节点。\n \n免费（fair-code）\n可自托管\n显卡：不需要\n \n \n \n \nCategory 05 · 前端对话壳\n \n给模型配一个 \n好看的前端\n \n模型在本地（Ollama）或云端跑，这些「壳」负责漂亮的对话界面与多用户管理。\n \n \n \n \n \n\n \nOpen WebUI\n全能对话界面\n功能最全的自托管对话界面，接 Ollama 或 OpenAI 兼容 API，支持 RAG 与多用户。\n \n \nGitHub\nopen-webui/open-webui\n \n复制\ndocker run -d -p 3000:8080 -v open-webui:/app/backend/data --name open-webui ghcr.io/open-webui/open-webui:main\n \n最简上手\n：打开 \nhttp://localhost:3000\n，连上本地 Ollama 即可对话。\n \n免费\n本地\n显卡：不需要\n \n \n \n \n\n \nLobeChat\n现代多模型\n开源现代设计的多模型对话框架，支持多供应商、插件与视觉，可一键私有部署。\n \n \nGitHub\nlobehub/lobe-chat\n \n复制\ndocker run -d -p 3210:3210 -e OPENAI_API_KEY=sk-xxx -e ACCESS_CODE=yourcode lobehub/lobe-chat\n \n最简上手\n：打开 \nhttp://localhost:3210\n，配置模型密钥或接 Ollama。\n \n免费\n可自托管\n显卡：不需要\n \n \n \n \n\n \nChatbox\n桌面客户端\n跨平台桌面对话客户端，一键接本地 Ollama 或任意 API，数据本地保存。\n \n \nGitHub\nBin-Huang/chatbox\n \n复制\n# 官网下载桌面安装包（Windows / macOS / Linux / iOS / Android）\n \n最简上手\n：安装后在设置里选择 Ollama 或填 API Key，即可对话。\n \n免费\n本地\n显卡：不需要\n \n \n \n \nCategory 06 · 训练 / 微调\n \n让模型 \n学会你的数据\n \n从 Transformers 加载预训练模型，用 PEFT/LoRA 低显存微调，再用 DeepSpeed 加速大规模训练。\n \n \n \n \n \n\n \nTransformers\n模型库\nHugging Face 最广泛使用的模型库，统一加载、微调、推理数千种预训练模型。\n \n \nGitHub\nhuggingface/transformers\n \n复制\npip install transformers\n \n最简上手\n：\npipeline(\"sentiment-analysis\")(\"I love AI\")\n 一行跑通推理。\n \n免费\n本地\n显卡：可选（训练建议）\n \n \n \n \n\n \nPEFT / LoRA\n高效微调\n高效参数微调库，用 LoRA 只训练极小部分参数，低显存也能微调大模型。\n \n \nGitHub\nhuggingface/peft\n \n复制\npip install peft\n \n最简上手\n：配合 Transformers 用 \nLoraConfig\n 挂载后微调。\n \n免费\n本地\n显卡：建议（显存大幅降低）\n \n \n \n \n\n \nDeepSpeed\n分布式训练\n微软开源深度学习优化库，分布式训练 / 推理加速，可训练超大模型。\n \n \nGitHub\nmicrosoft/DeepSpeed\n \n复制\npip install deepspeed\n \n最简上手\n：用 \ndeepspeed train.py --deepspeed ds_config.json\n 启动训练。\n \n免费\n本地\n显卡：需要（多卡加速）\n \n \n \n白驹 ccowork\n \n开源 AI 项目 · 内嵌整合 —— 所有项目均为真实开源项目，地址与命令已核实 · 由 AI 协同创作 · 2026\n \n<i class=\"cc-ic cc-back\" data-ic=\"arrow-left\"></i> 返回首页","站内·开发者基地":"# 开发者基地\n\nccowork · 开发者基地 · GitHub 开源 AI 实战全教程\n\r\n \r\n \n\r\n\r\n\r\n\r\n \n开发者基地 DEVBASE\n\r\n \n\r\n \n 门户网站\n\r\n \n共同特点\n\r\n \n对话模型实战\n\r\n \n提示词实战\n\r\n \n编程 Agent\n\r\n \n一人公司\n\r\n \n手机全套玩法\n\r\n \n里程碑成果\n\r\n \n研究前沿\n\r\n \n \n教程视频\n \nAI赚钱\n \n作品大全\n \n\r\n\r\n\r\n\r\n \n\r\n \nGITHUB OPEN SOURCE · 全部命令可复现 · 持续迭代\n\r\n \n开发者基地\n从第一条命令，到第一件成品\n\r\n \n\r\n \n这是一座\n写给所有人的公开 AI 学校\n：不需要任何基础，每个开源项目都配\r\n \n真实提示词 + 真实输出 + 一键复制命令\n。从第一条命令开始，带你走到能教别人的那一天。\n\r\n \n\r\n \n11\n章完整课程\n\r\n \n15+\n开源项目全教程\n\r\n \n30+\n可复制命令块\n\r\n \n9\n真实输出演示\n\r\n \n\r\n\r\n\r\n\r\n \n目录 \n\r\n \n01 共同特点\n\r\n \n02 对话模型实战\n\r\n \n03 提示词实战\n\r\n \n04 编程与 Agent\n\r\n \n05 应用框架\n\r\n \n06 网络安全\n\r\n \n07 一人公司\n\r\n \n08 手机全套玩法\n\r\n \n09 打包下载\n\r\n \n10 里程碑成果\n\r\n \n11 研究方向全景\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 01\n先懂规律：2026 开源 AI 的六个共同特点\n\r\n \n把 GitHub 热榜翻到底，规律清晰得惊人。看懂这六条，任何新项目到你手里都能三分钟看透。\n\r\n \n1. 从\"造模型\"转向\"造身体\"。\n增长最快的不再是新模型，而是让模型干活的基建：DeepSeek Harness（一切皆插件）、OpenMontage（视频流水线）、各类 Skill 技能包。模型是大脑，2026 年的战场在四肢。\n\r\n \n2. 对话即界面。\n主流项目统一支持 MCP 或插件机制，交互收敛为一种：自然语言下命令，Agent 调工具执行。\"配置\"正在消失。\n\r\n \n3. 本地优先。\nOllama、vLLM 的爆发说明隐私、零成本、离线是刚需。开源权重让\"自己的模型跑在自己的机器上\"成为默认。\n\r\n \n4. OpenAI API 格式是事实标准。\n几乎所有推理框架都暴露 \n/v1/chat/completions\n 兼容接口——学会一次调用，换掉底层任何模型。\n\r\n \n5. 流水线化取代单点生成。\nAI 视频从\"生成片段\"转向\"组织整个生产流程\"，写作、编程同理。\n\r\n \n6. 工程纪律回潮。\nsuperpowers（26 万 star）登顶说明社区共识：让 AI 写出\n能维护\n的代码，测试、审查、知识库一个不能少。\n\r\n \n记住公式：\n开源模型 + OpenAI 接口 + 插件 Agent + 本地部署 + 流水线\n。下面每一章都是它的具体化身，而且每一章都有真实演示。\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 02\n对话模型实战：今晚跑起一个\"你的 DeepSeek\"\n\r\n \n不只给命令——给你看跑完之后真实的样子。\n\r\n\r\n \n2.1 Ollama：三条命令，本地模型开口说话\n\r\n \nGitHub  15 万+\nGo\nMIT\n难度：\n硬件：8GB 内存起步\n\r\n \n安装（三选一）\n复制\n# Windows：官网下载 OllamaSetup.exe 双击安装  ollama.com/download\n\r\nbrew install ollama \n# macOS\n\r\ncurl -fsSL https://ollama.com/install.sh | sh \n# Linux\n\r\n \n拉取模型并对话（按内存选一个）\n复制\nollama run qwen3:8b \n# 8GB 内存：中文最强小模型\n\r\nollama run deepseek-r1:14b \n# 16GB 内存：带深度推理\n\r\nollama run qwen3:32b \n# 24GB+ 显存：满血体验\n\r\n\r\n \n跑完之后是什么样？真实对话长这样：\n\r\n \n终端 · ollama run deepseek-r1:14b\n\r\n \n你\n用一句话向小学生解释什么是\"反向传播\"。\n\r\n \nDEEPSEEK-R1（本地 · 离线）\n反向传播就像投篮练习：你投出一球没进（\n误差\n），教练告诉你\"力气大了、偏左了\"，你就调整手腕的每个动作（\n每个参数\n）——从最后出手的手指，一路调整回脚的发力。调整亿万次之后，你就成了神射手。\n\r\n \n\r\n \n全程离线、免费、数据不出本机。这就是\"把 DeepSeek 装进自己电脑\"的真实体验。\n\r\n\r\n \n2.2 关键一步：把模型变成\"任何软件都能用的 API\"\n\r\n \nOllama 默认已开启 OpenAI 兼容接口（11434 端口），直接验证：\n复制\ncurl http://localhost:11434/v1/chat/completions -d \"{\\\"model\\\":\\\"qwen3:8b\\\",\\\"messages\\\":[{\\\"role\\\":\\\"user\\\",\\\"content\\\":\\\"你好\\\"}]}\"\n\r\n \n返回一段 JSON 就说明成功。之后任何支持\"自定义 OpenAI 接口\"的软件——沉浸式翻译、Obsidian、Chatbox、你自己写的 Python 脚本——把地址填成 \nhttp://localhost:11434/v1\n，密钥随便填，全部免费用上本地模型。\n\r\n\r\n \n2.3 进阶实战：用 Modelfile 捏一个\"人设模型\"\n\r\n \n这是大多数人不知道的 Ollama 杀器：把\"模型 + 系统提示词 + 参数\"打包成一个新模型。下面是真实可用的例子——捏一个只聊创作的写作助教：\n\r\n \n三步捏人设\n复制\n# 1. 新建一个文本文件，命名为 Modelfile（无后缀），内容：\n\r\nFROM qwen3:8b\r\nSYSTEM \"\"\"你是「墨白」，一位毒舌但靠谱的写作助教。规则：\r\n1. 只回答写作相关问题，其他问题礼貌拒绝\r\n2. 每次先指出文本的 1 个最大问题，再给修改示范\r\n3. 禁止说\"挺好的\"这类空话\"\"\"\r\nPARAMETER temperature 0.8\r\n# 2. 打包成新模型\n\r\nollama create mobai -f Modelfile\r\n# 3. 使用\n\r\nollama run mobai\n\r\n \n真实效果 · ollama run mobai\n\r\n \n你\n帮我看看这句：\"今天的天气很好，我的心情也很好。\"\n\r\n \n墨白（你捏的人设）\n最大问题：两个\"很好\"是零信息量。\n天气好在哪里？心情好到什么程度？读者什么都看不见。修改示范：\"太阳把柏油路晒得发软，我踩着影子走，一路都在哼歌。\"——具体画面自带情绪，不需要说\"好\"。\n\r\n \n\r\n \n这就是\"提示词工程\"的落地形态：人设一旦写进 Modelfile，每次对话自动生效。你也可以用同样方法捏客服、英语老师、代码审查员——\n提示词就是你的产品\n。\n\r\n\r\n \n硬件速查：8GB 内存  7B/8B 量化模型；16GB  14B；24GB 显存（4090 级） 32B。想跑满血 671B？那不是消费级硬件的事，用官方 API。\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 03\n提示词实战：三个真实案例，输入什么、得到什么\n\r\n \n\"怎么设置提示词、怎么利用它\"——这一章全部给真实输入和真实输出，复制改改就能用。对云端 DeepSeek/本地模型同样有效。\n\r\n\r\n \n案例 1 · 让 AI 当你的选题军师\n\r\n \nDeepSeek-R1 · 真实提示词与输出\n\r\n \n你的输入（直接复制可用）\n你是百万粉丝科技博主。围绕\"普通人用 AI 赚钱\"产出 5 个短视频选题。要求：标题 ≤20 字，含数字或悬念；标注目标情绪（好奇/焦虑/共鸣）；给每个选题写一句 15 字以内的开场钩子。输出为表格。\n\r\n \n真实输出（节选）\n1.《我用 AI 接单，一个月赚了 4000》\n｜情绪：好奇+焦虑｜钩子：\"我没辞职，也没投资，只靠下班后两小时。\"\n2.《这 3 类工作，AI 已经开始抢单了》\n｜情绪：焦虑｜钩子：\"如果你是做文案的，先看完这条再睡。\"\n3.《宝妈用 AI 做表情包，月入过万？》\n｜情绪：好奇｜钩子：\"我亲测了 7 天，结果和想的不一样。\"\n\r\n \n\r\n \n拆解这条提示词为什么有效：\n角色\n（百万粉博主）+ \n任务\n（5 个选题）+ \n约束\n（字数、情绪、钩子）+ \n格式\n（表格）。四件套齐全，输出质量立判高下。\n\r\n\r\n \n案例 2 · 让 AI 写\"能跑\"的代码\n\r\n \nDeepSeek · 真实提示词与输出\n\r\n \n你的输入\n你是资深 Python 工程师。写一个脚本：读取当前文件夹所有 .md 文件，统计每个文件的字数，输出为 CSV（文件名,字数）。要求：处理中文编码；加注释；最后告诉我怎么运行。\n\r\n \n真实输出（核心代码）\nimport os, csv\n — 遍历 os.listdir('.')  以 encoding='utf-8' 打开  len(text) 计字  csv.writer 写入 report.csv。运行方法：保存为 count.py，终端执行 python count.py，同目录生成 report.csv。\n\r\n \n\r\n\r\n \n案例 3 · 杠精编辑法：让 AI 骂你的稿子\n\r\n \nDeepSeek-R1 · 本基地博文真实用过的工作流\n\r\n \n你的输入\n你是以毒舌著称的资深主编。审阅我粘贴的文章：1）找出 5 个最大问题并引用原文；2）指出 3 处\"像 AI 写的\"的句子；3）给出修改示范，保留我的风格，删掉所有空话。\n\r\n \n真实输出（节选）\n\"问题 1：第二段'效率提升显著'是空话——\n显著是多少？\n没有数字的判断是撒娇。问题 2：'值得注意的是'这个短语本身就是 AI 指纹，全文出现 3 次……\"\n\r\n \n\r\n \n更多模板（选题/分镜/润色/小说四章套）已整理在 主站提示词工程模块\n，全部可一键复制。\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 04\n编程与 Agent：让 AI 真正替你干活\n\r\n \nDeepSeek Harness 的理念：模型是大脑，插件是四肢——一切皆插件\n\r\n\r\n \n4.1 DeepSeek Harness：8 月 13 日刚开源的\"Agent 身体\"\n\r\n \n上线 1.5 小时  2.4 万（破纪录）\ndeepseek-ai 官方\n难度：\n\r\n \n公式：\nModel + Harness = Agent\n。装好后，DeepSeek 从\"会聊天\"变成\"会操作文件、终端、网页\"的数字员工。\n\r\n \n安装与配置\n复制\ngit clone https://github.com/deepseek-ai/deepseek-harness.git\r\ncd deepseek-harness && pip install -e .\r\ndsh config set model deepseek-chat\r\ndsh config set api_key sk-你的密钥 \n# 或指向本地 Ollama 接口，零成本\n\r\n \n真实派活演示\n\r\n \n你\ndsh run \"读取我桌面 report 文件夹里所有 docx，合并成一份周报摘要，存为 summary.md\"\n\r\n \nHARNESS 执行过程\n① 调用 fs 插件扫描目录，发现 6 个文档  ② 逐个读取并提取要点  ③ 合并去重，按\"本周进展/风险/下周计划\"组织  ④ 写入 summary.md  \n完成，用时 40 秒。你全程只说了一句话。\n\r\n \n\r\n\r\n \n4.2 superpowers：给 AI 编程立规矩（26 万 star）\n\r\n \n装进 AI 编程客户端（以 Claude Code 为例）\n复制\ngit clone https://github.com/obra/superpowers.git ~/.claude/skills/superpowers\r\n# 之后对 AI 说\"用 superpowers 流程实现 XX\"，它会先写测试、小步提交、自我审查\n\r\n\r\n \n4.3 OpenMontage：一句话出整支视频\n\r\n \n安装与使用\n复制\ngit clone https://github.com/calesthio/OpenMontage.git\r\ncd OpenMontage && pip install -r requirements.txt\r\npython openmontage.py \"做一支 60 秒科普短片：为什么天空是蓝色的\" --duration 60\r\n# 它自动完成：脚本分镜素材剪辑合成，即本项目视频工作流的自动化版\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 05\n应用框架：零代码拼出 AI 应用\n\r\n\r\n \n5.1 Dify：可视化 AI 应用工厂（含真实搭建流程）\n\r\n \nGitHub  10 万+\nApache 2.0\n难度：\n\r\n \nDocker 一键部署\n复制\ngit clone https://github.com/langgenius/dify.git\r\ncd dify/docker && cp .env.example .env\r\ndocker compose up -d \n# 打开 http://localhost\n\r\n \n\r\n \n接入免费模型\n：设置  模型供应商  选 \"OpenAI-API-compatible\"  填 \nhttp://host.docker.internal:11434/v1\n（即你第 2 章装的 Ollama），模型名填 qwen3:8b，密钥任意。\n\r\n \n建知识库\n：新建知识库  上传你的产品文档/手册  选\"自动分段与清洗\"  等待向量化完成。\n\r\n \n建应用\n：新建\"聊天助手\"  关联知识库  提示词写：\"你是产品客服，只根据知识库回答，不知道就说不知道并转人工\"。\n\r\n \n发布\n：点\"发布\"获得网页链接/API——一个 24 小时客服上线了，全程零代码。\n\r\n \n\r\n\r\n \n5.2 n8n：自动化流水线（真实案例：每日 AI 日报机器人）\n\r\n \n启动\n复制\ndocker run -d --name n8n -p 5678:5678 -v n8n_data:/home/node/.n8n docker.n8n.io/n8nio/n8n\n\r\n \n打开 \nhttp://localhost:5678\n，拖四个节点连起来：\n定时触发（每天 8:00） HTTP 抓取 10 条 AI 新闻  DeepSeek 节点总结成 300 字  邮件节点发送\n。保存激活后，它每天自动替你上班。\n\r\n\r\n \n5.3 FastGPT 与 LangGraph\n\r\n \nFastGPT\n：专精中文知识库问答，引用溯源比通用框架更细——\"让 AI 熟读我的资料再回答\"选它。\nLangGraph\n：给程序员的状态图编排框架，生产级复杂 Agent 的主流选择。命令与前文模式相同：\ngit clone  docker compose up -d\n。\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 06\n网络安全：上线前，先让 AI 打自己一遍\n\r\n \n本章工具仅用于\n你自己拥有或被书面授权\n的系统。未授权扫描他人系统违法。\n\r\n\r\n \n6.1 garak：给你的模型做体检\n\r\n \n扫描第 2 章部署的本地模型\n复制\npip install garak\r\ngarak --model_type ollama --model_name qwen3:8b --probes all\r\n# 输出 HTML 报告：提示词注入/越狱/数据泄露哪些能攻破你的模型\n\r\n\r\n \n6.2 Strix：AI 红队体检你的产品\n\r\n \n对自己写的网站做授权测试\n复制\npipx install strix-agent\r\nexport STRIX_LLM=\"deepseek/deepseek-chat\" && export LLM_API_KEY=\"sk-你的密钥\"\r\nstrix --target http://localhost:3000 --instruction \"检查常见 Web 漏洞并给出修复建议\"\n\r\n \n影响\n：渗透测试从\"几十万、等数周\"变成\"一个开发者、几小时\"——中小团队第一次买得起安全感。2026 年的共识：\n用 AI 防 AI\n。\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 07\n一人公司：一个人 + 一组 Agent = 一家公司\n\r\n \n2026 年最确定的趋势：单人开发者的复杂度上限 ≈ 小型团队\n\r\n \n\r\n \n公司职能\nAI 员工\n教程位置\n月成本\n\r\n \n技术部\nCodeBuddy / Cursor + superpowers\n第 4 章\n¥0~140\n\r\n \n大脑\nDeepSeek API / 本地 Ollama\n第 2 章\n¥0~50\n\r\n \n运营部\nn8n 自动化流水线\n第 5 章\n¥0\n\r\n \n设计部\nComfyUI 本地 / 即梦云端\n主站视频模块\n¥0~100\n\r\n \n客服部\nDify / FastGPT 知识库\n第 5 章\n¥0\n\r\n \n安全部\ngarak + Strix 上线体检\n第 6 章\n¥0\n\r\n \n\r\n \n影响\n：科斯说企业因降低交易成本而存在——当 Agent 把协作成本压到近零，传统雇佣关系松动。但一人公司 ≠ 轻松公司：AI 消灭执行成本，放大决策密度。幸存者画像一致：垂直领域深认知 + 快速试错体力 + 把 AI 当\"员工\"管理的能力。\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 08\n手机全套玩法：跑模型、管项目、打包下载\n\r\n \n2026 年，你的手机足以完成\"对话、部署、管理、下载\"全流程\n\r\n\r\n \n8.1 在手机上打包下载本基地（以及任何网页）\n\r\n \n你要的\"手机上一键打包下载\"——分两步，30 秒搞定：\n\r\n \n\r\n \n把本页存到手机\n：iOS 用 Safari 打开本页  点底部分享按钮  \"选项\"选 \n网页归档\n  存到\"文件\"App；安卓用 Chrome  右上角 ⋮  下载图标（或分享  打印  另存为 PDF）。得到单个文件，离线可开、可转发给任何人。\n\r\n \n页面内的下载按钮\n：第 9 章的\"一键打包下载\"按钮在手机上同样有效——点一下，浏览器直接弹出保存/分享。\n\r\n \n\r\n\r\n \n8.2 手机上直接跑离线模型（5 分钟，断网可用）\n\r\n \nPocketPal AI 五步（安卓 / iOS 均可，开源免费）\n复制\n1. 应用商店搜 PocketPal AI  安装\r\n2. 打开  模型库选 DeepSeek-R1 蒸馏版（1.5B~8B 按内存选）\r\n3. Wi-Fi 下点下载（约 1~5GB）\r\n4. 加载模型  直接对话，开飞行模式也能用\r\n5. 想更快：换 MLC Chat，支持 NPU 加速\n\r\n \n配置参考：8GB 内存手机流畅跑 1.5B~3B；12GB+ 旗舰可跑 7B~8B 量化版。速度不如电脑，但隐私无敌——数据永远不出你的口袋。\n\r\n\r\n \n8.3 手机遥控全部开源项目（主力姿势）\n\r\n \n真正的\"手机上操作所有开源项目\"：\n项目跑在电脑/服务器上，手机当遥控器\n。\n\r\n \n\r\n \n网页直达\n：Dify、Open WebUI、ComfyUI、n8n 都是网页界面——同一 Wi-Fi 下，手机浏览器打开 \nhttp://电脑IP:端口\n 就能用（电脑 IP 用 ipconfig 查）。\n\r\n \nSSH 遥控\n：安卓装 Termux / iOS 装 Termius  \nssh 用户名@电脑IP\n  本基地所有命令手机上全能敲。\n\r\n \nGitHub 手机端\n：官方 App 可 star、审阅、合并；看到好项目先 star，回家一键 clone。\n\r\n \n出门在外\n：电脑装 tailscale（免费），手机在世界任何角落都能连回家里的服务。\n\r\n \n\r\n \n组合技：地铁上用 PocketPal 离线聊天想创意  到家用手机浏览器打开电脑上的 Dify 调整知识库  睡前 SSH 进去敲一条 \nollama pull\n 下载新模型。全流程零电脑桌面操作。\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 09\n打包下载：把开源项目变成\"你的软件\"\n\r\n \n\r\n \n层级\n方式\n适合谁\n操作\n\r\n \nL1 最省心\n官方安装包\n所有人\n项目主页 Releases 下载，双击安装（Ollama、Chatbox、PocketPal）\n\r\n \nL2 一键脚本\nPinokio 安装器\n怕命令行\n装 Pinokio  搜项目  点 Install，依赖全自动\n\r\n \nL3 容器\nDocker\n进阶\ndocker compose up -d\n 一条命令起整个应用\n\r\n \nL4 源码\ngit clone\n开发者\n克隆  按 README 装依赖  自由魔改\n\r\n \n\r\n \n本基地自己就是示范：零依赖单文件网页，点下面立刻打包带走——\n\r\n \n\r\n \n 一键打包下载本基地（单文件 HTML）\n\r\n \n\r\n \n下载后的文件双击即开，无需网络、无需安装；发到微信/邮箱给任何人都能直接打开。这就是 2026 年做软件的新常态：对话生成  单文件  随处分发。\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 10\n前辈们的里程碑：这些真实成果，改变了你的世界\n\r\n \n学 AI 最好的方式，是先看懂它已经完成过什么。以下是 AI 史上已被验证的里程碑成果——每一件都在今天的你的生活里有回声。\n\r\n\r\n \n10.1 智力与科学之巅\n\r\n \nAlphaGo（2016）· 机器第一次展现\"直觉\"\n\r\n \nDeepMind 的 AlphaGo 以 4:1 战胜李世石，第二局第 37 手被职业棋手称为\"天外飞仙\"——人类千年棋谱里没有人这样落子。它证明：AI 不只是计算，还能产生\n超越人类经验的创造性判断\n。一年后 AlphaZero 从零自学三天，碾压所有前辈版本。\n\r\n \nAlphaFold（2020—2026）· 破解生命折叠，拿下诺贝尔奖\n\r\n \n蛋白质折叠是生物学 50 年悬案，AlphaFold 一举预测两亿多个蛋白质结构，哈萨比斯因此获 2024 年诺贝尔化学奖。2026 年，DeepMind 与英伟达、EMBL-EBI 组队的新一代 AlphaFold 已开始解析细胞的\"组装车间\"（核孔复合体），AI 驱动的超导材料发现、自动化实验室同年入选年度科学突破。\n它给你的回声：未来十年新药的研发周期，将以\"年\"而非\"十年\"计。\n\r\n\r\n \n10.2 改变世界的时刻\n\r\n \nChatGPT（2022）· 五天百万用户的\"iPhone 时刻\"\n\r\n \nOpenAI 把一个对话框变成史上增长最快的消费级应用：两个月破亿用户。它第一次让\"通用人工智能\"从论文走进菜市场。2026 年 GPT-5.6 更进一步：免费用户获得无限对话与推理能力——\n顶级 AI 第一次真正全民免费\n。\n\r\n \nSora 与视频生成革命（2024—2026）\n\r\n \nSora 用一句话生成电影感视频，震惊影视行业；随后可灵、即梦、混元视频集体跟进。两年后，\"文字  视频\"已是普通人手机里的日常功能，广告与短剧行业的制作成本被重写。本基地视频工程的素材，正是这条技术线的产物。\n\r\n \nDeepSeek 时刻（2025.1）· 效率革命的惊雷\n\r\n \n中国团队用约 560 万美元训练出比肩顶级闭源模型的 R1 并完全开源，1 月 27 日英伟达单日暴跌 17%、蒸发约 5900 亿美元——\n人类股市史最大单日市值蒸发\n。它向世界证明：算力霸权之外，还有效率革命；中国 AI 可以换道超车。\n\r\n \n盘古气象大模型（2023）· 登《Nature》的中国 AI\n\r\n \n华为云盘古成为首个精度超越传统数值预报的 AI 模型，速度提升一万倍，上线欧洲中期天气预报中心。AI 预报如今在台风路径与极端天气预警中守护真实生命——\n这是 AI 最没有争议、最纯粹的胜利\n。\n\r\n\r\n \n10.3 正在发生的现在\n\r\n \n具身智能与人形机器人（2026 WAIC）\n\r\n \n2026 世界人工智能大会的主角是\"会动的 AI\"：国家地方共建人形机器人创新中心与华为联手揭牌具身智能实训场。行业共识\"先通后专\"——先让机器人什么都会一点，再让它们在工厂、仓库、家庭各就其位。\n\r\n \nDeepSeek Harness（2026.8）· 模型长出身体\n\r\n \n就在本周：DeepSeek 开源 Agent 框架 Harness，1.5 小时 GitHub Star 破 2.4 万。它让大模型操作文件、终端、浏览器——\"一切皆插件\"。AI 从\"会说\"到\"会做\"的最后一公里，正在被填平。\n\r\n\r\n \n看完成果，看门道：这些里程碑全部遵循同一个节奏——\n论文  开源  生态  改变行业\n。学会这个节奏，下一个里程碑出现时，你就能对身边人说：\"这个我懂，来，我讲给你听。\"\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n \nCHAPTER 11\n紧跟时事：2026 AI 研究方向全景\n\r\n \n综合 2026 智源大会与 WAIC 的最前沿议题，当前所有重要研究都收敛到这八个方向。每个方向标注\"谁在领跑 + 与你何干\"。\n\r\n \n\r\n \n方向\n研究什么\n谁在领跑\n与你何干\n\r\n \n推理模型\n让模型\"先想后答\"，思维链可训练（RLHF  RLVR）\nOpenAI o 系、DeepSeek R 系、Qwen\nDeepSeek 开\"深度思考\"模式，数学/代码/策划能力质变\n\r\n \n世界模型\n从\"预测下一个词\"到\"预测世界的下一个状态\"——智源大会年度主题\n智源研究院、Google DeepMind、Momenta\n自动驾驶与机器人安全的底层技术\n\r\n \n具身智能\n大模型装进机器人身体，\"先通后专\"\n华为 × 国地中心、特斯拉 Optimus、宇树\n未来 5 年工厂与家庭的劳动力变量\n\r\n \nAI for Science\nAI 做科学发现：蛋白质、材料、气象、数学\nDeepMind（AlphaFold）、华为（盘古）\n新药更快、天气预报秒级——直接救命的技术\n\r\n \nAgent 与自进化\n多步任务规划、工具调用、Agent 自我改进\nDeepSeek Harness、Anthropic、Manus 系\n第 4 章教程就是它的平民版\n\r\n \n原生多模态\n一个模型同时理解文字、图像、声音、视频\nGemini、GPT-5.6、豆包 Seed\n拍张照问 AI、语音实时对话已是日常\n\r\n \n高效小模型\n10B-70B 精调模型服务垂直场景，端侧部署\nQwen 全尺寸矩阵、DeepSeek 蒸馏系\n第 2 章：8GB 内存的电脑就能跑\n\r\n \nAI 安全与对齐\n让 AI 可控、诚实、不越界；制度化治理\nAnthropic、SSI（苏茨克维）、LawZero（本吉奥）\n第 6 章 garak 就是安全研究的民用化\n\r\n \n\r\n \n跟踪方法：每周花 10 分钟扫一眼 GitHub Trending（热榜）+ 智源/WAIC 大会动态，你就能永远比朋友圈早三个月知道风向。\n\r\n\r\n\r\n\r\n \n开发者基地 DEVBASE\n\r\n \n项目信息采集自 GitHub Trending 与官方仓库（2026 年 8 月）· 命令以官方文档为准 · 本页随生态持续迭代","站内·AI全景编年史":"# AI全景编年史\n\nccowork · AI 全景编年史 · 从图灵到 2026\n\r\n \r\n \n\r\n\r\n\r\n\r\n \nAI 全景编年史\n\r\n \n\r\n \n<i class=\"cc-ic cc-back\" data-ic=\"arrow-left\"></i> 返回主站\n\r\n \n前线快报\n\r\n \n卷一 · 世界编年史\n\r\n \n卷二 · 中国之路\n\r\n \n卷三 · 人物列传\n\r\n \n卷四 · 2026 模型横评\n\r\n \n卷五 · 影响篇\n\r\n \n卷六 · 未来\n\r\n \n \n教程视频\n \nAI赚钱\n \n作品大全\n \n\r\n\r\n\r\n\r\n \n1950 — 2026 · 人与机器相互塑造的七十六年\n\r\n \nAI 全景\n编年史\n\r\n \n这是一份基于公开资料联网归纳写成的超长卷：从达特茅斯的夏天到 DeepSeek 时刻，\r\n 从图灵之问到万亿参数；世界与中国的两条大河、十余位关键人物的命运、2026 年最新模型的正面对决，\r\n 以及 AI 在文学、经济、内容、气象等领域投下的真实涟漪。\n\r\n \n向下滚动 · 进入历史\n\r\n\r\n\r\n\r\n\r\n \n\r\n \nLIVE WIRE · 持续更新\n\r\n \n卷零 · 前线快报（2026 年 8 月）\n\r\n \n历史不是只发生在过去。这一周，牌桌上又落下了几张新牌。\n\r\n \n\r\n \n\r\n \n2026.8.13 · 开源地震\nDeepSeek 开源 Harness：模型的\"身体\"来了\nDeepSeek 发布并开源首个智能体运行框架 \nDeepSeek Harness（DSH）v0.1\n 开发者预览版：不是新模型，而是让模型调用文件系统、终端、网页、代码工具的基础设施，核心设计原则只有六个字——\"一切皆插件\"。公式：\nModel + Harness = Agent\n。上线一个半小时 GitHub Star 破 2.4 万，刷新平台纪录，被视为补齐 Vibe Coding 入口的关键一子。\n一切皆插件\n省 Token\nAgent 可自改装\n\r\n \n2026.8.3 · 开源超大杯\n阿里发布 Qwen3.8-Max\n通义千问家族迄今规模最大、能力最强的模型，旗舰首次开源，此前缺席的基准分全部补齐。Qwen 系列继续以\"全尺寸矩阵 + 完全开源\"压制开源生态位，长期霸榜 HuggingFace 下载榜。\n\r\n \n2026.7-8 · 普惠时刻\nChatGPT 推送 GPT-5.6 全家桶\nOpenAI 发布 GPT-5.6 系列（Sol / Terra / Luna 三档），8 月更新更激进：\n免费用户首次获得无限文本对话与\"Think\"推理能力\n——推理模型从付费墙后走向全民，数亿人的 AI 体验被一次性抬升。\n\r\n \n2026.8.13 · 价格战\nGemini 3.7 Flash 同日对垒\nGoogle 同日发布 Gemini 3.7 Flash，定位\"最智能的工作马模型\"，主打编码与 Agent 能力并限时半价。三巨头在同一周贴身肉搏——2026 年的模型竞争，已是\"高性价比工作马\"的白刃战。\n\r\n \n\r\n\r\n\r\n\r\n\r\n \n\r\n \nVOLUME I\n\r\n \n卷一 · 世界 AI 编年史\n\r\n \n人工智能的历史是一部\"三起两落\"的历史：每一次狂喜都迎来寒冬，每一次寒冬都埋下下一次爆发的种子。读懂这七十六年，才能理解 2026 年我们站在哪里。\n\r\n \n\r\n\r\n \n第一幕 · 诞生与第一次狂想（1950—1973）\n\r\n \n\r\n \n1950\n图灵之问\n艾伦·图灵\n 发表《计算机器与智能》，开篇即问\"机器能思考吗\"，并提出模仿游戏（图灵测试）作为判定标准。这个问题此后纠缠了人类七十余年。\n\r\n \n1956\n达特茅斯会议：学科诞生\n约翰·麦卡锡、马文·明斯基、香农 等\n 在达特茅斯学院召开夏季研讨会，\"人工智能（Artificial Intelligence）\"一词正式诞生。与会者乐观预言：二十年内机器将胜任人类的一切工作。\n\r\n \n1957—1969\n感知机与早期繁荣\n罗森布拉特\n 发明感知机，神经网络第一次成为现实；《纽约时报》惊呼\"海军期望电子计算机的雏形将能行走、说话、观看、书写、自我复制并意识到自身存在\"。1958 年麦卡锡发明 LISP 语言，统治 AI 编程数十年。\n\r\n \n\r\n\r\n \n第二幕 · 两次寒冬（1974—1993）\n\r\n \n\r\n \n1973\n莱特希尔报告：第一次寒冬\n英国发表莱特希尔报告，尖锐批评 AI\"言过其实\"，英美政府相继大幅削减经费。教训写进教科书：承诺超过交付，信任就会崩塌。\n\r\n \n1980s\n专家系统复兴与再度破灭\n以 XCON 为代表的专家系统一度创造十亿美元级产业，日本\"五代机\"计划震惊西方；但规则系统的脆弱与维护成本，让 AI 在 1987 年后滑入第二次寒冬。\n\r\n \n1986\n寒冬里的火种\n辛顿、鲁梅尔哈特、威廉姆斯\n 推广反向传播算法，让多层神经网络可训练。当时无人问津，二十年后它成为深度学习革命的引信。\n\r\n \n\r\n\r\n \n第三幕 · 深度学习革命（1997—2017）\n\r\n \n\r\n \n1997\n深蓝击败卡斯帕罗夫\nIBM 深蓝在国际象棋上战胜世界冠军，AI 第一次在全民围观中\"赢了人类\"。同一年，LSTM 架构发表，为序列建模奠基。\n\r\n \n2012\nAlexNet 时刻\n辛顿 携学生 伊利亚·苏茨克维、克里热夫斯基\n 用 GPU 训练的 AlexNet 在 ImageNet 竞赛中以碾压优势夺冠，深度学习时代正式开启。谷歌、百度随即展开对辛顿团队的竞价争夺——AI 人才战争的第一枪。\n\r\n \n2016\nAlphaGo：信仰之跃\nDeepMind 的 AlphaGo 以 4:1 战胜李世石，第 37 手\"天外飞仙\"让所有职业棋手沉默。同年，\n黄仁勋\n 将第一台 DGX-1 亲手交给 OpenAI——算力与新物种完成历史性交接。\n\r\n \n2017\nTransformer 诞生\n谷歌八位作者发表《Attention Is All You Need》。这篇当时不起眼的论文，此后十年几乎所有大模型的共同祖先。八位作者后来全部离职创业，被称为\"史上最贵的一页纸\"。\n\r\n \n\r\n\r\n \n第四幕 · 大模型时代（2018—2026）\n\r\n \n\r\n \n2022.11\nChatGPT：iPhone 时刻\nOpenAI 发布 ChatGPT，五天破百万用户、两个月破一亿，成为史上增长最快的消费级应用。全世界第一次直观地摸到通用人工智能的轮廓。\n\r\n \n2023—2024\n百模大战与多模态之年\nGPT-4 通过模拟律师考试进入前 10%；Claude、Gemini、Llama 相继登场；Sora 在 2024 年初以文生视频震惊世界；中国\"百模大战\"开打。2023 年 11 月 OpenAI 上演\"五日宫斗\"，奥特曼被罢免又复职，AI 安全的路线之争摆上桌面。\n\r\n \n2024.12\nAI 天气预报：超越数值预报\n谷歌 DeepMind 的 GenCast 登上《Nature》，8 分钟给出 15 天全球预报，精度超越顶尖物理模型；它与华为盘古 Pangu-Weather（2023.7 上《Nature》）、GraphCast 一起，把气象预报从超算小时级压缩到秒级。AI 在这个\"没有争议\"的战场上，完成了从辅助到主力的范式更替。\n\r\n \n2025.1\nDeepSeek 时刻\n中国公司 DeepSeek 以约 560 万美元成本训练出的开源模型 R1 比肩顶级闭源模型，1 月 27 日英伟达单日暴跌 17%、市值蒸发约 5900 亿美元——创人类股市史单日最大跌幅。全球 AI 产业逻辑被改写：算力军备竞赛之外，效率革命同样成立。\n\r\n \n2025.2\n中国开源大模型下载量首超美国\n继 DeepSeek-R1 震动全球之后，阿里通义千问（Qwen）等中国开源矩阵集体爆发。据麻省理工学院等机构统计，2025 年中国开源 AI 模型的全球下载量占比首次超越美国、跃居全球第一——\"开源平权\"从口号变成了可量化的格局逆转。\n\r\n \n2025\n多模态大爆发：视频、图像、语音齐飞\nAI 视频进入可生产级：可灵（Kling）、Sora 2、Runway Gen-4 相继迭代，国产\"即梦\"让普通创作者一键出片；AI 图像（即梦 / Midjourney）从\"能看\"走向\"能用\"；AI 语音合成与实时语音对话逼近以假乱真。多模态不再是演示，而成为内容生产的新基建。\n\r\n \n2025\nAI 编程与\"一人公司\"跑通闭环\nCursor、Claude Code、GitHub Copilot 等 AI 编程工具从\"代码补全\"进化为\"结对工程师\"，独立开发者一人即可完成从前需要数人团队的产品——\"一人公司\"借助 AI 杠杆跑通从创意到商业化的完整闭环。编程成为 Agent 能力最早、最彻底落地的主战场。\n\r\n \n2025—2026\n智能体（Agent）时代\n模型从\"会回答\"进化到\"会做事\"：推理模型（o 系列 / R 系列）先想后答，Agent 开始独立完成编程、调研、订票等长链条任务。2026 年，旗舰模型之间的差距收窄到\"选谁看场景\"，竞争的焦点转向成本、Agent 能力与生态。\n\r\n \n2026 · 趋势\nAgent 元年：从\"陪聊\"到\"干活\"\n智谱 GLM-5 登顶全球开源第一、OpenClaw 等智能体产品刷屏出圈，AI 的叙事重心从\"生成内容\"转向\"完成任务\"。模型能力趋同后，胜负手变为谁能调度最多工具、跑通最长的任务链。\n\r\n \n2026 · 趋势\n推理成本悬崖式下降，Token 经济学兴起\n推理成本较 2025 年再降一个数量级，推理模型从付费墙后走向全民；中国开源模型持续霸榜 HuggingFace，成为全球开发者首选基座。参数竞赛退潮，\"每单位智能的成本\"成为新的竞争叙事。\n\r\n \n\r\n\r\n\r\n\r\n \n\r\n \nVOLUME II\n\r\n \n卷二 · 中国 AI 之路\n\r\n \n从\"863 计划\"埋下火种，到 DeepSeek 震动全球，中国 AI 用四十年走完了从跟跑到局部领跑的征途。这条路上既有国家工程的恢弘叙事，也有草根工程师的孤勇。\n\r\n \n\r\n \n\r\n \n1980s\n火种：从 863 计划起步\n1986 年\"863 计划\"将智能计算机列入国家高技术研究发展计划；1990 年代，清华大学、中科院相继成立人工智能研究机构。彼时中国与世界差距悬殊，但人才梯队悄然成形。\n\r\n \n1999\n科大讯飞：语音突围\n脱胎于中国科大的科大讯飞成立，以中文语音合成与识别为切口，后来成为中文语音市场的长期霸主，证明了\"中文场景\"本身就是一条护城河。\n\r\n \n2011—2014\n巨头觉醒：百度先行\n2011 年硅谷\"谷歌大脑\"启动的次年，百度成立深度学习研究院（IDL），\n李彦宏\n 亲自参与对辛顿团队的全球竞价，虽未得手，却请来吴恩达执掌百度大脑。阿里、腾讯随后跟进，中国互联网巨头全面转向 AI。\n\r\n \n2014—2017\n视觉四小龙与国家战略\n商汤、旷视、依图、云从\"AI 四小龙\"借计算机视觉风口崛起，商汤由 \n汤晓鸥\n 创立、一度成为全球估值最高的 AI 独角兽。2017 年国务院发布《新一代人工智能发展规划》，提出 2030 年成为世界主要 AI 创新中心——AI 上升为国家战略。\n\r\n \n2023\n百模大战\n文心一言抢发，通义千问、讯飞星火、智谱 GLM、Kimi 等百余家大模型混战。喧嚣之中也伴随着质疑：\"套壳\"与\"重复造轮子\"的争论贯穿全年。\n\r\n \n2023.7\n盘古气象模型登上《Nature》正刊\n华为云盘古气象大模型论文登上《Nature》，成为首个精度超越传统数值预报的 AI 模型，速度提升一万倍以上，并上线欧洲中期天气预报中心官网。中国 AI 第一次在基础科学应用上拿到世界级勋章。\n\r\n \n2025.1\nDeepSeek 时刻：换道超车\n量化基金出身的 \n梁文锋\n 带领 DeepSeek，用极致的工程效率（MLA 架构、MoE 精细化）在算力受限条件下训练出 R1，成本仅为美国同行的零头，并完全开源。R1 登顶美区 App Store，硅谷惊呼\"斯普特尼克时刻\"。它证明：限制可以逼出创新，开源可以改写权力格局。\n\r\n \n2026\n集群化与上市潮\n智谱、MiniMax 等大模型公司相继上市，单月亿级融资达 42 起；阿里千问、字节豆包、DeepSeek-V4 构成第一梯队；AI 应用从模型竞赛转入\"Agent + 行业落地\"的深水区。\n\r\n \n\r\n\r\n\r\n\r\n\r\n \n\r\n \nVOLUME III\n\r\n \n卷三 · 人物列传\n\r\n \n历史是技术写的，但标点是人点的。以下十位人物，用各自的选择塑造了 AI 的走向——有人点燃了火，有人试图把火关进笼子。\n\r\n \n\r\n \n\r\n \nAI 之父 · 悲剧天才\n艾伦·图灵\n破解恩尼格玛密码的二战英雄，1950 年提出\"机器能思考吗\"。1954 年因时代偏见被迫害致死，半个世纪后才获英国王室赦免。今天每一句与 AI 的对话，都是对他问题的回答。\n\"我们只能看到很近的将来，但那里已有足够多的工作要做。\"\n\r\n \n深度学习教父\n杰弗里·辛顿\n在神经网络最不被看好的三十年里死磕反向传播，2012 年 AlexNet 一战封神，2018 年获图灵奖、2024 年获诺贝尔物理学奖。晚年却成为 AI 风险最响亮的警告者，从谷歌辞职只为\"自由地谈论危险\"。\n\"我毕生的工作，可能正在创造取代人类的东西。\"\n\r\n \nOpenAI 掌舵人\n山姆·奥特曼\n19 岁从斯坦福辍学创业，30 岁执掌 YC，2015 年联合创办 OpenAI。2023 年 11 月被董事会罢免、五天后在员工\"集体逼宫\"中复职——这场宫斗暴露了\"加速派\"与\"安全派\"的根本裂痕。他如今手握史上最大规模的算力豪赌。\n宫斗\n星际之门计划\n\r\n \n技术灵魂 · 出走者\n伊利亚·苏茨克维\nAlexNet 作者之一、GPT 系列关键推动者，OpenAI 前首席科学家。他主导了 2023 年罢免奥特曼的董事会行动，又在事后公开表示后悔。2024 年离职创立 Safe Superintelligence（SSI），只做一件事：安全的超级智能。\n超级对齐\nSSI\n\r\n \n算力之王\n黄仁勋\n1993 年创立英伟达，赌上公司命运做 CUDA，把游戏显卡变成 AI 时代的\"新石油\"。2016 年亲手把第一台 DGX-1 送给 OpenAI 时，没人想到这家公司日后会成为全球市值之王——也没人能预见 2025 年 1 月那个暴跌 17% 的夜晚。\n\r\n \nDeepMind 创始人 · 诺奖得主\n戴米斯·哈萨比斯\n神童棋手、游戏设计师、神经科学博士。AlphaGo、AlphaFold 之父——后者预测了两亿多个蛋白质结构，为他赢得 2024 年诺贝尔化学奖。他证明了 AI 不只是聊天工具，更是科学发现的加速器。\n\r\n \n开源旗手 · 深度学习三巨头\n杨立昆（Yann LeCun）\n卷积神经网络之父，Meta 首席 AI 科学家，2018 年图灵奖得主。他力主开源路线，Llama 系列成为全球开源生态的地基；同时是大模型路线最激烈的批评者，坚称\"仅靠自回归模型到不了 AGI\"。\n\r\n \n中国 AI 布道者\n李彦宏\n2010 年代初便断言\"互联网的下一幕是人工智能\"，百度十年千亿投入 AI：IDL、Apollo 自动驾驶、文心大模型。押注最早、争议也最多，但他让中国巨头在 AI 牌桌上始终没有缺席。\n\r\n \nDeepSeek 创始人 · 理想主义者\n梁文锋\n浙江大学出身，量化基金幻方量化创始人。用炒股赚来的钱囤下万张 GPU\"研究好奇心\"，2023 年创立 DeepSeek。他坚持开源、坚持底层创新、不融资不上市，用 560 万美元训练成本撬动了全球 AI 格局。\n\"中国 AI 不可能永远处在跟随的位置。\"\n\r\n \n计算机视觉先驱 · 巾帼\n李飞飞\nImageNet 的缔造者——没有她标注的 1400 万张图片，就没有 2012 年深度学习的大爆炸。从洗碗工之女到斯坦福教授，再到空间智能创业，她始终在问同一个问题：如何构建\"以人为本的 AI\"。\n\r\n \n视觉宗师 · 薪火相传\n汤晓鸥\n商汤科技创始人，让中国人脸识别算法首次超越人眼。2023 年 12 月因病逝世，年仅 55 岁。他创办的香港中文大学多媒体实验室被誉为\"计算机视觉黄埔军校\"，门下学生撑起了中国 AI 视觉的半壁江山。\n\r\n \n安全派领袖\n达里奥·阿莫代伊\n因理念分歧于 2020 年带领核心团队离开 OpenAI，创立 Anthropic，Claude 成为\"负责任 AI\"路线的标杆。他与奥特曼的分道扬镳，是这个行业最深刻路线的分叉口：先跑再说，还是先想清楚再跑。\n\r\n \nAI 教育的普罗米修斯\n吴恩达（Andrew Ng）\n谷歌大脑创始人之一、百度前首席科学家、Coursera 创始人。他主讲的机器学习课程让全球数百万人零基础入门 AI——论\"把 AI 带给普通人\"，无人比他做得更多。如今他倡导\"数据为中心\"的 AI 与全民 AI 素养教育。\n\"AI 是新的电力。而教育，是让每个人都用上电的电网。\"\n\r\n \nVibe Coding 之父\n安德烈·卡帕西（Andrej Karpathy）\n特斯拉前 AI 总监、OpenAI 创始成员。他的公开课是无数工程师的启蒙读物。2025 年他提出\"Vibe Coding（氛围编程）\"——用自然语言描述意图、让 AI 写代码——这个词一年内风靡全球，直接催生了 DeepSeek Harness 这类框架的土壤，彻底改变了\"谁能创造软件\"。\nVibe Coding\nnanoGPT\n\r\n \n三巨头中最不安的一位\n约书亚·本吉奥（Yoshua Bengio）\n2018 年图灵奖得主，深度学习三巨头之一。近年全力转向 AI 安全，公开签署\"AI 灭绝风险\"联名信，创立 LawZero 研究\"不会撒谎的 AI\"。他的存在提醒整个行业：最懂这项技术的人，恰恰最敬畏它。\n\r\n \n长文本之王 · 90 后掌门\n杨植麟\n月之暗面（Moonshot AI）创始人，Transformer-XL 与 XLNet 的核心作者。他创立的 Kimi 以\"长文本\"撕开百模大战的缺口，成为现象级应用——一个技术天才带着学术直觉做产品的样本。\n\r\n \nAI 布道者 · 连续创业者\n李开复\n从苹果、微软、谷歌中国总裁，到创新工场，再到 2023 年创立零一万物（01.AI）。他 2017 年的《AI·未来》预言了就业重构，此后每年都在为\"普通人如何不被 AI 抛下\"奔走疾呼。\n\r\n \n中国云计算先知\n王坚\n阿里云创始人，中国工程院院士。2009 年在全公司质疑声中坚持自研云计算，\"骗子\"骂名背了四年。没有他赌来的云底座，就没有后来中国大模型的训练土壤——包括 Qwen 的每一次迭代。\n\r\n \n\r\n\r\n \n\r\n \nEPILOGUE OF VOLUME III\n\r\n \n附篇 · 这些人物如何改变了\"你\"的生活\n\r\n \n人物列传不是名人堂。他们每个人做的事，最终都变成了普通人生活里具体的变化：\n\r\n \n\r\n \n\r\n \n\r\n \n人物\n他们做的事\n落到你身上的影响\n\r\n \n奥特曼 / OpenAI\n把大模型装进聊天框，2026 年 GPT-5.6 推理能力免费开放\n不花一分钱，就能拥有一个会\"深度思考\"的随身顾问——写方案、改简历、辅导孩子作业\n\r\n \n卡帕西\n提出 Vibe Coding：说人话，AI 写代码\n\"我不会编程\"不再是借口。本站、本页，都是这一理念的产物——普通人第一次能亲手造软件\n\r\n \n梁文锋 / DeepSeek\n开源 R1 + Harness 框架，成本打到地板\n大模型从\"大公司奢侈品\"变成\"全民基础设施\"：无数国产 App 免费满血接入，你用的每个 AI 功能都在因此变便宜\n\r\n \n吴恩达\n免费公开课遍布全球\n任何人，无论学历背景，都能系统学会 AI——教育平权是 AI 时代最被低估的慈善\n\r\n \n李飞飞\nImageNet 点燃视觉革命，倡导以人为本\n你手机里的人脸解锁、相册自动分类、扫一扫识物，全部源自她铺下的数据基石\n\r\n \n哈萨比斯\nAlphaFold 破解蛋白质结构\n新药研发周期从十年级缩短到年级——它终将以\"更便宜的药、更快上市的疫苗\"的形式救你的命\n\r\n \n辛顿 & 本吉奥\n晚年转向 AI 风险警告\n你看到的每一条内容标注规范、每一次模型发布前的安全评估，背后都有他们推动的制度化力量\n\r\n \n杨植麟 / Kimi\n把长文本做成国民级产品\n扔给 AI 一整本书、一份百页合同、一年财报——\"读完再答\"成为普通人触手可及的能力\n\r\n \n\r\n \n\r\n\r\n\r\n\r\n \n\r\n \nVOLUME IV\n\r\n \n卷四 · 2026 最新模型横评\n\r\n \n截至 2026 年 8 月的旗舰对决。头部模型之间的差距已收窄到\"选谁取决于场景\"——推理看 R 系列与 o 系列，编程看 Claude 与 Gemini，性价比与开源看 DeepSeek。\n\r\n \n\r\n \n\r\n \n\r\n \n模型\n公司 / 国家\n开放性\n最强项\n一句话点评\n\r\n \nGPT-5.6（Sol/Terra/Luna）\nOpenAI · 美国\n闭源\n综合均衡、生态最完整\n7 月发布三档型号；8 月免费用户获无限对话 + Think 推理，普惠力度史无前例\n\r\n \nClaude Opus 4.x\nAnthropic · 美国\n闭源\n编程、长文写作、Agent 工具调用\n开发者口碑之王，\"写代码最像人类工程师\"的模型\n\r\n \nGemini 3 / 3.7 Flash\nGoogle · 美国\n闭源\n多模态、超长上下文、编码 Agent\n8 月 13 日新发 3.7 Flash 主打\"最智能的工作马\"，限时半价抢市场\n\r\n \nDeepSeek-V4 / R2 + Harness\nDeepSeek · 中国\n开源\n推理、极致性价比、Agent 框架\n推理成本比 GPT-5 低约 90%；8 月 13 日开源 Harness 框架（一切皆插件），补齐\"模型Agent\"最后一公里\n\r\n \nLlama 4\nMeta · 美国\n开源权重\n开源生态、可定制性\n开源社区的底座，微调与衍生模型数量第一\n\r\n \nQwen3.8-Max\n阿里 · 中国\n开源\n全尺寸矩阵、中文能力\n8 月 3 日发布的千问史上最大旗舰，首次开源超大杯，基准分全面补齐，下载量长期霸榜\n\r\n \n豆包 / Seed 系列\n字节跳动 · 中国\n闭源\nC 端体验、语音、多模态\n国内用户量最大的 AI 助手，产品化能力标杆\n\r\n \nKimi k 系列\n月之暗面 · 中国\n闭源\n长文本、搜索推理\n长文档处理的代名词，Agent 检索能力持续进化\n\r\n \n\r\n \n\r\n \n注：模型版本与价格基于 2026 年公开报道归纳，AI 领域迭代极快，请以官方最新发布为准。\n\r\n\r\n\r\n\r\n\r\n \n\r\n \nVOLUME V\n\r\n \n卷五 · 影响篇：AI 如何重写现实世界\n\r\n \n不谈参数，只谈后果。以下每一个领域，AI 都已经留下了可量化的、不可逆的脚印。\n\r\n \n\r\n\r\n \nIMPACT 01 · 文学\n第一篇获奖的 AI 小说：潘多拉的墨盒\n\r\n \n2023 年 10 月，清华大学教授沈阳使用 AIGC 创作的科幻小说《机忆之地》获得江苏省科普科幻作品大赛奖项——文学史上 AI 深度参与创作的作品首次获奖。2024 年 1 月，日本作家九段理江凭《东京都同情塔》摘得芥川奖，并公开承认约 5% 内容由 AI 生成，文学界哗然。\n\r\n \n冲击是双重的：一端是\"AI 亵渎文学\"的愤怒，另一端是网文行业的静默革命——AI 辅助日更万字成为流水线标配。争议的共识落点逐渐清晰：\n机器可以生成文字，但\"为什么写、为谁写\"仍是人的特权。\n本项目的《白驹 ccowork》正是这场争论的文学化回应。\n\r\n \n关键事实：2023《机忆之地》首奖  2024 芥川奖《东京都同情塔》 2026 年主流网文平台普遍要求标注 AI 辅助比例。\n\r\n \n\r\n\r\n \nIMPACT 02 · 财富\nAI 赚钱：新淘金热与重排的牌桌\n\r\n \nAI 制造了 21 世纪最陡峭的财富曲线：英伟达三年内市值从数千亿冲上全球之巅；OpenAI 估值突破数千亿美元；2026 年 1 月中国 AI 领域亿级以上融资达 42 起，智谱、MiniMax 相继上市，阶跃星辰单笔融资超 50 亿元。\n\r\n \n但同一枚硬币的另一面：2025 年 1 月 27 日，DeepSeek-R1 让英伟达单日蒸发约 5900 亿美元——\n人类股市史上最大的单日市值蒸发\n。AI 时代的财富逻辑第一次被\"效率\"而非\"垄断算力\"撼动。应用层同样疯狂：AI 代写、AI 视频、AI 数字人构成草根创富新赛道，\"一人公司\"借助 AI 杠杆成为真实存在的商业形态。\n\r\n \n关键事实：DeepSeek 以约 560 万美元训练成本，挑落数万亿美元的\"算力神坛\"叙事。\n\r\n \n\r\n\r\n \nIMPACT 03 · 内容生态\nAI 博文与内容洪水：注意力的通胀\n\r\n \nAI 让\"写一篇像模像样的文章\"的边际成本趋近于零。结果是内容供给侧的大洪水：营销号批量产文、AI 稿件充斥信息流、平台被迫上线 AIGC 检测与标注系统。\n\r\n \n内容行业由此完成一次价值重排：\n信息整合型写作迅速贬值，第一手经验、独家观点、人格化表达大幅升值。\n媒体机构一边用 AI 自动生成财报与赛事简讯，一边把更多资源压向调查报道与深度特稿。对普通创作者的启示直白而残酷：别和机器比产量，要和机器比\"只有你能说的话\"。\n\r\n \n关键事实：主流平台（公众号、知乎、B站等）均已上线 AI 内容标注规范；\"AI 味\"成为读者最敏感的低质信号。\n\r\n \n\r\n\r\n \nIMPACT 04 · 气象\nAI 天气：从超算机房到秒级预报\n\r\n \n这是 AI 最没有争议、最纯粹的胜利。2023 年 7 月，\n华为云盘古气象大模型登上《Nature》正刊\n：首个精度超越传统数值预报的 AI 模型，速度提升一万倍以上——把超算数小时的全球预报压缩到秒级，并上线欧洲中期天气预报中心（ECMWF）官网。谷歌 DeepMind 的 GraphCast 同期在 90% 的检验指标上超越最权威的传统系统。\n\r\n \n此后上海人工智能实验室\"风乌\"、复旦\"伏羲\"相继跟进，中国形成气象大模型集群。到 2026 年，AI 预报已深入台风路径预测与极端天气预警——它直接关系着灾害面前的生命。\n\r\n \n关键事实：AI 预报不模拟物理方程，而是从数十年观测数据中\"学会\"大气的脾气——方法论上的范式革命。\n\r\n \n\r\n\r\n \nIMPACT 05 · 就业\nAI 与饭碗：创造性破坏进行时\n\r\n \n2026 年全球就业报告给出一组矛盾又真实的数字：AI 相关岗位新增约 1200 万，被重组或消失的岗位约 800 万。普华永道《2026 全球 AI 就业报告》的结论是：\nAI 加速技能转型而非简单替代\n——掌握 AI 工具的劳动者薪资溢价显著，岗位内容的重组快于岗位的消失。\n\r\n \n消失最多的是：初级文案、基础翻译、模板化设计、简单客服与代码 CRUD；增长最快的是：AI 训练师、提示词工程师、Agent 流程设计师、AI 伦理审计，以及一切\"AI + 垂直行业\"的复合岗位。历史没有重复，但押韵——如同汽车消灭马车夫却创造了整个公路文明。\n\r\n \n关键事实：2025 年市场薪酬整体下行时，AI 相关岗位降幅更小、高薪占比优势明显（腾讯研究院 × 劳动经济学会报告）。\n\r\n \n\r\n\r\n \nIMPACT 06 · 科学\nAI for Science：第四种科研范式\n\r\n \nAlphaFold 预测两亿多个蛋白质结构，把生物学五十年的难题压缩成几年；2024 年诺贝尔物理学奖与化学奖双双颁给 AI 相关研究，史无前例。AI 正在成为继实验、理论、计算之后的\"第四科研范式\"：从气象到材料、从药物到数学猜想证明。\n\r\n \n关键事实：2024 年辛顿获诺贝尔物理学奖、哈萨比斯获诺贝尔化学奖——AI 第一次以\"科学本身\"而非\"科学工具\"的身份加冕。\n\r\n \n\r\n\r\n\r\n\r\n\r\n \n\r\n \nVOLUME VI\n\r\n \n卷六 · 未来简史\n\r\n \n如果过去七十六年教会我们什么，那就是：预测 AI 的人总是错的——错在低估了它。\n\r\n \n\r\n \n\r\n \n趋势一\nAgent 成为新操作系统\nAI 从\"对话框里的顾问\"变成\"替你干活的数字员工\"。2026 年之后，竞争的不再是模型本身，而是谁能调度最多的工具、完成最长的任务链。\n\r\n \n趋势二\n物理 AI 与世界模型\n智能从屏幕走向现实：自动驾驶、人形机器人、世界模型（如 Momenta 等公司押注的路线）让 AI 开始理解并操作物理世界。\n\r\n \n趋势三\n能源与算力的终极博弈\n万亿参数模型背后是吉瓦级的电力需求。DeepSeek 式效率革命与\"星际之门\"式算力扩张将长期并存，能源成为 AI 竞赛的隐藏变量。\n\r\n \n趋势四\n开源与闭源的拉锯\nDeepSeek 证明开源可以逼近甚至追平闭源，Llama 与 Qwen 构成开放生态。权力的天平在\"集中\"与\"普惠\"之间持续摇摆。\n\r\n \n趋势五\n治理与安全的制度化\n从欧盟 AI 法案到各国备案制度，从 SSI 的\"超级对齐\"到内容标注规范——AI 治理正从口号变成法律、标准与职业。\n\r\n \n趋势六\n人的重新定义\n当技能全面平权，\"提出好问题的能力\"\"真实的生命经验\"\"承担责任的意愿\"成为人类最后的、也是最初的护城河。\n\r\n \n\r\n\r\n \n\r\n \n历史不会记住模型，\n历史只记住用模型改变了什么的人\n\r\n \n1956 年达特茅斯的先驱们无法想象 ChatGPT，正如今天的我们无法想象 2076 年。\r\n 唯一确定的是：每一个时代最精彩的作品，都出自最先学会与新工具共舞的人。\r\n 回到主站，开始属于你的那一页。\n\r\n \n<i class=\"cc-ic cc-back\" data-ic=\"arrow-left\"></i> 返回 白驹 ccowork主站\n\r\n \n\r\n\r\n\r\n\r\n \nAI 全景编年史\n\r\n \n资料来源：公开新闻报道、学术期刊（Nature）、机构报告（普华永道 / 腾讯研究院 / 上海科技大学 CEISD）等，经归纳整理 · 2026","站内·工科实训项目":"# 工科实训项目\n\n工科实训项目 · 白驹 ccowork（离线版）\n \n白驹 ccowork · 离线版\n<i class=\"cc-ic cc-back\" data-ic=\"arrow-left\"></i> 返回总览\n工科实训项目（真动手清单）\n从\"看懂了\"到\"做出来\"，这些项目都能在本目录或免费开源工具里完成。\n1. 机械/控制类\nPID 温控仿真\n：用 \n01_pid_controller.py\n 改造，加噪声、调参，观察超调。\n倒立摆/小车\n：用 Gazebo + ROS 仿真，再学 PID/LQR。\n弹簧振子\n：改 \n02\n 参数，验证阻尼比对衰减的影响。\n2. 电气/电子类\nRC/RL 暂态\n：跑 \n04_rc_circuit.py\n，再用 ngspice 画同一条曲线对比。\n放大电路\n：LTspice 搭共射放大电路，仿真增益与频率响应。\nPCB 设计\n：KiCad 画一块最小系统板。\n3. 数控/制造类\nG 代码仿真\n：把本目录 3 个 .nc 拖进 CNCjs/NC Viewer 看刀路。\n生成一个零件\n：让 AI 生成一个\"六边形法兰\"的 G 代码，逐行复核、仿真。\n3D 打印\n：学切片软件（Cura/PrusaSlicer），打一个机械零件。\n4. 编程/数据类\n物理仿真库\n：把 5 个仿真脚本整合成一个带命令行参数的 \nsimlab.py\n。\n测试驱动\n：给每个仿真补 pytest 测试，覆盖边界条件。\n可视化\n：用 matplotlib 给仿真画曲线、动画。\n5. 综合实训（毕业级）\n数字孪生小系统\n：选一个简单系统（如
