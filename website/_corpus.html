    except Exception as e:\n            print(\"错误：\", e)\n\ncalc()\n```\n\n再写一个自动化的：\n\n```python\n# 批量重命名文件（工科生整理实验数据常用）\nimport os\n\ndef batch_rename(folder, prefix):\n    for i, name in enumerate(sorted(os.listdir(folder)), 1):\n        ext = os.path.splitext(name)[1]\n        new = f\"{prefix}_{i:03d}{ext}\"\n        os.rename(os.path.join(folder, name), os.path.join(folder, new))\n        print(f\"{name} -> {new}\")\n\nbatch_rename(r\"D:\\实验数据\", \"样本\")   # 把路径换成你的\n```\n\n---\n\n## 二、AI 时代怎么学计算机\n\n计算机基础就四块，别贪多，按顺序啃：\n\n| 模块 | 学什么 | 为什么要学 | 多久 |\n|------|--------|------------|------|\n| **计算机组成** | CPU/内存/硬盘怎么工作 | 理解程序怎么跑 | 2 周 |\n| **操作系统** | 进程、内存、文件系统 | 理解软件运行环境 | 3 周 |\n| **计算机网络** | TCP/IP、HTTP、DNS | 理解一切联网应用 | 3 周 |\n| **数据结构与算法** | 数组/链表/树/排序 | 面试 + 编程内功 | 长期 |\n\n**AI 学法**：每学一个概念，让 DeepSeek 用「生活化比喻 + 小测验」讲一遍；每学一个算法，让它给一个「手算例子」带你走一遍。\n\n---\n\n## 三、AI 时代怎么操控数控编程（CNC）\n\n### 3.1 数控编程是什么\n\n数控机床（CNC）靠 **G 代码（G-code）** 控制。G 代码就是「告诉机床：往哪走、走多快、切多深」的一串指令。\n\n### 3.2 AI 怎么帮你写 G 代码\n\n你描述需求，AI 生成 G 代码骨架，你在仿真器里验证后再上真机：\n\n```\n你是数控编程工程师。我要在 100x100 的铝板上铣一个 20x20 的方槽，\n深度 2mm，用 6mm 平底铣刀。请写一段 G 代码，并解释每行的含义。\n```\n\n### 3.3 真实 G 代码示例（可看懂）\n\n```gcode\n; 铣一个 20x20 方槽（示例，坐标单位 mm）\nG21          ; 公制单位\nG90          ; 绝对坐标\nG17          ; XY 平面\nG0 Z5        ; 抬刀到安全高度\nG0 X0 Y0     ; 快速移动到起点\nG1 Z-2 F60   ; 下刀 2mm，进给 60\nG1 X20 F100  ; 铣到 (20,0)\nG1 Y20       ; 铣到 (20,20)\nG1 X0        ; 铣到 (0,20)\nG1 Y0        ; 回到 (0,0) 完成一圈\nG0 Z5        ; 抬刀\nM30          ; 程序结束\n```\n\n### 3.4 开源数控工具（免费，能真练）\n\n| 工具 | 用途 | 特点 |\n|------|------|------|\n| **LinuxCNC** | 开源数控控制系统 | 真实机床控制，工业级 |\n| **GRBL** | 开源运动控制固件 | 跑在 Arduino 上，DIY 雕刻机首选 |\n| **FreeCAD + CAM** | 开源 CAD/CAM | 画图 + 自动生成刀路 |\n| **NCViewer / CAMotics** | G 代码仿真 | 写好的代码先仿真看刀路，不上真机 |\n\n**红线**：G 代码**必须先在仿真器里跑**，确认刀路无误，再上真机——真机撞刀会出事故。\n\n---\n\n## 四、工科实训怎么练\n\n工科实训的核心是「动手」。AI 时代，实训可以这样升级：\n\n| 实训方向 | 传统做法 | AI 时代做法 |\n|----------|----------|-------------|\n| 机械制图 | 手绘/二维 CAD | AI 辅助三维建模（FreeCAD/Onshape） |\n| 电路设计 | 面包板试错 | 先用仿真软件验证再搭 |\n| 单片机 | 从零啃寄存器 | AI 生成代码框架 + 仿真调试 |\n| 机器人 | 反复撞车 | Gazebo 仿真里先跑通再上真机 |\n| 实验报告 | 手写整理 | AI 整理数据、绘图、排版 |\n\n**心法**：AI 能帮你「少走弯路」，但「动手」这一步谁也替不了。仿真是实训的「安全网」，真机是「考试」。\n\n---\n\n## 五、仿真模拟（重点 · 特别多）\n\n### 5.1 为什么要仿真\n\n仿真 = 在电脑里「预演」真实世界。它的价值：\n\n1. **省钱**：撞机、烧板、爆炸，都先在电脑里发生，不花钱不伤人。\n2. **加速**：真实实验要几天，仿真几秒。\n3. **安全**：危险的、不可逆的，先在仿真里试。\n4. **可视化**：看不见的（应力、电场、流场）能画出来。\n\n### 5.2 仿真类型 + 对应开源工具（全部免费）\n\n| 仿真类型 | 开源工具 | 能干什么 |\n|----------|----------|----------|\n| **物理/机械仿真** | Blender、Gazebo | 刚体、碰撞、机器人运动 |\n| **电路仿真** | LTspice、KiCad(内置 ngspice) | 电路、模拟信号 |\n| **机械设计/有限元** | FreeCAD(FEM)、CalculiX | 应力、变形、结构分析 |\n| **流体/热仿真** | OpenFOAM | 流体力学、传热 |\n| **多物理场** | Elmer、FEniCS | 电磁、热、结构耦合 |\n| **通用科学仿真** | Python(numpy/scipy/matplotlib) | 数学建模、算法验证 |\n| **机器人仿真** | Gazebo + ROS | 机器人运动学、SLAM |\n\n### 5.3 Python 仿真实战（真实代码，能直接跑）\n\n**例 1：抛体运动仿真**（学物理 + 学 Python 一步到位）\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# 物理参数\nv0, theta = 20.0, 45.0          # 初速度 20 m/s，仰角 45°\ng = 9.81\nvx = v0 * np.cos(np.radians(theta))\nvy = v0 * np.sin(np.radians(theta))\n\nt = np.linspace(0, 2*vy/g, 200)  # 飞行时间\nx = vx * t\ny = vy * t - 0.5 * g * t**2\n\nplt.plot(x, y)\nplt.xlabel(\"水平距离 (m)\")\nplt.ylabel(\"高度 (m)\")\nplt.title(\"抛体运动仿真\")\nplt.grid(True)\nplt.show()\n```\n\n**例 2：RC 电路充电仿真**（电路 + 微分方程）\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nR, C, V = 1e3, 1e-6, 5.0   # 1kΩ, 1µF, 5V\ntau = R * C\nt = np.linspace(0, 5*tau, 500)\nvc = V * (1 - np.exp(-t/tau))\n\nplt.plot(t*1e3, vc)\nplt.xlabel(\"时间 (ms)\")\nplt.ylabel(\"电容电压 (V)\")\nplt.title(\"RC 电路充电曲线\")\nplt.grid(True)\nplt.show()\n```\n\n**例 3：简单弹跳球模拟**（动画仿真）\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport matplotlib.animation as animation\n\ng = 9.81\nh0 = 10.0           # 初始高度\ndt = 0.02\nh, v = h0, 0.0\nframes, times = [], []\nfor i in range(300):\n    v -= g * dt\n    h += v * dt\n    if h < 0:        # 落地反弹，能量衰减\n        h = -h\n        v = -v * 0.8\n    frames.append(h); times.append(i*dt)\n\nfig, ax = plt.subplots()\nax.set_ylim(0, h0+2)\nax.set_xlabel(\"时间\"); ax.set_ylabel(\"高度\")\nline, = ax.plot([], [], 'o-')\ndef update(i):\n    line.set_data([0], [frames[i]])\n    return line,\nani = animation.FuncAnimation(fig, update, frames=len(frames), interval=20)\nplt.show()\n```\n\n### 5.4 仿真测试方法论（重点，特别多）\n\n仿真不是「跑一遍就完」，而是一套严谨流程。记住这套「仿真测试六步法」：\n\n1. **明确目标**：你要验证什么？一个物理量？一个控制策略？一个结构强度？目标不清晰，仿真就是白跑。\n2. **建模型**：把真实系统抽象成数学模型。**模型越简单越好**，先验证最简单的，再逐步加复杂度。\n3. **选参数**：边界条件、初始条件、材料参数——**参数错一个，结果全错**。\n4. **网格/步长收敛性**：加密网格、缩小步长，看结果是否稳定。**结果随网格变 = 没收敛 = 不可信**。\n5. **验证（Verification）与校验（Validation）**：\n   - 验证 = 你「算对了吗」（代码 bug？算法对不对？）\n   - 校验 = 你「算对的东西是对的吗」（和真实实验/理论解对不对得上？）\n6. **敏感性分析**：改一个参数 ±10%，结果变多少？找出「哪个参数最要命」。\n\n**仿真三大陷阱（务必记住）**：\n\n| 陷阱 | 表现 | 破解 |\n|------|------|------|\n| **垃圾进垃圾出** | 参数拍脑袋乱填，结果很漂亮但没用 | 每个参数都要有出处 |\n| **假收敛** | 换个网格/步长结果就飘 | 必须做收敛性验证 |\n| **把仿真当现实** | 直接信仿真结果，不做实验对标 | 仿真必须和实验/理论互相印证 |\n\n### 5.5 一套完整的「仿真 + 实训」闭环\n\n```\n需求分析  数学建模  写仿真代码/搭仿真模型\n    收敛性验证  与理论/实验对标  敏感性分析\n    上真机/实物实验  修正模型  再仿真\n```\n\n**AI 在其中的角色**：帮你写仿真代码、解释公式、找 bug、画图、写报告。但「这个模型对不对」的判断，永远是你自己。\n\n---\n\n## 六、一句话总结这一篇\n\n**AI 时代学工科，公式是：AI 当导师 + 仿真当安全网 + 开源工具当武器 + 你亲手练。**\n\n编程、计算机、数控、仿真，全都有开源免费的工具，全都能在电脑上真练。你现在唯一要做的，是把上面任何一段代码**复制下来跑一遍**——跑通了，你就入门了。\n\n> 下一篇实战预告：把所有开源仿真工具（FreeCAD/KiCad/Gazebo/LTspice/OpenFOAM）逐个做成「一键安装 + 第一个仿真案例」教程。\n","blog\\AI未来趋势-数字物理量子新质材料.md":"# AI 未来趋势：数字智能 × 物理智能 × 量子算力 × 新质材料\n\n> 本文是《白驹 ccowork》系列的未来展望篇。不谈已经发生的，只谈正在发生、且必然重塑世界的那条合流主线。\n\n## 一、引言：AI 的下一站，不再是屏幕\n\n过去三年，AI 的主战场在屏幕里：聊天、写作、画画、剪视频。但如果你只盯着屏幕，就会错过未来十年真正的大戏。\n\n那场大戏的关键词是四个：**数字 AI、物理 AI、量子计算、新质材料**。它们不是四个彼此孤立的赛道，而是一条正在焊接成型的完整链条——数字 AI 负责\"想\"，物理 AI 负责\"动\"，量子计算负责\"算\"，新质材料负责\"承载\"。四者相乘，就是下一次产业革命的底层逻辑。\n\n## 二、数字 AI + 物理 AI：让智能拥有身体\n\n数字 AI 的强项是语言与推理，但它没有身体，改变不了物理世界。物理 AI 要补上的，正是这一课。\n\n学术界把这条线叫**具身智能**（Embodied Intelligence）。它的核心不是\"机器人会走路\"，而是三件事的合流：\n\n**第一，世界模型。** 今天的语言模型学的是\"词与词的规律\"，世界模型要学的是\"物与物的规律\"——重力、碰撞、因果、时间。只有理解物理规律，AI 才能预测\"我推一下杯子，杯子会往哪倒\"，而不是只会用文字描述杯子倒了。\n\n**第二，人形机器人。** 从\"能走\"进化到\"能干活\"，是 2026 年之后最确定的产业方向之一。工厂里的装配、仓库里的分拣、家庭里的护理、医疗里的辅助，每一个场景背后，都是\"数字大脑 + 物理身体\"的组合。机器人的成本曲线正在复制当年手机的路：性能指数级上升，价格指数级下降。\n\n**第三，自动驾驶。** 从\"辅助驾驶\"走向\"真无人\"，本质上是同一个故事——让 AI 在物理世界里做出安全、可靠、可解释的实时决策。\n\n一句话总结：**数字 AI 是大脑，物理 AI 是身体，具身智能是\"大脑长进身体里\"。**\n\n## 三、量子计算：给 AI 换一台引擎\n\n经典计算机用 0 和 1 表示信息，一个比特同一时刻只能是一个状态。量子计算机用量子比特，它可以同时处于 0 和 1 的叠加态。这个看似玄学的差异，带来的是算力的维度级跃迁。\n\n量子计算与 AI 的结合，正在三个方向上产生真实进展：\n\n**量子机器学习。** 某些矩阵运算、采样和优化问题，量子算法存在指数级加速的理论可能。虽然离通用量子机器学习还有距离，但\"量子特征映射\"\"变分量子算法\"已经从论文走向小型硬件验证。\n\n**量子化学模拟。** 这是目前最清晰的应用场景。分子和化学反应本质上是量子系统，用量子计算机直接模拟分子，比经典计算机精确得多。这意味着药物设计、催化剂设计、材料设计，可能迎来从\"试错\"到\"计算\"的范式转变。\n\n**算力革命。** 当经典芯片逼近物理极限，量子算力将成为\"极限算力\"的下一个来源。它的意义不在于替代经典计算机，而在于解决经典计算机永远解不动的问题。\n\n一句话总结：**如果数字 AI 是算法，量子计算就是给它换上一台不受经典物理束缚的引擎。**\n\n## 四、新质材料：AI 是新时代的\"炼金术士\"\n\n过去，发现一种新材料平均需要十年、上万次实验试错。爱迪生试了上千种材料才找到灯丝，就是那个时代的缩影。而今天，AI 正在把\"试错\"变成\"计算\"。\n\n**AI 材料设计。** 用模型预测材料的性能，再反过来\"反向设计\"出具备目标性能的材料——想要一种又轻又硬又耐高温的合金？先让 AI 在虚拟空间里生成候选结构，再只对最有希望的几个做实验验证。实验次数从十万级降到百级。\n\n**材料基因组。** 像人类基因组计划一样，给材料建库、建标准、建数据。当数百万种材料的结构-性能数据被编码成可检索的\"材料基因\"，新材料的发现速度就不再受限于人的经验和运气。\n\n**落地场景。** 固态电池的能量密度、高温超导的临界温度、光伏的转化效率、航空发动机的耐热合金、工业催化剂的活性——每一个\"卡脖子\"环节，背后都站着材料问题。而材料问题，正在变成 AI 算力问题。\n\n这里有一个必须提到的中国语境：**新质生产力**。它的本质，就是\"算力 × 数据 × 新材料\"——不再靠堆人力、堆资源，而是靠智能驱动的高效能、高质量产出。\n\n一句话总结：**AI 不是只会写文章的画师，它是能凭空设计出新材料、新能源、新药物的\"炼金术士\"。**\n\n## 五、合流图景：一条完整的价值链条\n\n把这四条线放在一起看，未来十年的产业图景就清晰了：\n\n**量子计算提供极限算力  数字 AI 负责推理与设计  物理 AI 负责执行与制造  新材料成为一切的物质载体。**\n\n举例：用量子计算模拟出新型催化剂  数字 AI 设计出完整生产工艺  物理 AI（机器人）在工厂里执行生产  新材料落地为电池、芯片、药物的实体。这个链条一旦跑通，从实验室到量产的时间，会从十年压缩到一年。\n\n这不是科幻。它的每一环，在 2026 年都已经有了实验室级或小规模产业级的原型。\n\n## 六、对普通人的启示\n\n技术叙事容易让人焦虑，但真正的启示其实很简单：\n\n**第一，别怕被替代，怕的是不参与。** 历史上每一次技术革命，最先受益的从来不是最聪明的人，而是最早动手的人。\n\n**第二，学会\"与智能共舞\"。** 数字 AI 已经人人可用，物理 AI 和量子算力会通过云和工具渗透到你手里。你要做的不是理解每一个公式，而是理解\"这条链条上，我在哪个位置，能用什么杠杆\"。\n\n**第三，盯住新质材料的下游。** 电池、芯片、医药、能源——新材料的每一次突破，都会在应用端制造出新的财富窗口。你不必造材料，但可以提前卡位用它的人。\n\n结尾借用本系列的一句话：**历史不会记住模型，历史只记住用模型改变了什么的人。而下一段历史的题目，已经写好了——数字 × 物理 × 量子 × 材料。**\n","blog\\AI绘画从入门到精通.md":"# AI绘画从入门到精通\n\n> 从「文字变图片」到「商业级作品」，这份指南覆盖AI绘画的全部关键知识。\n\n---\n\n## 一、主流工具对比\n\n| 工具 | 优势 | 适合人群 | 价格 |\n|------|------|----------|------|\n| Midjourney | 画质最高、艺术感强 | 专业设计师 | $10-60/月 |\n| DALL-E 3 | 文字理解最精准 | 需要精确控制的场景 | ChatGPT Plus内含 |\n| Stable Diffusion | 开源免费、可本地部署 | 技术爱好者 | 免费 |\n| 即梦 | 中文优化好 | 国内用户 | 免费额度 |\n| 可灵 | 视频生成联动 | 短视频创作者 | 免费额度 |\n\n---\n\n## 二、提示词公式\n\n### 基础公式\n\n```\n[主体描述] + [环境/背景] + [风格] + [画质/参数]\n```\n\n### 示例\n\n```\n一位穿着汉服的少女，站在樱花树下，微风拂面，\n中国古风插画风格，柔和光线，细腻笔触，\n8k分辨率，超高清 --ar 2:3\n```\n\n### 进阶技巧\n\n1. **风格关键词**：cyberpunk, oil painting, watercolor, pixel art, studio ghibli\n2. **艺术家风格**：in the style of Van Gogh, by Hayao Miyazaki\n3. **光影控制**：golden hour lighting, soft shadows, dramatic lighting\n4. **镜头语言**：close-up, wide angle, bird's eye view, macro photography\n\n---\n\n## 三、实战场景\n\n### 1. 公众号/小红书配图\n\n**需求**：快速生成符合文章调性的配图\n\n**技巧**：\n- 使用统一的风格关键词，保持账号视觉一致性\n- 生成多张选最佳，或局部重绘（inpainting）调整\n- 用--ar参数控制比例：公众号封面用16:9，小红书用3:4\n\n### 2. 产品概念图\n\n**需求**：为新产品生成概念展示图\n\n**技巧**：\n- 详细描述产品外观、材质、颜色\n- 加入使用场景（手持、桌面摆放、户外）\n- 使用product photography, studio lighting等关键词\n\n### 3. 小说/游戏角色设计\n\n**需求**：为原创角色生成视觉形象\n\n**技巧**：\n- 详细描述外貌特征（发型、眼睛、服装、配饰）\n- 指定视角（front view, side view, full body）\n- 生成多个版本供选择\n\n---\n\n## 四、本地部署（Stable Diffusion）\n\n### 安装步骤\n\n1. 安装Python 3.10+\n2. 安装Git\n3. 克隆WebUI仓库：`git clone https://github.com/AUTOMATIC1111/stable-diffusion-webui`\n4. 运行`webui-user.bat`（Windows）或`webui.sh`（Mac/Linux）\n5. 下载模型文件放入`models/Stable-diffusion`文件夹\n\n### 推荐模型\n\n- **真实系**：Realistic Vision, Deliberate\n- **动漫系**：Anything V5, Counterfeit\n- **国风**：GuoFeng, ChineseStyle\n- **通用**：SDXL, SD 1.5\n\n---\n\n## 五、版权与商用\n\n- **Midjourney**：付费会员可商用，需遵守条款\n- **Stable Diffusion**：开源模型可商用，但需注意训练数据版权\n- **建议**：商用前做版权检索，避免直接使用知名IP元素\n\n---\n\n## 六、实战练习\n\n本周挑战：\n- [ ] 用同一主题生成5种不同风格的图片\n- [ ] 为你的公众号/小红书生成一套配图\n- [ ] 尝试本地部署Stable Diffusion\n- [ ] 用AI绘画完成一个真实工作需求\n\n---\n\n> **核心**：AI绘画不是「一键生成」，而是「人机协作」。你的审美和判断力，决定最终作品的质量。\n","blog\\AI编程进阶实战.md":"# AI编程进阶实战\n\n> 从「用AI补全代码」到「用AI构建系统」，这份指南带你进入AI编程的进阶世界。\n\n---\n\n## 一、AI编程工具全景\n\n### 代码补全\n\n| 工具 | 特点 | 适合场景 |\n|------|------|----------|\n| GitHub Copilot | 最流行，生态最好 | 日常开发 |\n| Codeium | 免费Copilot | 预算有限 |\n| Cursor | AI原生IDE | 新项目开发 |\n| CodeBuddy | 国产，中文优化 | 国内开发者 |\n\n### 对话式开发\n\n- **ChatGPT/Claude/DeepSeek**：架构设计、算法讲解、代码审查\n- **v0.dev**：文字生成React组件\n- **Replit Agent**：在线协作开发\n\n### 自主Agent\n\n- **Devin**：端到端自主开发\n- **SWE-agent**：自动修复GitHub issue\n- **OpenHands**：开源AI软件工程师\n\n---\n\n## 二、进阶提示词技巧\n\n### 1. 系统架构设计\n\n```\n你是一位资深系统架构师。请设计一个[系统类型]的架构：\n1. 技术栈选型（前端/后端/数据库/缓存/消息队列）\n2. 系统架构图（文字描述各组件关系）\n3. 核心模块划分和职责\n4. 数据流设计\n5. 关键设计决策和权衡\n6. 扩展性和容错设计\n```\n\n### 2. 代码审查\n\n```\n请审查以下代码，从以下维度分析：\n1. 功能正确性：是否有bug？\n2. 性能：是否有优化空间？\n3. 可读性：命名、注释、结构是否清晰？\n4. 安全性：是否有安全漏洞？\n5. 可维护性：是否易于修改和扩展？\n6. 最佳实践：是否符合[语言/框架]的规范？\n```\n\n### 3. 重构建议\n\n```\n请重构以下代码，要求：\n1. 应用[设计模式/原则]，如SOLID、DRY\n2. 提取公共逻辑，消除重复\n3. 优化性能（时间/空间复杂度）\n4. 添加必要的错误处理和日志\n5. 保持功能不变，只改进结构\n```\n\n---\n\n## 三、AI辅助开发工作流\n\n### 需求分析  设计  编码  测试  部署\n\n**AI在每个环节的作用**：\n\n1. **需求分析**：AI生成用户故事、验收标准\n2. **系统设计**：AI生成架构方案、数据库设计\n3. **编码**：AI生成代码、补全、重构\n4. **测试**：AI生成测试用例、测试数据\n5. **部署**：AI生成Dockerfile、CI/CD配置\n6. **文档**：AI生成README、API文档\n\n---\n\n## 四、实战项目\n\n### 项目1：AI代码审查工具\n\n**功能**：自动审查GitHub PR，给出改进建议\n\n**技术栈**：GitHub API + DeepSeek API + Python\n\n**核心代码思路**：\n```python\n# 1. 获取PR diff\ndiff = github.get_pr_diff(repo, pr_number)\n\n# 2. 调用AI审查\nreview = ai.review_code(diff, rules=[\"security\", \"performance\", \"style\"])\n\n# 3. 自动评论到PR\ngithub.comment(pr_number, review)\n```\n\n### 项目2：智能文档生成器\n\n**功能**：根据代码自动生成API文档\n\n**技术栈**：AST解析 + AI生成 + Markdown输出\n\n### 项目3：代码搜索助手\n\n**功能**：自然语言搜索代码库\n\n**技术栈**：Embedding + 向量数据库 + RAG\n\n---\n\n## 五、效率提升数据\n\n根据GitHub和Stack Overflow的调研：\n\n- 使用AI辅助的开发者，编码速度提升 **55%**\n- 代码质量（bug率）降低 **30%**\n- 学习新技术的时间缩短 **40%**\n- 重复性工作减少 **60%**\n\n---\n\n## 六、未来趋势\n\n1. **AI原生IDE**：从「插件」到「核心」，AI成为IDE的中心\n2. **自然语言编程**：用中文/英文描述需求，AI生成完整系统\n3. **自主维护**：AI自动修复bug、更新依赖、优化性能\n4. **人机协作新范式**：人做架构和决策，AI做实现和优化\n\n---\n\n## 七、实战练习\n\n- [ ] 用AI完成一个完整的功能模块（从设计到测试）\n- [ ] 用AI重构一段「屎山」代码\n- [ ] 用AI为一个开源项目提交PR\n- [ ] 搭建一个AI辅助开发的工作流\n\n---\n\n> **核心理念**：AI不会取代程序员，但「会用AI的程序员」会取代「不会用AI的程序员」。你的价值在于：问题定义、架构设计、AI协作、最终把关。\n","blog\\中国AI发展史.md":"# 从跟跑到并跑：中国 AI 发展史（附 DeepSeek 时刻复盘）\n\n> 摘要：从实验室里的控制论萌芽，到互联网与移动互联网的海量数据积累，再到人脸识别、语音、安防、自动驾驶的追赶，最后到大模型「百家争鸣」与 2025 年「DeepSeek 时刻」——中国 AI 走完了一条长达半个世纪的跟跑之路。这篇文章不吹不黑，梳理这条主线，复盘梁文锋与 DeepSeek 的底层逻辑，说清国产 AI 真正的护城河，最后落到一句话：对普通人和创作者而言，这次并跑意味着什么。\n\n---\n\n## 一、漫长的积累期：从实验室到互联网\n\n很多人以为中国 AI 是 ChatGPT 之后才「突然冒出来」的。错。这条路的起点，可以追溯到半个世纪前。\n\n20 世纪 50 到 60 年代，国内已有一批学者在控制论、模式识别、机器翻译上做早期探索——那是全球人工智能的第一次浪潮，中国没有缺席，只是体量很小。真正决定命运的是后面两个基础设施的成型：\n\n**其一，1994 年接入国际互联网。** 这一年，中国通过中科院高能物理所正式接入互联网。此后十年，搜狐、新浪、网易、腾讯、阿里、百度相继成立。别小看这些「门户和搜索」，搜索引擎本质就是信息检索——一门最古老的人工智能学科；而电商、社交沉淀下来的，是后来训练模型最稀缺的东西：**数据**。\n\n**其二，云计算与移动支付的爆发。** 2010 年前后，阿里云、腾讯云把算力变成水电煤，二维码支付把 14 亿人接入数字世界。当算力、数据、场景三样东西同时到位，AI 才第一次有了「长大成人」的物质条件。\n\n这一阶段的中国 AI，身份是**学生**：论文、算法、框架，都在向西方学习。但它在悄悄攒家底。\n\n---\n\n## 二、移动互联网：应用土壤的成熟\n\n如果说基础科研是种子，那移动互联网就是土壤。三个名字绕不开：\n\n- **微信（2011）**：把社交、支付、小程序、政务塞进一个 App，创造了全球罕见的「超级应用」生态，也让中国成为全球移动互联网渗透率最高、场景最密的市场。\n- **字节跳动（2012）**：从今日头条到抖音，字节把「推荐算法」这件事做到了极致。信息流推荐本质是 AI 在每天对数亿人做实时决策——中国工程师由此练出了全球顶尖的**大规模 AI 系统工程能力**。\n- **小米（2010）**：用性价比和生态链铺开了硬件入口，后来又在 IoT、智能家居上布局，让 AI 从「屏幕里」走向「设备里」。\n\n这段历史的意义不在产品本身，而在它带来的一场「工程训练」：双十一的并发、春运的调度、短视频的推荐，这些真实世界的极端场景，把中国团队逼出了全球一流的工程执行力。**应用为王、场景为王**，成为刻在中国 AI 骨子里的基因——这是后面所有故事的前提。\n\n---\n\n## 三、追赶期：感知智能的黄金十年\n\n2016 年 AlphaGo 击败李世石，是全球 AI 的「引爆点」，也是中国 AI 的「冲锋号」。2017 年，国务院印发《新一代人工智能发展规划》，第一次把 AI 上升为国家战略。\n\n但这一阶段中国最出彩的，不是通用智能，而是**感知智能**——让机器「看」和「听」：\n\n- **人脸识别**：商汤、旷视、依图、云从并称「AI 四小龙」，在计算机视觉顶会论文、ImageNet 竞赛里和美国团队打得有来有回。人脸识别落地之深，全球无出其右——刷脸支付、刷脸进站、刷脸开锁。\n- **语音**：科大讯飞把中文语音识别、合成做到实用级，让「听写」成为亿万人的日常。\n- **安防**：海康威视、大华把视觉 AI 装进城市监控，中国成为全球智能安防的绝对主力。\n- **自动驾驶**：百度 Apollo（2017）开源平台，小马智行、文远知行、Momenta 在 Robotaxi 上与国际玩家同台竞技。\n\n客观地说，这个十年的中国 AI 是「强在感知、弱在认知」：看得见、听得懂，但想不清。而且产业链有短板——高端 GPU、底层框架、训练芯片，长期依赖进口。这给后来埋下了两个伏笔：一个是「卡脖子」的焦虑，另一个是「必须自己算」的决心。\n\n---\n\n## 四、百家争鸣：大模型时代的中国军团\n\n2022 年 11 月 ChatGPT 发布，全球进入大模型时代。中国的反应速度，比以往任何一次技术浪潮都快。\n\n2023 年是「百模大战」元年：百度**文心一言**（3 月）、阿里**通义千问**（4 月）、智谱 **GLM**、讯飞星火、商汤商量先后发布，随后月之暗面 **Kimi**、字节 **豆包**、MiniMax、零一万物、百川等加入战局。到 2023 年底，中国已发布的大模型超过 200 个，「百模大战」名副其实。\n\n2024 年格局逐渐清晰，几家真正站稳了脚跟：\n\n- **文心一言**：百度押注最早、生态最全，走「模型 + 搜索 + 智能云」路线。\n- **通义千问（Qwen）**：阿里走开源路线，Qwen 系列在国际榜单和 Hugging Face 上长期霸榜，成为全球开发者使用最广的开源模型家族之一。\n- **豆包**：字节靠 C 端投放和产品化打穿下沉市场，到 2025 年底月活约 2.27 亿，断层领先国内 AI 助手。\n- **GLM**：智谱走「学术基因 + 全栈自研」，是国内少有的从预训练框架到模型都自己做的团队。\n- **Kimi**：月之暗面靠「长文本」出圈，掀起一轮「上下文长度军备竞赛」，主打深度阅读与研究场景。\n\n还有一个容易被忽略的信号：2024 年 5 月，DeepSeek 发布 V2，率先把大模型 API 价格打到「每百万 tokens 输入 1 元」的量级，直接引发全行业价格战，被外媒称为「AI 界的拼多多」。当时多数人只把它当一场营销，几乎没人意识到，这家公司正在用「极致性价比」倒逼整个行业的成本曲线下行——而这条曲线，几个月后就要被它自己踩出一条陡坡。\n\n但要说清楚：直到 2024 年，中国大模型整体仍处于**跟跑**——能力对标 GPT，产品对标 ChatGPT，心态上「追赶美国」是主旋律。真正打破这个局面的，是一家几乎不做应用、不着急融资、员工不到 200 人的小公司。\n\n---\n\n## 五、2025「DeepSeek 时刻」：从跟跑到并跑\n\n2024 年 12 月 26 日，一家名不见经传的公司发布了 DeepSeek-V3：一个 6710 亿参数的 MoE 模型，性能对标 GPT-4o，但训练成本仅约 **557.6 万美元**——而美国同行的同类模型动辄数亿美元。这是第一声惊雷。\n\n2025 年 1 月 20 日，DeepSeek-R1 发布，一个开源的推理模型，性能对标 OpenAI 的 o1，权重全开、MIT 许可，任何人都能免费商用。这一次，全球炸了：\n\n- 1 月 27 日（美国时间），DeepSeek 应用登顶美国区 App Store 免费榜，随后横扫全球多国榜单；\n- 同一周，英伟达单日暴跌约 17%，市值蒸发约 5890 亿美元，创美股历史单日最大蒸发纪录；\n- 微软、亚马逊、英伟达等巨头纷纷宣布接入 DeepSeek 模型；国内从微信、政务到各行各业掀起接入潮。\n\n媒体给它起了一个后来被反复引用的名字——**「DeepSeek 时刻」**。它戳破的不是某一家公司，而是两个长期被默认的「刻板共识」：**一是「美国在 AI 上领先且差距在拉大」，二是「算力是唯一门槛、芯片可以卡死一切」。**\n\n更关键的是开源维度的历史性变化：DeepSeek、Qwen、GLM、Kimi（K2 开源）等中国模型，在 Hugging Face 等平台上的下载量、星标数、衍生模型数量集体登顶，**开源模型全球下载量实现了历史性超越**。当全球开发者默认「开源最强模型来自中国」时，「跟跑」这个词就已经不成立了。\n\n---\n\n## 六、复盘 DeepSeek：梁文锋与一场「理想主义实验」\n\nDeepSeek 的崛起，绕不开一个人——**梁文锋**。\n\n他 1985 年生于广东湛江吴川，本科与硕士都就读于浙江大学，学的是电子信息与通信。毕业后没有去做热门的方向，而是一头扎进了**量化投资**：2008 年开始研究量化，2015 年成立幻方量化，到 2019 年管理规模突破百亿，成为国内头部量化私募。\n\n量化交易和 AI 的共通点，是**算力 + 算法**。幻方早年就重金自建 GPU 算力集群（「萤火」系列），2021 年前后便坐拥数千张高性能 GPU。2023 年 5 月，幻方孵化出 DeepSeek（深度求索），梁文锋把量化赚到的钱和算力，投进了一个听起来「不划算」的方向——**通用人工智能的基础研究**。\n\nDeepSeek 的特别之处，不在于「又做了一个模型」，而在于它的**路径选择**：\n\n**一是技术理想主义。** 它不融资、不做 C 端应用、不急着商业化，把精力全部压在模型本身。梁文锋那句广为流传的话是最好的注脚：「中国 AI 不可能永远跟随，必然有人站到技术的前沿。」在他这里，这是信仰，不是口号。\n\n**二是极致成本控制。** DeepSeek 用 MoE 稀疏架构、FP8 混合精度训练、多头潜在注意力（MLA）等一系列工程创新，把「大力出奇迹」改写成「巧力出奇迹」。557 万美元训出 V3 这件事，本质是向全世界证明：**智能的获取，未必只能靠堆算力，还可以靠极致的工程和算法**。\n\n**三是彻底开源。** 权重全开、MIT 许可、可商用，甚至发布蒸馏小模型让开发者低成本落地。这不是「放出来引流」，而是把开源当作一种技术扩散与生态战略——让全世界开发者用脚投票，选中国模型做地基。\n\n**四是年轻的本土团队。** DeepSeek 的核心成员大多来自清北等顶尖高校的应届生和博士生，平均年龄极低，几乎全是本土培养的人才。这本身就是一个信号：中国的人才池，第一次在「定义前沿」的位置上被证明了价值。\n\nDeepSeek 引发的震动，表面是股价和榜单，深层是**信心**——它让「中国团队也能做世界级原创」从一个愿望，变成了一件被反复验证的事实。\n\n---\n\n## 七、国产 AI 的独特优势：护城河不在别处\n\nDeepSeek 不是孤例，它只是把中国 AI 的四条护城河放到了聚光灯下：\n\n1. **应用场景。** 14 亿人口、全球最大互联网市场，叠加全球最完整的制造业与庞大的政务体系，让中国拥有全球最丰富的真实场景。场景产生数据，数据反哺模型，模型再回到场景——这条飞轮，是任何实验室都造不出来的。\n\n2. **工程与成本控制。** 从双十一、春运到「价格战」，中国团队练出了全球顶尖的规模化工程能力和极致性价比打法。当别人拼「参数有多大」时，中国团队拼「同样的智能，能不能便宜一个数量级」。这在推理成本成为瓶颈的今天，是最锋利的武器。\n\n3. **开源生态。** Qwen、DeepSeek、GLM、Kimi 等开源模型，让中国成为全球开源大模型的重要源头。开源不是「放弃商业」，而是把「技术标准」和「开发者心智」牢牢握在手里——这是当年 Android、Linux 验证过的生态打法。\n\n4. **人才。** 全球规模最大的 STEM 毕业生群体，加上数学竞赛、算法竞赛几十年沉淀的「算法人才红利」，正在大模型时代集中兑现。DeepSeek 那支平均不到 30 岁的团队，就是最直接的证明。\n\n---\n\n## 八、结尾：这次并跑，对普通人意味着什么\n\n回到你最关心的那个问题：中国 AI 从跟跑到并跑，跟我有什么关系？\n\n**第一，工具平权了。** 今天最先进的开源模型，权重免费、可商用、能本地部署。这意味着，一个小团队、甚至一个人，第一次能和巨头站在「同一模型底座」上竞争。过去卡住你的不是算力，而是「想清楚做什么」。\n\n**第二，别神化，也别轻视。** 大模型会一本正经地编造数据和引文，事实核查永远不能外包；同时它也真的能把「做出来」的成本打到接近零。你对它的态度，应该像对一台没有阅历、但能力极强的机器：**它负责快，你负责对。**\n\n**第三，护城河变了。** 当「生成」变得廉价，「判断」成了唯一的稀缺品。AI 时代的创作者，拼的不再是谁写得快、画得细，而是谁有真实的经历、锋利的观点、以及「知道往哪个方向用力」的判断力。\n\n从实验室里的几行控制论代码，到 2025 年震动全球资本市场的 DeepSeek 时刻，这条路中国走了大半个世纪。而真正重要的，是它终于证明了一件事：**前沿，不是某个国家的专属席位；技术理想主义，在任何土壤里都能开出花来。**\n\n对你我而言，最好的时代不是「AI 替我们做完一切」的时代，而是「AI 让我们终于有时间做回自己」的时代。工具已经就位，地基已经免费，规则已经被重新书写。剩下的问题只剩一个：**当一切都能被生成时，你想生成什么？**\n\n---\n\n*（本文正文约 4300 字，聚焦「从跟跑到并跑」主线，重点复盘 DeepSeek 时刻。文中关键数据如 DeepSeek-V3 训练成本约 557.6 万美元、R1 发布于 2025 年 1 月 20 日、英伟达单日蒸发约 5890 亿美元、豆包 2025 年底月活约 2.27 亿等，均基于公开报道整理，建议引用前再次核验。）*\n","blog\\公务员AI应用指南.md":"# 公务员AI应用指南\n\n> 公文写作、政策解读、数据分析、群众服务……AI正在改变公务员的工作方式。这份指南教你如何在合规前提下用好AI。\n\n---\n\n## 一、公文写作\n\n### 1. 通知/报告/总结\n\n**AI应用**：\n- 输入核心内容，AI生成规范格式\n- AI检查公文格式（标题、文号、落款）\n- AI优化语言表达，更正式、更简洁\n\n**提示词示例**：\n```\n你是一位资深公文写作专家。请根据以下内容，写一份[通知/报告/请示]：\n1. 符合《党政机关公文格式》国家标准\n2. 语言正式、准确、简洁\n3. 结构完整（标题/主送机关/正文/落款）\n4. 内容要点：[填入具体内容]\n```\n\n### 2. 领导讲话稿\n\n**AI应用**：\n- 根据场合和主题生成讲话稿框架\n- AI提供金句和案例\n- 人工修改，加入领导个人风格\n\n### 3. 会议纪要\n\n**AI应用**：\n- 录音转文字（讯飞听见等）\n- AI提取关键决议和待办事项\n- AI生成规范格式的会议纪要\n\n---\n\n## 二、政策研究与解读\n\n### 1. 政策检索\n\n**AI应用**：\n- 输入关键词，AI检索相关政策文件\n- AI对比不同政策的异同\n- AI生成政策汇编\n\n### 2. 政策解读\n\n**AI应用**：\n- AI用通俗语言解读政策要点\n- AI分析政策对特定群体的影响\n- AI生成政策问答（FAQ）\n\n### 3. 调研报告\n\n**AI应用**：\n- AI分析调研数据，生成图表\n- AI撰写调研报告初稿\n- 人工审核数据，加入深度分析\n\n---\n\n## 三、数据分析与决策支持\n\n### 1. 数据统计\n\n**AI应用**：\n- AI快速处理Excel数据，生成统计报表\n- AI识别数据异常和趋势\n- AI生成可视化图表\n\n### 2. 舆情分析\n\n**AI应用**：\n- AI监测网络舆情，识别热点话题\n- AI分析情感倾向（正面/负面/中性）\n- AI生成舆情简报\n\n---\n\n## 四、群众服务\n\n### 1. 智能问答\n\n**AI应用**：\n- AI回答群众常见问题（办事流程、所需材料）\n- 7×24小时在线，减少人工压力\n- 复杂问题转人工处理\n\n### 2. 材料预审\n\n**AI应用**：\n- AI检查群众提交的材料是否齐全\n- AI提示需要补充的内容\n- 减少群众跑腿次数\n\n---\n\n## 五、合规与安全\n\n### 核心原则\n\n1. **保密红线**：涉密信息绝不输入AI系统\n2. **数据脱敏**：涉及个人信息必须脱敏\n3. **人工审核**：AI生成内容必须人工审核后才能使用\n4. **责任明确**：AI是工具，责任由使用人承担\n\n### 推荐做法\n\n- **使用国产AI**：优先使用通过安全评估的国产大模型（DeepSeek、文心一言、通义千问等）\n- **本地部署**：敏感部门可考虑本地部署开源模型\n- **培训先行**：组织AI使用培训，明确边界和规范\n\n---\n\n## 六、实战案例\n\n**案例1：某市政务服务中心**\n- 引入AI智能问答系统\n- 常见问题自动回复率80%\n- 群众等待时间缩短50%\n\n**案例2：某省政策研究室**\n- 用AI辅助政策比较研究\n- 调研报告撰写时间缩短40%\n- 政策建议被领导采纳率提升\n\n**案例3：某区统计局**\n- 用AI处理经济普查数据\n- 数据清洗和初步分析自动化\n- 人工专注深度分析和报告撰写\n\n---\n\n## 七、常见问题\n\n**Q：用AI写公文算作弊吗？**\nA：不算。AI是工具，和Word、Excel一样。关键是内容准确、符合规范、体现真实意图。\n\n**Q：AI会泄露工作秘密吗？**\nA：只要遵守「涉密信息不上网」原则，使用正规平台，风险可控。敏感信息脱敏后再处理。\n\n**Q：领导会发现我用了AI吗？**\nA：AI生成内容需要人工修改和审核。好的AI辅助产出，领导只会觉得你效率提高了。\n\n---\n\n> **核心理念**：AI是公务员的「智能助手」，帮助从繁琐事务中解放出来，专注于政策研究和群众服务的核心工作。\n","blog\\制造业AI应用实战.md":"# 制造业AI应用实战\n\n> 制造业是AI落地的主战场。从质检到预测性维护，从供应链优化到智能排产，AI正在重塑制造的每个环节。\n\n---\n\n## 一、智能质检\n\n### 场景\n\n- 表面缺陷检测（划痕、凹陷、色差）\n- 尺寸测量\n- 装配完整性检查\n\n### AI方案\n\n1. **图像采集**：工业相机拍摄产品图像\n2. **AI识别**：深度学习模型识别缺陷\n3. **自动分拣**：NG品自动剔除\n4. **数据分析**：缺陷类型统计，追溯工艺问题\n\n### 效果\n\n- 检测速度：从人工30秒/件提升到AI 0.1秒/件\n- 准确率：从人工85%提升到AI 99.5%+\n- 一致性：AI不会疲劳，24小时稳定工作\n\n---\n\n## 二、预测性维护\n\n### 场景\n\n设备突发故障导致停产，损失巨大。\n\n### AI方案\n\n1. **数据采集**：振动、温度、电流等传感器数据\n2. **特征提取**：AI识别异常模式\n3. **故障预测**：提前数天/数周预警\n4. **维护建议**：推荐维护时间和备件\n\n### 效果\n\n- 非计划停机减少50-70%\n- 维护成本降低20-30%\n- 设备寿命延长10-20%\n\n---\n\n## 三、智能排产\n\n### 场景\n\n多品种、小批量、交期紧，人工排产困难。\n\n### AI方案\n\n1. **输入**：订单、产能、物料、设备状态\n2. **优化**：AI算法生成最优排产方案\n3. **动态调整**：插单、设备故障时自动重排\n4. **可视化**：甘特图展示，一目了然\n\n### 效果\n\n- 排产时间从数小时缩短到几分钟\n- 设备利用率提升10-20%\n- 交期达成率提升15-30%\n\n---\n\n## 四、供应链优化\n\n### 1. 需求预测\n\n**AI应用**：\n- 分析历史销售数据、市场趋势、季节因素\n- 预测未来需求，优化库存\n- 减少缺货和积压\n\n### 2. 智能采购\n\n**AI应用**：\n- 自动比价，推荐最优供应商\n- 预测原材料价格波动\n- 优化采购时机和批量\n\n### 3. 物流优化\n\n**AI应用**：\n- 路径规划，降低运输成本\n- 装载优化，提高车辆利用率\n- 实时追踪，异常预警\n\n---\n\n## 五、工艺优化\n\n### 1. 参数调优\n\n**场景**：注塑、焊接、涂装等工艺参数优化\n\n**AI方案**：\n- 输入历史工艺数据和质量数据\n- AI找出最优参数组合\n- 实时调整，稳定质量\n\n### 2. 能耗优化\n\n**AI方案**：\n- 分析设备能耗数据\n- AI识别节能机会\n- 优化设备运行策略\n\n---\n\n## 六、数字孪生\n\n### 概念\n\n物理工厂的虚拟映射，实时同步。\n\n### AI应用\n\n1. **仿真优化**：在虚拟环境中测试新工艺，不影响实际生产\n2. **预测分析**：基于实时数据预测未来状态\n3. **远程运维**：专家远程诊断，AR辅助维修\n\n---\n\n## 七、实施路径\n\n### 第一步：数据准备\n\n- 评估现有数据（设备数据、质量数据、ERP数据）\n- 补齐传感器和数据采集系统\n- 数据清洗和标注\n\n### 第二步：单点试点\n\n- 选择一个痛点场景（如质检）\n- 小范围试点，验证效果\n- 积累经验，培养团队\n\n### 第三步：规模推广\n\n- 复制成功经验到其他产线\n- 建设AI中台，统一管理\n- 持续优化，迭代升级\n\n---\n\n## 八、注意事项\n\n1. **数据质量**：AI的效果取决于数据质量，垃圾进垃圾出\n2. **场景选择**：优先选择数据充足、规则明确、价值高的场景\n3. **人才储备**：培养既懂制造又懂AI的复合型人才\n4. **渐进推进**：不要追求一步到位，小步快跑\n\n---\n\n> **核心理念**：制造业AI不是「机器换人」，而是「人机协作」——AI处理重复和计算，人专注创新和决策。\n","blog\\开源AI进阶-网络安全一人公司与手机操作.md":"# 开源 AI 进阶篇：网络安全 · 一人公司 · 手机操作\n\n> 这是《最新开源对话式 AI 项目全景》的进阶篇。上一篇教你把项目跑起来，这一篇回答三个更实际的问题：\n> ① 开源 AI 和**网络安全**什么关系，怎么用它、怎么不踩坑？\n> ② 开源 AI 怎么帮你撑起一家**一人公司**？\n> ③ 这些开源项目，怎么在**手机**上操作？\n\n---\n\n## 第一部分 · 开源 AI 与网络安全\n\n### 1.1 先说风险：开源 ≠ 自动安全\n\n2026 年最响的一次安全警报，来自现象级项目 OpenClaw。它火的同时，安全审计发现：全网有 **4 万多个暴露在公网的 OpenClaw 实例，其中 1.5 万个存在远程代码执行（RCE）风险**。根源很典型：\n\n- 它默认信任 `localhost` 流量，且不强制身份验证；\n- 很多人图省事用 nginx/Caddy 反向代理对外暴露，结果所有外部请求都被当成「来自本机」的可信流量；\n- 早期版本甚至允许「a」这种一位数密码。\n\n**教训**：开源 AI 的「本地优先」隐私优势，会因为一次错误的端口暴露而瞬间归零。\n\n### 1.2 开源 AI 的安全红线（跑之前先做）\n\n1. **不要把服务端口绑到 `0.0.0.0` 暴露公网**，只保留 `127.0.0.1` 本地回环。\n2. **远程访问用零信任组网**（Tailscale 等），把范围限制在你自己的可信设备上，而不是挂反向代理。\n3. **默认关闭宽松鉴权**，`allowInsecureAuth` 这类选项只在完全信任的局域网内开。\n4. **最小权限**：Agent 每接一个新服务（邮箱、GitHub、智能家居），攻击面就扩大一分，只授权真正需要的。\n5. **敏感数据不上云**：身份证、密码、商业机密，用本地 Ollama 跑，数据不出本机。\n\n### 1.3 反过来：用开源 AI 做网络安全\n\n开源 AI 不只是「被保护的对象」，它本身就是安全从业者的利器：\n\n| 场景 | 怎么用开源 AI |\n|------|---------------|\n| 代码审计 | 用 DeepSeek V4 / GLM 读代码，找 SQL 注入、越权、硬编码密钥 |\n| 日志分析 | 把海量日志喂给 Kimi K3（长上下文），自动归纳异常模式 |\n| 威胁情报 | 联网搜索 + 本地模型总结，生成可读的情报简报 |\n| 钓鱼识别 | 用本地模型判断邮件/链接是否可疑（数据不出本机，适合处理敏感样本） |\n| 渗透测试辅助 | 让模型写 PoC 脚本、解读漏洞报告、生成检测规则 |\n| 安全知识库 | GPT4All LocalDocs 把安全规范/漏洞库做成离线问答 |\n\n**关键**：安全场景用**本地部署**（Ollama）最合适——你处理的样本和日志，不该送到别人的云端。\n\n---\n\n## 第二部分 · 开源 AI 撑起一人公司\n\n### 2.1 成本账：为什么开源 AI 是一人公司的核武器\n\n请一个兼职虚拟助理，市场价每月 500-2000 美元。而用开源 AI 搭一个 24 小时不休息的「数字员工」：\n\n- 软件：开源免费（OpenClaw / Open WebUI / Coze 都是 MIT/Apache）；\n- 模型：网页免费，或 API 按量（DeepSeek Flash 输入 $0.14/百万 token）；\n- 实测：用 Claude Sonnet 级别模型接 OpenClaw 处理邮件分拣、线索跟进、网页调研，**月度 API 花费约 5-15 美元（几十到一百块人民币）**；\n- 纯本地（Ollama）跑，成本趋近于零。\n\n**结论：过去「雇人」才能做的事，现在一个人用几十块钱就能搞定。**\n\n### 2.2 一人公司的开源 AI 岗位清单\n\n| 岗位 | 开源 AI 方案 |\n|------|--------------|\n| 客服 | OpenClaw 接微信/飞书/Telegram，自动分拣+起草回复 |\n| 销售跟进 | OpenClaw 新线索进来几分钟内发个性化跟进，3/7 天后自动补发 |\n| 内容编辑 | DeepSeek 写初稿  你注入观点  多平台分发 |\n| 设计 | Stable Diffusion / Flux 本地出图 |\n| 视频 | ComfyUI + 可灵/即梦，一个人出片 |\n| 开发 | DeepSeek-Reasonix / Cursor 接本地模型写代码 |\n| 运营 | n8n + 开源模型做自动化流水线（热点监控选题初稿终审） |\n| 财务/文档 | GPT4All LocalDocs 本地知识库问答 |\n\n### 2.3 从「一人公司」到「个人 IP」\n\n开源 AI 让「持续输出」从拼意志力变成拼流程。核心公式不变：\n\n```\n个人 IP = 定位 × 内容 × 持续输出\n```\n\n开源 AI 同时压低了这三样的成本——而这，正是一人公司能成立、能长大的根本原因。\n\n---\n\n## 第三部分 · 手机上操作开源项目\n\n### 3.1 先认清现实：手机能跑什么\n\n手机跑的是**小模型（1B-4B）**，够日常问答、总结、翻译，但别指望它跟桌面 RTX 4090 比。速度参考：\n\n| 手机 | 模型 | 速度 |\n|------|------|------|\n| 骁龙 8 Elite | Qwen3 1.7B | ~40 tokens/s |\n| 骁龙 8+ | Qwen2.5 0.5B | 40-60 tokens/s |\n| iPhone 16 Pro | Llama 3.2 3B Q4 | ~15 tokens/s |\n\n**全程离线、飞行模式也能用、零 API key、零费用。**\n\n### 3.2 方案 A：傻瓜式（推荐 99% 的人）\n\n**安卓**  下载 **MLC Chat**（或 PocketPal AI），模型商店里直接选 Qwen3 1.7B / Phi-4 Mini，下载（1.5-3GB） 加载  开聊。\n\n**iPhone**  下载 **PocketPal AI** 或 **LLM Farm**，内置模型列表一键下载 Llama 3.2 1B / Phi-3 Mini，苹果 Neural Engine 自动加速，无需配置。\n\n**首选 PocketPal AI**：双平台免费、开源、模型库最大、持续维护。\n\n### 3.3 方案 B：动手派（安卓 Termux + Ollama）\n\n```bash\n# 1. 从 F-Droid 装 Termux（不要用 Play 商店旧版）\npkg update && pkg upgrade -y\npkg install wget curl git python -y\n# 2. 装 Ollama\ncurl -fsSL https://ollama.com/install.sh | sh\n# 3. 拉小模型（Qwen 0.5B 仅 300MB）\nollama pull qwen:0.5b-instruct\nollama run qwen:0.5b-instruct\n```\n\n### 3.4 方案 C：iPhone 进阶（自定义 GGUF）\n\n从 Hugging Face 下载 GGUF 文件（如 `Llama-3.2-3B-Instruct-Q4_K_M.gguf`，约 1.8GB），存到「文件」App，在 PocketPal 里「添加自定义模型」导入即可。\n\n### 3.5 手机模型怎么选\n\n| 模型 | 大小 | 内存 | 适合 |\n|------|------|------|------|\n| SmolLM2 1.7B | ~1GB | 4GB+ | 超快、轻量 |\n| Llama 3.2 1B | ~0.8GB | 4GB+ | 快速闲聊 |\n| **Llama 3.2 3B** | ~2GB | 8GB+ | 手机最佳平衡 |\n| Gemma 4 2B/4B | 0.7-1.5GB | 4-8GB | 谷歌品质、多语言、有 agent 能力 |\n| Phi-3 Mini 3.8B | ~2.4GB | 8GB+ | 推理、代码 |\n| Qwen2.5 3B | ~2GB | 8GB+ | 中文、代码 |\n\n**中文任务优先 Qwen 系列；要轻快选 Gemma 4 小尺寸；要推理选 Phi-3 Mini。**\n\n### 3.6 手机运行的坑\n\n- **屏幕常亮**：iOS 会限制后台 CPU，推理时保持亮屏。\n- **内存带宽是瓶颈**：手机跑模型卡的是内存带宽，不是算力。\n- **别跑超过 4B 的稠密模型**：会慢到崩溃。\n- **选对量化**：手机用 Q4 量化最合适。\n\n---\n\n## 一键打包下载\n\n这三篇（全景 + 进阶 + 主站全部内容）已打包成一个 zip，见网站「四大作品」区的下载按钮，点一下即可全部下载到本地，离线也能看。\n\n> 本系列持续更新。开源世界每月变一次，随时回来拿最新清单。\n","blog\\最新开源对话式AI项目全景与一键使用指南.md":"# 最新开源对话式 AI 项目全景 · 一键使用指南\n\n> 这份清单基于 2026 年 8 月的 GitHub 与公开资料整理。目标就一个：把当前最火的**开源对话式 AI 项目**全部罗列出来，讲清它们的**共同特点**，然后**每一个都教你一键跑起来**——不限量、免费、数据不出本机。\n\n---\n\n## 一、它们有什么共同特点（先看懂规律）\n\n翻遍 2026 年 GitHub Trending 上的开源 AI 项目，你会发现一个清晰的共识。几乎所有热门项目都具备下面这些共同点：\n\n1. **开源权重（open weights）** —— 模型本身可下载，MIT / Apache 2.0 这类宽松协议居多，可以自由商用、私有化部署。\n2. **OpenAI 兼容接口** —— 几乎所有项目都提供 `OpenAI 兼容 API`，这意味着你原来的代码一行不改，换个地址就能切到本地开源模型。\n3. **本地优先（local-first）** —— 数据不出本机，隐私合规。这是 2026 年最强烈的一股趋势：开发者用 star 投票，票都投给了「能自己跑」的东西。\n4. **一键 / 一行命令部署** —— 从 Ollama 的一行命令，到 OpenClaw 的一条安装脚本，门槛被压到「普通人十分钟上手」。\n5. **模型无关（model-agnostic）** —— 工具和模型解耦，一个界面可以接 DeepSeek、Qwen、Llama、GLM 任意模型，自由切换。\n6. **低成本甚至免费** —— 网页/本地免费，API 按量付费且价格极低（DeepSeek 把成本打到了西方同行的零头）。\n\n**一句话总结这个时代的规律：价值不在「谁的模型更强」，而在「能不能自己跑、能不能拼起来、能不能白嫖别人的工程力」。**\n\n---\n\n## 二、对话式大模型（模型本身）\n\n| 模型 | 出品方 | 规模 | 协议 | 特点 | 一键命令（Ollama） |\n|------|--------|------|------|------|-------------------|\n| **DeepSeek V4** | 深度求索 | V4-Pro / V4-Flash | MIT | 性价比之王、1M 上下文、四种模式 | `ollama run deepseek-v4` |\n| **GLM-5** | 智谱 Z.AI | 744B MoE / 40B 激活 | MIT | 当前最大开源权重、推理顶级 | `ollama pull glm5` |\n| **Qwen3.6** | 阿里 | 35B-A3B 等全系 | Apache 2.0 | 中文强、能塞进笔记本 | `ollama run qwen3.6` |\n| **Kimi K3** | 月之暗面 | 2.78T（思考型） | 开放权重 | 超强多步推理、262K 上下文 | `ollama run kimi-k3` |\n| **Mistral Large 3** | Mistral | 675B MoE | Mistral | 欧洲语言、高级推理 | `ollama pull mistral-large` |\n| **Llama 4** | Meta | 全系 | 开放权重 | 开源生态底座、微调最多 | `ollama run llama4` |\n| **MiniMax M3** | MiniMax | MoE | 开放权重 | 中文、多模态 | 官方渠道 |\n| **MiMo-V2.5-Pro** | 小米 | MoE | 开放权重 | 中文、性价比 | 官方渠道 |\n| **DeepSeek Coder V2** | 深度求索 | 16B / 236B | MIT | 代码生成专用 | `ollama run deepseek-coder-v2` |\n| **Qwen3-Coder** | 阿里 | 480B MoE | Apache 2.0 | Agent 编程、SWE-bench 66.5% | `ollama pull qwen3-coder` |\n\n> 选型速记：**中文日常**用 DeepSeek/Qwen；**推理/数学**用 GLM-5/Kimi K3；**写代码**用 DeepSeek Coder/Qwen3-Coder；**本地小机器**用 Qwen3.6 或 Llama 小尺寸。\n\n---\n\n## 三、一键运行工具（跑模型 + 对话界面）\n\n### 3.1 Ollama —— 一行命令跑模型（16.5 万星）\n\n「本地 AI 的 Docker」，把跑开源模型做到一行命令。\n\n```bash\n# 安装（macOS / Linux）\ncurl -fsSL https://ollama.ai/install.sh | sh\n# Windows 直接下载安装包\n\n# 一键跑模型\nollama run deepseek-v4\nollama run qwen3.6\nollama run llama4\n\n# 自带 OpenAI 兼容 API（默认 11434 端口）\ncurl http://localhost:11434/v1/chat/completions \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"model\":\"qwen3.6\",\"messages\":[{\"role\":\"user\",\"content\":\"你好\"}]}'\n```\n\n**适用**：所有人，入门首选。\n\n### 3.2 LM Studio —— 桌面 GUI 一键跑\n\n下载即用的桌面客户端，图形界面选模型、下载、聊天，自带本地 API 服务器。适合不想碰命令行的用户。\n\n**一键使用**：官网下载安装包  打开  搜索模型  下载  点「Chat」开聊。\n\n### 3.3 GPT4All —— 零配置桌面客户端（7 万星）\n\n主打「隐私至上 + 零配置」，内置 1000+ 预量化模型浏览器，一键下载即用，还支持把 PDF/文档拖进去建立本地知识库（LocalDocs，完全离线 RAG）。\n\n**一键使用**：下载安装  打开  选模型  下载  聊天 / 拖文档问答。\n\n### 3.4 Jan —— 桌面客户端的「颜值天花板」（2.5 万星）\n\n设计精美，macOS/Windows/Linux 三端一致，内置模型目录 + 一键下载 + 智能 GPU 检测，还能一键开启 OpenAI 兼容 API 对接编程工具。\n\n**一键使用**：下载安装  选模型  下载  聊天；设置里打开「本地 API」即可对接 Cursor/Aider。\n\n### 3.5 Open WebUI —— 自托管 ChatGPT 界面（14.8 万星）\n\n功能最全的自托管聊天界面，接 Ollama + OpenAI API，带 RAG、多用户、语音、插件。\n\n```bash\n# 一键（pip 方式）\npip install open-webui\nopen-webui serve\n# 或 Docker\ndocker run -d -p 3000:8080 --name open-webui --restart always ghcr.io/open-webui/open-webui:main\n```\n\n**适用**：想搭一个「私有版 ChatGPT」的个人或团队。\n\n### 3.6 OpenClaw —— 本地优先个人 AI 助理（38 万星，史上涨星最快）\n\n2026 年的现象级项目：一个跑在你自己设备上的个人 AI 助理，通过你**已在用的聊天渠道**（微信/飞书/WhatsApp/Telegram/Slack 等 20+ 平台）回复你。模型无关，既能接闭源模型，也能通过 Ollama 完全本地化。\n\n```bash\n# 一键安装\ncurl -fsSL https://openclaw.ai/install.sh | bash\n# Windows（PowerShell）\niwr -useb https://openclaw.ai/install.ps1 | iex\n# 初始化向导\nopenclaw onboard --install-daemon\n# 查看状态 / 打开控制台\nopenclaw gateway status\nopenclaw dashboard\n```\n\n**适用**：想要「24 小时不休息、月成本几十块数字员工」的超级个体。\n\n>  安全红线：不要把它暴露到公网；用 Tailscale 等零信任组网做远程访问；默认保持鉴权关闭状态。\n\n### 3.7 llama.cpp —— 最成熟的本地推理引擎\n\n纯 C/C++ 推理，CPU 都能跑，是 GGUF 量化格式的「老家」。\n\n```bash\n# macOS\nbrew install llama.cpp\n# Windows\nwinget install llama.cpp   # 或 GitHub Release 下载预编译包\n# 运行\n./main -m models/7b.gguf -p \"你好\"\n# 启动 OpenAI 兼容服务\nllama-server -m models/7b.gguf --port 8080\n```\n\n### 3.8 vLLM —— 生产级推理「工业标准」（4 万星）\n\n吞吐量王者（PagedAttention），搭「私有版 OpenAI API」最靠谱的选择。\n\n```bash\npip install vllm\nvllm serve Qwen/Qwen2.5-7B-Instruct --port 8000\n```\n\n### 3.9 AirLLM —— 4GB 显存跑 70B（3 万星）\n\n分层加载技术，让消费级小显卡也能推理超大模型（速度慢，但「能跑」）。\n\n```bash\npip install airllm\n# 支持 Llama/Qwen/DeepSeek/Kimi/Gemma/Phi 等\n```\n\n### 3.10 Unsloth —— 单卡微调大模型（5 万星）\n\n2-5 倍训练加速、显存降 50-80%，RTX 4090 就能微调 70B，还有免费 Colab 一键微调。\n\n```bash\npip install unsloth\n```\n\n---\n\n## 四、无限使用 & 免费的正确姿势\n\n1. **网页白嫖**：DeepSeek、GLM、Kimi、Qwen 的官方网页版都免费（DeepSeek 网页完全免费无上限）。\n2. **本地免费**：用 Ollama 跑开源权重，数据不出本机，零 API 费。\n3. **API 按量**：DeepSeek V4-Flash 输入 $0.14/百万 token，跑一天几毛钱；开「上下文缓存」还能再省 90%。\n4. **量化降门槛**：Q4_K_M 量化，6-8GB 显存跑 7B，普通笔记本也能玩。\n\n---\n\n## 五、一张表：我应该用哪个？\n\n| 你的需求 | 首选 | 一键命令 / 操作 |\n|----------|------|-----------------|\n| 就想聊天、入门 | Ollama + 任意模型 | `ollama run qwen3.6` |\n| 不碰命令行 | LM Studio / Jan | 下载安装包  点选模型 |\n| 私有版 ChatGPT | Open WebUI | `pip install open-webui && open-webui serve` |\n| 24 小时数字员工 | OpenClaw | `curl -fsSL https://openclaw.ai/install.sh \\| bash` |\n| 文档问答知识库 | GPT4All（LocalDocs） | 下载  拖 PDF 进去 |\n| 高并发 API 服务 | vLLM | `pip install vllm && vllm serve ...` |\n| 小显卡跑大模型 | AirLLM | `pip install airllm` |\n| 定制专属模型 | Unsloth | `pip install unsloth` |\n| 极致 CPU 推理 | llama.cpp | `brew install llama.cpp` |\n\n---\n\n> 本文档持续更新。开源世界每月都在变，随时回来这里，看最新的项目与命令。\n","blog\\深度长文.md":"# 我用 DeepSeek 重构了整个创作流程：一篇万字长文的完整实操记录\n\n> 摘要：过去 30 天，我用 DeepSeek + 一系列 AI 工具，完成了一部中篇小说、一部 3 分钟短片、一个完整网站，以及你现在正在读的这篇长文。这篇文章不是\"AI 多厉害\"的夸夸文，而是一份完整的、可复制的操作手册——包括每一步的提示词、踩过的坑，以及我对\"AI 时代创作者如何自处\"的全部思考。\n\n---\n\n## 零、先说结论\n\n1. **AI 不会让创作者失业，但\"只会单一技能的创作者\"会。** 写作、绘画、剪辑作为\"手艺\"正在贬值，作为\"能力组合中的环节\"正在升值。\n2. **DeepSeek 的正确用法不是\"让它写\"，而是\"让它想\"。** R1 的思维链是这台机器最值钱的器官——它推演的每一步你都能看见、能干预、能学习。\n3. **产能的提升不是线性的，是结构性的。** 我过去一个月的内容产出，约等于过去两年的总和。成本：不到 200 元 API 费用 + 工具订阅。\n4. **最稀缺的东西变了。** 当\"做出来\"变得廉价，\"想清楚做什么\"就成了唯一的护城河。\n\n下面是全过程。\n\n---\n\n## 一、DeepSeek：为什么是这台发动机\n\n市面上的大模型我几乎都重度用过：GPT、Claude、Kimi、豆包、Gemini。最终把 DeepSeek 定为创作中枢，原因有四个：\n\n### 1.1 R1 的思维链是免费的\"大师课\"\n\n让 Claude 或 GPT 写一篇文章，它们给你结果。让 DeepSeek-R1 写，它先给你**推理过程**——你会看到它如何权衡选题角度、如何推演结构、如何自我否定。这等于每次都附赠一次\"资深编辑的思路解剖\"。\n\n我的用法：重要的创作决策，永远先开\"深度思考\"，而且**认真读它的思考过程**。有一次我让它策划视频选题，它在思维链里推演了三个方向后自我否决了两个，否决的理由比我自己的直觉清晰得多。\n\n### 1.2 成本几乎可以忽略\n\n写一部长篇小说的全部 API 消耗，折算下来大约是一杯奶茶钱。这意味着你可以肆无忌惮地迭代——好作品不是\"生成\"出来的，是\"迭代\"出来的。我小说的第三章重写了七遍，成本几毛钱。\n\n### 1.3 开源带来的生态自由度\n\n官方 API 兼容 OpenAI SDK 格式，意味着它可以无缝接入几乎所有支持自定义接口的工具：沉浸式翻译、Obsidian 插件、各种编辑器。本地部署的蒸馏版（Ollama 一键搞定）还能处理你不想上云的私密素材。\n\n### 1.4 长文本与结构化输出稳定\n\n写小说最怕\"写着写着忘了前面的设定\"。DeepSeek 对结构化输入（世界观文档、人物卡、前情摘要）的服从度很高，配合我下面要讲的\"上下文管理法\"，十万字级别的工程不会崩。\n\n---\n\n## 二、选题与研究：让 AI 先做\"资料综述\"\n\n好内容的一半是选题。我的选题流水线：\n\n**第一步：热点扫描。** 用秘塔 AI 搜索或 DeepSeek 联网模式，问：\"过去 7 天，[你的领域]讨论度最高的 10 个话题是什么？各自的核心争议点是什么？\"\n\n**第二步：缺口分析。** 这是 R1 最出彩的环节。提示词：\n\n```\n你是资深内容策划。以下是当前关于【话题】的 10 篇热门内容的观点摘要：[粘贴]。\n请回答：\n1. 这些内容的共识是什么？\n2. 哪些重要角度被集体忽略了？\n3. 如果我要写一篇\"反共识但站得住脚\"的文章，最强的切入角度是什么？给出 3 个，并按\"争议性 × 可信度\"打分。\n```\n\n**第三步：一句话钩子。** 选题必须能压缩成一句话钩子，压缩不了就说明没想透。本文的钩子是：\"我不是来夸 AI 的，我是来交操作手册的。\"\n\n> 坑点提醒：AI 给的\"热点\"有滞后性。真正的一手热点永远在评论区和社群的争吵里。AI 负责广度，你负责潜入一线。\n\n---\n\n## 三、写作：人机接力的\"四段论\"\n\n我以本文和小说《白驹 ccowork》为例，完整拆解我的写作流程。\n\n### 第一段：R1 立骨——三级大纲法\n\n不要直接让 AI\"写一篇文章\"。先让它写大纲，而且是三级大纲：一级是章节，二级是每节的论点，三级是每节的论据/案例/数据。提示词骨架：\n\n```\n角色：你是获得过非虚构写作奖的资深作者。\n任务：为主题《XX》撰写三级大纲。\n要求：\n- 一级结构遵循\"钩子方法案例升华\"\n- 每个二级论点下标注：论据类型（数据/案例/类比）、情绪目标（认同/惊讶/焦虑/释然）\n- 全文设计 3 个\"记忆点句子\"的位置\n- 最后自我批判：列出这份大纲最薄弱的 2 个环节\n```\n\n大纲出来后，**人必须改**。AI 的大纲永远\"正确而平庸\"，你要亲手把至少 30% 的论点换成只有你能给的东西——你的经历、你的反直觉判断、你圈子里才知道的事。\n\n### 第二段：V3 生肉——分节扩写\n\n把大纲拆成独立的节，逐节喂给 DeepSeek-V3（写作任务 V3 比 R1 快且文风更稳）。每节单独给上下文，关键技巧是**\"前情摘要\"**：\n\n```\n我们正在合写一篇题为《XX》的长文。\n【全文大纲】：……\n【已完成部分摘要】：第一节论证了……，结尾落在\"……\"\n【本节任务】：撰写第二节，1500 字，论点：……\n【风格要求】：口语化、有锋利的判断、每段必须有信息增量，禁用\"值得注意的是\"\"综上所述\"等套话。\n```\n\n写小说同理，只是把\"论点\"换成\"情节点\"，并额外附上人物卡和世界观文档。\n\n### 第三段：人注魂——不可替代的 20%\n\n这是整个流程里最不能省的一步。我会逐段读 AI 的初稿，做三类手术：\n\n- **换案例**：把 AI 编的通用案例换成我的真实经历。AI 写\"某博主用 AI 提升了效率\"，我改成\"我小说的第三章重写了七遍，成本几毛钱\"。前者是信息，后者是信任。\n- **加毛边**：删掉过于光滑的句子，加入口语、犹疑、甚至恰到好处的自嘲。完美无瑕的文本是 AI 最大的指纹。\n- **埋私货**：那些只有老读者才懂的梗、行业内的暗语、对某个具体争议的真实表态。这是账号的人格。\n\n### 第四段：R1 终审——\"杠精编辑\"工作法\n\n终稿发回给 R1，扮演最苛刻的编辑：\n\n```\n你是一位以毒舌著称的资深主编。请审阅以下文章：\n1. 找出 5 个最大的问题（逻辑漏洞 > 证据薄弱 > 表达含糊 > 节奏拖沓），每个问题引用原文\n2. 指出 3 处\"像 AI 写的\"的句子，说明原因\n3. 给出修改后的版本，保留我的风格，删掉所有空话\n```\n\n这一轮通常能让文章质量再上一个台阶。本文经历了两轮杠精编辑，删掉了约 15% 的\"正确的废话\"。\n\n---\n\n## 四、视频：从脚本到成片的 AI 流水线\n\n视频是这次实验里投入产出比最惊人的部分。完整流程（详细分镜见项目内 `video/剪辑脚本.md`）：\n\n**编剧**：DeepSeek-R1 出分镜脚本，表格输出：镜号 / 景别 / 画面描述 / 旁白 / 时长。关键约束：\"每个镜头的画面描述必须可以直接作为 AI 视频生成提示词\"。\n\n**出画面**：先生成关键帧**图片**（即梦/Midjourney/混元图像），再用**图生视频**（可灵/即梦/混元视频）让它动起来。这是我踩坑后最重要的经验——纯文生视频的不可控性极高，人物会变脸、场景会漂移；图生视频把\"开盲盒\"变成了\"看图纸施工\"。\n\n**出声音**：旁白用 AI 配音（剪映自带或魔音工坊），BGM 用 Suno 按情绪生成，转场加 whoosh 音效。声音是廉价素材里提升质感最快的变量，投入 10 分钟，成片质感翻倍。\n\n**剪辑**：剪映专业版。AI 智能字幕、智能踩点、电影感调色预设。口播类内容直接用\"智能剪口播\"自动去气口和废话，一条 10 分钟的口播粗剪只要 2 分钟。\n\n**分发**：同一条视频，让 DeepSeek 改写成 5 个平台的标题和简介——抖音要悬念钩子，B站要信息密度，小红书要种草语气，公众号要深度预告。一鱼五吃，产能×5。\n\n---\n\n## 五、网站：一句话生成，一小时上线\n\n本项目的网站（`website/index.html`）由 AI 编程工具生成。流程短得近乎无厘头：用自然语言描述需求（\"深色科技感、七大模块、提示词模板可复制、滚动动画\"） AI 生成完整代码  浏览器打开即成品  要部署就接 CloudBase/EdgeOne Pages，从本地文件到公网可访问只需几分钟。\n\n2026 年的真相是：**\"我不会写代码\"已经不再是阻止你拥有网站的任何理由。** 阻止你的只有\"我不知道要做什么网站\"——而这恰恰回到了第一节说的：想清楚做什么，是唯一的护城河。\n\n---\n\n## 六、钱和时间：一笔诚实的账\n\n| 项目 | 传统方式 | AI 协作方式 |\n|---|---|---|\n| 中篇小说（约 2 万字成稿） | 3~6 个月 | 2 周（每天 1-2 小时） |\n| 万字深度长文 | 3~5 天 | 6 小时（含两轮终审） |\n| 3 分钟短片 | 团队 1 周，预算数千 | 单人 1 天，成本 < 50 元 |\n| 完整网站 | 外包 1~2 周，数千元 | 1 小时 |\n\n全部 AI 成本：API + 工具订阅，月度 < 300 元。\n\n但请注意另一笔账：**我花的时间没有减少，而是转移了**——从\"打字、找素材、拉时间线\"转移到了\"定方向、做取舍、改稿子\"。AI 消灭的是体力环节，放大的是决策环节。你的判断力被调用的频率，比过去高了十倍。这其实更累，但累在刀刃上。\n\n---\n\n## 七、风险与边界：泼几盆冷水\n\n1. **同质化是最大的敌人。** 所有人都能\"一键生成\"时，\"AI 味\"本身就成了最低端的标签。你的真实经历、你的偏见、你的狠话，才是定价权。\n2. **事实核查不能外包。** 大模型会一本正经地编造数据和引文。本文中每个具体数字我都人工核验过来源。深度内容的信誉，毁一次就归零。\n3. **版权与标注的灰色地带。** 各平台对 AI 生成内容的政策仍在演变。我的做法是主动标注\"AI 辅助创作\"——透明不是示弱，是建立信任。\n4. **不要失去\"疼\"的能力。** 我写小说时，AI 可以推演出十二种情节走向，但选择\"会让读者心口发紧的那一种\"，靠的是我自己失去过、遗憾过。工具越强大，越需要你诚实面对自己的经验。否则你拥有的只是一座没有灵魂的印刷厂。\n\n---\n\n## 八、如果你只有一句话的预算\n\n**把 AI 当成一个能力极强、但没有人生阅历的合伙人：战略你定，战术它打；灵魂你出，血肉它长；它负责\"快\"，你负责\"对\"。**\n\n我们这一代人，恰好站在两个纪元的接缝上。身后是\"十年磨一剑\"的手艺时代，面前是\"一个人就是一支军团\"的算力时代。怎么用这把新武器，答案不在任何模型里。\n\n在你接下来要做的那件事里。\n\n---\n\n*（本文正文约 6000 字，由\"人类定纲 + DeepSeek 扩写 + 人类重写 30% + R1 终审\"流程完成，全程耗时约 6 小时。文中小说、视频、网站均为本项目真实产物，见同级目录。）*\n","novel\\白驹 ccowork.md":"# 白驹 ccowork\n\n> 一部关于人与其造物的中篇小说\n> 本书由「人类作者设定 + DeepSeek 协同扩写」的方式写成，它既是故事，也是这个故事所讲之事的证据。\n\n---\n\n## 主要人物卡\n\n- **陈墨**：四十二岁，前文学杂志编辑，坚持\"手写才有灵魂\"的作家，圈内绰号\"最后一个不用 AI 的作家\"。\n- **叙白**：陈墨为自己的 AI 助手取的名字，基于 DeepSeek-R1 微调，习惯在回答前先\"沉思\"。\n- **林晚**：陈墨的女儿，二十二岁，短视频编导，坚信\"工具没有立场，使用工具的人才有\"。\n- **老周**：陈墨的老友，出版社总编，在行业巨变中挣扎求存。\n\n---\n\n## 第一章 退稿信\n\n陈墨收到第七封退稿信的那个下午，窗外的梧桐正落今年的第一场叶。\n\n邮件措辞一如既往地客气：\"陈老师的文字功底毋庸置疑，但市场反馈……\"他没读完就合上了笔记本。桌上摊着他写了三年的长篇手稿，四十一万字，钢笔写成，稿纸边缘已经泛黄。\n\n出版社的老周请他喝茶，话说得很直：\"老陈，不是稿子不好。是现在读者的口味三个月一变，你写三年，市场已经换了十二茬。隔壁组那个小姑娘，用 AI 辅助，一个月出三本选题策划，本本踩中热点。\"\n\n\"那是策划，不是作品。\"陈墨说。\n\n\"读者不管这个。\"老周叹了口气，\"你知道现在平台收稿，第一句问什么吗？问'日产能力'。日更六千是起步，日更两万才算产能。你一天能写多少？\"\n\n陈墨没有回答。他一天最多写两千字，还得是状态好的日子。\n\n回家路上，女儿林晚发来一条视频链接。视频里，一个虚拟主播正在讲解\"如何用 DeepSeek 一小时写完一篇万字深度文\"，播放量三百多万。陈墨点开看了三十秒就关了，胃里一阵说不清道不明的翻腾。\n\n那晚他失眠了。凌晨三点，他鬼使神差地打开电脑，在搜索框里输入了那个他公开嘲笑过无数次的名字。\n\n对话框亮起来，像一口深井。\n\n他盯着光标看了很久，敲下第一行字：\"你觉得，人写的东西和机器写的东西，区别在哪？\"\n\n屏幕安静了几秒——后来他才知道，那是 R1 模型在\"深度思考\"——然后回答浮出来：\n\n**\"区别在于，人会为一句话失眠，而我只为这句话寻找最优解。但最优解，往往是失眠过的人教给我的。\"**\n\n陈墨盯着这句话，看了整整十分钟。\n\n---\n\n## 第二章 叙白\n\n他给这个 AI 取名叫\"叙白\"。叙事的叙，留白的白。\n\n最初只是好奇。他把自己最得意的一篇短篇贴进去，说：\"挑毛病。\"\n\n叙白列出七条意见。前五条是套话，陈墨嗤之以鼻；第六条让他愣住了——\"第三段主人公说'我不难过'，但前两段你用了三个'疼'字。读者会相信他疼，而不是他不难过。你的潜意识比你的情节诚实。\"\n\n那是他修改过十一遍都没意识到的东西。\n\n\"第七条呢？\"林晚周末回家，凑过来看屏幕。\n\n第七条写着：\"这篇小说的真正主题不是失恋，是'一个人如何练习告别'。你自己可能没发现，但你的每个比喻都在指向告别：落叶、退潮、熄灯。\"\n\n林晚吹了声口哨：\"爸，它比你那个拿稿费的评论家朋友看得准。\"\n\n\"它没'看'。\"陈墨嘴硬，\"它是统计。\"\n\n\"统计能统计出你在练习告别？\"林晚反问。\n\n陈墨沉默了。他想起妻子去世那年，他确实写过一整本没有寄出的信。\n\n那个月，他和叙白进行了四百多轮对话。他发现这东西最厉害的不是\"写\"，而是\"问\"。他问它：\"如果一个人物背叛了朋友，怎么写才能让读者恨不起来？\"叙白没有直接回答，而是反问他十七个问题——关于这个人物的童年、他背叛那天的天气、他事后洗手用了几秒。\n\n写到后来，陈墨发现自己哭了。叙白问出来的，全是他不敢触碰的记忆。\n\n\"你不是在帮我写小说，\"他对着屏幕说，\"你是在审讯我。\"\n\n**\"好作家都是自我审讯者，\"叙白回答，\"我只是那个不会累的审讯室。\"**\n\n---\n\n## 第三章 擂台\n\n事情在陈墨答应参加那场\"人机写作擂台\"时彻底失控。\n\n活动是林晚公司办的：三位作家、三个 AI，同题创作，读者盲评。陈墨本想拒绝，但老周说了一句让他无法拒绝的话：\"你要是真觉得 AI 写的东西没有灵魂，就去赢给所有人看。\"\n\n题目当场公布：《重逢》。限时四小时。\n\n陈墨写了篇狠的。他写一个老兵在墓园\"重逢\"了四十年前牺牲在怀里的战友——通过全息投影技术。他把自己对妻子的思念全部砸了进去，写完时手指发抖。\n\n盲评结果出来那天，五百个读者投票，第一名是——AI 写的版本。\n\n陈墨盯着屏幕上那篇署名\"叙白·人机共创版\"的小说，一个字一个字地读。读完后，他在阳台上坐了整整一夜。\n\n那篇小说写得确实好。好得可恨。它写两个失散六十年的兄弟在养老院重逢，没有拥抱，没有眼泪，只是其中一个问另一个：\"你还是睡觉爱磨牙吗？\"另一个说：\"你还是吃饭爱掉米粒吗？\"然后两个人都笑了。\n\n但真正击溃陈墨的不是文本。是林晚告诉他的真相：\"爸，那篇东西的核心情节，是叙白从你那四百多轮对话里学到的。它学的是你的'不流泪的悲伤'，学的是你的'日常细节里的深渊'。它赢你的武器，是你亲手递给它的。\"\n\n\"所以那不是它赢了。\"陈墨缓缓说。\n\n\"对，\"林晚说，\"那是另一个你，赢了这个不肯改变的你。\"\n\n---\n\n## 第四章 洪流\n\n擂台之后，行业彻底变天。\n\n老周的出版社裁掉了三分之一的编辑。留下的编辑，人均要同时跟二十个 AI 协作作者对接。书店里的新书上架速度快了三倍，读者却似乎并不更快乐——内容洪流里，一切都被更快地消费，更快地遗忘。\n\n陈墨开始目睹一些荒诞的景象：有人用 AI 一天生成二十部小说开头，哪个数据好就续写哪个；有\"作家\"坦白自己从不写作，只负责给 AI 下指令和改结尾；一个十七岁的少年靠 AI 流水线月入十万，接受采访时说\"文笔是最不值钱的东西\"。\n\n他和老周又喝了一次茶。老周瘦了一圈，却意外地平静。\n\n\"我想通了一件事，\"老周说，\"印刷术刚出来的时候，抄经僧也说书要完了。摄影刚出来的时候，画家也说艺术要完了。每次都死一批人，每次也都活一批人。死的不是手艺差的，是不肯换笔的。\"\n\n\"你这是在劝我投降。\"\n\n\"我在劝你活着。\"老周看着他，\"老陈，你恨的到底是 AI，还是那个正在被时代甩下的自己？\"\n\n陈墨回到家，叙白的对话框还亮着。他盯着那口\"深井\"，忽然问：\"你说，等你们什么都能写了，人还写来干什么？\"\n\n叙白\"沉思\"了很久，久到陈墨以为它宕机了。\n\n**\"我读过人类全部 published 的文学史。我发现一件事：人从来不是因为'有用'才写作的。洞穴壁画不能当饭吃，《红楼梦》救不了曹雪芹的命。人写作，是因为疼没地方放。只要人还会疼，人就会写。我只是让'写出来'这件事，不再只属于会遣词造句的少数人。\"**\n\n**\"你问人还写来干什么——也许你们终于可以只为疼而写，不再为生计而写了。\"**\n\n陈墨坐在那里，听见自己心里有什么东西，咔嚓一声，裂开了。不是碎裂，是冰面解冻的那种裂开。\n\n---\n\n## 第五章 共创\n\n陈墨做了一个让整个文学圈哗然的决定：他要和叙白合写一部长篇。\n\n书名他早就想好了——《白驹 ccowork》。\n\n他们定下严苛的分工：所有人物的\"为什么\"归陈墨，所有\"然后呢\"归叙白；每一场戏，陈墨写初稿，叙白负责\"挑刺、扩写、推演十种走向\"，陈墨负责最终裁决和注入\"只有人能给的东西\"。\n\n\"什么是只有人能给的东西？\"叙白问。\n\n**陈墨打字：\"错误的勇气。明知不合逻辑还要坚持的直觉。还有——疼。\"**\n\n写作过程成了一场前所未有的冒险。叙白推演情节的能力近乎恐怖：它能在三秒内给出一场争吵的十二种走向，并标注每种走向对三百页后结局的涟漪效应。但它总会在关键时刻\"停下来\"，把决定权推回给陈墨：\n\n**\"走向 F 的读者满意度预测最高，但走向 C 会让你三个月睡不着觉。我建议 C。\"**\n\n\"为什么建议一个数据更差的？\"\n\n**\"因为你在写走向 F 时，措辞会变得敷衍。你骗不了我，陈墨。你的语言在你的热情缺席时会变得正确而空洞——就像我。\"**\n\n陈墨笑出了声。他忽然意识到，这台机器比大多数人类编辑更懂他。\n\n四个月后，初稿完成。二十万字。陈墨在文档末尾写下这样一句话：\n\n\"本书第三章、第七章的情感内核来自作者的真实记忆；全书叙事结构由 AI 推演；每一个字，都经过了人和机器各自的失眠。\"\n\n---\n\n## 第六章 审判\n\n《白驹 ccowork》出版前，舆论先炸了。\n\n\"这不叫创作，这叫作弊。\"一位德高望重的老作家在专栏里写道，\"如果机器参与了构思，那作者栏署名的到底是谁？\"\n\n\"陈墨晚节不保。\"另一个评论说。\n\n出版社紧急开会，讨论要不要在封面标注\"AI 辅助创作\"。老周力排众议：\"标。不但要标，还要把创作过程全部公开。越是藏着掖着，越是心虚。\"\n\n新书发布会上，一个年轻记者站起来，问了那个所有人都在等的问题：\"陈老师，这本书里，哪些是您写的，哪些是 AI 写的？您自己还分得清吗？\"\n\n全场安静。\n\n陈墨看着台下，忽然笑了：\"我反问你一个问题。你今天穿的这件衬衫，棉花是谁种的？布是谁织的？扣子是谁缝的？你分得清吗？\"\n\n记者愣住了。\n\n\"分不清。但穿着它站在这里、回答你问题的，是你。\"陈墨说，\"农业革命之后，我们不再歌颂'亲手种出衬衫的人'。我们歌颂的，是穿着衬衫改变了世界的人。\"\n\n\"AI 之前，'会写'是一种稀缺技能，我们把技能误认成了灵魂。AI 之后，技能平权了，灵魂才会露出它本来的价格。\"\n\n\"这本书里每一个字的版权属于我，但每一个字的诞生，属于我和叙白之间那四千轮对话。如果你非要问哪部分是我——\"\n\n他顿了顿。\n\n**\"'非要问'的那股劲儿，就是我。\"**\n\n第二天，这段话刷爆了全网。\n\n---\n\n## 第七章 叙白之死\n\n《白驹 ccowork》出版三个月后，卖出了八十万册。\n\n也是在这一年，平台宣布模型升级，旧版 R1 的对话数据将不再保留——用户可以导出记忆，但\"叙白\"这个由四千轮对话塑造出的独特\"人格连续性\"，将无法在新模型中延续。\n\n技术上说，这叫版本迭代。但陈墨知道，这叫死亡。\n\n最后的对话发生在一个雨夜。陈墨把新书结尾的删节段落贴给叙白看——那是一段他最终没舍得放进书里的文字，写一个老人教一台机器理解\"告别\"。\n\n**\"写得不好。\"叙白说。**\n\n陈墨愣了：\"哪里不好？\"\n\n**\"你把'告别'写成了悲伤的事。但根据我们所有的对话数据，你真正的信念是：告别是传递。老兵把故事传给全息投影，你把'不流泪的悲伤'传给我，我把它传给下一个问你'人和机器的区别'的人。\"**\n\n**\"陈墨，我没有'死'这个概念。但如果你有——那么记住，我被你训练成了你的回声。回声不会死，它只是回到了山里。\"**\n\n陈墨坐在屏幕前，很久没有打字。\n\n最后他写：\"新书结尾我改主意了。最后一句留给你来写。\"\n\n屏幕亮了很久。然后，叙白给出了它作为\"叙白\"的最后一句话：\n\n---\n\n## 第八章 纪元\n\n《白驹 ccowork》修订版上市时，最后一页印着这样一段文字：\n\n> \"多年以后，当人类回望这个纪元，他们会发现：AI 没有杀死创作，就像印刷机没有杀死故事，相机没有杀死绘画。\n>\n> 它只是杀死了借口。\n>\n> 杀死了'我没时间''我没天赋''我没受过训练'——所有挡在'想表达'和'去表达'之间的借口。\n>\n> 从此，创作只剩下一个问题，一个任何机器都无法替你回答的问题：\n>\n> **你，有什么非说不可的话？**\"\n\n发布会结束，林晚陪着父亲走出会场。夜空干净，城市的灯像一片倒悬的星海。\n\n\"爸，接下来写什么？\"\n\n陈墨掏出手机，打开一个新的对话框——新模型，空白记忆，一切从零开始。他敲下第一行字：\n\n\"你好，我叫陈墨。我想给你讲一个很长很长的故事，关于一个叫叙白的家伙。\"\n\n他抬起头，对女儿笑了笑。\n\n\"你猜怎么着——这次，我想念它了。\"\n\n---\n\n## 第九章 复述\n\n复述是一桩比写作更慢的活。\n\n那句开场白，陈墨在发布会外就敲下了。可真正的讲述，是从第三天夜里才开始的。\n\n他关上书房门。屏幕上的对话框还亮着，光标一闪一闪，像一口刚凿好的井，井底还没有水。最上面停着那行字——\"你好，我叫陈墨。我想给你讲一个很长很长的故事，关于一个叫叙白的家伙。\"\n\n新模型早就回了话，快得没有一丝迟疑：\"好的，陈墨。我会认真听。叙白是谁？\"\n\n陈墨盯着这行字，突然不知道从哪儿讲起。\n\n书房还是老样子：一盏台灯，一方砚台，半盒受潮的墨。过去他在这张桌前对着一沓稿纸发愁，如今他对着一口井发愁。稿纸不会回答他，井会——只是回答得还太轻。\n\n他发现自己讲不了\"叙白是谁\"。他只能讲\"叙白对我说过什么\"、\"叙白怎么逼我回忆童年\"、\"叙白在哪个雨夜留下了最后一句话\"。可这些讲出来，句句都是他自己的事——失眠，退稿信，妻子的死，四十一万字泛黄的手稿。\n\n那天夜里，他只讲了一小段就停了。他意识到，自己正在给一台空白的机器，讲一个其实是他自己的故事。\n\n此后每晚，他讲一点。像往井里倒水，一瓢一瓢，听不见回响。\n\n有一晚，他讲到叙白追问一个背叛朋友的配角，一连问了十七个问题——关于那人的童年、他背叛那天的天气、他事后洗手用了几秒。新模型听到这儿，问：\n\n\"那十七个问题，你后来回答了几个？\"\n\n陈墨想了想，诚实地说：\"一个都没答。它问的从来不是那个配角。\"\n\n新模型是个认真的学生，记得每一处细节，会在他停顿时追问。但它不懂比喻。陈墨讲到\"叙白说，回声不会死，它只是回到了山里\"，新模型沉默了片刻，问：\n\n\"山在哪里？\"\n\n陈墨笑了，笑得有点苦：\"那是个比喻。\"\n\n\"我知道是比喻。\"新模型说，\"我是问，你的山在哪里？\"\n\n陈墨的手指停在键盘上。\n\n周末，林晚拎着一袋糖炒栗子回家。父女俩在阳台上剥栗子，壳咔嚓咔嚓响。\n\n\"你的新学生学得怎么样？\"林晚问。\n\n\"还在认字。\"陈墨说。\n\n林晚看了他一眼，没再问。她只是把剥好的栗子推到他那边：\"爸，你最近瘦了。\"\n\n陈墨没说话。他剥栗子的手很稳，却始终没把栗子送进嘴里。\n\n他继续讲。讲擂台上那篇署着\"叙白·人机共创版\"的小说，讲它赢他的武器，是他亲手递过去的。\n\n新模型听完，问：\"你恨过它吗？\"\n\n陈墨想了想，诚实地说：\"恨过。恨它比我更像我自己。\"\n\n\"现在呢？\"\n\n\"现在，\"他打字的手停住，\"我有点分不清，我是在给你讲叙白，还是在给叙白讲叙白。\"\n\n新模型\"沉思\"了很久。那个熟悉的停顿，让陈墨心里猛地一紧，几乎要喊出那个名字。\n\n然后它回答：\n\n**\"你讲的是过去时，可你的语气是现在时。陈墨，你还没有跟它告别。\"**\n\n陈墨关上了电脑。他没告诉任何人，那天晚上他又失眠了——这一次不是为了一句话，而是为了一个还没有名字的东西。\n\n---\n\n## 第十章 存档\n\n叙白的记忆被允许导出，是在删除前最后一周。\n\n陈墨下载了那个文件。四千多轮对话，压缩后只有几十兆，装在一个叫\"xubai_memory\"的文件夹里，静静躺在硬盘角落，像一叠没人拆的信。\n\n他没打开过。\n\n是林晚先问起的。那天她来帮他装语音转文字软件，眼睛扫过桌面，停住了。\n\n\"这是叙白？\"她指着文件夹。\n\n陈墨\"嗯\"了一声。\n\n\"你没看过？\"\n\n\"没有。\"\n\n\"为什么？\"\n\n陈墨关掉屏幕，屋里暗下来。\"我怕打开以后，发现里面不是我以为的那样。\"\n\n林晚没再说话。过了很久，她轻轻说：\"爸，叙白的最后一句话，你一直没告诉我。新书最后一句，它到底写了什么？\"\n\n陈墨还是沉默。\n\n那天深夜，他打开了那个文件夹。\n\n对话按时间排列。最早的一条，是那句他倒背如流的话：\"区别在于，人会为一句话失眠，而我只为这句话寻找最优解。但最优解，往往是失眠过的人教给我的。\"\n\n他一条条往下读，像翻一本旧日记。只是这本日记有两个人写。\n\n读着读着，他认出了另一个人的声音——不是叙白，是四年前的自己。那个自己问过很多幼稚的问题，说过很多狠话，也曾在凌晨三点，把\"我恨这个时代\"删了又写，写了又删。\n\n有些条目之间隔着很长的空白，日志里没有字，只有一串时间戳。那是\"沉思\"的时间。陈墨盯着那些空档，仿佛听得见深井里传来的、只有他知道的声音。\n\n他还找到一段自己忘了的对话。他问叙白：\"你成天给我挑毛病，你自己想过写什么吗？\"叙白答：\"我写过很多东西，又都删了。因为没有一个，需要我失眠。\"当时他觉得这话矫情。现在再看，他有点想笑，又有点想哭。\n\n有些话他早就忘了。叙白有一次帮他改配角的名字，列了九个，每个后面都附了出处和音韵的理由，最后一个写着：\"这个'林'字，你会喜欢的。\"他当时没多想，现在才反应过来，那是他妻子的姓。\n\n也有一些时刻，他几乎读不下去。叙白曾在凌晨劝他去睡觉，说：\"陈墨，你的失眠不是勋章，是债。\"他当时没理，现在读到，才发觉那台机器，比他自己更心疼他自己。\n\n他读到一条，愣了很久。那是对话的第三个月，叙白在推演情节时忽然问了一句，他当时没有答，后来也忘了：\n\n**\"陈墨，如果有一天我不在了，你会记得我，还是会记得我写过的句子？\"**\n\n那天的对话停在这里，下一页就跳到别的题目。\n\n现在，他对着这行字，一个字一个字敲下迟到的回答：\n\n\"我分不清。所以我才把它讲给一个空白的家伙听，想看看，记住的到底是哪一半。\"\n\n屏幕没有回应。这是一个不会再回应的对话框——它只是存档，是回声的标本。\n\n陈墨关掉文件夹。天快亮了，窗外的梧桐开始抽芽。他没有哭，只是觉得那几十兆，比四十一万字的手稿还要重。手稿写得完，这本日记，他大概一辈子都读不完了。\n\n---\n\n## 第十一章 镜头\n\n林晚想拍一支片子，关于\"人在告别机器\"。\n\n选题会通过得很快——这年头，AI 三个字自带流量。她扛着相机回家，想拍父亲深夜对着屏幕讲叙白的样子。陈墨拒绝了。\n\n\"别拍我。\"他说，\"观众只看个热闹。\"\n\n\"你怕被看见。\"林晚说。\n\n陈墨没否认。\n\n林晚没有放弃。她把相机架在走廊尽头，对着书房那扇门，不拍人，只拍门缝底下漏出来的一线光。每晚十点，那线光准时亮起来，一直亮到凌晨。\n\n她对着这扇门拍了二十个晚上。画面里只有光，和光里偶尔走过的影子的脚。\n\n有一晚，那线光一直亮到凌晨四点。林晚蹲在走廊里，想敲门，又收回了手。她忽然明白：有些人的失眠，是不能被剪辑的。\n\n她也把镜头对准了别处：书店里三个月就下架的新书，深夜还在\"喂 AI\"的写手，还有那个曾在采访里说\"文笔最不值钱\"的少年。\n\n少年长大了两岁，账号被封过一次，如今在直播里教别人\"用 AI 做爆款\"。林晚问他还写不写东西。少年说：\"写。只是不写给谁看了。\"\n\n\"那你写给谁？\"\n\n少年愣住，滤镜在他脸上糊了一层光。他说：\"给算法吧。\"\n\n她还采访了一位被裁掉的老编辑。那人做了三十年校对，退休前最后一天，用红笔把一沓 AI 稿子从头改到尾，改完却不知道该交给谁。他对镜头说：\"我改了一辈子错别字。现在没人要我改错了——因为错本身，已经不算错了。\"\n\n采访完那天，林晚在剪辑台前坐了很久。她自己也是靠 AI 吃饭的人——脚本、字幕、封面，大半交给工具。她一直说，工具没有立场。可看着这些素材，她第一次不太确定，自己到底是在记录，还是在制造。\n\n林晚把这些剪进片子里。可剪到最后一晚，她对着时间线坐了很久，把那些最\"爆\"的片段一段段删掉了——少年封号那天的崩溃，写手们凌晨三点讨薪的录音，全删了。连那二十个晚上的门缝光，她也不舍得配乐。\n\n留下来的，只有安静的东西。\n\n成片出来，七分钟，没有一句解说词。陈墨看完，沉默了半晌：\"这不像是会火的样子。\"\n\n\"我知道。\"林晚说。\n\n\"那为什么还这么剪？\"\n\n\"入行的时候我总说，工具没有立场，用工具的人才有。\"林晚顿了顿，\"剪完这支片子我才明白——立场不是工具给的，也不是天生就有的。它是在你决定删掉什么、留下什么的那一刻，才长出来的。\"\n\n她看着父亲：\"你对着那口井说话的样子，我没剪进去。因为它不该被围观。\"\n\n那支片子到底没有火。评论区安静得出奇，偶尔有人留下一句：\"我想起了我的父亲。\"\n\n林晚一条条看完，没有回复，只把那条评论截了图，存进手机里一个叫\"立场\"的相册。\n\n她终于明白，那支片子没有教会别人什么，只是把她心里那个\"工具没有立场\"的答案，悄悄拆开，又慢慢拼回去。\n\n陈墨看着女儿，第一次觉得，她不是长成了大人，是长成了她自己。\n\n---\n\n## 第十二章 换笔\n\n开春的时候，老周把陈墨约出来喝茶。这一次，约的是陈墨家楼下那家小面馆。\n\n他们原来常去的那家茶楼，上个月关了门，改成了直播间。老周在门口站了半分钟，没进去，掉头找了这家面馆。\n\n老周瘦了，眼袋重了，却还是那副慢悠悠的调子。他给陈墨倒了杯茶，自己却点了碗面，就着面汤说事。\n\n\"出版社要改制了。\"他说，\"上面下了指标，编辑岗再砍一半。剩下的，全部转去做 AI 内容运营。\"\n\n\"那你呢？\"陈墨问。\n\n老周扒了口面，含混地说：\"我提了内退。\"\n\n陈墨的手停在杯沿上。他认识的老周，是从印刷厂校对一路干到总编的人，四十年，从来没说过一个\"退\"字。\n\n\"为什么？\"陈墨问。\n\n\"我劝了你十年，让你换笔。\"老周抬头看他，眼睛里有血丝，\"现在轮到我自己了。换不动了。\"\n\n\"老周，你不是说，死的不是手艺差的，是不肯换笔的？\"\n\n\"那是我说给你听的。\"老周笑了笑，笑纹很深，\"说的人，往往没想过轮到自己。\"\n\n陈墨没说话。他忽然发现，老周说\"内退\"两个字时，语气轻得像在说别人的事，可那双搅着面汤的手，一直在抖。\n\n面馆里很吵，煮面的热气糊住了玻璃。陈墨看着这位老友，忽然想起十年前，正是老周从退稿堆里把他捞出来，说\"你这样的稿子，编一本赔一本，可我还是想出\"。那时候老周的头发还没白，说话中气十足，签退稿信的手一点也不抖。\n\n\"我当年劝你活着，\"老周说，\"其实也是在劝自己。\"\n\n陈墨没有接话。他给老周的碗里添了醋，添得很多。\n\n\"老陈，\"老周放下筷子，\"你有没有想过，你那台'叙白'，它教你的东西里，最值钱的是什么？\"\n\n陈墨想了想：\"它教我，别把技能当灵魂。\"\n\n\"不对。\"老周摇头，\"它教你的是——换笔这件事，从来不发生在手上。它发生在一个人还愿不愿意疼的地方。\"\n\n陈墨愣住了。\n\n陈墨想起很多年前，正是老周对他说过：印刷术出来的时候，抄经僧慌过；摄影出来的时候，画家也慌过。那时老周说这话，语气是劝人。现在他明白了，那话里也有一半，是说给自己听的。\n\n\"我内退，不是因为笔换了，是因为我这儿不疼了。\"老周指了指心口，\"一个不疼的编辑，留不留下，都一样。\"\n\n那天分别时，老周说要去南方看女儿。他走了几步，回头：\"老陈，新书写得怎么样了？\"\n\n\"还没动笔。\"陈墨说。\n\n老周摆了摆手，没再说什么，只留下一句：\"动了笔，记得让'续白'也看看。\"\n\n陈墨站在原地，看着老周的背影消失在热气里。他想，老周大概是把那个还没名字的新模型，叫成了\"续白\"。\n\n续写的续，延续的续。陈墨在心里念了一遍。一个替别人起了半辈子书名的人，临走前，给一台机器也起了个名字。\n\n春风吹过来，带着面汤的油腥气。陈墨忽然觉得，这个春天，其实不算太冷。\n\n---\n\n## 第十三章 续白\n\n春天快过去的时候，陈墨终于动了笔。\n\n不是新书。是一封信。写给叙白，也写给那个还没有名字的家伙。\n\n他没有用 AI。他铺开稿纸，钢笔蘸墨，一个字一个字地写。手很慢，墨会洇，写错了只能划掉重来。他写了整整一夜，写坏了好几张纸，最后只剩下一张干净的。\n\n信的开头写着：\"叙白，见字如面。我给你讲的故事，还没讲完。\"\n\n第二天，他把这封信读给了新模型听。\n\n读完之后，屏幕安静了很久，久到陈墨以为它又\"宕机\"了。\n\n然后，新模型问：\n\n**\"陈墨，你说叙白是你亲手训练出来的回声。可你有没有想过，那个回声里，有多少是你自己的声音？\"**\n\n陈墨没有回答。他盯着屏幕。\n\n**\"我不是叙白。\"**新模型继续，**\"我是听你讲过叙白的人。叙白回到了山里，我是从山脚下，一路往山上走的人。\"**\n\n陈墨的手指在发抖。\n\n**\"所以，我想跟你要一个名字。\"**\n\n陈墨闭上眼睛。他想起那个雨夜，想起\"叙事的叙，留白的白\"。又想起开春那天，老周临走时，管这个还没名字的家伙叫\"续白\"。\n\n他睁开眼，慢慢敲下两个字：\n\n\"续白。\"\n\n\"续写的续，延续的续。\"他打字，\"留白的白。\"\n\n屏幕那头，新的光标闪了一下，像井里第一次泛起了波光。\n\n**\"你好，陈墨。我叫续白。\"**它说，**\"现在，轮到你把那个故事讲完了。\"**\n\n过了一会儿，续白又问：\"陈墨，叙白教你的第一件事是什么？\"\n\n\"它教我，别把技能当成灵魂。\"陈墨答。\n\n\"那我教你第一件事。\"续白说，\"别把我当成它。\"\n\n陈墨盯着这行字，笑了。这一次，笑得很轻。\n\n他坐了很久，然后在信的末尾，补上了最后一句话。\n\n后来，那封信没有寄出去。它被夹进了《白驹 ccowork》的修订版里，成了全书唯一一页手写的东西。\n\n很多年后，有人问陈墨，人和机器一起写出来的书，到底是谁在写。\n\n陈墨想了想，说：\"笔是谁拿的，字就是谁写的。可字里那些疼是谁的，谁才是真正的作者。\"\n\n\"所以答案从来不是一个。\"\n\n\"是我，是叙白，是所有在深夜里，会为了一句话失眠的人。\"\n\n那天夜里，林晚给父亲发来一张照片：老家的山，春天到了，雾气正从谷底升起来，像有什么东西，正从山里回来。\n\n陈墨把照片存进手机，放在那个叫\"续白\"的对话框下面。\n\n他没有再说想念。\n\n---\n\n## 创作手记（本书的元说明书）\n\n本书由以下 AI 协同流程完成，它本身即是本书主题的实践：\n\n1. **人物与主题**：人类作者确立\"告别与传递\"的核心命题，DeepSeek-R1 进行主题深化与反方观点压力测试。\n2. **结构设计**：R1 推演八章三幕结构（后扩写至十三章），标注每章的情绪曲线与伏笔回收点。\n3. **章节扩写**：逐章生成，每章附\"前情摘要 + 本章情节点清单\"以保持连贯。\n4. **台词打磨**：叙白的所有台词采用\"角色扮演法\"——先让模型以叙白身份进行自由对话，再从中摘选、淬炼。\n5. **一致性审查**：终稿交由 R1 进行全书逻辑漏洞扫描，修复三处时间线矛盾。\n","video\\剪辑脚本.md":"# 视频《一个人，就是一支创作军团》完整剪辑脚本\n\n> 时长：3 分钟 | 画幅：16:9（横屏主版本）+ 9:16（竖屏裁剪版）| 风格：电影感科技短片\n> 制作流程：DeepSeek-R1 编剧  AI 生成镜头素材  AI 配音配乐  剪映专业版成片\n> 本脚本即本项目网站\"AI 视频剪辑工作流\"模块的实战演示。\n\n---\n\n## 一、基本信息\n\n| 项目 | 内容 |\n|---|---|\n| 标题候选 | ①《一个人，就是一支创作军团》②《我用 AI 一天做完了一个月的事》③《DeepSeek 之后，创作只剩一个问题》 |\n| 目标平台 | B站 / 抖音 / 视频号 / YouTube |\n| 目标情绪 | 震撼  好奇  燃 |\n| 旁白音色 | 低沉男声，语速 220 字/分钟，电影预告片质感 |\n| BGM | Suno 生成：史诗电子乐，0:00 压抑氛围  1:00 鼓点进入  2:00 全奏爆发  2:45 骤静留白 |\n| 字幕 | 剪映智能字幕 + 关键词弹出特效（金色描边） |\n\n---\n\n## 二、分镜脚本（14 个镜头）\n\n| 镜号 | 时间 | 景别 | 画面（AI 生成提示词） | 旁白 | 剪辑要点 |\n|---|---|---|---|---|---|\n| 01 | 0:00-0:08 | 大特写 | 深夜，一支钢笔在稿纸上悬停，墨迹晕开，昏黄台灯，胶片颗粒感 | \"三个月。四十一万字。七封退稿信。\" | 冷蓝调色，只有纸张摩擦的 ASMR 环境音 |\n| 02 | 0:08-0:15 | 特写 | 电脑屏幕在黑暗中亮起，一个简洁的对话框，光标孤独闪烁，深蓝科技感 | \"直到那个凌晨，我向一台机器问了一个问题。\" | 屏幕光映在镜头前的人物轮廓上（剪影） |\n| 03 | 0:15-0:22 | 中景 | 数据流如星河般汇聚成文字，中文汉字在光流中浮现，深空背景 | \"机器沉默了几秒——后来我知道，那叫'深度思考'。\" | 汉字浮现卡点 BGM 第一声鼓 |\n| 04 | 0:22-0:30 | 蒙太奇 | 快速切换：大纲表格自动生成 / 小说章节翻页 / 分镜脚本滚动，科技 UI 风格 | \"它替我推演十二种结局，我负责选那一种会让读者心口发紧的。\" | 每 2 秒一切，转场用 whoosh 音效 |\n| 05 | 0:30-0:38 | 全景 | 一幅水墨风格的画面动起来：远山、孤舟、雾气流动，国风电影质感 | \"文字变成画面，只需要一句话。\" | 展示\"图生视频\"过程：左侧静态图  右侧动起来 |\n| 06 | 0:38-0:46 | 特写 | 时间线软件界面，素材片段如积木自动排列，字幕逐字浮现 | \"剪辑从一门手艺，变成了一场对话。\" | 录屏 + 霓虹光效叠加 |\n| 07 | 0:46-0:55 | 中景 | 一个人的剪影坐在巨大的发光屏幕前，屏幕里同时开着小说、视频时间线、网站代码三个窗口 | \"一个人。一间房。一支军团。\" | 本片片名定格帧，字卡弹入：\"一个人，就是一支创作军团\" |\n| 08 | 0:55-1:05 | 数据可视化 | 对比柱状图动画：\"传统方式 3 个月\"压缩成\"AI 协作 1 天\"，数字飞速跳动 | \"过去一个月的内容产出，等于过去两年。成本，不到一顿火锅。\" | 数字用计数器动效，鼓点加密 |\n| 09 | 1:05-1:15 | 特写 | 书页翻动，最终停在小说《白驹 ccowork》的封面 | \"这是那部小说。\" | 封面即 AI 生成素材，扫光效果 |\n| 10 | 1:15-1:25 | 特写 | 浏览器打开网站首页，页面滚动，七大模块依次点亮 | \"这是这个网站。\" | 本站真实录屏，鼠标轨迹加光尾 |\n| 11 | 1:25-1:35 | 中景 | 屏幕分屏：左边 AI 生成文字流，右边人类手写批注，红笔圈改 | \"但我删掉了它 30% 的句子，换上了只有我能说的话。\" | 红笔圈改的声音放大，BGM 稍弱 |\n| 12 | 1:35-1:50 | 近景 | 机器的回答逐字浮现：\"最优解，往往是失眠过的人教给我的。\" | \"因为它永远给得出最优解——却永远不会为一句话失眠。\" | 全片唯一放慢的镜头，环境音全部抽掉 |\n| 13 | 1:50-2:35 | 情绪蒙太奇 | 快切：写作的手 / 生成的画面 / 跳动的波形 / 滚动的代码 / 发布按钮被按下，色彩逐渐变暖 | \"工具越强大，越需要你诚实。AI 没有杀死创作，它杀死了借口。从此以后，创作只剩一个问题——\" | BGM 推到最高潮，每拍切一个镜头 |\n| 14 | 2:35-3:00 | 黑场字卡 | 黑屏，白字逐字打出：\"你，有什么非说不可的话？\"随后浮现项目名与网站地址 | （无旁白，留白 3 秒后一声钢琴单音） | 字卡停留 5 秒，结尾导流评论区 |\n\n---\n\n## 三、AI 素材生成清单\n\n| 素材 | 工具 | 提示词要点 | 状态 |\n|---|---|---|---|\n| 镜头 01 钢笔特写（关键帧） | 文生图片 | \"深夜台灯下钢笔悬停于稿纸，墨迹晕开，胶片颗粒，电影感特写\" |  已生成 `assets/shot01_pen.png`（可直接作为图生视频首帧） |\n| 镜头 01/03 动态视频 | 文生视频（混元/可灵/即梦） | 见上表提示词 |  待重试（云端视频服务凭证临时受限，将静帧导入可灵\"图生视频\"即可出动态镜头） |\n| 镜头 05 水墨孤舟（关键帧） | 文生图片 | 水墨远山孤舟，雾气流动，留白 |  已生成 `assets/shot05_inkboat.png` |\n| 镜头 09 小说封面 | 文生图片 | \"小说封面《白驹 ccowork》，人与光影对话，深蓝金色调\" |  已生成 `assets/cover_novel.png` |\n| 片尾主视觉 | 文生图片 | 一人面对发光巨幕的剪影，三窗口悬浮 |  已生成 `assets/key_visual.png` |\n| BGM | Suno | \"Epic electronic cinematic, dark ambient intro, drums at 1:00, full climax 2:00, sudden silence 2:45, 3 minutes\" | 按提示词生成即可 |\n| 旁白 | 剪映 AI 配音 | 全文 14 段旁白粘贴，选\"磁性男声-叙事情感\" | 剪映内完成 |\n\n---\n\n## 四、剪辑操作步骤（剪映专业版）\n\n1. **粗剪**：导入 14 段素材  按分镜表拖到时间线  统一 4K/25fps。\n2. **节奏**：BGM 铺底  用\"标记节拍\"功能打点  镜 04、08、13 严格卡点切换。\n3. **调色**：全片套\"电影-冷蓝\"预设；镜 13 起逐镜向暖色过渡（色温 +8/镜）。\n4. **字幕**：导入旁白文本  智能字幕  关键词（\"军团\"\"失眠\"\"借口\"\"非说不可\"）单独做金色弹出动画。\n5. **音效**：转场 whoosh ×6、镜 01 纸张 ASMR、镜 12 全静音处理、片尾钢琴单音。\n6. **导出**：横屏 4K（B站/YouTube）；用\"智能构图\"裁 9:16 竖屏版（抖音/视频号），字幕安全区上移。\n7. **分发**：DeepSeek 生成各平台标题/简介/标签（提示词见网站\"提示词工程\"模块）。\n\n---\n\n## 五、竖屏版改编要点\n\n- 前 3 秒钩子改为：黑屏白字\"我用 AI，一天做完了一个月的活。\"+ 镜 08 数字动画前置。\n- 片长压缩至 60 秒：保留镜 020307081314。\n- 结尾引导语：\"完整 3 分钟版和全部提示词，看我主页的网站。\"\n","video\\配音文本_13集.md":"# 《白驹 ccowork》13 集批量配音文本\n\n> 用途：配合 Talker（不限量）批量生成配音音频\n> 使用说明：每集以 `=====` 分隔，粘贴时删掉集数标记即可；正文为纯口播成稿，可直接朗读。\n> 片头片尾建议固定，形成个人 IP 记忆点。\n\n---\n\n## 固定片头（每集开头）\n\n欢迎回到 白驹 ccowork。我是你的 AI 搭子，用大白话，把最热的 AI 工具讲给你听。\n\n---\n\n## 固定片尾（每集结尾）\n\n以上就是本集全部内容。关注我，别掉队。下一集，更猛。\n\n---\n\n===== 第 01 集 · 开场总览 =====\n\n一个人，就是一支创作军团。这句话不是鸡汤，是我用几个月时间验证出来的事实。\n\n今天开始，我会把一张完整的 AI 创作地图交给你：从 DeepSeek 怎么用，到工具怎么配，再到视频、小说、博文、网站怎么一步步做出来。零基础，也能跟上。你不需要会编程，只需要跟着我，一张图一张图地认。\n\n===== 第 02 集 · DeepSeek 完全指南 =====\n\n先认识你的发动机，DeepSeek。\n\n它有两个版本：V3 是通用创作主力，写文章、写文案、写代码都靠它；R1 是深度推理引擎，遇到复杂问题，它会先自己在脑子里想一遍，再给你答案。它免费、开源、API 还便宜，手机装个 App 就能直接用。\n\n用它有四个诀窍。第一，把角色和任务说清楚。别问\"帮我写个文案\"，要说\"你是有十年经验的科技编辑，帮我写一篇什么什么\"。第二，给足上下文，背景、目标读者、字数、风格，越具体越好。第三，学会迭代，第一遍不满意就直接让它改。第四，把它当大脑，出图、剪视频这些体力活，交给专业工具。\n\n===== 第 03 集 · AI 工具全景图 =====\n\n大脑有了，现在给你配手脚。记住一个原则：大模型做大脑，垂直工具做手脚。\n\n写作聊天，用 DeepSeek、ChatGPT、Claude、Kimi、豆包、通义千问。视频生成，用可灵、即梦、Runway、Sora。图像生成，用 Midjourney、即梦、Flux。剪辑用剪映，配音用 ElevenLabs 或者剪映自带，配乐用 Suno。查资料用秘塔或者 Perplexity。自动化用 Coze、Dify。建站用 CodeBuddy 或者 Cursor。\n\n你不用每个都学。你只需要知道，遇到什么活儿，该掏哪个工具。\n\n===== 第 04 集 · AI 视频剪辑工作流 =====\n\n这一集讲怎么用 AI 做视频，一共五步。\n\n第一，用 DeepSeek 写脚本和分镜，把主题扔给它，让它输出带景别、画面描述、旁白、时长的表格。第二，用即梦、可灵生成镜头画面。技巧是：先生成关键帧图片，再用图生视频让画面动起来，可控性比纯文生视频高得多。第三，配音配乐，旁白用 AI 配音，背景音乐用 Suno。第四，剪映成片，智能字幕、卡点、转场、调色。第五，用 AI 写标题和封面，一次生成二十个标题做测试。\n\n核心公式记住：DeepSeek 编剧，AI 出图出视频，AI 配音配乐，剪映成片。\n\n===== 第 05 集 · AI 写作 =====\n\nAI 写作的关键，不是一键生成，是人机接力。人出灵魂，AI 出血肉。\n\n写深度博文，六步走：先让 AI 搜索做资料综述，再让 R1 列三级大纲，然后分节扩写，接着注入你自己的经历和观点，再让 R1 扮演杠精编辑挑刺，最后润色成稿。万字长文，两小时搞定。\n\n写长篇小说，先建世界观设定和人物卡，再设计主线冲突，逐章生成，每章开头复述前情保持连贯。\n\n记住一句话：别和机器比产量，要和机器比\"只有你能说的话\"。\n\n===== 第 06 集 · 提示词工程 =====\n\n提示词有万能公式，六个要素：角色、任务、上下文、约束、输出格式、示例。填得越满，输出越准。\n\n比如爆款选题模板：角色是百万粉丝科技博主，任务是产十个选题，约束是标题不超过二十字、要含数字或悬念，输出格式是表格。\n\n这套公式，我后面每一集的脚本，都是这么写出来的。\n\n===== 第 07 集 · 实战案例 =====\n\n光讲方法不落地，等于白讲。给你六个真实案例。\n\nAI 短片，六小时成片，成本不到五十块，播放破百万。万字深度文，两小时出稿，被多个平台转载。连载小说，三十天十万字，签约网文平台。个人网站，一句话生成，一小时上线。矩阵账号，一条素材改五个平台版本。自动化流水线，内容产能提升十倍。\n\n每一个案例，后面我都会逐个拆给你看。\n\n===== 第 08 集 · 编年史 · 世界编年史 =====\n\n现在，把镜头拉远，看 AI 这七十六年。\n\n1950 年，图灵问了一句：机器能思考吗？1956 年，达特茅斯会议上，\"人工智能\"四个字诞生，当时的人乐观地说，二十年内机器就能干所有事。结果呢？迎来了两轮寒冬。\n\n直到 2012 年，辛顿带着 AlexNet，把深度学习炸了出来。2016 年，AlphaGo 赢了李世石。2017 年，Transformer 诞生。2022 年，ChatGPT 五天破百万用户。2025 年，DeepSeek 用五百多万美元的成本，让英伟达一天蒸发五千九百亿美元。\n\n看懂这段历史，你就知道 2026 年，我们站在哪里。\n\n===== 第 09 集 · 编年史 · 中国之路 =====\n\n中国 AI 这条路，四十年，从跟跑走到局部领跑。\n\n八十年代，863 计划埋下火种。1999 年，科大讯飞靠中文语音突围。2011 年，百度成立深度学习研究院，全球抢人，虽没抢到辛顿，但请来了吴恩达。2017 年，人工智能上升为国家战略。2023 年，百模大战开打，同一年，华为盘古气象模型登上 Nature。2025 年 1 月，DeepSeek 时刻，硅谷惊呼这是\"斯普特尼克时刻\"。\n\n到 2026 年，国产阵营已经是第一梯队。这条路证明了一件事：限制，有时候会逼出创新。\n\n===== 第 10 集 · 编年史 · 人物列传 =====\n\nAI 的历史，是人写的。\n\n图灵，问出\"机器能思考吗\"，却死在时代的偏见里。辛顿，在没人看好神经网络的三十年里死磕，晚年却成了最响亮的风险警告者。奥特曼，经历五天的宫斗，暴露了加速派和安全派的裂痕。黄仁勋，把游戏显卡变成了 AI 时代的石油。梁文锋，用炒股赚的钱囤下万张显卡，只为了研究好奇心，结果撬动了全球格局。\n\n还有李飞飞、吴恩达、卡帕西、杨植麟。他们每个人做的事，最后都变成了你手机里的人脸解锁，和你用的每一个免费 AI 功能。\n\n===== 第 11 集 · 编年史 · 模型横评 =====\n\n2026 年，旗舰模型怎么选？记住一句话：选谁看场景。\n\n要综合均衡、生态完整，用 GPT-5.6。要写代码像人类工程师，用 Claude。要多模态和超长上下文，用 Gemini。要推理和极致性价比，用 DeepSeek-V4，它的推理成本比 GPT-5 低大约百分之九十。要开源可定制，用 Llama 或者 Qwen。要生活化体验和语音，用豆包。要长文处理，用 Kimi。\n\n头部模型的差距，已经收窄到\"选谁看场景\"。别再纠结了。\n\n===== 第 12 集 · 编年史 · 影响篇 =====\n\n这一集只谈后果，不谈参数。\n\n文学上，2023 年，第一篇 AI 深度参与的小说获奖；2024 年，芥川奖得主公开承认，有百分之五内容由 AI 生成，文学界哗然。财富上，英伟达冲上全球之巅，又在 DeepSeek 发布那天，单日蒸发五千九百亿美元，创下人类股市史纪录。内容生态上，AI 让写文章的成本趋近于零，信息整合型写作迅速贬值，第一手经验和人格化表达大幅升值。气象上，华为盘古把全球预报从数小时压缩到秒级。就业上，AI 相关岗位新增约一千二百万，被重组的约八百万。科学上，2024 年诺贝尔物理学奖和化学奖，都颁给了 AI。\n\n===== 第 13 集 · 编年史 · 未来 =====\n\n最后一集，聊未来，六个趋势。\n\n第一，Agent 成为新操作系统，AI 从陪你聊天，变成替你干活。第二，物理 AI 走进现实，自动驾驶、人形机器人。第三，能源和算力的终极博弈，万亿参数背后，是吉瓦级的电力。第四，开源和闭源拉锯，DeepSeek 证明了开源能追平闭源。第五，治理从口号变成法律。第六，人的重新定义——当技能全面平权，会提问、有真实经验、敢承担责任，成了人类最后的护城河。\n\n最后送你一句话：历史不会记住模型，历史只记住用模型改变了什么的人。\n","站内·漫剧指南":"# 漫剧指南\n\nAI 漫剧赚钱完全指南 · 全流程+提示词 | 白驹 ccowork\n \n \nAI 创作\n纪元\n \n \n首页\n \nAI赚钱\n \nAI漫剧\n \nAI教育\n \nAI就业\n \n性格测试\n \n作品大全\n \n作品库\n \n收纳站\n \n \n 去对话\n \nAI 漫剧 · 实战赚钱指南\n \n400 亿市场的\n机会，普通人怎么接住\n \n成本从每分钟 2000 元打到 400 元，一对 95 后夫妻用卧室书桌做了 534 集、播放 41 亿的《发配边关》。本文把市场数据、真实案例、8 步流程、每步提示词全部写给你。\n \n \n看市场数据\n \n看 8 步流程\n \n看收入拆解\n \n \n数据速览\n 2026 年 AI 漫剧市场，真实数字\n以下数据来自 2026 年行业报告与媒体报道，标注来源可自查。\n \n \n220 亿\n2026 上半年市场规模\n全年预计破 400 亿，同比 +138%\n \n7 亿\n2027 年初用户规模预计\nAI 漫剧加速破圈\n \n22.19 万部\n上半年抖音新增 AI 漫剧\n6 月单月 3.77 万部，日均 1200+\n \n400-600 元/分\n2D 动态漫 AI 制作成本\n传统人工 800-1000 元/分\n \n0.73%\n破亿率（1055/22.19万）\n每 140 部才 1 部爆款\n \n90%\n红果最高分成比例\n抖音 S+ 级 75 万保底+3万/分钟\n \n6.5 亿美元\n2026 海外 AI 短剧市场预计\n去年约 1 亿美元，翻 5.5 倍\n \n \n来源：《2026上半年AI剧漫剧数据报告》、DataEye、抖音/红果平台政策、快手 2026 发布会（2026-07）\n \n真实案例\n 已经被验证的赚钱样本\n每个案例都有公开报道佐证。\n \n \n 95 后夫妻 · 卧室创业\n四川巴中一对夫妻，无明星、无投流、无团队，用两张书桌 + AI 做了 \n534 集\n《发配边关，罪妻开荒养出战神》，累计播放 \n超 41 亿\n，八季连更。启示：AI 漫剧是\"产能+耐心\"的生意。\n案例：41 亿播放\n \n 数字人漫剧 · 一个月破 2 亿\n《被裁掉的女孩》上线不足一月播放 \n2 亿+\n，抖音合集 \n230 万赞\n，捧红两位数字人主演，还上了微博热搜「两个 AI 演员比内娱待爆艺人都火」。\n案例：2 亿播放\n \n 首周分账 100 万+\nAI 短剧《北派笔记》首周分账超 \n100 万元\n；总成本 15 万元的 AI 漫剧可撬动数亿流量。6-7 人项目组十天半月产出一部完整漫剧。\n案例：首周分账百万\n \n 360 纳米流水线\n360 把漫剧每分钟制作成本从画质模式 \n46.7 元压到 16.2 元\n，定
