<script>
(function(){
'use strict'
var QS = [
  {q:'你用 AI 最想解决什么？', o:['做出作品（漫剧/绘画/视频）','更快干完活（周报/表格/邮件）','学懂新东西（课程/答疑/研究）','多赚钱（副业/接单/卖货）']},
  {q:'拿到一个 AI 工具，你先干什么？', o:['试着创作点什么','找它能不能自动做我的活','查资料、学透用法','琢磨怎么用它变现']},
  {q:'什么事让你最有成就感？', o:['作品被人夸','省下了大把时间','搞懂一个难题','收到第一笔钱']},
  {q:'你的时间大头花在哪？', o:['表达创意、打磨细节','处理事务、安排琐事','吸收信息、深度思考','对接需求、谈合作']},
  {q:'朋友怎么形容你？', o:['有想法、点子多','靠谱、执行力强','爱钻研、坐得住','会来事、懂商业']},
  {q:'如果只学一样 AI 技能，你选？', o:['提示词做图/视频','自动化工作流','深度问答/文献研究','商业落地与运营']},
  {q:'你希望 AI 是你的……', o:['灵感搭子','万能助理','私人家教','生意搭档']},
  {q:'刷到 AI 爆款内容，你第一反应？', o:['想模仿一个','想拿去提效','想搞清楚原理','想看能不能变现']},
  {q:'工作学习里你最烦什么？', o:['灵感枯竭','重复琐碎','概念听不懂','忙活不赚钱']},
  {q:'给你 10 万预算投入 AI，你选？', o:['买工具做作品','买软件省人力','报课深度学习','投资做小生意']}
]
var KEYS=['A','B','C','D'], DIMS=['creative','efficient','learn','business']
var NAME={creative:'灵感创作者',efficient:'效能管家',learn:'求知学者',business:'商业操盘手'}
var EMOJI={creative:'',efficient:'',learn:'',business:''}
var SCORE={creative:0,efficient:0,learn:0,business:0}
var cur=0
var stage=document.getElementById('stage'), prog=document.getElementById('prog')
function renderQ(i){
  prog.style.width=((i+1)/QS.length*100)+'%'
  var q=QS[i]
  var html='<div class="qno">第 '+(i+1)+' / '+QS.length+' 题</div><div class="qtext">'+q.q+'</div>'
  q.o.forEach(function(t,j){ html+='<button class="opt" data-j="'+j+'" type="button"><span class="k">'+KEYS[j]+'</span>'+t+'</button>' })
  stage.innerHTML=html
  stage.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click',function(){ SCORE[DIMS[+b.getAttribute('data-j')]]++; cur++; if(cur<QS.length) renderQ(cur); else renderR() })
  })
}
function renderR(){
  prog.style.width='100%'
  var sorted=DIMS.slice().sort(function(a,b){return SCORE[b]-SCORE[a]})
  var top=sorted[0]
  var desc={
    creative:{d:'你的天赋是“创造”。别人在等灵感，你在用提示词量产灵感。', rec:' AI 漫剧 + 作品创作', links:[['去 AI 漫剧指南','manju.html'],['逛作品内容库','works.html']], tips:['练熟 1-2 款生图/生视频模型，做垂直品类','把人设卡+一致性模板沉淀成你的流水线','先在平台发 10 条练数据，再考虑变现']},
    efficient:{d:'你的天赋是“提效”。别人加班，你用 AI 下班。', rec:' 岗位工作台 + 办公自动化', links:[['去 AI 赚钱攻略','ai-money.html'],['去 AI 就业指南','ai-jobs.html']], tips:['把周报/表格/邮件做成你的专属提示词库','学自动化工作流，让 AI 替你盯重复活','用提效结果做述职，向“岗位+AI”转型']},
    learn:{d:'你的天赋是“钻研”。别人在学用法，你在研究原理。', rec:' AI 赋能教育 + 深度研究', links:[['去 AI 教育专题','ai-edu.html'],['去 AI 就业指南','ai-jobs.html']], tips:['用 AI 做“苏格拉底式”对练，边问边学','把学到的整理成课程/笔记，二次变现','往提示工程、AIGC 训练师等新职能发展']},
    business:{d:'你的天赋是“经营”。别人在玩工具，你在算账。', rec:' 变现闭环 + 工作台顾问', links:[['去 AI 赚钱攻略','ai-money.html'],['去 AI 漫剧指南','manju.html']], tips:['先跑通一个小闭环：接单交付复购','用 AI 降低交付成本，单子越接越值钱','把经验打包成课程/代运营，做高客单']}
  }[top]
  var s=desc
  var html='<div class="result"><div class="emoji">'+EMOJI[top]+'</div><h3>'+NAME[top]+'</h3>'+
    '<p class="sub">'+s.d+'</p>'+
    '<div class="score">'+DIMS.map(function(k){return '<span>'+(k===top?'':'')+NAME[k]+' '+SCORE[k]+'</span>'}).join('')+'</div>'+
    '<div class="rec"><b> 推荐路线：</b>'+s.rec+'<ul>'+s.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></div>'+
    '<div class="links">'+s.links.map(function(l){return '<a class="btn btn-p" href="'+l[1]+'">'+l[0]+'</a>'}).join('')+'<button class="btn btn-g" id="again" type="button">重新测试</button></div></div>'
  stage.innerHTML=html
  document.getElementById('again').addEventListener('click',function(){ SCORE={creative:0,efficient:0,learn:0,business:0};cur=0;renderQ(0) })
  try{localStorage.setItem('ai.personality',JSON.stringify({top:top,score:SCORE,ts:Date.now()}))}catch(e){}
}
renderQ(0)
})()
</script>
