:root{

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

.hero{padding:64px 24px 30px;text-align:center;

.hero h1{font-size:clamp(28px,4.5vw,52px);font-weight:900;letter-spacing:1px}

.toolbar{display:flex;justify-content:center;gap:10px;margin:22px 0 6px;flex-wrap:wrap}
.toolbar button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 16px;font-size:13px;cursor:pointer;transition:.25s}
.toolbar button:hover{border-color:var(--cyan)}
.chips{display:flex;justify-content:center;gap:9px;margin:10px 0 4px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 16px;font-size:13px;cursor:pointer;transition:.25s}
.chip:hover{border-color:var(--cyan);color:var(--text)}
.chip.on{background:var(--grad);color:#03121a;border-color:transparent;font-weight:700}
.count{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 18px}
.count b{color:var(--cyan);font-family:var(--mono)}
.wrap{max-width:900px;margin:0 auto;padding:10px 20px 80px}
.work{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;transition:.25s}
.work.hide{display:none}
.work[open]{border-color:rgba(79,140,255,.4)}
.work summary{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;list-style:none;user-select:none}
.work summary::-webkit-details-marker{display:none}
.work summary:hover{background:var(--bg2)}
.w-cover{width:48px;height:48px;border-radius:10px;object-fit:cover;border:1px solid var(--line);flex:none;background:#0b1224}
.w-title{font-weight:700;font-size:15px;flex:1;line-height:1.4}
.w-tag{font-size:11px;color:var(--cyan);border:1px solid rgba(56,225,255,.35);padding:2px 10px;border-radius:999px;white-space:nowrap}
.w-caret{color:var(--muted);font-size:13px;transition:transform .25s;flex:none}
.work[open] .w-caret{transform:rotate(90deg)}
.w-body{padding:6px 22px 24px;border-top:1px solid var(--line);color:#d7e0f4;font-size:15px}
.w-body article{max-width:100%}
.w-body h1{font-size:24px;margin:14px 0 12px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.w-body h2{font-size:21px;margin:22px 0 10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.w-body h3{font-size:17px;margin:18px 0 8px;color:var(--cyan)}
.w-body h4{font-size:15px;margin:14px 0 6px;color:var(--gold)}
.w-body p{margin:10px 0}
.w-body blockquote{border-left:3px solid var(--purple);padding:4px 14px;color:var(--muted);margin:12px 0;font-style:italic}
.w-body ul,.w-body ol{margin:10px 0 10px 22px}
.w-body li{margin:4px 0}
.w-body hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.w-body a{color:var(--cyan)}
.w-body code{background:#0b1224;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:13px}
.w-body img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:10px 0}
.w-body b{color:#fff}
.w-body table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px}
.w-body th,.w-body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.hint{text-align:center;color:var(--muted);font-size:13px;padding:16px}
.err{color:var(--pink)}
.loading{color:var(--muted);font-size:13px;padding:8px 0}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
/*
// 抽取 <article>
<figure class="cc-pg-cover" style="margin:0 0 22px;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.10);background:linear-gradient(120deg,#4f8cff22,#8b5cf622);"><img src="/assets/pg/pg-website-works.png" alt="ccowork · 作品内容库 · 白驹 ccowork" loading="lazy" style="display:block;width:100%;height:clamp(180px,32vw,340px);object-fit:cover;"></figure>
 正文，剥离脚本，并把资源路径重写为绝对地址（保证图片/链接可加载）
*/
function extractArticle(html, baseUrl){
  var m = html.match(/<article[\s\S]*?<\/article>/i);
  var art = m ? m[0] : html;
  art = art.replace(/<script[\s\S]*?<\/script>/gi, '');
  // 剥掉 <article> 外壳
  art = art.replace(/^<article[^>]*>/i, '').replace(/<\/article>\s*$/i, '');
  try {
    var base = new url(baseUrl, location.href);
    art = art.replace(/(src|href)="([^"]*)"/gi, function(full, attr, val){
      if(/^(https?:|data:|#|mailto:)/.test(val)) return full;
      try { return attr + '="' + new url(val, base).href + '"'; } catch(e){ return full; }
    });
  } catch(e){}
  // 去掉与卡片标题重复的首个 h1
  art = art.replace(/^\s*<h1[^>]*>[\s\S]*?<\/h1>/i, '');
  return art;
}
var wrap = document.getElementById('works')
var loaded = 0
MANIFEST.forEach(function(item, idx){
  var d = document.createElement('details')
  d.className = 'work'
  d.dataset.cat = item.cat
  d.open = idx < 3   // 前 3 部默认展开，其余懒加载
  d.innerHTML =
    '<summary>' +
      '<img class="w-cover" src="'+item.cover+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
      '<span class="w-title">'+esc(item.title)+'</span>' +
      '<span class="w-tag">'+item.cat+'</span>' +
      '<span class="w-caret"></span>' +
    '</summary>' +
    '<div class="w-body"><div class="loading">加载中…</div></div>'
  wrap.appendChild(d)
  var body = d.querySelector('.w-body')
  function load(){
    if(d.dataset.loaded) return
    d.dataset.loaded = '1'
    fetch(item.url)
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text() })
      .then(function(html){ body.innerHTML = extractArticle(html, item.url); loaded++; updateCount() })
      .catch(function(e){ body.innerHTML = '<span class="err">无法加载：'+esc(item.url)+'（'+esc(e.message)+'）</span>' })
  }
  // 默认展开的直接加载；其余在首次打开时懒加载
  if(d.open) load()
  d.addEventListener('toggle', function(){ if(d.open) load() })
})
function updateCount(){
  document.getElementById('count').innerHTML = '共 <b>'+MANIFEST.length+'</b> 部作品 · 已载入 <b>'+loaded+'</b> 部 · 点标题展开正文'
}
updateCount()
document.getElementById('expandAll').onclick = function(){
  wrap.querySelectorAll('details').forEach(function(d){ if(!d.classList.contains('hide')){ d.open = true; /* 触发懒加载 */ if(!d.dataset.loaded){ var ev=new Event('toggle'); d.dispatchEvent(ev); } } })
}
document.getElementById('collapseAll').onclick = function(){
  wrap.querySelectorAll('details').forEach(function(d){ d.open = false })
}
// 分类筛选
document.getElementById('chips').addEventListener('click', function(e){
  var btn = e.target.closest('.chip'); if(!btn) return
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on') })
  btn.classList.add('on')
  var cat = btn.dataset.cat
  wrap.querySelectorAll('.work').forEach(function(d){
    d.classList.toggle('hide', cat !== 'all' && d.dataset.cat !== cat)
  })
})
document.getElementById('footNote').textContent = '提示：正文为真实内嵌内容。若某部显示「无法加载」，请用 http(s) 方式访问（本地 node server.mjs 或已部署的云端链接）。'
</script>
