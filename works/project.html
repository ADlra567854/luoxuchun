<style>
:root{--blue:#4f8cff;--grad:linear-gradient(120deg,#4f8cff,#38b6ff 50%,#8b5cf6)}
.pj-wrap{max-width:960px;margin:0 auto;padding:30px 20px 90px}
.pj-back{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;padding:8px 16px;
  border-radius:999px;border:1px solid rgba(79,140,255,.28);background:rgba(79,140,255,.08);
  color:var(--blue,#4f8cff);font-size:13px;font-weight:700;text-decoration:none}
.pj-back:hover{background:rgba(79,140,255,.16)}
.pj-card{border-radius:18px;border:1px solid rgba(130,160,210,.22);background:var(--card,#fff);
  box-shadow:0 10px 34px rgba(30,60,120,.07);overflow:hidden}
.pj-hero{display:flex;gap:22px;align-items:center;padding:30px;background:var(--grad);color:#fff}
.pj-ini{flex:0 0 84px;height:84px;border-radius:20px;display:grid;place-items:center;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);
  font-size:40px;font-weight:900;line-height:1}
.pj-hero h1{margin:0 0 6px;font-size:27px;font-weight:800;letter-spacing:-.4px}
.pj-repo{font-family:ui-monospace,Consolas,monospace;font-size:13px;opacity:.92;word-break:break-all}
.pj-badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;
  background:rgba(255,255,255,.22);font-size:12px;font-weight:700}
.pj-body{padding:28px 30px 32px}
.pj-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px}
.pj-kpi{padding:14px 16px;border-radius:12px;border:1px solid rgba(130,160,210,.2);background:rgba(79,140,255,.045)}
.pj-kpi b{display:block;font-size:19px;font-weight:800;color:var(--text,#1e293b);word-break:break-all}
.pj-kpi span{display:block;margin-top:4px;font-size:12px;color:var(--muted,#475569)}
.pj-h{font-size:14px;font-weight:800;margin:0 0 10px;color:var(--text,#1e293b)}
.pj-desc{font-size:15px;line-height:1.85;color:var(--text,#1e293b);margin:0 0 26px}
.pj-cta{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:12px;
  background:var(--grad);color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.pj-cta:hover{filter:brightness(1.07)}
.pj-rel{margin-top:34px}
.pj-rel h2{font-size:17px;font-weight:800;margin:0 0 14px}
.pj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.pj-item{display:block;padding:15px;border-radius:13px;border:1px solid rgba(130,160,210,.2);
  background:var(--card,#fff);text-decoration:none;transition:transform .18s}
.pj-item:hover{transform:translateY(-3px)}
.pj-item b{display:block;font-size:14px;color:var(--text,#1e293b)}
.pj-item small{display:block;margin-top:5px;font-size:11px;color:var(--muted,#475569);word-break:break-all}
.pj-empty{padding:48px 30px;text-align:center;color:var(--muted,#475569)}
</style>

<body data-ccnav="works" data-cctitle="作品">
<main class="pj-wrap">
  <a class="pj-back" href="/works/projects.html">← 返回项目库</a>
  <div id="pj" class="pj-card"><div class="pj-empty">正在读取项目数据…</div></div>
  <section class="pj-rel" id="pjRel" hidden>
    <h2>同类推荐</h2>
    <div class="pj-grid" id="pjGrid"></div>
  </section>
</main>
<script src="/ccowork.js?v=20261115b"></script>
<script>
(function () {
  var root = document.getElementById('pj');
  var relBox = document.getElementById('pjRel');
  var grid = document.getElementById('pjGrid');
  var key = new URLSearchParams(location.search).get('repo');
  var LEVEL = {1: '开箱即用', 2: '要配环境', 3: '要动手改'};
  var CN = {y: '可直连', p: '部分可直连', n: '需代理'};

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function empty(msg) {
    root.textContent = '';
    var box = el('div', 'pj-empty');
    box.appendChild(el('p', '', msg));
    var a = el('a', 'pj-back', '← 返回项目库');
    a.href = '/works/projects.html';
    box.appendChild(a);
    root.appendChild(box);
  }
  function stars(n) {
    n = Number(n) || 0;
    return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n);
  }

  if (!key) { empty('没有指定项目。请从项目库点进来，或带上 ?repo=owner/name 参数。'); return; }

  fetch('/data/repos.json', {cache: 'no-store'})
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      var rows = d.repos || [];
      var cats = d.cats || {};
      var x = null;
      for (var i = 0; i < rows.length; i++) { if (rows[i].r === key) { x = rows[i]; break; } }
      if (!x) { document.title = '未找到项目 · 白驹 ccowork'; empty('没找到这个仓库：' + key); return; }

      document.title = x.n + ' · 项目详情 · 白驹 ccowork';
      root.textContent = '';

      var hero = el('div', 'pj-hero');
      hero.appendChild(el('div', 'pj-ini', (x.n || '?').charAt(0).toUpperCase()));
      var ht = el('div');
      ht.appendChild(el('h1', '', x.n));
      ht.appendChild(el('div', 'pj-repo', 'github.com/' + x.r));
      var cat = cats[x.c] || {};
      ht.appendChild(el('span', 'pj-badge', cat.n || x.c || '未分类'));
      hero.appendChild(ht);
      root.appendChild(hero);

      var body = el('div', 'pj-body');
      var kpis = el('div', 'pj-kpis');
      var items = [
        ['★ ' + stars(x.s), 'GitHub 星数'],
        [x.l || '未标注', '主要语言'],
        [x.li || '未标注', '许可证'],
        [LEVEL[x.h] || '未标注', '上手难度'],
        [CN[x.cn] || x.cn || '未标注', '国内直连']
      ];
      items.forEach(function (it) {
        var k = el('div', 'pj-kpi');
        k.appendChild(el('b', '', it[0]));
        k.appendChild(el('span', '', it[1]));
        kpis.appendChild(k);
      });
      body.appendChild(kpis);

      body.appendChild(el('h3', 'pj-h', '这个项目解决什么问题'));
      body.appendChild(el('p', 'pj-desc', x.d || '（暂无中文说明）'));
      if (cat.d) {
        body.appendChild(el('h3', 'pj-h', '为什么把它放在「' + (cat.n || x.c) + '」这一类'));
        body.appendChild(el('p', 'pj-desc', cat.d));
      }

      var cta = el('a', 'pj-cta', '打开 GitHub 仓库 →');
      cta.href = 'https://github.com/' + x.r;
      cta.target = '_blank';
      cta.rel = 'noopener noreferrer';
      body.appendChild(cta);
      root.appendChild(body);

      var same = rows.filter(function (y) { return y.c === x.c && y.r !== x.r; })
                     .sort(function (a, b) { return (Number(b.s) || 0) - (Number(a.s) || 0); })
                     .slice(0, 4);
      if (same.length) {
        relBox.hidden = false;
        same.forEach(function (y) {
          var a = el('a', 'pj-item');
          a.href = '/works/project.html?repo=' + encodeURIComponent(y.r);
          a.appendChild(el('b', '', y.n));
          a.appendChild(el('small', '', '★ ' + stars(y.s) + ' · ' + (y.l || '未标注')));
          grid.appendChild(a);
        });
      }
    })
    .catch(function (e) { empty('项目数据读取失败：' + e.message + '。请刷新重试。'); });
})();
</script>
